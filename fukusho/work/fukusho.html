.tc .kaki{font-size:15.5px}
.an{margin:10px 0 0;padding:8px 14px;border:1px dashed var(--line);border-radius:6px}

.kchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

.guess.neg{background:var(--line)}

.scroll{overflow-x:auto}
a.tag{text-decoration:none;color:inherit}

<footer>底本：『腹証奇覧』稲葉克（文礼）著・『腹証奇覧翼』和久田叔虎著（京都大学附属図書館所蔵 富士川文庫）。画像は <a href="https://rmda.kulib.kyoto-u.ac.jp/item/rb00004916" target="_blank" rel="noopener">京都大学貴重資料デジタルアーカイブ</a>（出典：京都大学附属図書館。腹証図は同画像から切り出したもの）。本文の読み・現代語訳は学習用の試訳です。</footer>
<script>
// 腹証奇覧（稲葉文礼）正編 上冊：腹診の法（総論）・第1図 桂枝湯　コマ10L–13R
// 書式：paras[] は本文の段落（kaki＝本文をひらがな交じりに直したもの、yaku＝現代語訳）。
//       本文中の漢文の引用は書き下す。tochu[] は枠外上部の頭注。fig は腹証図（../img/fig_コマ頁.jpg）
window.FUKU_DATA = window.FUKU_DATA || [];
window.FUKU_DATA.push(
{
  id: "fukushin-ho", no: 0, kind: "総論", title: "腹診の法", yomi: "ふくしんのほう", group: "正編 上冊",
  koma: [10, 11], komaNote: "10L–11R",
  intro: "上冊の巻頭、「腹證奇覧上冊　湖南 稲葉克文禮著」に続く総論。診察の心構えと、腹を診る順序を述べる。",
  paras: [
    { head: "診察の心構え", koma: "10L",
      kaki: "夫れ腹症を按ずるの法。まづ病人を平らかに臥しめ、志氣を正しうせしめ、さて醫者も亦平らかに坐し、呼吸をたゞし、志氣を臍下に收め、あたかも武夫の兵器を執りて敵にむかふが如く、大病を怖れず、死生に眩せず、富貴に屈せず、貧賤を侮らず、その病毒を治して、その疾苦を救はんと、心を專一にして診察すべし。是れ疾醫病者を診察するの大法なり。",
      yaku: "腹証を按じて診る方法。まず病人を平らに寝かせ、気持ちを落ち着けさせる。医者もまた姿勢を正して座り、呼吸を整え、気力を臍の下に収める。ちょうど武士が武器を取って敵に向かうときのように、大病を恐れず、生死に心を乱されず、相手が富貴でもへつらわず、貧賤でも侮らず、その病毒を治してその苦しみを救おうと、心を一つにして診察しなければならない。これが疾医（古方の医者）が病者を診察するときの大原則である。" },
    { head: "腹を診る順序", koma: "10L–11R",
      kaki: "凡そ腹症を候ふの法。右のごとく病者に臨み、まづ右手の掌を徐かに胸心へあて、一息して呼吸を定靜し、こゝろをしづめて胸脇の毒をうかゞふ。中央より診して左右におよぶ。而して後、心下へやはらかに指を下して、三指（食指・中指・無名指）の頭にて按すべし。次に肋骨のはしへ指頭をかゝげ入れて、苦滿の有無をうかゞひ、次に腹中、次に左右の小腹、次に臍究、次に左右の臍傍、次に臍下と、順々に診察すべし。これ診腹の次第なり。かくのごとくにして後、外證を察し、諸患の有無を問ふべし。",
      yaku: "腹証をうかがう手順。上のような心構えで病者に向かい、まず右手のてのひらを静かに胸に当てる。ひと呼吸おいて呼吸を整え、心を静めて、胸脇の毒をうかがう。中央から診て左右に及ぶ。その後、みぞおち（心下）へやわらかに指を下ろし、三本の指（人差し指・中指・薬指）の先で按じる。次に肋骨の縁へ指先を差し入れるようにして、苦満（胸脇苦満）の有無をうかがう。次に腹の中、次に左右の下腹部（小腹）、次に臍、次に臍の左右、次に臍の下と、順々に診察する。これが腹診の順序である。こうして腹を診たのちに、外に現れた症状（外証）を観察し、そのほかの症状の有無を問うべきである。" }
  ],
  tags: ["腹診", "診察の順序", "胸脇苦満", "みぞおち"],
  check: ["11R「臍究」の「究」は字形どおり。臍窠（へそのくぼみ）の意と解した"]
},
{
  id: "keishito", no: 1, kind: "方剤", title: "桂枝湯", yomi: "けいしとう", group: "正編 上冊",
  koma: [11, 13], komaNote: "11L–13R",
  fig: { src: "img/fig_011L.jpg", koma: "11L", label: "桂枝湯之證",
    desc: "冠をかぶった髭の男が椅子に腰掛け、胸腹をあらわにしている。臍のすぐ左上（向かって左上）に、くすんだ青緑色の小さな彩色が一か所ある。" },
  paras: [
    { head: "腹証と三方の使い分け", koma: "12R",
      kaki: "此の證、腹滑にして、底までもこたゆるものなく、圖のごとく、只拘攣あり。所謂臓に他病なし。上衝・發熱・頭痛有りて、汗あり惡風する者は、桂枝湯を用ゆる也。拘攣せざる者は、去芍藥湯を用ゆるなり。拘攣劇しき者は、加芍藥湯を用ゆるなり。此の三方を合せみれば、上衝と拘攣との二つ、此の症の準據たること知るべし。",

    { head: "遠州浜松の士 和久田某の蟅虫考", koma: "112L–114R",
      kaki: "遠州濱松の士和久田某、蟅蟲の考に曰く、字彙に「之夜の切、音柘、蟲の名、一に曰く蝗の類、一に曰く鼠婦」。按ずるに本艸化生蟲の部に出づ。字彙に蝗の類とすること尤も據あり。今字義を審らかにして之を按ずるに、蟅蟲と蝗と本一物にして、其の化生するに随ひて名を殊にするならん。蓋し蟅の字庶に从ふ。衆多の義に取るものならん。今華船のせ來る所の物をみるに、本艸の簸箕蟲と云ふ者その形よく似たり。地鼈と云ふものも亦少しく似たり。之を我が邦に産する所の物に考ふるに、即ち水田の泥中或いは池沢の中にすむ甲蟲、その形相似たり。俗に呼んで盛長蟲と云ふ。此の蟲五六月の比、黍粒の如き小卵數十を生じて背におふ。稲禾長ずるを待ちて禾の本に其の卵を附けて去る。この卵風化して蝗を生ず。蝗の形たる、方首青身、兩鬚六足、後の二脚長くしてよく跳る。羽あれども飛ぶこと能はず。背に黒文あり、形王の字に似たり。蝗の字皇に从ふこと之を以てなり。短き者は五六分、長き者は一寸許り。稲禾を食ひて害をなす。霜降の後色赤くなりて死す。即ち民間に呼んで伊那古と云ふ者是なり。是蝗の親は蟅蟲にして、其の子を生ずること衆多なるを以て蟅と名づくるならん。本艸に土鼈・簸箕の名を辨ずといへども蟅字の義を詳らかにせず。又蝗を生ずることを知らず。或いは甲ありと云ひ、或いは甲なく鱗ありと云ふ。見るべし、其の物を究極せざることを。其の功能を論ずるに及びては、蟅蝗同根同性、故に其の功亦同じ。且つ華産の物尤も高價なり。又眞贋審らかならず。故に多く用ひて經驗するもの少し。今水田中にある蟅蟲も亦采り得ること易からず。蝗は甚だ多し。取り得ること尤も易し。七八月の間稲禾中に在るを取り、火に炙りて殺し、日に干して之を貯ふ。此を蟅蟲に易へ用ゆること、古人未だ發明せず。仙石伯州刺史の醫中川友三と云ふ者、鶴先生の門に在りて予が師稲葉翁の先輩なり。始めて蝗を以て蟅蟲に易へ用ゆることを知りて、其の效驗を極む。予因りて諸家の説を參考し、以て此に記す。",

      yaku: "また『素問』『霊枢』の中には、ところどころ「尺を診る」という論がある。その文をよく調べると二つの説がある。一つは腕を「尺」と呼んで腕の肉を診ること、もう一つは腹の中を「尺」と呼んで腹を診ることである。腕の肉を診る術は後世に伝わっていないので、捨てて論じない。腹を診ることは大切なことなので、よく考えてみると、手の脈で医者の三本の指が当たる所を「寸口」と名づけ、これに対して鳩尾（みぞおち）から神闕（臍）までを一尺と定め、体の中央にあるので「尺中」と名づけたのであろう。これも後には手の脈の名に取られて、寸口をさらに三部に分け、医者の薬指が当たる所を「尺中」と名づけたことから、名前の意味が混じり合って混乱している。手の脈に尺中の名があるのは、腕を尺と名づけたことから出た名であろうが、「中」の字の意味が成り立たない。考えるに、肘の際から肘の曲がり目まで、肘の曲がり目から魚際（親指の付け根のふくらみ）まで一尺二寸、魚際から中指の先まで八寸、合わせて三尺。これが人体の自然の物差しである。親指と中指を開いて測る。そうすると、腕のほうから言えば尺は前、手先のほうから言えば尺は後になる。尺中という名には根拠がないことを知るべきである。" },
    { head: "診尺は診腹である。傷寒論・金匱を尊ぶ", koma: "134R–135L",
      kaki: "抑も素霊の中に於て、尺を診すれば脉を切することを待たずして病を言ふことあり。又尺と脉とを分けて對するの文ありて、診尺の診腹たること疑ひを容れず。然れども其の診法の詳なること載せて傳はらざれば、今に則つて試むべきこと難し。此の外に古書の今に存して取るべきものは、傷寒論・金匱玉函より貴きはなし。脉・證・治・論・藥方兼ね備へて遺すところなく、實に醫家の至寶とし尊ぶべき書なり。其の仲景の作たると否とは置いて姑く論ぜず。此の書も亦晋の王叔和が撰次にかかり、私言を雜へて眞を亂るもの半ばを過ぐ。然るを後世の諸醫、全く以て仲景の遺書と心得て取捨せざるは、これも亦見解なしと謂ふべし。近時本邦の醫稍や其の非を覺り、其の妄を破つて、互ひに一家言を張り、彼此に門戸を立てて、復古學を唱ふるもの踵を接して起る。其の説も亦一得一失ありといへども、概するに宋元以降の醫の上に出でたり。其の中にも亦名聞を求むるものは、文飾に過ぎて世を慷す。然れども醫は固より技術たれば、孰れにも實に近しと思ふところを、自ら擇んで之を學ぶに如くはなし。傷寒論を讀み、金匱玉函を看て、旦夕に其の深きに釣り、其の旨を味はふべし。後世の著書とは搭別にして、文簡にして旨微なり。必ずしも一家の言に僻すべからず。其の陰陽を分け、六位を差し、病狀を辨ずる中に、腹證と外證とを對し言ふもの多くして、脉候を擧ぐるものは大率疑途に非ざれば言はず。其の證を捨てて專ら脉に依つて病をいふもの、皆叔和の補添するものなること疑ひなし。脉と因とを後にして、一に證に隨つて治法を論ずるもの、概するに仲景の本色なりとして看讀すべきこと肝要なり。是の故に腹狀を診按して病證を辨ずるは、仲景を以て則とし學ぶべし。其の治套を得るに至つては、勉めて思ふにあり。語に曰く、「學んで思はざれば則ち罔し、思うて學ばざれば則ち殆し」と。今且く素霊の中に於て診腹の徴とすべきもの一二を掲げ、其の義を解釋し、以て初學に示すこと左の如し。",
      yaku: "そもそも『素問』『霊枢』の中には、尺を診れば脈を取るまでもなく病を言い当てられるという箇所があり、また尺と脈とを分けて対比する文もあるので、「尺を診る」とは腹を診ることであるのは疑いない。しかしその診法の詳細は伝わっていないので、今これに従って試すことは難しい。このほか古書で今に残り採るべきものは、『傷寒論』『金匱玉函（要略）』より貴いものはない。脈・証・治療・論・薬方を兼ね備えて漏れがなく、まことに医家の至宝として尊ぶべき書である。それが張仲景の作かどうかは、ひとまず論じない。この書もまた晋の王叔和が編集したもので、自分の言葉を混ぜて真を乱したところが半分を超える。それなのに後世の医者たちが、すべて仲景の遺した書と心得て取捨しないのは、これもまた見識がないというべきである。近ごろわが国の医者はその誤りに少しずつ気づき、妄説を打ち破って、互いに一家言を主張し、あちこちに門派を立て、復古の学を唱える者が次々と現れている。その説にも一得一失はあるが、おおむね宋・元以降の医者よりはすぐれている。その中にも名声を求める者は、文章の飾りに過ぎて世を嘆かせる。しかし医は本来技術であるから、どの説であれ実際に近いと思うものを自分で選んで学ぶのが一番である。『傷寒論』を読み、『金匱玉函』を見て、朝夕その深みを探り、その趣旨を味わうべきである。後世の著書とはまったく別物で、文は簡潔で趣旨は奥深い。必ずしも一家の説に偏ってはならない。陰陽を分け、六つの病位を区別し、病状を論じる中で、腹証と外証を対にして言うものが多く、脈の様子を挙げるのはたいてい紛らわしい場合でなければ言わない。証を捨ててもっぱら脈によって病を言うものは、みな王叔和が補い加えたものに違いない。脈と病因を後回しにし、ひたすら証に従って治法を論じるものが、おおむね仲景の本来の姿であるとして読むことが肝要である。それゆえ腹の状態を按じて病証を見分けることは、仲景を手本として学ぶべきである。その治療の型を身につけるには、努めて考えることにある。『論語』に「学んで考えなければ暗く、考えて学ばなければ危うい」とある。いまひとまず『素問』『霊枢』の中から腹診の証拠となるものを一、二挙げ、その意味を解釈して、初学者に示すと次のとおりである。" },
    { head: "素問 脉要精微論の解：尺内・尺外・尺裏", koma: "135L–136R",
      kaki: "素問脉要精微論に曰く、「尺内の兩傍は則ち季脇なり」。〔鳩尾より臍までを一尺とす。其の兩傍は則ち脇肋の下端なり。季はすゑなり。あばらのすゑといふの義なり。内は外に對するの字。臍下を尺外といふに對して尺内といふ。尺中とは其の義ことなり。〕「尺外は以て腎を候ふ。」〔臍より上を尺内とす。臍下を尺外とす。蓋し氣海丹田をさす。〕「尺裏は以て腹を候ふ。」〔尺裏は尺内なり。臍上までの間を廣くさして腹といふ。尺裏は皆腹なり。故に腹を候ふといふ。〕「中附上、」〔附上は身軀を三つにわかち、鳩尾より臍までを中とす。中附上は臍より上、中部に隣るといふの義なり。〕「左は外以て肝を候ひ、内以て鬲を候ふ。右は外以て胃を候ひ、内以て脾を候ふ。」〔中附上の間にて左右をわかち、左右各内外をわかつ。下同じ。鬲は膈なり。胸腹の分界の名なり。〕「上附上、」〔鳩尾より上、天突までをさす。〕「右は外以て肺を候ひ、内以て胸中を候ふ。左は外以て心を候ひ、内以て膻中を候ふ。」〔膻中は兩乳の間なり。○案ずるに胸腹ども其の候ふ處各高下あるべし。細かに分たざるなり。〕「前は以て前を候ひ、後は以て後を候ふ。」〔前は蓋し面部の七竅なり。後は腦髓・頸項・背脊なり。竅の通塞・利不利および諸證を候ふなり。〕「上竟上は、胸喉中の事なり。」〔上竟上とは上部の竟の上なり。蓋し天突より上をさす。故に胸喉中の事といふ。喉はのどぶえなり。事は候ふを事とするなり。〕「下竟下は、少腹・腰・股・膝・脛・足中の事なり。」〔下竟の下は下部の境の下なり。蓋し横骨より下、足さきに至るまでをいふなり。〕此の章に因つて考ふるときは、古の三部九候といふは、身軀を三段に分け、上中下各左右中を候ふの事なり。〔天突より鳩尾まで一尺、鳩尾より臍まで一尺、臍より横骨に至るまで一尺。指を分け開きて之を度る。是れ人身自然の尺度なり。〕後之を手脉に移して、寸關尺に於て浮中沈を候ふの事とするならん。",
      yaku: "『素問』脈要精微論にいう。「尺内の両わきは季脇である。」〔鳩尾から臍までを一尺とする。その両わきは肋骨の下端である。「季」は末のことで、あばらの末という意味。「内」は「外」に対する字で、臍の下を尺外というのに対して尺内という。尺中とは意味が異なる。〕「尺外で腎をうかがう。」〔臍より上を尺内、臍より下を尺外とする。気海・丹田を指すのであろう。〕「尺裏で腹をうかがう。」〔尺裏は尺内のこと。臍の上までの間を広く指して腹という。尺裏はすべて腹である。だから腹をうかがうという。〕「中附上、」〔体幹を三つに分け、鳩尾から臍までを「中」とする。中附上は臍より上、中部に隣るという意味。〕「左は外で肝を、内で鬲をうかがう。右は外で胃を、内で脾をうかがう。」〔中附上の範囲で左右を分け、左右それぞれ内と外を分ける。以下同じ。鬲は膈で、胸と腹の境の名。〕「上附上、」〔鳩尾から上、天突までを指す。〕「右は外で肺を、内で胸中をうかがう。左は外で心を、内で膻中をうかがう。」〔膻中は両乳の間。○考えるに、胸も腹もうかがう場所にはそれぞれ高低があるはずで、細かくは分けていないのである。〕「前で前を、後で後をうかがう。」〔前は顔の七つの穴（目・耳・鼻・口）であろう。後は脳髄・首・背骨である。穴の通じ具合や諸症状をうかがう。〕「上竟上は胸と喉のことである。」〔上竟上とは上部の境のさらに上、天突より上を指すのであろう。だから胸と喉のことという。喉はのどぶえ。「事」はうかがうことを仕事とするの意。〕「下竟下は下腹・腰・股・膝・すね・足のことである。」〔下部の境の下、横骨（恥骨）から下、足先までをいうのであろう。〕この章によって考えると、古の「三部九候」とは、体幹を三段に分け、上・中・下それぞれ左・右・中をうかがうことである。〔天突から鳩尾まで一尺、鳩尾から臍まで一尺、臍から横骨まで一尺。指を開いて測る。これが人体の自然の物差しである。〕後にこれを手の脈に移して、寸・関・尺で浮・中・沈をうかがうことにしたのであろう。" },
    { head: "周礼と東洞の説", koma: "136L",
      kaki: "案ずるに周禮に曰く、「之を兩にするに九竅の變を以てし、之を參にするに九藏の動を以てす」。東洞吉益子以爲らく、竅の變は開閉の常に非ざるを謂ふ。陽竅七、陰竅二。藏の動は、水穀の納るる所を臓といふ。九は上中下各左右中なり。夫れ飲食の咽喉より入り、肛門に至つて一路なり。滯らず二陰より出づれば、百臓に醸して病なし。滯るときは變じて一身に三千、四肢百骸を病ましむ。中行に在るを慝とす。左右之に次ぐと云々。此れも亦三部九候及び前後の變を候ふの事にして、此の章の旨と相似たり。并に古診の事たるを見るべし。更に圖を以て左に詳にす。",
      yaku: "考えるに『周礼』に「九竅の変化で二つ目の判断をし、九臓の動きで三つ目の判断をする」とある。吉益東洞は次のように考えた。竅の変化とは、開閉が常と違うことをいう。陽の竅が七つ、陰の竅が二つ。臓の動きとは、飲食物の納まる所を臓といい、九は上・中・下それぞれの左・右・中である。飲食物は咽喉から入って肛門に至る一本の道で、滞らずに二陰（大小便の出口）から出れば、臓腑で熟されて病はない。滞ると変じて全身・四肢百骸を病ませる。正中の列にあるものを悪いとし、左右がこれに次ぐ、と。これもまた三部九候と前後の変化をうかがうことで、この章の趣旨と似ている。いずれも古の診法であることがわかる。さらに図で次に詳しく示す。" },
    { head: "図「寸口尺中図」の説明", koma: "137R",
      kaki: "古診は蓋し寸關尺をわかたず。三指の至る處、僅かに寸許りなるを以て之を寸口と名づく。大指と四指とを分け開く處、之を一尺と定めて尺中といふ。手脉は外に在つて病の動静を候ふの門戸とす。故に寸口といふ。腹は内に於て一身の中央にして、動脉の源を診し、病の在るところを知る。故に尺中といふ。中焦をうかがふの義なり。",
      yaku: "古の診法では寸・関・尺を分けなかったのであろう。三本の指の届く所がわずか一寸ほどなので、これを寸口と名づけた。親指と他の四指を開いた幅を一尺と定めて尺中という。手の脈は外にあって病の動静をうかがう門口であるから、寸口という。腹は内にあって体の中央であり、動脈の源を診て病のある所を知る。だから尺中という。中焦をうかがうという意味である。" },
    { head: "素問 方盛衰論の解：脈と尺を分けて診る", koma: "138R",
      kaki: "素問方盛衰論に曰く、「脉の動靜を按じ、尺の滑濇を循で、」〔按はおさへるなり。循はなでるなり。尺は腹の尺なり。脉浮數は動なり。沈遲は靜なり。滑はなめらかなり。うるほひありてすらすらしたるをいふ。濇はしぶるなり。鋏の銹をなづるがごとく、かわきてとどこほるなり。肌甲錯の類なり。〕「寒温の意、」〔寒はひゆるなり。温はあたたかなるなり。意はおもふなり。心づもりをすることなり。脉の動と尺の滑とは温を知るゆゑんなり。乃ち陽證なり。脉の靜と尺の濇とは寒を知る所以なり。乃ち陰證なり。是れ陰陽の二途を分別する、乃ち寒温を意測するなり。〕「其の大小を視、」〔視の字は心をつけてみるなり。其の字は尺をさす。大小は形の大小なり。故に視の字を下す。乃ち腹狀の大小を視て病の輕重をわかつなり。〕「之を病態に合す。」〔之を合すとは、脉と尺と其の大小との三つなり。態はすがたなり。此の三候を合せて一病の態とし定むるなり。〕此の章、脉と尺とを分け對し、脉に按といひ、尺に循といひ、其の大小を視るといふ。診腹の事たる昭々たり。",
      yaku: "『素問』方盛衰論にいう。「脈の動静を按じ、尺の滑濇をなでて、」〔「按」は押さえること、「循」はなでること。尺は腹の尺である。脈の浮・数は「動」、沈・遅は「静」。「滑」はなめらか、潤いがあってすらすらしていること。「濇」は渋ること、はさみの錆をなでるように乾いて滞ること。肌の甲錯（さめ肌）の類である。〕「寒温を推しはかり、」〔寒は冷えること、温は温かいこと。「意」は思うこと、見当をつけること。脈の動と尺の滑で温を知る。すなわち陽証。脈の静と尺の濇で寒を知る。すなわち陰証。陰陽の二つの道を見分けることが、寒温を推しはかることである。〕「その大小を視て、」〔「視」は注意して見ること。「其」は尺を指す。大小は形の大小。だから「視」の字を用いる。腹の状態の大小を見て病の軽重を分ける。〕「これらを病態に合わせる。」〔「これら」とは脈・尺・その大小の三つ。「態」は姿。この三つをうかがった結果を合わせて一つの病の姿と定める。〕この章は、脈と尺とを分けて対にし、脈には「按」、尺には「循」と言い、その大小を「視る」と言っている。腹を診ることであるのは明らかである。" },
    { head: "霊枢 論疾診尺篇の解：尺の緩急・小大・滑濇・堅脆", koma: "138R–138L",
      kaki: "靈樞診尺篇に曰く、「黄帝岐伯に問うて曰く、余色を視、脉を持すること無くして、獨り其の尺を調へ、以て其の病を言ひ、外より内を知らんと欲す。之を爲すこと奈何。」〔調はととのへるなり。こしらへてほどよくしくはすことなり。或いは按じ、或いは循でて、諸の形狀を審にするが乃ち調なり。此れは顔色も脉候もすてて、獨り腹の尺ばかりを調へて其の病態を言ひ、外がはより腹内のやまひを知らんとの問なり。〕「岐伯曰く、其の尺の緩急・小大・滑濇、肉の堅脆を審にして、病形定まる。」〔審はつまびらかにするなり。とくと其のもやうをわかつなり。緩はゆるむなり。皮のゆるみにてぐさつくなり。急はひつぱるなり。小大滑濇の解は前に見ゆ。堅はかたきなり。根のはりてうごかぬなり。脆はもろきなり。砕けやすきをいふ。其の腹皮の緩急と、形の大小と、膚の滑濇と、肉の堅脆とを審明にして、それにて病の形は定まることになるとなり。定はゆりすはりてすじのたつことなり。〕此の章、色候も脉診もすてて、獨り調尺のみにて其の病形を定むることを言ふゆゑ、方盛衰論よりも又一段は詳なり。",
      yaku: "『霊枢』論疾診尺篇にいう。「黄帝が岐伯に尋ねた。顔色を見ず脈も取らずに、ただ尺だけを整えてその病を言い当て、外から内を知りたいと思う。どうすればよいか。」〔「調」は整えること、具合よく調べ合わせること。按じたりなでたりして、さまざまな形状を詳しくするのが「調」である。顔色も脈もさしおいて、ただ腹の尺だけを調べて病態を言い、外側から腹の中の病を知ろうという問いである。〕「岐伯は答えた。その尺の緩急・小大・滑濇と、肉の堅脆を詳しく見れば、病の形が定まる。」〔「審」は詳しくすること、よくよく様子を見分けること。「緩」はゆるむこと、皮がゆるんでぐさぐさすること。「急」は引っ張ること。小大・滑濇の解は前に見える。「堅」は硬いこと、根が張って動かないこと。「脆」はもろいこと、砕けやすいこと。腹の皮の緩急、形の大小、膚の滑濇、肉の堅脆を明らかにすれば、それで病の形は定まるというのである。「定」は落ち着いて筋道が立つこと。〕この章は顔色も脈もさしおいて、尺を調べることだけで病の形を定めることを言っているので、方盛衰論よりもう一段詳しい。" },
    { head: "仲景の腹証に当てはめる", koma: "138L–139L",
      kaki: "抑も余之を病人に試驗したるところの、仲景の腹證に當つるに、其の大概を言ふべし。假令ば腹皮の緩なるものは、桂枝去芍藥湯・桂枝附子湯・梔子豉湯・四逆湯の類是れなり。其の急なるものは、小建中湯・芍藥甘草湯・甘麥大棗湯の類是れなり。形の小大は、胸に於ては大小陷胸湯、胸腹の間に於ては大小柴胡湯、腹に於ては大小承氣湯の類是れなり。肌膚滑澤なるものは桂枝湯、濇澁なるものは大黄䗪蟲丸・薏苡附子敗醤散の類是れなり。堅は諸の心下痞鞕・堅・鞕満の類、皆堅なり。脆は諸の水氣あるの腹、物あるが如くにして、之を按ずれば碎け散るものの類是れなり。凡そ是等の腹證、枚擧するに遑あらず。此れ僅かに其の一二を例するのみ。各方の證ごとに皆此の分別あらずといふことなし。是の故に腹證を審にすれば、脉を切し色を望み、及び病者に問ふ前に、預め其の患ふ所を知り、吉凶を分つに足る。且つ未病といふて、其の毒内に伏していまだ外に發せざるものを知り、藥を與ふる後に於ては、病毒の既に盡くると未だしとを明にせらるること、信に此の章の言ふところの如し。是に於てか、古の診尺の法、取つて以て仲景の腹證に徴するに足るのみ。",
      yaku: "私がこれを病人で試してきたところを仲景の腹証に当てはめて、そのあらましを言おう。たとえば腹の皮がゆるいものは、桂枝去芍薬湯・桂枝附子湯・梔子豉湯・四逆湯の類である。引っ張っているものは、小建中湯・芍薬甘草湯・甘麦大棗湯の類である。形の大小は、胸では大・小陥胸湯、胸と腹の間では大・小柴胡湯、腹では大・小承気湯の類である。肌がなめらかで潤うものは桂枝湯、渋ってかさつくものは大黄䗪虫丸・薏苡附子敗醤散の類である。「堅」は、心下痞鞕・堅・鞕満などで、みな堅である。「脆」は、水気のある腹で、物があるようでいて押すと砕け散るものの類である。こうした腹証は数え上げればきりがない。これはわずかに一、二を例に挙げただけで、どの方の証にもみなこの区別がある。だから腹証を詳しく見れば、脈を取り顔色を見て病人に尋ねる前に、あらかじめ患っている所を知り、吉凶を分けることができる。また「未病」といって、毒が内に潜んでまだ外に現れていないものを知り、薬を与えた後には、病毒がすでに尽きたかどうかを明らかにできることは、まことにこの章の言うとおりである。こうして古の「尺を診る」法は、仲景の腹証の裏付けとするに足るのである。" },
    { head: "同篇の尺膚の諸候", koma: "139L–140R",
      kaki: "同篇に曰く、「尺膚滑かにして、其れ淖澤なるは、風なり。」〔淖澤はうるほひてすらすらつくなり。蓋し微汗いづるの謂なり。此れ乃ち太陽中風、汗出づるものの尺膚にして、桂枝湯の證なり。故に風なりといふ。〕「尺肉弱き者は、解㑊安臥す。」〔解㑊はくたびれて精氣なきなり。安臥はおちついてねるなり。陰證の腹には、しまりなく輭脆をおすごとくにて、其の人精氣衰へくたびれて安靜平臥するもの、四逆湯の證のごときこれなり。〕「脱肉の者は、寒熱治せず。」〔脱肉は肉のおちたるなり。腹皮うすくつまみあがるやうになり、之をおすに綿絮のごとくくたわひなくなりたるをいふ。前の弱といふよりは一等精氣のぬけたるものなり。此の證寒にても熱にても死に治せぬものとするなり。〕「尺膚滑かにして澤脂なる者は、風なり。」〔脂はあぶらぎるなり。澤脂はうるほひてあぶらぎるなり。此れも亦太陽の中風の證なり。〕「尺膚濇なる者は、風痺なり。」〔濇はしぶるなり。膚のしぶるものは氣血の不足して、風を感じてしびるるなり。乃ち身體不仁の痺なり。〕「尺膚麄くして枯魚の鱗の如き者は、水泆飲なり。」〔麄はあるるなり。枯魚の鱗はがさつきてうるほひなきなり。此れは水氣にて留飲の皮膚なり。泆はあふるるなり。溢飲といふが猶し。〕案ずるに此の篇錯脱多くして全文の義を成さずといへども、所謂尺膚を審にして病形を定むるものは概見すべく、亦之を仲景の腹證に徴すべし。王氷等文義を審にせず、一に以て臂肉を診することとして牽強傳會す。妄と謂ふべし。凡そ文辭錯脱して全義を見るべからざるものは、古書の往々然りとするところ、其の疑はしきも一に於ては蓋し闕如たり。讀者之を思へ。○已上内經の文を解釋して、腹證の古診法たることを知らしむ。其の他一二診尺を言ふものありといへども、已上の諸章にして已に徴するに足るを以て之を略す。委しくは本書に就いて覽るべし。",
      yaku: "同じ篇にいう。「尺の膚がなめらかで潤っているのは、風である。」〔「淖沢」は潤ってすらすらすること。わずかに汗が出ていることをいうのであろう。これは太陽中風で汗の出る者の尺膚で、桂枝湯の証である。だから「風」という。〕「尺の肉が弱い者は、だるくて静かに横になる。」〔「解㑊」はくたびれて元気がないこと。「安臥」は落ち着いて寝ていること。陰証の腹は締まりがなく、やわらかくもろいものを押すようで、その人は元気が衰えくたびれて静かに横になっている。四逆湯の証のようなものがこれである。〕「肉の落ちた者は、寒でも熱でも治らない。」〔「脱肉」は肉が落ちること。腹の皮が薄く、つまみ上がるようになり、押すと綿のように張りがなくなったものをいう。前の「弱」より一段元気の抜けたもので、この証は寒でも熱でも死んで治らないものとする。〕「尺の膚がなめらかで脂ぎっているのは、風である。」〔「沢脂」は潤って脂ぎること。これも太陽中風の証である。〕「尺の膚が渋るのは風痺である。」〔膚が渋る者は気血が不足し、風に感じてしびれる。すなわち体の感覚が鈍くなる痺である。〕「尺の膚が粗く、干し魚のうろこのようなのは、水があふれる飲である。」〔「麄」は荒れること。干し魚のうろこはがさついて潤いがない。これは水気による留飲の皮膚である。「泆」はあふれること。溢飲というのと同じ。〕考えるに、この篇は誤りや脱落が多く全文の意味は通らないが、尺の膚を詳しく見て病の形を定めるということはおおよそ見てとれ、これも仲景の腹証の裏付けとできる。王冰らは文意をよく考えず、もっぱら腕の肉を診ることとしてこじつけている。でたらめというべきである。文に誤りや脱落があって全体の意味が見えないのは古書によくあることで、疑わしいところはひとまず空けておくのがよい。読者はよく考えよ。○以上、『内経』の文を解釈して、腹証が古の診法であることを知らせた。ほかにも尺を診ることを言う箇所が一、二あるが、以上の諸章ですでに証拠として十分なので省く。詳しくは原書について見よ。" },
    { head: "問答：四診と腹診", koma: "140L–142R",
      kaki: "或るひと問うて曰く、古醫に四診の目あり。曰く望聞問切。其の術に達するもの、名づくるに神聖巧工を以てす。吾子が云ふ、扁鵲の術のごときは上工の手段にして則るべきこと難しと。然れども齊桓の色を望むは乃ち望なり。虢に入るの診は乃ち聞なり。則ち扁鵲の術といへども四診の外に出でず。乃ち神乃ち聖なりといへども、彼も人なり。我も亦人なり。爲すことあるものは皆斯の如くなるべし。本邦の先達、今大路・古林の如きも、亦其の術を能くすることありと聞く。至高至遠にして到り難しといへども、造るに其の道を以てせずんば、焉んぞ日か其の源に逢はんや。之を自棄といふ。吾子今偏に診腹のみを主張す。是れ亦古の術なりといへども、僅かに四診中の一にして、最も卑しとするにあらずや。磧礫に習つて深淵を窺はざるものは、驪龍の蟠るところを知らずといへり。吾子も亦一家に僻して反つて卑近に失するにあらずや。抑も望と聞とは、得て學ぶべからざるや。願はくは其の説を聞かん。答へて曰く、古に四診の目あるは、別けて四術とするにあらず。其の歸は一なり。假令ば今一病人を得て之を診するに、いまだ其の前に適かざるときに、先づ遠く望んで其の神色を觀察し、預め其の吉凶淺深を知り、既にして其の傍に到るや、先づ其の語聲の清濁高下と、呼吸氣息の緩急長短多少とを聞いて、其の輕重難易を知り、次いで其の患ふところを問ひ、且つ脉を切し、腹を按じて、其の陰陽虚實及び病毒の形狀所在を審にし、然して後其の病態を定め、愼んで治案を處す。是れ四診の序なり。然らば則ち四診は一病人ごとにして必ず闕くべからざるの法なり。而して其の歸は一なり。別けて四術とするに非ざるなり。但し望と聞とは、黙して識り、感じて格るべし。初めより其の術を能くすべからず。教ふるに物なく、學ぶに則なし。大匠は人に教ふるに規矩を以てす。學者も亦必ず規矩を以てすといへり。問と切とは教ふるに物あり。學ぶに則あり。抑も古人の曰く、「高きに升るは必ず卑きよりし、遠きに陟るは必ず邇きよりす」と。切は四診の下に序して最も卑近なり。是の故に初學は必ず先づ切より入るべし。予が所謂切とは、徒らに脉を切するのみを謂ふに非ず。腹を診するを以て緊要至切とす。蓋し腹を診するときは、詳に病の在所を知り、陰陽虚實復た臆斷なし。故に腹候詳なれば、脉狀も亦隨つて明なるべし。是に於てか之を問ふに方あり、之を聞くに物あり。力を用ふるの久しきに至らば、豁然として望察の神鑒を得べし。扁鵲が五臓の癥結を見るも、豈是の外に出でんや。是の故に吾が門は腹を診するを以て入門第一義とす。豈啻に此の診腹にして已まんや。亘に此に就いて四診を脩するの階梯とすべし。是れ鶴・稲葉二翁の腹診に先驅し、予が勉めて殿後をなす所以なり。",
      yaku: "ある人が尋ねた。「古の医には四診の項目がある。望（見る）・聞（聞く・嗅ぐ）・問（尋ねる）・切（触れる）である。その術に達した者を、神・聖・巧・工と名づける。あなたは、扁鵲の術などは上工の手段で手本にするのは難しいと言う。しかし斉の桓公の顔色を見たのは望であり、虢に入っての診察は聞である。扁鵲の術といっても四診の外に出るものではない。神であり聖であるといっても、彼も人、私も人である。志ある者はみなそうなれるはずだ。わが国の先達、今大路や古林のような人もその術をよくしたと聞く。至高至遠で到達しがたいとしても、その道によって進まなければ、いつその源に出会えようか。これを自棄という。あなたは今ひたすら腹診だけを主張している。これも古の術ではあるが、四診のうちのわずか一つで、最も低いものではないか。河原の小石に慣れて深い淵をのぞかない者は、黒竜の潜む所を知らないという。あなたも一家に偏って、かえって卑近なところにとどまっているのではないか。そもそも望と聞は学ぶことができないのか。その説を聞きたい。」答えて言う。「古に四診の項目があるのは、四つの別々の術とするのではない。行き着く所は一つである。たとえばいま一人の病人を診るとき、まだその前に行かないうちに、まず遠くから顔色や様子を観察して、あらかじめ吉凶や浅深を知る。そばに行けば、まず声の清濁高低と、呼吸の緩急・長短・多少を聞いて、軽重や治しやすさを知る。次に患っている所を尋ね、脈を取り、腹を按じて、陰陽・虚実と病毒の形状・所在を詳しくし、その後で病態を定め、慎重に治療方針を立てる。これが四診の順序である。だから四診は一人の病人ごとに必ず欠かせない法であり、行き着く所は一つで、別々の四術ではない。ただし望と聞は、黙って会得し、感じ取って到達するもので、初めからその術を身につけることはできない。教える手がかりがなく、学ぶ規則がない。大工の棟梁は人に教えるのに定規とコンパスを用い、学ぶ者も必ず定規とコンパスによるという。問と切には教える手がかりがあり、学ぶ規則がある。古人も『高い所へ登るには必ず低い所から、遠くへ行くには必ず近い所から』と言った。切は四診の最後に置かれ、最も身近である。だから初学者は必ずまず切から入るべきである。私のいう切とは、ただ脈を取ることだけではない。腹を診ることを最も大切とする。腹を診れば病のある所を詳しく知ることができ、陰陽・虚実に当て推量がなくなる。だから腹の様子が詳しくわかれば、脈の状態もそれにつれて明らかになる。そうなれば問うにも方法があり、聞くにも手がかりがある。長く努力を続ければ、からりと開けて望診の神妙な眼力を得られるであろう。扁鵲が五臓の癥結（しこり）を見たのも、これをはずれるものではない。それゆえわが門では腹診を入門の第一とする。どうして腹診だけで終わろうか。これによって四診を修める階段とすべきである。これが、鶴・稲葉の二翁が腹診の先駆けとなり、私が努めてそのしんがりを務めるわけである。」" }

{

  paras: [
    { head: "証は部位に審にする：三焦", koma: "142R–142L",
      kaki: "夫れ仲景の治法を論ずる、病因と經絡とに於てせずして、一に之を脉證に審にす。故に曰く、「證に隨つて之を治す」と。證を審にする所は、各其の部位に於てす。部位とは、三陽三陰及び三焦の部位なり。究め身軀の大段を分けて三とす。曰く上焦、膈膜より上、心胸の位をいふ。曰く中焦、鳩尾より下、臍上の位をいふ。曰く下焦、臍より下、少腹の位をいふ。論に曰く、「湯を得て反つて劇しき者は、上焦に屬するなり」。又曰く、「理中は中焦を理む。此の利は下焦に在り」と是れなり。愚案ずるに三焦を經絡の名とするは古義に非ず。焦はこがすとよむ。蓋し陽氣薫焦して飲物を熟化し、精氣を運行す。故に咽喉より肛門に至るまでを三段に分けて三焦の名あり。上焦は水穀をいるる道路なり。中焦は水穀を熟化する鍛爐なり。下焦は水穀を通利する溝瀆なり。故に經に云ふ、「三焦は元氣の別使なり」と。",
      yaku: "仲景が治法を論じるのは、病因や経絡によらず、ひたすら脈と証によって詳しくする。だから「証に従って治す」という。証を詳しくするのは、それぞれその部位においてである。部位とは、三陽三陰と三焦の部位である。体幹を大きく三つに分ける。上焦は膈膜より上、心胸の位置。中焦は鳩尾より下、臍の上の位置。下焦は臍より下、下腹（少腹）の位置である。『傷寒論』に「湯薬を飲んでかえってひどくなる者は上焦に属する」、また「理中湯は中焦を整える。この下痢は下焦にある」とあるのがそれである。私が考えるに、三焦を経絡の名とするのは古い意味ではない。「焦」は焦がすと読む。陽気がいぶし焦がして飲食物をこなし、精気を巡らせるのであろう。だから咽喉から肛門までを三段に分けて三焦の名がある。上焦は飲食物を入れる道、中焦は飲食物をこなす炉、下焦は飲食物を通す溝である。だから経に「三焦は元気の別使である」という。" },
    { head: "三陽の部位と表裏", koma: "142L–143R",
      kaki: "而して太陽は其の證を上焦にあらはす。所謂頭項強痛、項背強、若しくは喘・乾嘔の類是れなり。少陽は上中二焦の間にあらはす。所謂口苦・咽乾・目眩、〔三證は熱の胸腹の間にあるの候なり。〕若しくは胸中滿して煩、脇下鞕滿是れなり。陽明は中焦にあらはす。所謂胃家實、腹滿是れなり。又之を名づけて表證・裏證といふ。太陽を表とし、陽明を裏とし、少陽を半表半裏とす。表裏はうらおもてなり。陽病轉じ入る故、此の名あり。",
      yaku: "そして太陽はその証を上焦に現す。いわゆる頭や首筋のこわばりと痛み、首から背中のこわばり、あるいは喘・からえずきの類である。少陽は上焦と中焦の間に現す。いわゆる口が苦い・のどが乾く・めまい〔この三証は熱が胸と腹の間にある徴候である〕、あるいは胸の中が張って苦しい、脇の下が硬く張るなどである。陽明は中焦に現す。いわゆる胃家実（胃腸の実）、腹満である。これをまた表証・裏証と呼ぶ。太陽を表、陽明を裏、少陽を半表半裏とする。表裏とは裏表のことで、陽病は表から裏へ移り入るのでこの名がある。" },
    { head: "表裏の中の内外：内に対して外という", koma: "143R–143L",
      kaki: "又其の表裏の中に於て内外を分つ。内は胃内なり。外は胃外なり。陽邪胃に入り實熱の證をあらはす、之を内實といふ。外は胃外なり。内に對する字なり。故に内に對していふときは、表證・裏證も共に之を外證といふことあり。論に曰く、「傷寒六七日、發熱微惡寒、支節煩疼、微嘔、心下支結し、外證未だ去らざる者は、柴胡桂枝湯之を主る」。〔これは傷寒六七日、結胸をなさんとして心下支結すれども、發熱微惡寒・支節煩疼の外證あり。且つ支結いまだ結實に至らざるゆゑ、結胸として下すべからざるを以て外證といふ。〕又曰く、「傷寒十三日解せず、胸脇滿して嘔し、日晡所潮熱を發する者は、云云。潮熱の者は實なり。先づ宜しく小柴胡湯以て外を解すべし。後柴胡加芒硝湯を以て之を主る」。〔これは潮熱胃實の候にて下すべきものなれども、胸脇滿して嘔するの胃外の證あるものは、まづ之を解して後下すべしとなり。これ胸脇滿は裏證なれども、内に對して外といふなり。〕又「太陽病解せず、熱膀胱に結び、其の人狂の如く、血自ら下る、下る者は愈ゆ。其の外解せざる者は、尚未だ攻むべからず。當に先づ外を解すべし。外解し已つて、但だ少腹急結する者は、乃ち之を攻むべし。桃核承氣湯に宜し」。〔これは少腹急結の者は血證にして胃内のことに非ずといへども、所謂急結の者は熱血相結ぶものにして、攻下せずんばあるべからず。故に太陽の表證を指して外といふなり。〕又曰く、「太陽病、外證未だ除かずして、數之を下し、遂に協熱して利し、利下止まず、心下痞鞕し、表裏解せざる者は、桂枝人參湯之を主る」。〔これは表熱の解せざるを數下して、内に熱を協合して下利をなして止まず。是を以て外に發熱惡寒、裏に心下痞鞕並びにいまだ解せずしてあるゆゑ、表裏を兼ねて治するなり。〕已上の數章、並びに内に對して外といふなり。故に其の下すべからざると、攻むべからざるとの意を以ていふと考ふべし。",
      yaku: "また表裏の中で内外を分ける。内は胃の内、外は胃の外である。陽邪が胃に入って実熱の証を現すのを内実という。外は胃の外で、内に対する字である。だから内に対して言うときは、表証も裏証もともに外証と呼ぶことがある。『傷寒論』に「傷寒六、七日、発熱して少し悪寒し、関節がうずき、少し吐き気があり、心下支結して、外証がまだ去らない者は柴胡桂枝湯が主治する」とある。〔これは傷寒六、七日で結胸になりかけて心下が支え結ぼれているが、発熱・軽い悪寒・関節のうずきという外証があり、また支結がまだ結実に至っていないので、結胸として下してはならない。それで外証という。〕また「傷寒十三日たっても治らず、胸脇が張って吐き、夕方に潮熱が出る者は……潮熱は実である。まず小柴胡湯で外を解し、後で柴胡加芒硝湯が主治する」とある。〔これは潮熱・胃実の徴候で下すべきものだが、胸脇が張って吐くという胃の外の証がある者は、まずこれを解してから下せというのである。胸脇満は裏証であるが、内に対して外と言っている。〕また「太陽病が治らず、熱が膀胱に結び、その人は狂ったようになり、血が自然に下る。下る者は治る。外が解していない者はまだ攻めてはならない。まず外を解すべきである。外が解し終わって、ただ少腹急結だけがある者は、攻めてよい。桃核承気湯がよい」とある。〔少腹急結は血証で胃の内のことではないが、いわゆる急結は熱と血が結んだもので、攻め下さなければならない。だから太陽の表証を指して外と言っている。〕また「太陽病で外証がまだ除かれないのに何度も下し、ついに熱を伴って下痢し、下痢が止まらず、心下痞鞕して、表裏ともに解さない者は桂枝人参湯が主治する」とある。〔表の熱が解さないのに何度も下したため、内に熱が合わさって下痢が止まらない。それで外には発熱悪寒、裏には心下痞鞕がともにまだ解さずにあるので、表裏を兼ねて治すのである。〕以上の数章はいずれも内に対して外と言っている。だから、下してはならない、攻めてはならないという意味で言っていると考えるべきである。" },
    { head: "三陰の部位", koma: "143L–144R",
      kaki: "若し夫れ陰病も亦部位あらざることなし。所謂「太陰の病たる、腹滿して吐し、食下らず、自利益甚しく、時に腹自ら痛む」もの、是れ胃陽衰へて水氣溜滯するの致す所にあらずや。故に其の部位を中焦にあるものとす。陽明の腹滿は熱其の水を爍するものとす。故に之を按ずるに鞕にして痛む。〔實なり。〕太陰の腹滿は虚なり。水其の火を熄するものとす。故に之をおすに鞕からず、痛まず。これ陰陽腹滿のことなる所なり。少陰の初めや、其の證を外にあらはす。所謂脉微細にして、但だ寐んと欲し、或いは手足寒え、背惡寒するものは、腹内の事にあらざるが如しといへども、其の寒固より表證の惡寒と異にして、其の源を下焦の虚寒とすれば、亦其の部位を腹に於てせざることなし。況や其の下利腹痛、及び便膿血するもの、中下二焦の事に非ざることなし。少陰病、咽痛、心煩、胸滿等の上焦に屬するものありといへども、皆下焦の寒に非ざることなし。氣血上り逆するの發するところにして、故に少陰・厥陰の病候は、臍傍より少腹にあるものを本とす。厥陰の病たる、四肢より厥逆するを以て名とすといへども、所謂消渴、氣上つて心を撞き、心中疼熱し、饑ゑて食を欲せざるもの、陰病の極にして、微陽將に絶えんとするの候なり。",
      yaku: "陰病にもまた部位がないわけではない。いわゆる「太陰の病は、腹が張って吐き、食べ物が下らず、下痢がますますひどく、ときどき腹が自然に痛む」というのは、胃の陽気が衰えて水気が溜まり滞ったためではないか。だからその部位を中焦にあるものとする。陽明の腹満は熱がその水を焼きつめるもので、だから押すと硬くて痛む〔実である〕。太陰の腹満は虚で、水がその火を消すものである。だから押しても硬くなく、痛まない。これが陰陽の腹満の違いである。少陰の初めは証を外に現す。いわゆる脈が微細でただ眠りたがり、あるいは手足が冷え、背中が寒いというのは、腹の中のことではないようだが、その寒さはもともと表証の悪寒とは違い、源は下焦の虚寒であるから、やはりその部位は腹にある。まして下痢・腹痛や膿血便は、中焦・下焦のことでないものはない。少陰病にはのどの痛み・胸苦しさ・胸満など上焦に属するものもあるが、みな下焦の寒による。気血が上へ逆上して現れるのであり、だから少陰・厥陰の病候は、臍のわきから下腹にあるものを本とする。厥陰の病は、手足から冷え上がること（厥逆）を名としているが、いわゆる口渇が止まず、気が上って胸を突き、胸の中が痛み熱く、空腹でも食べたくないというのは、陰病の極みで、わずかな陽気が絶えようとしている徴候である。" },
    { head: "陽病は上から下へ、陰病は下から上へ", koma: "144R–144L",
      kaki: "是れ其の下焦の陽氣已に虚して、陰寒蹶起して心中を攻むるものとすれば、所謂消渴疼熱は邪氣の致す所にあらず。氣血上逼して此の熱狀をあらはすものにして、其の病下焦に始まつて直ちに上焦に迫るものなり。案ずるに陽病は外より起つて内に及ぶ。中焦に至るを其の極とす。陰病は内體より始まるがごとしといへども、其の本下焦より起つて、中焦に於けるを甚しとす。其の上焦に及ぶものは、氣血これが爲に鬱して上に逆るなり。故に陽病は上より下に及ぶ。太陽を始めとす。少陽を中とす。陽明を終りとす。陰病は下より上に逆る。少陰を始めとし、太陰を中とし、厥陰を極とす。是れ陰陽順逆自然の象なり。已上皆腹證にあらざることなし。之を要するに、陰陽表裏内外、皆證を辨じ位を分つ爲の紀號にして、其の三陰三陽三焦を以て經脉の名とするものは、仲景の本旨に非ざるなり。",
      yaku: "下焦の陽気がすでに虚して、陰の寒さが起こり立って胸の中を攻めるのであるから、いわゆる口渇や痛み・熱は邪気のしわざではない。気血が上へ迫ってこの熱の状態を現すもので、その病は下焦に始まってすぐに上焦に迫るのである。考えるに、陽病は外から起こって内に及び、中焦に至るのを極みとする。陰病は体の内から始まるようだが、その本は下焦から起こり、中焦に至るのを甚だしいとする。上焦に及ぶものは、気血がそのために鬱して上へ逆上するのである。だから陽病は上から下に及び、太陽を始め、少陽を中、陽明を終わりとする。陰病は下から上へ逆上し、少陰を始め、太陰を中、厥陰を極みとする。これが陰陽の順逆の自然の姿である。以上はすべて腹証でないものはない。要するに、陰陽・表裏・内外はみな証を見分け部位を分けるための記号であり、三陰三陽・三焦を経脈の名とするのは仲景の本旨ではない。" },
    { head: "各位の細かな名目：臓腑の名も部位の記号", koma: "144L–145R",
      kaki: "又其の各位に於て細かに別つところの名あり。胸脇は脇上の総名にして、其の内に於てするもの、肺・心・缺盆・膈上・膈内等の名あり。腹は膈下より臍に至るまでの總名にして、其の内に於てするもの、心下・脇下・臍上・胃の名あり。少腹は臍下より横骨に至るまでの總名にして、其の内に於てするもの、腎・膀胱・腸・血室〔婦人の臍下にあり〕・關元・氣街の名あり。已上皆細かに別つところの名目にして、臓腑の名ありといへども、悉く臓腑内の事をいふにあらず。畢竟亦各位を細別するの紀號なり。陰陽五行臓腑配當の説と齊しく見るべからざるなり。肺癰・腸癰の如きも、但だ其の部位を以て之を定む。〔肺癰は胸にあるを紀し、腸癰は腹にあるを紀す。其の肺癰の證にして膿を吐かざるものを名づけて肺痿とす。蓋し肺痿は肺疽なり。膿なきを以て疽とす。仲景の癰とするもの、皆其の證を枚擧して臆斷せざるを以て見るべし。〕其の腎・膀胱・腸のごときも、皆其の位を紀するの名なり。",
      yaku: "またそれぞれの部位には細かく分けた名がある。胸脇は脇より上の総称で、その中に肺・心・缺盆・膈上・膈内などの名がある。腹は膈の下から臍までの総称で、その中に心下・脇下・臍上・胃の名がある。少腹は臍の下から横骨（恥骨）までの総称で、その中に腎・膀胱・腸・血室〔女性の臍の下にある〕・関元・気街の名がある。以上はみな細かく分けた名目で、臓腑の名ではあっても、すべてが臓腑の中のことを言うのではない。結局、それぞれの部位を細かく分ける記号である。陰陽五行を臓腑に配当する説と同じに見てはならない。肺癰・腸癰なども、ただその部位によって定めている。〔肺癰は胸にあることを、腸癰は腹にあることを記す。肺癰の証で膿を吐かないものを肺痿と名づける。肺痿は肺疽であろう。膿がないので疽とする。仲景が癰とするものは、みな証を列挙して当て推量をしていないことから見てとれる。〕腎・膀胱・腸なども、みなその位置を記す名である。" },
    { head: "胃だけは腑の中をいう。心煩と胸煩、心気不足の辨", koma: "145R–145L",
      kaki: "獨り胃に於ては、腑内のことをいふものあり。これは飲食によりて、其の納るるところ能く知るべきを以て、臆斷にあらず。〔若し其の證を得ざれば言はず。其の不大便五六日已上、潮熱讝語、若しくは腹滿の證を得ざれば、胃中燥屎あるを言はず。乾噫食臭の證あらざれば、胃中不和を言はず。吐下の後、腹微滿、若しくは心煩等の證あらざれば、胃氣を和する劑を投ぜず。〕又梔子豉湯の證に胃中空虛といへば、又之を按じて心下濡といふことあり。黄連湯の證に胃中邪氣有りといへば、腹中痛といふを以て其の應とす。其の他熱膀胱に結ぶといへば、下に少腹急結の應あり。皆腹診の據本とするところなり。若し夫れ心煩と胸煩との別は、讀者猶同物の異稱とす。心は胸の中央にあたるの称なり。小柴胡の證に、心煩喜嘔、或いは胸中煩して嘔せずといふ。其の嘔の有無によりて心胸の分別あるを以て考ふべし。此れ皆作者の意を寓するところなり。其の瀉心湯の證に於て心氣不足といふは、千金方に不定につくること是とすべし。若し強ひて不足とせば、瀉心の名と反せり。瀉は實を瀉するなり。實は乃ち有餘なり。何ぞ不足を瀉するといふことを得んや。讀む者詳にせよ。",
      yaku: "ただ胃についてだけは、腑の中のことを言うものがある。これは飲食によって、それが納まっている所がよくわかるので、当て推量ではない。〔その証がなければ言わない。大便が五、六日以上出ない、潮熱・うわごと、あるいは腹満の証がなければ、胃の中に燥屎があるとは言わない。乾いたげっぷや食べ物のにおいの証がなければ、胃の中が不和とは言わない。吐かせたり下したりした後に、腹が少し張るとか胸苦しいなどの証がなければ、胃気を和らげる薬を与えない。〕また梔子豉湯の証で「胃中空虚」と言えば、それを按じて「心下濡（やわらか）」ということがある。黄連湯の証で「胃中に邪気あり」と言えば、「腹中痛」をその対応とする。そのほか「熱が膀胱に結ぶ」と言えば、下に少腹急結の対応がある。みな腹診の拠り所とするところである。心煩と胸煩の区別については、読者はなお同じものの別名と考えている。心は胸の中央に当たる呼び名である。小柴胡湯の証に「心煩して吐きたがる」、あるいは「胸中が煩して吐かない」という。吐き気の有無によって心と胸の区別があることから考えるべきである。これらはみな作者の意を込めたところである。瀉心湯の証で「心気不足」というのは、『千金方』が「不定」と書いているのが正しいとすべきである。もし無理に「不足」とするなら、瀉心という名と矛盾する。「瀉」は実を瀉することで、実とは余りがあることである。どうして不足を瀉すると言えようか。読む者はよく考えよ。" }

  koma: [147, 151], komaNote: "147L–151R（図二：150L・151R）",
  intro: "臍の底（両腎の間）の動脈の拍動を「腎間の動」とし、生命の根本として診ることの大切さを説く。オランダ（蘭学）の胎児循環の説も引く。臍下の気の充実と動気の位置で死生を見分ける図を付す。",

  paras: [
    { head: "腹中の動脈を診ることの緊要", koma: "147L–148R",
      kaki: "夫れ腹中を按じて動脉を候ふこと、最も緊要にして、務めて精覈せずんばあるべからず。然るに濟生家此の診に疏なるもの多し。甚しきに至つては所謂寸を按じて尺に及ばず、或いは動あり、或いは動なしとして、但だ病毒の致すと言ふとするものあるに至る。豈歎息せざるべけんや。古人も言はずや、「腎間の動は生命の本、十二經の根本なり」。又云ふ、「人の尺あるは、樹の根あるがごとし」と。已上難經に出づ。〔尺は動脉の根本。委しくは別に論ず。〕又云ふ、「陰尺の動脉は五里に在り、五兪の禁なり」。〔霊樞本輸篇に出づ。陰尺は腹なり。動脉は動氣なり。五里五兪は五臓の在所なり。〕此れ皆動脉の事にして、呼吸の氣息たえざる間は、此の動なしといふことなし。世醫動もすれば元氣の虚實をいふもの、亦此の物に於てせずして何をかいふことを得んや。論偏此に及ぶものありといへども、或いは神闕にありといひ、或いは氣海丹田にありといひ、其の實を極むるに至つては、大率秘訣として言はず。他なし、徒らに之を彷彿の中に求めて、其の物を究極せざるなり。",
      yaku: "腹の中を按じて動脈をうかがうことは最も大切で、努めて詳しく調べなければならない。ところが医者にはこの診察がおろそかな者が多い。ひどいものになると、いわゆる「寸を按じて尺に及ばず」で、動があるとかないとか言い、ただ病毒のしわざだとするに至る。嘆かずにいられようか。古人も「腎間の動は生命の本、十二経の根本である」、また「人に尺があるのは木に根があるようなものだ」と言っている。以上は『難経』に出る。〔尺は動脈の根本である。詳しくは別に論じる。〕また「陰尺の動脈は五里にあり、五兪の禁である」という。〔『霊枢』本輸篇に出る。陰尺は腹、動脈は動気、五里・五兪は五臓のある所である。〕これらはみな動脈のことで、呼吸が絶えない間は、この動がないということはない。世の医者が何かといえば元気の虚実を言うのも、この物によらずに何を言えようか。論がここに及ぶものもあるが、神闕（臍）にあるとか、気海・丹田にあるとか言い、その実体を突きつめるとなると、たいてい秘訣として言わない。ほかでもない、ただぼんやりとした中に求めて、その物を突きつめないからである。" },
    { head: "命と元気、魂魄", koma: "148R–148L",
      kaki: "蓋し惟ふに天は一氣にして萬物を維持するものなり。故に天地の間に生じて氣息あるものは、命を受けて活動せずといふことなし。命とは乃ち天の一元氣にして、之を其の腹内に結ぶところありて、それより己が有となり、一身に運行して活動の用をなすなり。其の形氣の相結ぶ處、名づけて魄といふ。其の氣即ち魂となる。是れ魂魄は神明の舎にして、生命の本なり。愚案ずるに、漢儒以來、元氣の説を立てて太元となす。遂に取つて以て醫家の恒言となる。其の説、先天に基づきて人の元氣をいふ。人生の初めに天より賦しあたへられて、出生より後は我が腹内にもちきりになりて活動するものあり。之を元氣と名づけ、因つて元氣を補ふの説あるに至る。大なる誤りなり。元氣は天の一元氣にして、これを我が内に稟けうくるところありて、それにて活動するものにして、時々に新たに我が口鼻より出入往來してあるもの、猶魚の水中に居て水を得たるがごとし。されば元氣の强弱は、それを我が内につなぎもつところの強弱をいふまでのことにして、別に人の元氣として我にもちきりたるものなし。たとへば質鋪の如なるものにて、主人は彼にあるなり。抑も人の初めて生ずるや、男女精を構へて以て成る。譬へば燧を鑽つて火を得るがごとし。其の育するや、乳汁を以てし、之に續くに穀肉果菜を以てす。譬へば得るところの火に油を添へて燈とするが如し。其の死するや、精虚し魄散じて、氣獨り其の元に歸す。譬へば油盡きて燈滅するが如し。是れ魂氣は猶燈火のごとく、形魄は猶油汁のごとし。魂魄の名義、別に詳にす。茲に略す。",
      yaku: "思うに、天は一つの気で万物を支えている。だから天地の間に生まれて呼吸するものは、命を受けて活動しないものはない。命とは天の一つの元気で、それが腹の中に結ぶ所があって、そこから自分のものとなり、全身を巡って活動のはたらきをする。形と気が結び合う所を魄といい、その気が魂となる。魂魄は神明の宿る所で、生命の本である。私が考えるに、漢代の儒者以来、元気の説を立てて万物の大本とし、ついに医家の決まり文句となった。その説は、生まれる前の天賦に基づいて人の元気を言う。人が生まれるとき天から与えられ、生まれてからは自分の腹の中に持ち切りになって活動するものがある、これを元気と名づけ、そこから元気を補うという説が生まれた。大きな誤りである。元気は天の一つの元気で、それを自分の内に受ける所があり、それによって活動するのであって、そのつど新たに口と鼻から出入りしているもの、ちょうど魚が水中にいて水を得ているようなものである。だから元気の強弱とは、それを自分の内につなぎとめておく力の強弱を言うだけのことで、別に人の元気として自分が持ち切っているものはない。たとえば質屋のようなもので、持ち主は向こうにいるのである。そもそも人が初めて生まれるのは、男女が精を合わせてできる。たとえば火打ちで火を得るようなものである。育つには乳を用い、続いて穀物・肉・果物・野菜を用いる。得た火に油を足して灯とするようなものである。死ぬときは、精が虚し魄が散じて、気だけがその元に帰る。油が尽きて灯が消えるようなものである。魂の気は灯火のよう、形の魄は油のようである。魂魄の名の意味は別に詳しく述べるので、ここでは略す。" },
    { head: "腎間＝臍底：動脈の根本（蘭説を引く）", koma: "148L–149R",
      kaki: "其の形氣の相結ぶ所の處、之を腎間とす。正に臍底に當れり。故に臍底を以て動脉の根本とす。所謂腎間の動是れなり。〔腎に左右あり。左を腎といひ、右を命門といふ。其の中間は臍なり。故に腎間といふ。又臍を名づけて神闕といふも、神氣往來の門戸なるの義なり。命門と其の義同じ。和蘭の説に、子宮に在るや、其の養を臍に受け、其の母の血、胞衣に浸漬して、其の臍帶の血脉に傳ひ、臍より肝に送り、肝より心に送り、心より一身に周流して、復た胞衣に歸る。其の血の流るるもの、大人の動脉のごとし。後臍帶の端より其の頭を結ぶ。兒出生の後は口鼻より氣を通ず。和蘭の俗は人身の事を究む。其の説は皆解體に據つて發明して、其の精微を究む。〕して實に其の説のごとくなれば、子母の臍帶より氣血を通ずること是なるべければ、兒身の後口鼻より通ずるところの氣も、直ちに臍底に於て相むすぶところあること、亦此の氣の道を通ずるや、上鼻口に開け、咽喉に至つて氣管の一路となり、下腎間に達し、氣形相結んで呼吸に往來す。而して其の相結ぶ處、一は血脉に分れ、一は動脉に分れて、上下に運行し、一身に周流し、四體を温む。",
      yaku: "形と気が結び合う所、これを腎間とする。ちょうど臍の底に当たる。だから臍の底を動脈の根本とする。いわゆる腎間の動がこれである。〔腎には左右があり、左を腎、右を命門という。その中間が臍である。だから腎間という。また臍を神闕と呼ぶのも、神気の行き来する門口という意味で、命門と同じ意味である。オランダの説では、子宮にいる間は臍から養分を受け、母の血が胞衣（胎盤）に浸みて臍帯の血管を伝い、臍から肝へ、肝から心へ送られ、心から全身を巡って、また胞衣に帰る。その血の流れは大人の動脈のようである。後に臍帯の端を結ぶ。子が生まれた後は口と鼻から気を通わせる。オランダ人は人体のことを究め、その説はみな解剖によって明らかにし、精密を究めている。〕本当にその説のとおりなら、母と子が臍帯から気血を通わせるのは正しいはずで、子が生まれた後に口と鼻から通う気も、すぐに臍の底で結び合う所がある。この気の道は、上は鼻と口に開き、咽喉に至って気管の一本道となり、下は腎間に達し、気と形が結び合って呼吸とともに行き来する。そしてその結び合う所で、一つは血脈に、一つは動脈に分かれて上下に巡り、全身を流れて手足を温める。" },
    { head: "腎間の動と心身・臍下の力", koma: "149L",
      kaki: "故に神明の舎所も此に在り、思慮の發する所も此にあり、嗜慾の動く所も此にあり。驚けば則ち此の動跳々たり、憂ふれば則ち此の氣冲々たり。君子は養ふに浩然たらんことを以てし、小人は暴して以て禍を致す。吾が聖人の道より佛老諸子及び凡百の技藝に至るまで、是の物を知つて自ら省察せざれば、其の德を成し、其の術を達すること能はず。且つ人常を得るときは、此の氣四肢に旺じ、百骸に充ち、臍下實して力あり。",
      yaku: "だから神明の宿る所もここにあり、思慮の起こる所もここにあり、欲望の動く所もここにある。驚けばこの動がどきどきと跳ね、憂えればこの気が揺れ動く。君子はこれを浩然と養い、小人は荒らして災いを招く。わが儒の聖人の道から仏教・老荘・諸子、さらにあらゆる技芸に至るまで、この物を知って自ら省みなければ、その徳を成し、その術に達することはできない。また人が正常であれば、この気は手足に盛んで全身に満ち、臍の下が充実して力がある。" },
    { head: "動気の位置と死生", koma: "150R",
      kaki: "若し病篤く、若しくは年老いて神まさに其の舎を去らんとするときは、此の動心胸に逼つて四肢に旺ぜず。臍下空虛、之を按ずるに絮の如し。動氣上にありといへども、臍下に氣旺じて力あるものは、危しといへども死せず。又形狀死せるがごとく、或いは形容枯槁すといへども、此の氣存するものは起たしむべし。所謂「形容枯槁すといへども根本まさに自ら生ぜんとす」、又所謂「能く生くべきもの、之をして能く起たしむ」と、是れなり。若し此の氣旺せざるものは、其の人いまだ病まずといへども、名づけて行屍といふ。是れ死人も同じことにて、所謂司命といへどもいかんともすることなきものなり。然れども人いまだ全く死せざる間は、此の動尚存して止まず。故に此の動を按ずるのみにしては、いまだ吉凶を預め決しがたし。故に之を氣海丹田の間に候ふ。是れ少しく動を離れて、其の氣の旺衰を窺ふなり。氣海・關元まで動氣の應ずるもの間ありといへども、臍底を本とす。故に人毎にはなきなり。誤らざるべし。",
      yaku: "病が重いとき、あるいは年老いて精神がまさにその宿を去ろうとするときは、この動は胸に迫って手足には盛んでない。臍の下は空虚で、押すと綿のようである。動気が上にあっても、臍の下に気が盛んで力がある者は、危うくても死なない。また姿が死んだようでも、あるいは顔かたちがやつれ果てていても、この気が残っている者は回復させることができる。いわゆる「顔かたちがやつれ果てても根本が自ら生じようとしている」、また「よく生きられる者を、よく立ち直らせる」というのがこれである。もしこの気が盛んでない者は、まだ病んでいなくても「行屍（歩く屍）」と呼ぶ。死人も同じで、いわゆる司命（運命をつかさどる神）でもどうしようもない者である。しかし人が完全に死なない間は、この動はなお残って止まない。だからこの動を按じるだけでは、まだ吉凶をあらかじめ決めがたい。そこで気海・丹田のあたりでうかがう。これは少し動から離れて、その気の盛衰をうかがうのである。気海・関元まで動気が応じる者もときにはあるが、臍の底を本とする。だからどの人にもあるわけではない。誤ってはならない。" }

{
  id: "yoku1-doki", no: 77, kind: "総論図", title: "動悸の辨 附 治法略案", yomi: "どうきのべん つけたり ちほうりゃくあん", group: "腹証奇覧翼 初編 上",
  koma: [151, 156], komaNote: "151L–156R（図一：156R。附方 三才飲）",

    desc: "墨刷り。髷・ひげの男が竹籠の腰掛けに座り、片膝を上げ、片手を背に回す。胸腹に点と線。書き込み：胸の中央上に「心動悸」、向かって右（患者の左）の乳の下に「虚里動」、臍に「腎間動」。心下へ線「狂・驚・煩狂・煩躁スルモノ、虚實トモニ此邊ノ上下ニ於テ動氣ヲ得ベシ」、「奔豚・氣血暈・驚癇等ノ動氣、右ノ小腹ヨリ其邊ニ奔騰ス」、「臍傍・臍上ノ動氣、其上下ニ於テ浮ナルモノハ外邪表証多シ」、向かって右下「肝積ト名ルモノ、左ノ臍傍ヨリ其邊ニ動アリ、或ハ急痛ス。飲家モ亦同シ」。" },
  paras: [
    { head: "動と悸の区別", koma: "151L–152R",
      kaki: "動はうごくなり。神氣にて動くを動といふ。腹底を按ずるに、指頭に應じてどきどきと動いて止まざるもの、動氣なり。腹皮を淺く按ずるに、びくびくとして指頭に應じ、深く按ずれば却つて失ふものは悸なり。然れども悸はおそるる意ありて、相當氣に弱のつきたるの字義なるゆゑ、其の悸するところ心中のみならず、心下にても臍下にても、びくびくだくだくとして、其の氣のよわみありて落ちつかぬ心もちあるもの、乃ち悸なり。案ずるに動は本なり。悸は末なり。動は形あり。悸は形なし。悸は必ず動より發す。故に動悸を連ね言ふことあり。然れども動あるもの必ずしも悸せず。故に又動と悸とを別けて、其の證候を異にす。且つ動は動脉の根本にして、病に非ざること、前説の如し。但し其の常を失ひ、其の舎に安んぜざるときは、之を病證に見す。",
      yaku: "「動」は動くことで、神気によって動くのを動という。腹の底を按じると、指先に応じてどきどきと動いて止まないもの、これが動気である。腹の皮を浅く按じると、びくびくと指先に応じ、深く按じるとかえって消えるもの、これが悸である。しかし悸には恐れる意味があり、気に弱さが伴うという字の意味なので、悸する所は胸の中だけでなく、心下でも臍の下でも、びくびく・どきどきとして、気に弱みがあって落ち着かない気持ちのあるもの、それが悸である。考えるに、動は本、悸は末である。動には形があり、悸には形がない。悸は必ず動から起こる。だから「動悸」と続けて言うことがある。しかし動がある者が必ず悸するとは限らない。だからまた動と悸とを分けて、その証候を区別する。また動は動脈の根本であって病ではないことは前の説のとおりである。ただしその常を失い、その宿に落ち着かないときは、これを病証に現す。" },
    { head: "傷寒論・金匱の動悸の諸証", koma: "152R",
      kaki: "證に曰く、「臍上築する者は、腎氣動ずるなり。桂四兩を加へ、朮を去る」。〔○案ずるに方下の加減法、多くは古に非ざるに似たり。然れども亦其の古意を存し、且つ試みて効あるものは之をすてず。〕又曰く、「動臍上に在る者は、癥痼の害を爲す」。〔一説は非なり。本方の下に辨ず。桂枝茯苓丸。〕又曰く、「脉結代、心動悸するは、炙甘草湯」。其の他胸腹に動あるもの、復た直ちに其の動を言はずして其の應を言ふ。所謂驚狂・煩驚・煩燥・心煩・癲癇・目眩・氣上衝・奔豚氣上衝心の類、皆動氣の變候なり。悸は病證なり。其の發する所三つ。曰く心中、曰く心下、曰く臍下。而して其の候一ならず。水氣によるものあり。〔半夏麻黄丸・茯苓桂枝甘草大棗湯・眞武湯是れなり。〕熱によるものあり。〔小柴胡湯是れなり。〕急迫によるものあり。〔小建中湯・桂枝甘草湯是れなり。〕其の他驚いて悸するもの、憂へて悸するものの類、時あつて悸し、時あつて自ら定まるものは、藥治に及ばざるなり。詩に「容たり遂たり、垂帶悸たり」とは、憂へて悸するの謂なり。五雜組に「懸崖に臨み、深淵に瀕し、獨木の橋は、人をして悸を病ましむ」とは、怖れて悸するなり。",
      yaku: "『傷寒論』（理中丸の加減）に「臍の上がつくように動く者は、腎気が動いているのである。桂枝四両を加え、朮を去る」とある。〔○考えるに、方の下の加減法は多くは古いものではないようだ。しかし古い意味を残し、試して効果のあるものは捨てない。〕また「動が臍の上にある者は、癥痼（古いしこり）の害をなす」とある。〔一説は誤り。その方のところで論じる。桂枝茯苓丸。〕また「脈が結代し、心動悸するのは炙甘草湯」とある。そのほか胸腹に動があるものは、その動を直接言わずに、その現れを言う。いわゆる驚いて狂う・驚き苦しむ・もだえる・胸苦しい・癲癇・めまい・気の上衝・奔豚の気が胸を突き上げるなどの類は、みな動気の変わった現れである。悸は病証で、起こる所は三つ、胸の中・心下・臍の下である。その原因は一つではない。水気によるもの〔半夏麻黄丸・茯苓桂枝甘草大棗湯・真武湯〕、熱によるもの〔小柴胡湯〕、急迫によるもの〔小建中湯・桂枝甘草湯〕がある。そのほか驚いて悸する、憂えて悸するなど、ときに悸してときに自然におさまるものは、薬で治すまでもない。『詩経』に「落ち着かずそわそわし、垂れた帯が揺れる」とあるのは憂えて悸すること、『五雑組』に「崖っぷちや深い淵、一本橋は人に悸を病ませる」とあるのは、怖れて悸することである。" },
    { head: "問答：動気を診る法（両覆手壓按）", koma: "152L–153R",
      kaki: "或るひと問うて曰く、動脉を診するの緊要なると、動と悸との辨は、粗其の旨を明すことを得たり。今病人を診するに、動氣の指頭に應ずるものあり。又應じ難きものあり。宜なるかな世醫の動氣に於て有無をいふのことあること。之を診するに法ありや。且つ其の動氣の應ずるもの、其の證を辨じ、其の方を處するの略も、亦聞くことを得べきや。答へて曰く、凡そ腹を診するもの、三指探按の法あり、兩覆手壓按の法あり。探指に應ぜざるものは、兩覆手壓按せざれば得べからず。〔診法、下冊に詳にす。〕今初學の爲に、其の治法の顯然たるものを擧げて、以て索捜の引とす。豈其の變を盡すに足らんや。委しくは各方の腹證の下に辨ず。",
      yaku: "ある人が尋ねた。「動脈を診ることが大切なことと、動と悸の区別とは、おおよそその趣旨がわかった。いま病人を診ると、動気が指先に応じる者もあれば、応じにくい者もある。世の医者が動気について有る無しを言うのももっともだ。これを診るのに方法はあるのか。また動気が応じる者について、証を見分け、方を処するあらましも聞かせてもらえるか。」答えて言う。「腹を診るには、三本の指で探るように按じる法と、両手を伏せて重ねて押す法（両覆手圧按）とがある。探る指に応じないものは、両手を伏せて押さなければつかめない。〔診法は下冊に詳しく述べる。〕いま初学者のために、治法のはっきりしたものを挙げて、探る手引きとする。どうしてその変化を尽くせようか。詳しくは各方の腹証のところで論じる。」" },
    { head: "虚里の動・心動悸・心胸の動", koma: "153R–153L",
      kaki: "○虚里の動は、左の乳下にあり。凡そ胸腹に動あるもの、多くは此の處に應ず。甚しきものは右の乳下にもあり。平生此の動高きものは、痰飲に屬す。〔苓桂朮甘湯の類、證に隨つて考へ服すべきなり。〕傷寒熱證に、此の動高きものは、後大患あり。輕視すべからず。○心動悸するもの、炙甘草湯。兩覆手に胸を按じて之を得べし。其の他病人を診するごとに、必ず先づ兩覆手壓按して、心胸の動靜を候ふことを要す。心胸一面にだくだくと動を覺ゆるもの、諸證の分別ありて紛れやすし。熱煩なるものあり。〔柴胡輩。〕虚煩なるものあり。〔梔子豉・酸棗仁湯・瀉心輩。〕諸桂枝輩、臍上の動ある者、氣上衝するものあり。〔苓桂甘棗湯の類。〕氣上衝して急迫するものあり。〔甘艸乾姜湯・小建中湯・桂枝甘艸湯の類。〕痰飲なるものあり。〔苓桂五味甘艸湯・桂枝甘艸湯・小青龍湯・苓桂朮甘湯の類。〕まさに外證と腹狀とを併せて之を分別すべし。",
      yaku: "○虚里の動は左の乳の下にある。胸腹に動のある者は、多くはここに応じる。ひどい者は右の乳の下にもある。ふだんからこの動が高い者は痰飲に属する。〔苓桂朮甘湯の類を、証に従って考えて服用させる。〕傷寒の熱証でこの動が高い者は、後に大病になる。軽く見てはならない。○心動悸する者は炙甘草湯。両手を伏せて胸を按じればつかめる。そのほか病人を診るたびに、必ずまず両手を伏せて押し、心胸の動静をうかがうことが必要である。胸一面にどきどきと動を感じるものは、いろいろな証の区別があって紛らわしい。熱による胸苦しさのもの〔柴胡剤〕、虚による胸苦しさのもの〔梔子豉湯・酸棗仁湯・瀉心湯類〕、桂枝剤の類で臍の上に動があり気が上衝するもの〔苓桂甘棗湯の類〕、気が上衝して急迫するもの〔甘草乾姜湯・小建中湯・桂枝甘草湯の類〕、痰飲のもの〔苓桂五味甘草湯・桂枝甘草湯・小青竜湯・苓桂朮甘湯の類〕がある。外証と腹の状態を合わせて見分けるべきである。" },
    { head: "危急の動気・上中脘の動気", koma: "153L–154R",
      kaki: "○動氣心に迫つて、胸滿・短氣・煩悶、若しくは喘急、若しくは乾嘔、若しくは痿癖、若しくは上竄して死せんと欲するものは危急の證とす。〔風引湯・紫石寒食散を撰び用ゆ。吐方及び走馬・備急を用ふべからず。〕○動氣上中脘の間にありて強きものは、〔桂枝輩。〕若しくは驚狂・煩狂・心煩・心悸・煩躁・目眩等の證を發するものは、〔諸加竜骨牡蠣の輩。〕若しくは心下痞するものは〔瀉心輩。〕亦外證と腹狀とに依つて分辨すべし。○動氣心中にありて、背の五六椎に徹し痛みあるもの、或いは動氣上脘より心下にせまりて、臍下空虛なるものは危しとす。〔並びに死の候なり。妄りに治法を論じがたし。〕○中脘の邊に動氣ありて、之を按ずるに浮なるものは、大率表證なり。〔諸桂枝輩を考ふべし。〕若しくは胸腹實して力あり、上中脘の動氣按ずれば按ずるほど強きを覺ゆるものは、實邪胃内に實するものとす。〔大柴胡加芒硝、或いは承氣の輩を考ふべし。〕沈實にして力あるものとす。",
      yaku: "○動気が胸に迫って、胸が張る・息切れ・もだえ苦しむ、あるいは喘ぎが急、あるいはからえずき、あるいは痿えしびれ、あるいは目が上につり上がって死にそうになる者は、危急の証とする。〔風引湯・紫石寒食散を選んで用いる。吐かせる方や走馬湯・備急丸を用いてはならない。〕○動気が上脘・中脘のあたりにあって強い者は〔桂枝剤〕、あるいは驚いて狂う・もだえ狂う・胸苦しい・動悸・煩躁・めまいなどの証を起こす者は〔竜骨牡蠣を加えた方の類〕、あるいは心下が痞える者は〔瀉心湯類〕、これも外証と腹の状態によって見分ける。○動気が胸の中にあって背中の第五・六胸椎まで通って痛む者、あるいは動気が上脘から心下に迫って臍の下が空虚な者は危ういとする。〔いずれも死の徴候で、みだりに治法を論じがたい。〕○中脘のあたりに動気があって、按じると浮いている者は、たいてい表証である。〔桂枝剤の類を考えよ。〕あるいは胸腹が充実して力があり、上・中脘の動気が押せば押すほど強く感じられる者は、実邪が胃の内に実しているものとする。〔大柴胡湯加芒硝、あるいは承気湯類を考えよ。〕沈んで実して力があるものである。" },
    { head: "水分の動・臍底の動・脾虚", koma: "154R",
      kaki: "○水分の動浮にして、之を按じて痛むもの、水氣なり。若しくは小便不利、若しくは水瀉、若しくは渇等の證を兼ぬれば、五苓散の證なり。或いは曰く、外邪の候あり。愚案ずるに苓桂朮甘湯・桂枝去芍藥加茯苓朮湯の類にもまたあるべし。○臍底の動は前に辨ず。若しくは之を按ずるに底に堅塊あり、動氣と倶にうごき上中脘の邊に及ぶものは、癥痼なり。〔桂枝茯苓丸。〕若しくは臍邊に動あり、之をおすに牢く痛み、外證熱瞤すれば、若しくは口舌かわき、肌膚枯燥するものを、脾虚とす。〔貞元湯をもちゆ。〕",
      yaku: "○水分（臍の上一寸）の動が浮いていて、按じると痛むものは水気である。小便が出にくい、水様の下痢、口渇などの証を兼ねれば五苓散の証である。ある人は外邪の徴候があるという。私が考えるに、苓桂朮甘湯や桂枝去芍薬加茯苓朮湯の類にもあるだろう。○臍の底の動は前に論じた。按じると底に堅い塊があり、動気とともに動いて上・中脘のあたりまで及ぶものは癥痼である。〔桂枝茯苓丸。〕臍のあたりに動があり、押すと硬く痛み、外証に熱やぴくつきがあり、あるいは口や舌が乾き、肌が枯れて乾燥する者を脾虚とする。〔貞元湯を用いる。〕" },
    { head: "奔豚の動・蟲・癲癇・産後の暈", koma: "154L",
      kaki: "○奔豚の動は、臍底より起つて、直ちに心胸に至る。休作あり。若し臍下悸するもの、奔豚をなさんとす。水氣ありとす。〔桂枝加桂湯・苓桂甘棗湯・奔豚湯。〕又此の形狀に似て發するとき呻吟するものは、蟲なり。又蟲證に常に動氣甚しきものあり。或いは心中煩悶怔忡するものあり。他の蛔蟲の脉證と併せ考へて之を分辨すべし。〔甘草粉蜜湯・烏梅丸。其の他殺蟲の類。〕癲癇亦奔豚に似たり。別に論ぜり。○産後の暈、及び諸の血暈するもの、皆動氣上つて心胸にせまる。其の暈を禁ずべし。右の不容の穴を按ぜよ。虚實あり。大率産論によるべし。〔若しくは瘀血上衝する者は、黄土湯・千金甘草湯・失笑散の類。〕",
      yaku: "○奔豚の動は臍の底から起こって、まっすぐ胸に至る。起こったりやんだりする。臍の下が悸する者は奔豚を起こしかけている。水気があるとする。〔桂枝加桂湯・苓桂甘棗湯・奔豚湯。〕またこの形に似て起こるときにうめく者は虫である。また虫の証で常に動気のひどい者がある。胸の中がもだえて動悸がおさまらない者もある。ほかの回虫の脈や証と合わせて考えて見分けよ。〔甘草粉蜜湯・烏梅丸、そのほか虫下しの類。〕癲癇も奔豚に似るが、別に論じた。○産後のめまいや、さまざまな血によるめまいは、みな動気が上って胸に迫る。そのめまいを抑えるには、右の不容穴を按じよ。虚実がある。おおむね『産論』によるべきである。〔瘀血が上衝する者は黄土湯・千金甘草湯・失笑散の類。〕" },
    { head: "水腫・脚気・火動・婦人の血証の動悸", koma: "154L–155R",
      kaki: "○水腫・癰瘍を兼ぬるもの、悸動あるものあり。又脚氣衝心の漸あるもの、心下に必ず動あり。誤り混ずべからず。水腫に積痼の動をかぬるもの、〔柴胡姜桂湯に茯苓を加ふ。〕脚気衝心するものは、〔風引湯。劇しからざるものは呉茱萸・茯苓輩。〕○所謂火動・燥證・積熱と名づくるものの類、必ず動氣亢ることまさに虚實を分別すべし。〔實するものは諸瀉心輩。虚するものは百合湯・竹葉石膏湯の類。〕○凡そ婦人の血證、悸動するもの多し。〔桂枝加黄耆湯・小建中の輩あるべし。〕若しくは産後の病、男婦の諸血・痰飲・積癖の類、悸動を兼ぬるもの多し。能く其の本證を捜り、證に隨つて之を治すべし。善く其の本を得るときは、或いは動を主とせずといへども、動は自ら治することあり。左に試むるところの一二を具列す。併せ考ふべし。〔沈香天麻湯〈濟生寶鑑の方〉・三物黄芩湯〈金匱 産後〉・人參大木湯〈治案談によるべし〉・加桂湯・四逆散加牡蠣湯・桂枝湯牡蠣湯合方。其の他前に載するところと併せ覽るべし。〕",
      yaku: "○水腫や腫れ物を兼ねる者に、悸動のある者がある。また脚気衝心（脚気が心臓に及ぶ）の兆しのある者は、心下に必ず動がある。取り違えてはならない。水腫に積痼の動を兼ねる者は〔柴胡姜桂湯に茯苓を加える〕、脚気衝心する者は〔風引湯。ひどくない者は呉茱萸湯・茯苓剤の類〕。○いわゆる火動・燥証・積熱と呼ばれるものの類は、必ず動気が高ぶる。虚実を見分けるべきである。〔実する者は瀉心湯類、虚する者は百合湯・竹葉石膏湯の類。〕○女性の血の証には悸動する者が多い。〔桂枝加黄耆湯・小建中湯の類があるだろう。〕あるいは産後の病、男女のさまざまな血の病・痰飲・積癖の類には、悸動を兼ねる者が多い。よくその本の証を探り、証に従って治すべきである。よくその本をつかめば、動を主眼にしなくても、動は自然に治ることがある。次に試したものを一、二並べる。合わせて考えよ。〔沈香天麻湯（済生宝鑑の方）・三物黄芩湯（金匱要略 産後）・人参大木湯（治案談による）・加桂湯・四逆散加牡蠣湯・桂枝湯と牡蠣湯の合方。そのほか前に載せたものと合わせて見よ。〕" },
    { head: "陰証の動気と陰陽虚実の辨", koma: "155R–155L",
      kaki: "以上多くは陽証に於けるものとす。其の他陰証にあるものは、外証によつて動を主とせず。假へば眞武湯の心下悸、頭眩、身瞤動するもの、若しくは四逆湯の裏寒外熱するもの、通脉四逆湯の面赤色、白通加猪膽汁湯の乾嘔煩するもの、當歸四逆湯の脉浮革なるものの類、皆其の動氣臍上より心下に甚しきものとす。其の他脉家に所謂浮大・洪大等を忌むといふものは、皆下焦虚して臍下の氣衰へ、動氣心下に逼るものなり。是に於てか陰陽虚實の辨、審にせずんばあるべからず。",
      yaku: "以上は多くは陽証のものである。そのほか陰証にあるものは、外証によって判断し、動を主眼にしない。たとえば真武湯の心下悸・めまい・体のぴくつき、四逆湯の裏寒外熱、通脈四逆湯の顔の赤み、白通加猪胆汁湯のからえずきと煩、当帰四逆湯の脈が浮で革のようなものなどは、みなその動気が臍の上から心下にかけて甚だしいものである。そのほか脈の専門家がいわゆる浮大・洪大などを忌むというのは、みな下焦が虚して臍の下の気が衰え、動気が心下に迫っているのである。ここにおいて陰陽虚実の区別を詳しくしなければならない。" },
    { head: "附方：三才飲", koma: "155L",
      kaki: "三才飲　瘕動百計及ぶこと能はざる者を治す。又諸の暴逆の證を治す。熊膽二錢、沈香一兩、水銀二兩、鉛二錢。右先づ水銀と鉛二錢とを取り、倶に銅器に於て炭火を以て之を熔かし、之を臺器の上に移し、冷ゆるを候ひて、乃ち之を研末し、沈香細末・熊膽剉細末に和し、少しく水を加へ、擂りて糊と成し、以て膏の如くならしめ、米湯にて送下す。",
      yaku: "三才飲。腹のしこりの動悸に、あらゆる手を尽くしても及ばない者を治す。またさまざまな急な逆上の証を治す。熊胆二匁、沈香一両、水銀二両、鉛二匁。まず水銀と鉛二匁を銅の器に入れ、炭火で溶かし、台の上の器に移して冷めるのを待ち、粉末にする。沈香の細末と熊胆を刻んだ細末に混ぜ、少し水を加え、すりつぶして糊状にし、膏のようにして、重湯で飲み下す。" }
  ],

{

  paras: [
    { head: "七種の塊（一〜四）", koma: "156L–157R",
      kaki: "夫れ腹中の病塊を成すもの、古名づけて癥といひ、癖といひ、瘕といふ。而して其の物たる一ならず。先達七種の塊を辨ず。今愚按を附して其の説を載す。一に曰く、食塊。左右脇下にあらはる。〔愚案ずるに、肉食の癥瘕、心胸の間に留まつて化せざるありとす。又寄食の癥瘕は上脘にありとす。皆胃管に留まつて化せざるなり。或いは曰く、右の脇下に髪筋の如きものを見す。飲食の毒なり。〕二に曰く、風塊。中脘の邊にあらはる。〔愚案ずるに、臍上動脉に塊をなすものあらはる。所謂中風半身不遂のものにこれあり。〕三に曰く、氣塊。左右脇下肝經の邊にあらはる。〔愚案ずるに、所謂積癥なり。然れども氣は形なし。塊をなすべからず。但し氣鬱結すれば、沫・涎・瘀沫に凝滞して塊をなす。其の處を移して移らざるものを積とす。展轉推移するものを聚とすといへり。抑も德本が曰く、「積はつむなり。水穀の毒つみあつまるなり」と。此の説是なり。〕四に曰く、血塊。左の小腹にあらはる。〔愚案ずるに、婦人の血室は左の少腹にあり。故に左の少腹にあるものを血塊とす。然れども血塊、左の少腹にかぎるべからず。余が験するもの、脇下・臍の四邊、及び左右の少腹ならびに皆血塊あるをみる。まさに外証に隨つてこれを分別すべし。〕",
      yaku: "腹の中に病の塊をつくるものを、古くは癥・癖・瘕と名づけた。そのものは一種類ではない。先達は七種の塊を論じている。いま私の考えを付けてその説を載せる。一、食塊。左右の脇の下に現れる。〔私の考え：肉食による癥瘕で胸のあたりに留まってこなれないものがあるとする。また寄食の癥瘕は上脘にあるとする。いずれも胃に留まってこなれないのである。ある人は、右の脇の下に髪の毛の筋のようなものが現れ、飲食の毒であるという。〕二、風塊。中脘のあたりに現れる。〔私の考え：臍の上の動脈に塊をつくるものが現れる。いわゆる中風で半身不随の者にこれがある。〕三、気塊。左右の脇の下、肝経のあたりに現れる。〔私の考え：いわゆる積・癥である。しかし気には形がないので塊をつくれない。ただ気が鬱結すると、泡・よだれ・瘀滞したものに凝り滞って塊をつくる。場所を移しても移らないものを積、転がって移り動くものを聚とするという。永田徳本は「積は積むである。飲食の毒が積み集まるのである」と言った。この説が正しい。〕四、血塊。左の下腹に現れる。〔私の考え：女性の血室は左の下腹にある。だから左の下腹にあるものを血塊とする。しかし血塊は左の下腹に限らない。私の経験では、脇の下・臍の四方・左右の下腹のいずれにも血塊がある。外証に従って見分けるべきである。〕" },
    { head: "七種の塊（五〜七）と大横の塊", koma: "157R",
      kaki: "五に曰く、胎姙塊。臍下任脉の行、横骨の上にあらはる。〔愚案ずるに、妊娠七八十日の後、大なる栗子の如きものをみる。産論によるべし。〕六に曰く、水塊。右の少腹臍傍にあらはる。〔愚案ずるに、小便不利の塊なり。或いは此の邊結聚するもの、久寒の毒多し。〕七に曰く、燥屎塊。右の少腹股際の上にあらはる。〔愚案ずるに、其の形磊砢として碁子の嚢中の石を探るがごとし。此の邊に結聚するもの、亦久寒の毒あり。形を以てわかつべし。〕凡そ七種。又大横の穴の塊あるもの、左を大便道にかかるものとす。痔漏・脱肛の患あるべし。右を小便道にかかるものとす。下疳・淋疾の患あるべし。〔大横の穴は、臍下すこしさがりて左右各相去ること三寸にあり。〕",
      yaku: "五、胎妊塊。臍の下の正中線（任脈の通り）、横骨（恥骨）の上に現れる。〔私の考え：妊娠七、八十日の後に大きな栗の実のようなものを触れる。『産論』によるべきである。〕六、水塊。右の下腹、臍のわきに現れる。〔私の考え：小便が出にくいことによる塊である。このあたりに結び集まるものには、長年の冷えの毒が多い。〕七、燥屎塊。右の下腹、股の付け根の上に現れる。〔私の考え：その形はごろごろとして、袋の中の碁石を探るようである。このあたりに結び集まるものにも長年の冷えの毒がある。形で見分けよ。〕以上七種。また大横穴に塊がある者は、左は大便の道にかかるもので、痔ろう・脱肛を患うであろう。右は小便の道にかかるもので、下疳・淋病を患うであろう。〔大横穴は臍より少し下がって、左右それぞれ三寸離れた所にある。〕" },
    { head: "加えるべき塊：瘧母・蟲癖・疝癥・痃癖・飲癖", koma: "157R–157L",
      kaki: "愚又案ずるに、此の外尚言ふべきものあり。曰く瘧母。久瘧の塊を成すもの。曰く蟲癖。蚘蟲聚まつて塊に似たるものあり。或いは曰く、左の臍傍に縄をはりたるごとくかたまりて痛むもの、蚘虫なり。曰く疝癥。水血の二候あり。此の癥少腹膀胱の間にあるもの多し。水寒の毒は右の少腹にあり。血疝の毒は左の臍傍にあり。曰く痃癖。小兒にある塊、俗にかたかひといふ。左痃右癖の説あり。又小兒にもかぎらず、左右脇下に結聚するものをいふ。脾積の類なるべし。曰く飲癖。此れ留飲の結癖なり。之を按ずれば水聲を聞く。左右脇下にあり。又心下堅大なること盤の如しといふもの、水飲の作す所とすれば、飲癖の類なるべし。〔水塊に屬す。〕以上諸塊の辨、多端なるが如しといへども、其の妊胎・燥屎・蟲蝕の外、要するに水にあらざれば血、若しくは水血相結ぶもの、皆腹中の淫濁痰汁の凝滞結聚するところなり。之を名づけて陳寒痼冷といふものは、蓋し陽氣の至らざるところ、物必ず凝結凍涸するを以てなり。是の故に今法を仲景に取つて、證を審にして之を治するときは、堅塊癥瘕治せずといふことなし。一に攻撃するのみに由るべからず。",
      yaku: "私はさらに考える。このほかにも言うべきものがある。瘧母：長引いたマラリアが塊をつくったもの。虫癖：回虫が集まって塊のようになったもの。ある人は、左の臍のわきに縄を張ったように固まって痛むものは回虫だという。疝癥：水と血の二つの型がある。この癥は下腹・膀胱のあたりにあることが多い。水と冷えの毒は右の下腹に、血疝の毒は左の臍のわきにある。痃癖：子どもにある塊で、俗に「かたかい」という。左を痃、右を癖とする説がある。また子どもに限らず、左右の脇の下に結び集まるものをいう。脾積の類であろう。飲癖：これは留飲が結んで癖となったもので、按じると水の音が聞こえる。左右の脇の下にある。また「心下が堅く大きく盤（大皿）のよう」というものは、水飲によるものなので飲癖の類であろう。〔水塊に属する。〕以上、諸塊の区別は多岐にわたるようだが、妊娠・燥屎・虫の外は、要するに水でなければ血、あるいは水と血が結んだもので、いずれも腹の中の濁った痰や汁が凝り滞り結び集まったものである。これを陳寒痼冷（古い冷えの凝り）と呼ぶのは、陽気の届かない所では物が必ず凝り固まり凍りつくからであろう。それゆえいま法を仲景に取り、証を詳しくして治せば、堅い塊や癥瘕も治らないものはない。ひたすら攻めることだけに頼ってはならない。" },
    { head: "治法の略（一）：脊骨との区別・食毒・心下の堅塊・飲癖", koma: "157L–158L",
      kaki: "今且く初學の爲に其の治法の略を開列す。必ずしも此に止まるべからず。老年若しくは精虚のもの、腹皮輭弱にして物なきが如きもの、之を診して腹底中央に長き堅塊を得るものは、脊骨にして病毒にあらず。誤認することなかれ。○生肉胃脘に留まつて化せず、癥瘕を成すものは、橘皮大黄芒硝湯。或いは瀉心圓。〔徳本十九方の一。〕諸の食毒、心下若しくは脇下に在つて化せざるものは、まさに之を吐すべし。〔瓜蔕散。〕若し未だ解せざるものは、大承氣湯或いは調胃承氣湯。〔案ずるに吐方は腹狀の虚實を審にして之を服すべし。妄りに投ずべからず。〕或いは時食の毒久しく經て治せざるもの、其の當時食せし所の物を熟識するときは、之を得て、焼いて性を存し、證に隨ふの方内に加へ、或いは單服して効ありと。〔之れ建殊録にのす。茄子を食せしむるの類にして、一案に備ふべし。〕○心下の堅塊は、外證に隨つて方を求むべし。〔桂姜棗艸黄辛附湯の下に辨ぜり。〕飲癖は外證に隨つて、痰飲留飲の主劑を服し、丸藥を兼用することもあり。〔金匱の痰飲の治法を考ふべし。或いは下すべきものは、十棗湯・平水丸・頭行丸の類を用ふ。或いは云ふ、外臺の大蟾蜍湯を用ふべしと。〕",
      yaku: "いまひとまず初学者のために治法のあらましを並べる。必ずしもこれに限るべきではない。老人あるいは精気の虚した人で、腹の皮がやわらかく弱く何もないような者を診て、腹の底の中央に長い堅い塊を触れたら、それは背骨であって病毒ではない。誤認してはならない。○生肉が胃に留まってこなれず癥瘕となったものは橘皮大黄芒硝湯、あるいは瀉心円〔徳本十九方の一つ〕。さまざまな食毒が心下や脇の下にあってこなれないものは吐かせるべきである〔瓜蒂散〕。まだ解けないものは大承気湯か調胃承気湯。〔考えるに、吐かせる方は腹の状態の虚実を詳しく見て服用させよ。みだりに与えてはならない。〕あるいは食べ物の毒が長く経っても治らない者で、当時食べた物がはっきりわかるときは、それを手に入れ、性を残して黒焼きにし、証に合った方に加えるか単独で服用させて効果があるという。〔これは『建殊録』に載る。茄子を食べさせるなどの類で、一つの案として備えておくべきである。〕○心下の堅い塊は外証に従って方を求めよ。〔桂姜棗草黄辛附湯のところで論じた。〕飲癖は外証に従って痰飲・留飲の主剤を服用させ、丸薬を兼用することもある。〔金匱要略の痰飲の治法を考えよ。下すべきものは十棗湯・平水丸・頭行丸の類を用いる。ある人は『外台秘要』の大蟾蜍湯を用いよという。〕" },
    { head: "治法の略（二）：気塊積癥・疝・瘧母・小児の癖塊・血塊", koma: "158L–159R",
      kaki: "○氣塊積癥、諸證を分別すべし。蓋し氣分あり。〔久寒痼冷の證あるものは附子を主として温散すべし。或いは呉茱萸・當歸・大黄輩も考ふべし。〕血證あり。〔桃核承氣・芎歸膠艾・抵當・大黄䗪虫丸の類。若しくは攻むべき者、通氣丸試むべし。〕或いは實熱あり。〔大小承氣輩を用ふ。〕或いは疝癥亦此に例すべし。寒疝臍を繞り、處々に腹に塊あるものは、〔烏頭桂枝湯。〕或いは曰く、疝氣の塊は多くは右の少腹及び臍下にありて、或いは股にひきつる。〔附子粳米湯・眞武湯・八味丸・苓姜朮甘湯の類、證に隨つて芍藥甘艸湯を合方して服して効ありと。〕○瘧母は、〔鼈甲煎、若しくは大䗪蟲丸を用ふ。〕○小兒の癖塊は、〔柴胡加龍骨牡蠣湯・玉函の方を丸とし用ふ。或いは大黄牡丹湯を丸とす。大䗪蟲丸、米飲若しくは鶏卵汁を以て送下す。或いは紫圓・丸の類。并びに餅子・滅毒丸にて下すべし。〕○血塊は、大黄牡丹湯・抵當丸・桃核承氣・桂枝茯苓丸・大䗪蟲丸・下瘀血湯の類撰び用ふ。浮石丸・硝石大圓も亦兼ね用ふべし。〔産論に云ふ、鬼胎・血塊、病臍下の左、或いは章門の邊に在り、形娠に類す。六七月の者、之を按ずれば其の物偏り…攻む。愚云ふ、此の證解せざるものは、斑猫散を用ふべし。〕又臍下に塊ありて、之をおすに輭なるものは、帶下の塊とす。桂枝茯苓加大黄丸、或いは浮石丸を兼用すべし。或いは婦人臍中より、ややもすれば膿水を流すもの、亦多く帶下の候なり。急に前法に依つて悪物を取り尽すべし。以上諸塊を治するの大略なり。",
      yaku: "○気塊・積・癥はさまざまな証を見分けよ。気分のものがある〔長年の冷えの凝りの証があるものは附子を主として温めて散らす。呉茱萸・当帰・大黄の類も考えよ〕。血証のものがある〔桃核承気湯・芎帰膠艾湯・抵当湯（丸）・大黄䗪虫丸の類。攻めるべきものには通気丸を試みよ〕。実熱のものがある〔大・小承気湯類を用いる〕。疝の癥もこれにならう。寒疝で臍のまわりや腹のあちこちに塊があるものは〔烏頭桂枝湯〕。ある人は、疝気の塊は多くは右の下腹と臍の下にあって、股に引きつることがあるという〔附子粳米湯・真武湯・八味丸・苓姜朮甘湯の類に、証に従って芍薬甘草湯を合方して服用させて効果があるという〕。○瘧母は〔鼈甲煎丸、あるいは大䗪虫丸を用いる〕。○子どもの癖塊は〔柴胡加竜骨牡蛎湯・金匱玉函の方を丸にして用いる。あるいは大黄牡丹湯を丸にする。大䗪虫丸を重湯か鶏卵の汁で飲み下す。あるいは紫円などの丸薬。また餅子・滅毒丸で下すがよい〕。○血塊は、大黄牡丹湯・抵当丸・桃核承気湯・桂枝茯苓丸・大䗪虫丸・下瘀血湯の類から選んで用いる。浮石丸・硝石大円も兼用せよ。〔『産論』に、鬼胎・血塊は病が臍の下の左、あるいは章門のあたりにあり、形は妊娠に似る。六、七か月のもので、按じるとその物が偏っている……攻める、とある。私は、この証が解けないものには斑猫散を用いよと言う。〕また臍の下に塊があって押すとやわらかいものは、帯下の塊とする。桂枝茯苓丸加大黄、あるいは浮石丸を兼用せよ。女性で臍の中からともすれば膿のような水が流れる者も、多くは帯下の徴候である。急いで前の法によって悪い物を取り尽くせ。以上が諸塊を治す大略である。" },
    { head: "治法の略（三）：背に灸する法・石瘕・労瘵様の塊", koma: "159R–159L",
      kaki: "若し其の毒陳寒痼冷を成すものは、背を按じて、其の毒の凝るところを得、艾灼數旬にして其の毒の動くを候ひ、機に乘じて之を攻むべし。或いは熨法を兼ね施すも佳なり。婦人の腹滿、多年經閉して遂に血塊をなし、漸々に長ずるもの、亦其の病石瘕をなすもの、妄りに攻むべからず。若し其の毒一時に潰崩するときは、轉過すべからずして、死するものあり。其の精氣の虚實を審にして、之を治すべし。至つて虚羸のものは、手を下すべからず。之を治するの法、足脛の絡より血を刺すべきを上策とす。或いは熨法を兼ね施し、或いは灌藥の煎沸を以て、水蛭丸・䗪蟲丸の類を送下すべし。○或いは云ふ、男子も不容の邊に塊ありて、潮熱を發し、咳嗽ありて、勞瘵の如きもの、先づ背に當てて灸すること數百壯に至るべし。證に隨つて之を治すべし。其の塊散ぜば、或いは小兒乳を吐するものにも間あり。亦前法によるべしと。",
      yaku: "その毒が古い冷えの凝りとなっているものは、背中を按じて毒の凝っている所を見つけ、数十日灸をすえて毒が動くのを待ち、機に乗じて攻めよ。熨法（温罨法）を兼ねて行うのもよい。女性の腹満で、長年月経が止まってついに血塊となり、しだいに大きくなるもの、またその病が石瘕となったものは、みだりに攻めてはならない。その毒が一度に崩れると、持ちこたえられずに死ぬ者がある。精気の虚実を詳しく見て治すべきである。ひどく衰弱した者には手を下してはならない。これを治す法は、すねの静脈から刺絡して血を取るのが上策である。熨法を兼ねて行い、あるいは煎じた薬で水蛭丸・䗪虫丸の類を飲み下させよ。○ある人は言う。男子でも不容穴のあたりに塊があり、潮熱が出て咳があり、労瘵（結核）のようになる者は、まず背中に当てて灸を数百壮すえよ。証に従って治せ。その塊が散じれば治る。子どもが乳を吐く者にもときどきある。これも前の法によれ、と。" },
    { head: "術を修めよ：奇方を好むなかれ", koma: "159L–160L",
      kaki: "其の他機を遂ひ、重を持し、緩急迭ひに施すの治は、其の人に存す。善く仲景の書を讀み、審に今の病者に歷試して、其の妙處を感得するにあり。世に妙藥奇方を好んで輯むるに萬を以てするものありといへども、偶々之を治して彼治せざるは、其の病證を視察すること明ならざればなり。徳本翁言ふことあり、曰く、「いづれことごとしく神變不思議の藥ありと人のいふも、別なることはなし。秘事は睫毛の如し」と。詩に云ふ、「柯を伐り柯を伐る、其の則遠からず」と。好んで奇方を索めんより、退いて術を脩むるに如かず。術を脩むるは、已まず勉むるにあり。孟子の曰く、「人の德慧術智有る者は、常に疢疾に存す」。術智を開かんと欲せば、自ら苦思焦心して已まず勉めずんばあるべからず。今余が試み得るところの奇方を撰んで左に開列するもの、亦枝葉のみ。覽るもの固執して機變の術を失ふこと勿れ。抑も攻撃に僻することなかれ。温補に泥むことなかれ。下も亦下し極めず、吐も亦吐き極めず、一に證に隨つて之を治し、暗投妄行なからんことを要するのみ。",
      yaku: "そのほか機をとらえ、重みを保ち、緩急を代わる代わる施す治療は、その人次第である。よく仲景の書を読み、いまの病人に詳しく試してその妙所を会得することにある。世には妙薬奇方を好んで万もの方を集める者がいるが、たまたまこの人は治ってもあの人は治らないのは、病証の観察がはっきりしていないからである。永田徳本翁は言った。「どれもこれも大げさに、神変不思議の薬があると人は言うが、特別なことは何もない。秘事はまつげのようなもの（目の前にあって見えないもの）だ」と。『詩経』に「斧の柄を伐るには、その手本は遠くない（手にある斧の柄が手本）」とある。好んで奇方を探すより、退いて術を修めるほうがよい。術を修めるのは、やめずに努めることにある。孟子は「徳・知恵・術・知のある人は、常に病苦や困難の中にいる」と言った。術と知を開こうとするなら、自ら苦心してやめずに努めなければならない。いま私が試して得た奇方を選んで次に並べるが、これも枝葉にすぎない。見る者は固執して臨機応変の術を失ってはならない。攻めることに偏るな。温め補うことにこだわるな。下すにも下し尽くさず、吐かせるにも吐かせ尽くさず、ひたすら証に従って治し、当てずっぽうやでたらめのないようにすることが大切なのである。" },
    { head: "附方九首（一）：乾漆丸・通氣散・化毒神効丸・白餅子", koma: "160L–161R",
      kaki: "乾漆丸　伏梁、氣横たはつて心下に在り、堅牢にして散ぜず、胸中背に連なりて多く痛む者を治す。乾漆・芫花・鼈甲・硇砂各十錢、桃仁・木香・烏頭各五錢、雄黄・麝香各二錢半。右九味、末と爲し、酢を以て煮、麪糊を打つて丸と爲し、豆大の如くす。毎服十丸、食に先だち、温酒にて送下す。\n通氣散　十膈五噎、腹内の久積、氣塊、傷力、嘔吐、鼓脹、小兒の驚風痰、中風不語の者を治す。皂莢・大黄各二兩、硇砂・當歸各二錢、巴豆一兩半。右五味、末と爲し合す。毎服一分、好酒にて送下す。\n化毒神効丸　癩風・黴毒・噎膈・大腹痛・久瘧・休息痢・偏枯・喘息・留飲・血塊を治す。松脂十錢、髪灰・大黄各三錢、丁香・辰砂・鉛丹・雄黄各一錢、生々乳二錢。右八味、末と爲し丸とす。毎服五六分、續けて服すること七八日の後、梅肉丸を以て之を下す。〔案ずるに、此の方を服するもの、口中腐爛を度として服を止むべし。〕\n白餅子（家方）　痰飲の結實、及び小兒の痃癖を治す。南星・半夏・滑石各一錢、輕粉五分、巴豆二十四粒（皮心を去り、水一升を以て煮て三合に至り、取り出だし、乾かして用ふ）。右五味、末と爲し合し、糊丸菉豆大、生姜湯にて送下す。毎服五六粒。",
      yaku: "乾漆丸：伏梁（心下の積）で、気が横たわって心下にあり、堅く散らず、胸から背中にかけてよく痛む者を治す。乾漆・芫花・鼈甲・硇砂各十匁、桃仁・木香・烏頭各五匁、雄黄・麝香各二匁半。この九味を粉末にし、酢で煮て、小麦粉の糊で豆粒大の丸にする。一回十丸を食前に温めた酒で飲み下す。\n通気散：十膈五噎（飲食が通らない病）、腹の中の古い積、気塊、力仕事による傷、嘔吐、鼓脹、子どものひきつけと痰、中風で話せない者を治す。皂莢・大黄各二両、硇砂・当帰各二匁、巴豆一両半。この五味を粉末にして合わせる。一回一分を良い酒で飲み下す。\n化毒神効丸：癩風・梅毒・噎膈・ひどい腹痛・長引くマラリア・休息痢（慢性の下痢）・半身不随・喘息・留飲・血塊を治す。松脂十匁、髪灰・大黄各三匁、丁香・辰砂・鉛丹・雄黄各一匁、生々乳二匁。この八味を粉末にして丸にする。一回五、六分、七、八日続けて服用した後、梅肉丸で下す。〔考えるに、この方を服用する者は、口の中がただれるのを目安として服用をやめるべきである。〕\n白餅子（家伝の方）：痰飲が結んで実したもの、子どもの痃癖を治す。南星・半夏・滑石各一匁、軽粉五分、巴豆二十四粒（皮と芯を除き、水一升で三合まで煮て取り出し、乾かして用いる）。この五味を粉末にして合わせ、糊で緑豆大の丸にし、生姜湯で飲み下す。一回五、六粒。" },
    { head: "附方九首（二）：滅毒丸・水蛭丸・斑猫丸・大蟾蜍湯・浮石丸", koma: "161L–162R",
      kaki: "滅毒丸（鶴泰榮方）　小兒の胎毒諸病を治す、良し。鼹鼠霜二錢、輕粉一錢、巴豆五分。右三味、糊丸、蘿蔔子大。兒の年歯に隨ひ、或いは倍して用ふ。\n水蛭丸方　蠱瘴を治す。醫統に云ふ、凡そ單腹脹腫、屢下利を經て愈えざる者は、蠱瘴と成る。此の證多くは不治なり。又婦人經閉して、遂に塊を成し、漸く大にして遍腹脹滿し、鼓の如く、大いに臨月の腹の如くなるもの、治せずして死せしもの、五年十年に及ぶものあり。亦此の方を用ひて可なり。然れどもいづれも容易の治をなすべきものに非ず。世醫其の證を誤つて大承氣を服するものを見る。其の治にあらざるなり。三稜（炮）・莪朮（炮）・乾漆（炒りて烟を尽さしむ）・牛膝（酒に浸す）・斑蝥（糯米にて炒る）・虎珀・肉桂・硇砂・水蛭・大黄。右十味、各分ちて末と爲し、生地黄汁に米醋を和して調へ、丸梧子大。毎服十丸、空心に温酒にて送下す。\n斑猫丸　鬼胎・血塊、痛み忍ぶべからざるを治す。斑猫（糯米にて炒る）・延胡索（炒る）等分、末と爲し、酒にて五分を下す。\n大蟾蜍湯（外臺に出づ）　腹中の冷癖、水穀癊結し、心下に痰を停め、兩脇痞滿し、之を按ずれば鳴り轉じ、飲食を逆害するを治す。大蟾蜍・芒硝各二錢半。右水一盞半を以て煮て八分を取る。\n浮石丸　血塊及び經閉を治す。浮石・桃仁・大黄等分。右三味、末とし、糊丸。毎服一錢。或いは三味各四錢、赤石脂四錢、芒硝六錢、以上五味、末丸も亦可なり。○此の方、腹中に血塊ありて水滯の者を治す。其の證、經水不利、少腹に塊あり、腹中に水聲あるもの、或いは男女ともに腹はりて青筋のあらはるるもの、又帶下・久淋を治す。",
      yaku: "滅毒丸（鶴泰栄の方）：子どもの胎毒によるさまざまな病を治す。よく効く。鼹鼠霜（もぐらの黒焼き）二匁、軽粉一匁、巴豆五分。この三味を糊で大根の種ほどの丸にする。子どもの年齢に応じ、倍にして用いることもある。\n水蛭丸：蠱瘴を治す。『医統』に「腹だけが張って腫れ、何度も下痢をしても治らない者は蠱瘴となる。この証は多くは治らない」とある。また女性で月経が止まってついに塊となり、しだいに大きくなって腹全体が張り、太鼓のように、臨月の腹のようになって、治らずに死ぬまで五年、十年に及ぶ者がある。これにもこの方を用いてよい。しかしいずれもたやすく治せるものではない。世の医者がその証を誤って大承気湯を服用させるのを見るが、その治療ではない。三稜（炮じる）・莪朮（炮じる）・乾漆（煙が出なくなるまで炒る）・牛膝（酒に浸す）・斑蝥（もち米で炒る）・琥珀・肉桂・硇砂・水蛭・大黄。この十味をそれぞれ粉末にし、生地黄の汁に米酢を混ぜて練り、桐の実大の丸にする。一回十丸を空腹時に温めた酒で飲み下す。\n斑猫丸：鬼胎・血塊で痛みが我慢できないものを治す。斑猫（もち米で炒る）・延胡索（炒る）を等分に粉末にし、酒で五分を飲み下す。\n大蟾蜍湯（外台秘要に出る）：腹の中の冷えた癖、飲食物が結ぼれ、心下に痰がたまり、両脇が痞えて張り、押すとごろごろ鳴って動き、飲食を妨げるものを治す。大蟾蜍・芒硝各二匁半。水一盞半で八分に煮詰める。\n浮石丸：血塊と月経の停止を治す。浮石・桃仁・大黄を等分に粉末にし、糊で丸にする。一回一匁。あるいは三味各四匁に赤石脂四匁・芒硝六匁を加えた五味を粉末にして丸にしてもよい。○この方は、腹の中に血塊があって水が滞る者を治す。その証は、月経がすっきりせず、下腹に塊があり、腹の中に水の音がするもの、あるいは男女とも腹が張って青筋が浮き出るもの。また帯下・長引く淋疾を治す。" }
  ],

    { k: "塊・積聚", w: "風塊：中脘の邊（臍上動脉に塊をなす。中風半身不遂）", src: "本文", koma: "156L" },

    { head: "体位と両覆手壓按法", koma: "166L–167R",

    { head: "三指探按法：胸・心下・脇下", koma: "167R–167L",
      kaki: "次に右手の食・中・無名の三指頭を側てて、上缺盆より次を逐うて左右肋骨の間を細かに探り下るべし。之を名づけて三指探按の法といふ。〔此れ亦胸中の虚實緩急を候ふの法なり。すこしにても指頭に礙るものあらば、指を留めて之を按じ、痛むや否やを問ふべし。總て上部に凝結するものは、兩の乳の上缺盆までの間を探り按じて痛み堪へがたし。又兩の肋骨の縫際をもさぐるべし。痛み甚しきは皆血脉凝結するものとす。〕次に其の手を鳩骨の三つおちに沿うて、鳩尾へ下し、一は淺く一は深く、心下の虚實を候ふ。鳩尾より上脘までを心下の位と定む。遂に其の指頭を左右季肋に沿うて、章門の邊に至る。此れ脇下の診なり。此の時脇骨の下端より指頭を淺くかかげて、脇肉の虚實を候ふべし。",
      yaku: "次に右手の人差し指・中指・薬指の三本の指先を立てて、上は缺盆（鎖骨上窩）から順に左右の肋骨の間を細かく探り下りる。これを三指探按の法という。〔これも胸の中の虚実・緩急をうかがう法である。少しでも指先に引っかかるものがあれば、指を止めて按じ、痛むかどうかを尋ねる。上部に凝り固まるものは、両乳の上から缺盆までの間を探り按じると痛みが耐えがたい。また両側の肋骨の間の縫い目も探れ。痛みのひどいものは、みな血脈が凝り固まったものとする。〕次にその手を胸骨の下端（みずおち）に沿って鳩尾へ下ろし、浅くまた深く、心下の虚実をうかがう。鳩尾から上脘までを心下の位置と定める。さらに指先を左右の季肋（肋骨弓）に沿わせて章門のあたりまで行く。これが脇下の診察である。このとき肋骨の下端から指先を浅く差し上げるようにして、脇の肉の虚実をうかがう。" },

    { head: "再び両覆手で壓按：腹中の動気", koma: "167L–168R",
      kaki: "次に復た兩覆手の法を用ひ、遂うて壓按し下るべし。是の時醫者の身を前がかりにして、微しく指頭を浮かし、掌側骨に力を用ひて、却つて心下より臍下まで、次を逐うて壓按し下るべし。一身の力を右手に及ぼし、徐々に腹を壓すべし。此れ腹中の動氣を候ふの法なり。其の間意を用ひて其の指頭に礙るところの形狀を審にすべし。凡そ正しく按じて痛まざるもの、邪めに探りて即ち痛むものあり。〔梔子豉湯の腹證の如きこれなり。〕淺く按ぜざれば應ぜざるあり。〔心下・臍下の悸の如き是れなり。〕深く按ぜざれば徹せざるあり。〔腹底の動、及び其の緩急・小大・滑濇・堅脆・寒温までを始終實着に診して、蒼卒に按ずることなかれ。〕病人をして驚悸せしむること勿れ。",

    { head: "あわせて診るもの：顔色・乳頭・股の肉・肌膚", koma: "168R–168L",

      yaku: "そもそも桂枝湯を表証を治す薬とだけ考えるのは浅い見方である。また気上衝を主治すると定めるのも、まだ深く理解したとは言えない。とはいえ頭痛・発熱・汗が出る・悪風などの表証と、気上衝を治すことは、『傷寒論』に明文があって議論の余地はない。ではなぜ浅く、まだ理解していないというのかと問われれば、ここに一つの難点がある。古方は一方ごとにそれぞれ主治するところがあり、後世の方のように内も外も混じった骨董鉢のような薬剤ではない。君臣佐使の区別があって、五体を備えた人のように組み立てられているから、証に従って一、二味ずつの加減はあっても、本方は桂枝湯・小柴胡湯のように、みな必ず一つの役目をつかさどり、他を兼ねることはない。表証を主治する桂枝湯なら、ほかを兼ねて主治するはずがないのに、「太陽病を下した後、気が上衝する者には桂枝湯を与えよ。上衝しない者には与えてはならない」と丁寧に諭す章があるから、表証は解したのに、下したために気が上衝するものだけを治すことは明らかである。また加桂湯は本方に桂枝二両を増しただけで他の加減はなく、発汗後に焼鍼でまた汗を出させ、奔豚気を起こしたものを主治するのだから、これも表証は解していて、ただ衝気の激しさを挫くものとすれば、ますます気上衝だけをも主治することは疑いない。しかし気上衝や奔豚気は表証とは言えない。腹中の動気の変化を現すもので、まったく別物である。すると桂枝湯は表証も主治し、気上衝も主治する、二つのことを兼ねるというべきか。これが難点である。この言い分は、いまの古医方家は、桂枝はただ上衝を主治するのみで、ほかの表証を治すのは副次的なはたらき（傍治）だというのである。この難点を解こうとしても、ただそう言うだけでは少しわかりにくい。それでいまの古医方家は上衝を治すところばかりに目をつけ、肌を解し表を救うという肝要なところにはかえって思いが及ばないので、臨機応変のはたらきができない。また表を解する主剤とだけ思う者は、表証が見えなければこの方は使えないように思い、これもまた活用の手段がない。これらはみな一皮上の論で、末に走って本を究めないからである。まず表証を治すのか、気上衝を治すのか、主のはたらきか副のはたらきかという議論はひとまず捨てて、その本は一つの帰着点であるという意味を理解しなければ、まだこの方の深意を得たとは言いがたい。" },
    { head: "一つの帰趣を知れば応用が広がる", koma: "172L–173R",
      kaki: "されば今一段思ひを深きに致して、其の一歸趣なるの意を了解すれば、特に此の方の施用が廣くなりて、諸病に應じて奇特の功を奏する活套を得るなり。先達を非議するは、却つて己が醜を售るに似たりといへども、止むことを得ずして此の辨に及べり。且つ左に愚説を述べて、其の歸趣の一なるを曉さば、反つて穿鑿の説なりとして笑ふものもあらんか。兎にも角にも廣く病痾の愈ゆるを以て、其の實を得たりと謂ふべし。其の他の議論は、固より醫の與からざる所なり。余が是までに試驗したるところは、世に難治と稱する天刑病を始めとして、或いは陳痼壞證の癥毒、或いは癰疽惡瘡、及び鬱毒・勞瘵・積聚の類、凡百の氣血壅滯、表位に屬するもの、證を審にして之を與へ、効を奏せずといふことなし。日に新たに其の妙を覺ゆるのみ。豈啻に桂枝湯のみならんや。凡そ仲景の傳ふる所の藥劑、其の方意を得るときは、萬病に渉つて、變通の妙あらずといふことなし。初學の士其の方の簡易に失して、思辨の勞を致さざらんことを恐れて、敢へて煩言を厭はず、其の説を述ぶること左の如し。",
      yaku: "そこでもう一段深く考えて、その一つの帰着点という意味を理解すれば、この方の使い道がとりわけ広くなり、さまざまな病に応じてすばらしい効果を上げる活用法が得られる。先達を批判するのは、かえって自分の醜さをさらすようなものだが、やむをえずこの論に及んだ。また次に私の説を述べて、その帰着点が一つであることを示せば、かえって穿鑿の説だと笑う者もあろう。ともかく、広く病が治ることをもって、その実を得たと言うべきである。そのほかの議論は医者の関わるところではない。私がこれまでに試したのは、世に難治とされる天刑病（ハンセン病）をはじめ、古く治りにくい壊証の癥毒、癰疽や悪性のできもの、鬱毒・労瘵（結核）・積聚の類など、あらゆる気血の滞りで表位に属するもので、証を詳しくして与え、効かないものはなかった。日ごとに新たにその妙を感じるばかりである。桂枝湯だけではない。仲景の伝えた薬剤は、その方意を得れば、万病にわたって臨機応変の妙がある。初学の人がその方の簡易さにとらわれて考える労を惜しむことを恐れ、あえてくどさをいとわず、その説を次に述べる。" },
    { head: "陽気と飲食：血・精・津液は陽気が主宰する", koma: "173R–173L",
      kaki: "夫れ人身の陽氣は、臣天の一元氣にして、之を我が内に結ぶ所ありて、一身運行の氣となる。〔上冊腎間動の説に併せ考ふべし。〕此の氣又飲食を尅化すること、酒保の酒を造るが如く、胃府に醸成して、其の精液を一身に運び、糟粕を大便に下し、水汁を小便に利す。水汁と精液とを分つは、たとへば蘇露鑵にて焼酎を取るが如し。されば血も精も津液も、概するに皆飲食の精華にして、陽氣の主宰する所なり。形軀は陰に屬して地の類なり。故に凡そ形あるもの、血・精・津液・飲水、皆陰の屬にして、静なるを常とす。陽氣を得ざれば流動すること能はず。氣血分にあるものを陽氣と名づけ、血と倶に流動して止まず。精分に在るものを陰氣と名づけ、静にして命を保つ。精と倶に活く。津液は胃中水穀の生ずるところ、陽氣を得て能く四體に運び、肌膚をうるほす。故に陽氣衰ふるときは、血は一處に滯り、液がかわきて肌膚に滋潤せず、反つて枯燥するなり。",
      yaku: "人体の陽気は、天の一つの元気であって、それを自分の内に結ぶ所があり、全身を巡る気となる。〔上冊の腎間動の説とあわせて考えよ。〕この気はまた飲食物をこなし、酒屋が酒を造るように胃で醸して、その精液を全身に運び、かすを大便として下し、水分を小便として出す。水分と精液を分けるのは、たとえば蒸留器（蘭引）で焼酎を取るようなものである。だから血も精も津液も、おおむねみな飲食物の精華であり、陽気が主宰するものである。体は陰に属して地の類である。だから形あるもの、血・精・津液・飲んだ水は、みな陰に属し、静かなのが常である。陽気を得なければ流れ動くことができない。気血の分にあるものを陽気と名づけ、血とともに流れ動いて止まない。精の分にあるものを陰気と名づけ、静かにして命を保ち、精とともに生きる。津液は胃の中の飲食物から生じ、陽気を得て手足に運ばれ、肌を潤す。だから陽気が衰えると、血は一か所に滞り、液が乾いて肌を潤さず、かえって枯れて乾くのである。" },
    { head: "養生と病の起こり", koma: "173L–174R",
      kaki: "是の故に人生れ出でて後は、只此の飲食の養ひにて、天の陽氣を維持するものなれば、養生の道は、飲食を節するを本とす。水は舟を載するゆゑんにして、又舟を覆すゆゑんといへるが如く、命をたもつべきもの、愼まざれば、反つて命を伐るに至る。之を水穀の毒となづく。孟子に養氣の論あり。義と道とに配せざれば餒うといふことありて、道義に合はざることを行ひ、心を動かし、氣を暴し、及び飲食男女の慾を恣にすれば、内にしては流動運行の本を壅遏し、外にしては衛榮諧和の利を失ひて、四肢に達せず、肌膚に充たずして病を生ずるなり。其の道を能くするものは四肢に達し肌膚に充つるのみならず、浩然として天地の間に塞がるといへるも、元是れ一氣なればなり。此の氣や人身に在つては、常に温々燠々として中和を失はざれば、肌膚筋骨のしまりよく、虐邪賊風犯し入ることなし。これを無病の人とす。然れども人に天稟の強弱を称することありて、初めより父母の胎毒を受け得て生ずるものあれば、病あることを免れず。況や養生の道を失へば、必ず病を發す。",
      yaku: "だから人は生まれてからは、ただ飲食の養いによって天の陽気を保っているのであり、養生の道は飲食を節することを本とする。水は舟を浮かべるものでもあり、また舟を覆すものでもあるというように、命を保つはずのものも、慎まなければかえって命を損なうに至る。これを水穀の毒と名づける。孟子に養気の論があり、義と道に合わなければ気が飢えるという。道義に合わないことを行い、心を乱し、気を荒らし、飲食や男女の欲をほしいままにすれば、内では流れ巡る本をふさぎ、外では衛気と栄気の調和を失って、気が手足に達せず肌に満たず、病が生じる。その道をよく行う者は、気が手足に達し肌に満ちるだけでなく、浩然として天地の間に満ちるというのも、もともと一つの気だからである。この気が体にあって、常にほかほかと温かく中和を失わなければ、肌や筋骨の締まりがよく、悪い邪気や風が入り込むことはない。これが無病の人である。しかし人には生まれつきの強弱があり、初めから父母の胎毒を受けて生まれる者もあるので、病を免れない。まして養生の道を失えば必ず病を起こす。" },
    { head: "外因・内因と陰陽寒熱", koma: "174R–175R",
      kaki: "是れ氣即ち病となるに非ず。氣其の軀殻に充たざる所あれば、風寒暑濕の氣外より襲ひ入りて、或いは火を熾にし、或いは水を動かして、陰陽の和を失ふゆゑ、必ず偏勝をなして、寒熱の病を發す。之を外因といふ。若しくは外邪犯し入らずといへども、氣鬱滯する所あれば、血之に因つて流動せず、及び飲食の痰汁淫濁停滯し、糟粕下らず、水飲利せずして、病を發す。之を内因といふ。内外の因は異なれども、病となりては陰陽寒熱の二より外に證に見ることなきゆゑ、病證は必ず陰陽の二途に於て、六位を差して以て之を審辨するなり。若しくは陽氣を激して火勢を熾にすれば、日輪の北に遍りて暑氣の漸く甚しきに至るが如く、一身油が焼くるものとなりて、水氣を段々に乾し、後には胃中の津液も乾いて、大便不通、燥屎となり食すること能はず、終に一身を温め保つべき陽氣の為に、精液を亡ひて、薪盡きて火の滅するがごとく、魂魄の蛻殻となるなり。若しくは陽氣の結ぶ處を抑遏して、火を尅するときは、日輪の南を行きて、寒氣の漸く厲しきが如く、身體冷えて、殺氣横行し、水留まつて流れず、腹満吐利、飲食を欲せず、終に陽氣の本を蔑にして、再來して患ふものとなるなり。之を要するに、病證は必ず陰陽の二途に分れて、死生は獨り一氣の存亡によるなり。",
      yaku: "これは気そのものが病になるのではない。気が体に満ちていない所があると、風・寒・暑・湿の気が外から襲い入り、火を盛んにしたり水を動かしたりして陰陽の調和を失わせるので、必ず一方に偏って寒熱の病を起こす。これを外因という。あるいは外邪が入らなくても、気が鬱滞する所があれば、血がそのために流れ動かず、また飲食物による痰や濁った汁が停滞し、かすが下らず、水が通じなくなって病を起こす。これを内因という。内因と外因は違っても、病となってからは陰陽・寒熱の二つ以外の形で証に現れることはないので、病証は必ず陰陽の二つの道において、六つの病位を区別して詳しく見分けるのである。陽気を激して火の勢いを盛んにすれば、太陽が北に寄って暑さがしだいに増すように、全身が油の燃えるようになって水気を少しずつ乾かし、後には胃の中の津液も乾いて、大便が通じず燥屎となり食べられなくなる。ついには全身を温め保つはずの陽気のために精液を失い、薪が尽きて火が消えるように、魂魄の抜け殻となる。また陽気の結ぶ所を抑えて火を抑えつければ、太陽が南を行って寒さがしだいに厳しくなるように、体が冷え、殺気が横行し、水が留まって流れず、腹が張り、吐き下し、食べたくなくなり、ついには陽気の本をないがしろにして患うことになる。要するに、病証は必ず陰陽の二つの道に分かれ、生死はただ一つの気の存亡による。" },
    { head: "証を見て治す：火事のたとえ", koma: "175R–176R",
      kaki: "今の古醫家に陰陽を取らざるの説あるは、不審なり。又素問家の陰陽を主張して、五行・五臓・五色・五味、一々に配當するに至るも、反つて穿鑿にすぎて、空論多く取るにたらず。抑も證は證據なり。身の内に故障あれば、其の證據必ず外に見はるること、其の證を取つて以て之を治すれば、臆斷の謬誤なし。扁鵲曰く、「病の應は大表に見はる」。仲景曰く、「證に隨つて之を治す」。是の故に其の内外の因に拘らず、見證に隨つて藥方を求むること、古の醫術なり。後人此の理を會せず、病に臨んで專ら病因を論じて、其の治法を議す。譬へば失火の出來て火の燃え上るを見て、之を救はずして、先づ火原の詮議をするが如し。失火と見たらば、何かはさしおき、先づ鳶嘴・梯子・水盆・噴水等の用器を携へて、火を救ふが急務なるべきに、火原の詮議を先にするは、惑ひの甚しきといふべし。夫れ病因は火原なり。見證は失火の場なり。然れども火原は曾てかまはぬといふには非ず。其の原は火を忽にするより出でたることなれば、其の詮議をも究め、并びに其の禁戒をも嚴にすべきことなれども、事に臨んでは却つて迂遠なるべし。されども失火を救ふも、火原を詮議するも、火戒を申告するも、其の歸趣は一なれば、病因も亦知らずんばあるべからず。但だ證を捨てて因を論ずるは、臆斷にして毫釐千里の過差あらんことを恐れて、古人は慎んで證を辨ずるなり。",
      yaku: "いまの古医方家に陰陽を取り上げない説があるのは納得できない。また『素問』派が陰陽を主張して、五行・五臓・五色・五味を一つ一つに配当するに至るのも、かえって穿鑿に過ぎ、空論が多くて取るに足りない。そもそも証とは証拠である。体の内に故障があれば、その証拠は必ず外に現れる。その証を取って治せば、当て推量の誤りはない。扁鵲は「病の現れは体の表面に見える」と言い、仲景は「証に従って治す」と言った。だから内因・外因にこだわらず、現れた証に従って薬方を求めるのが古の医術である。後の人はこの理を理解せず、病に臨んでもっぱら病因を論じて治法を議論する。たとえば火事が起こって火が燃え上がるのを見て、消さずにまず火元の詮議をするようなものである。火事と見たら何はさておき、まず鳶口・はしご・水桶・竜吐水などの道具を持って火を消すのが急務なのに、火元の詮議を先にするのは、はなはだしい惑いである。病因は火元、現れた証は火事の現場である。とはいえ火元はまったく構わないというのではない。その元は火を粗末にすることから出たのだから、その詮議も究め、禁戒も厳しくすべきだが、事に臨んではかえって回り道である。しかし火を消すのも、火元を詮議するのも、火の用心を触れ回るのも、帰着するところは一つだから、病因もまた知らなければならない。ただ証を捨てて因を論じるのは当て推量で、わずかな差が千里の誤りになることを恐れて、古人は慎んで証を見分けたのである。" },
    { head: "扁鵲・仲景の内外一帰趣", koma: "176R",
      kaki: "然れども證を辨ずるのみにして已まず。扁鵲曰く、「病の陽を聞いて、論じて其の陰を得、病の陰を聞いて、論じて其の陽を得」と。聞くは病應なり。論じて得るものは、病因と病毒の在所となり。陰陽は猶内外と言ふがごときなり。言ふこころは、病の外證を聞いては、論じて其の内の斯くあるべきを得、病の内狀を聞かば、論じて其の外證に斯く見はるべきを得、必ずや内外一歸趣なるものを得ざれば措かざるなり。仲景三陽三陰を分け、〔三陰三陽は内より發するものの等位なり。〕中風傷寒の等位なり。〔中風傷寒は外より來るものの輕重なり。〕又論中諸の發汗吐下の後をいふものは、病の由つて來る所を辨ずるなり。然れども其の治法を論定するに至つては、一に證に隨つて之を治するのみ。是れ乃ち所謂證を論ずるのみにして已まざるものなり。",
      yaku: "しかし証を見分けるだけで終わるのではない。扁鵲は「病の陽（外）を聞いて論じてその陰（内）を得、病の陰を聞いて論じてその陽を得る」と言った。「聞く」とは病の現れのこと、論じて得るものは病因と病毒のある所である。陰陽は内外と言うのと同じである。その心は、病の外証を聞けば論じて内がこうであるはずだとつかみ、病の内の様子を聞けば論じて外証にこう現れるはずだとつかむ、必ず内外が一つに帰着するものをつかむまでやめない、ということである。仲景は三陽三陰を分けたが〔三陰三陽は内から起こるものの等級である〕、中風・傷寒の区別もある〔中風・傷寒は外から来るものの軽重である〕。また論中で発汗・吐・下の後をいうのは、病がどこから来たかを見分けるためである。しかし治法を論じ定めるに至っては、ひたすら証に従って治すのみである。これがいわゆる、証を論じるだけでは終わらないということである。" },
    { head: "方の組み立て：君佐の分", koma: "176R–176L",
      kaki: "さて又火を救ふにも、水を防ぐにも、それぞれの器用を具備せざれば、其の功を成すこと能はざるが如く、藥方も單味にしては大病を治するほどの具體の用を成さざるゆゑ、數品を合せて一方に隊伍するなり。然れども各其の主とする所ありて、火を救ふには水、水を防ぐには土を以て主として、其の他の器械の如きは、皆其の主用に適して、之が力を翼助するごとく、病を治するにも、各其の主とする所の藥を以て、之が君となし、其の他は皆之が佐として、其の用に適するものなり。古方に藥味の數少なきものは、此の君佐の分別を明にすればなり。後世の方の多味なるものは、皆此の分別なし。",
      yaku: "また火を消すにも水を防ぐにも、それぞれの道具をそろえなければ功を成せないように、薬方も一味だけでは大病を治すほどのまとまったはたらきができないので、何品かを合わせて一つの方に編成する。しかしそれぞれ主とするものがあり、火を消すには水、水を防ぐには土を主とし、そのほかの道具はみなその主なはたらきに合わせて力を助けるように、病を治すにも、それぞれ主とする薬を君とし、そのほかはみなその佐として、そのはたらきに合わせるのである。古方に薬味の数が少ないのは、この君と佐の区別を明らかにしているからである。後世の方で味数の多いものには、みなこの区別がない。" },
    { head: "桂枝湯の薬味：桂枝・芍薬・甘草・大棗・生姜", koma: "176L–178R",
      kaki: "今夫れ桂枝湯の方たるや、三陽の首に在つて、百病の始めたる風證に用ひて、解肌救表の主劑たり。其の主とする所は桂枝なり。蓋し桂枝は芳香辛甘の氣味を具へて、正氣と津液とを肌表に托出することを能とす。正氣肌表に達し、津液軀殻を潤すときは、衛榮和諧して、邪氣自ら解散し、瘀水自ら囘降して、上衝の氣隨つて平低することを得。病の愈ゆる所以なり。然れども正氣已に鬱塞する所あれば、水血之が為に瘀滯し、筋脈攣急し、胃管豁ならず。是に於てか、拘攣・疼痛・乾嘔等の證をあらはすもの、桂枝の力獨り此の諸證を解すること能はず。故に芍藥以て臣として、其の血分を解し、生姜・大棗之に佐として、以て胸膈胃管の水をさばき、甘草之に使として、以て諸藥に和し、内外の急を緩め、合して以て胃陽を健にし正氣を宣ぶ。芍藥能く血脈の拘攣を解き、甘草能く諸の急迫を緩む。二味相和して芍藥甘草湯と名づけて、脚攣急を治するに於て見るべし。大棗能く胸膈間の停飲ありて攣急するものを治す。十棗湯・甘麥大棗湯・苓桂甘棗湯の類、懸飲・攣急・臍下悸・咳嗽・嘔等を治するものにて知るべし。生姜の辛味能く胃管の停水を解し、胃氣を健にし、飲食を進む。生姜嘔を治すといへども、古方に生姜を伍するもの、專ら嘔を主治せず。加芍藥生姜人參湯に生姜を倍して、嘔吐の證を言はざるにて知るべし。然れども其の乾嘔を治するも、能く胃口を開き、停水を解するを以ての故なり。案ずるに禮記の檀弓に、曾子曰く、「喪に疾有れば、酒を飲み肉を食ふ。必ず草木の滋有り。以爲らく薑桂の謂なり」といふ。こころは、喪に居て病あるときは、血氣の衰へてあるものゆゑ、養生の為に酒肉を用ふることあれども、酒肉ばかりにては、其の氣の滞らんことを恐れて、必ず草根木皮の藥物の、其の酒肉の氣をば滞らさずして、四體へはりのばすものをのべて、飲食せしむることありといふことをば、曾子はおもひらく、桂枝生姜の謂ならんとなり。滋はふやすと訓じて、正氣と津液とを外へはりだしふやすことなり。是れ生姜よく胃口を開いて、飲食をして停滞せしめず、桂枝よく正氣に助けて、ともに飲食の精液をして肌表に滋達せしむるの意にして、古は養生の法に桂姜を用ひたること知るべし。されば孔子の薑を撤せずして食したまへるも、徒らに嗜みたまへるにあらず。此の意を以て食したまへるものなるべし。古方に生姜を伍するものも、亦併せ考ふべきなり。",
      yaku: "さて桂枝湯という方は、三陽の筆頭にあって、あらゆる病の始まりである風の証に用い、肌を解き表を救う主剤である。その主とするのは桂枝である。桂枝は芳香と辛・甘の気味を備え、正気と津液を肌表へ押し出すのを得意とする。正気が肌表に達し、津液が体を潤せば、衛気と栄気が調和して邪気は自然に解け散り、滞った水は自然に巡り下って、上衝の気もそれにつれて平らかになる。病が治るわけである。しかし正気がすでにふさがっている所があると、水と血がそのために滞り、筋や脈がひきつり、胃が開かない。そうして拘攣・疼痛・からえずきなどの証を現すと、桂枝の力だけではこれらを解くことができない。そこで芍薬を臣として血の分を解き、生姜・大棗をその佐として胸膈や胃の水をさばき、甘草を使として諸薬を調和し、内外の急迫をゆるめ、合わせて胃の陽気を健やかにし正気をのびやかにする。芍薬は血脈の拘攣を解き、甘草はさまざまな急迫をゆるめる。二味を合わせて芍薬甘草湯と名づけ、脚のひきつりを治すことからそれがわかる。大棗は胸膈の間に停飲があってひきつるものを治す。十棗湯・甘麦大棗湯・苓桂甘棗湯の類が懸飲・ひきつり・臍下悸・咳・吐き気などを治すことからわかる。生姜の辛味は胃の停水を解き、胃気を健やかにし、食欲を進める。生姜は吐き気を治すが、古方に生姜を配するのはもっぱら吐き気を主治するためではない。桂枝加芍薬生姜人参湯で生姜を倍にしながら嘔吐の証を言わないことからわかる。それでもからえずきを治すのは、胃の入り口を開き、停水を解くからである。考えるに、『礼記』檀弓篇に、曾子が「喪中に病があれば酒を飲み肉を食べる。必ず草木の滋（うるおい）を加える。思うに薑・桂のことであろう」とある。その心は、喪中に病があるときは血気が衰えているので、養生のために酒や肉を用いることがあるが、酒肉ばかりではその気が滞ることを恐れて、必ず草根木皮の薬で、酒肉の気を滞らせず手足へ張り伸ばすものを添えて飲食させることがある、それを曾子は桂枝・生姜のことだろうと考えた、というのである。「滋」は「ふやす」と訓じ、正気と津液を外へ張り出してふやすことである。これは生姜がよく胃の入り口を開いて飲食物を停滞させず、桂枝がよく正気を助けて、ともに飲食物の精液を肌表に行き渡らせるという意味で、古くは養生の法に桂枝と生姜を用いていたことがわかる。だから孔子が生姜を下げさせずに食べられたのも、ただ好まれたのではなく、この意味で食べられたのであろう。古方に生姜を配するものも、あわせて考えるべきである。" },
    { head: "傷寒論の五章（一）：太陽中風", koma: "178R–179R",
      kaki: "論に曰く、「太陽中風、」〔太陽は陽氣の表にあらはれたる病證の位の名なり。太は、はなはだしきなり。思ふほどよりうちこしたるの義なり。陽氣の表にうかみいでてあるを形容したる名なり。中風は風にあたるなり。風は外より來つて物を搖かすものなり。故に外邪の皮膚に侵し入りて、發散して解すべきものを、假に名づけて中風といふことなり。太陽の表位にありて、風に中ると名のつくところの病といふの義なり。〕「陽浮にして陰弱、」〔これは脈のことなり。凡そ傷寒論中に脈候をあげたるものは、輕重若しくは陰陽の疑途にあらざれば言はざるなり。陽は外なり。陰は内なり。外へ浮いて内へ弱き脈なり。これは此の病證さはがしく劇しきやうに見ゆれども、全体に根のあさき病ゆゑ、邪氣の内にしじまりいるやうすなく、偏に外に發出する勢のみなるゆゑ、陽浮にして陰弱なり。而の字、陽浮の二字をうけて置きたるゆゑ、外へ浮なるによつて、それで内へつよみなく弱なるといふのこころなり。〕「陽浮なる者は熱自ら發し、陰弱なる者は汗自ら出づ。」〔此の二句は前の脈狀に因つて判斷したる詞なり。故に或いは註文の傍入なりといふ説あれども、やはり本文として解すれども害なきなり。之を挿入の文法といふて、間へ挿しこみたる文なり。言ふこころは、脈の外へ浮なるものは、熱の自ら外へ發せんとするの候なり。自とは、藥力を假らざるの謂なり。内へ按じて弱なるものは、汗の自ら出づべきの候なり。これも自の字を下して、發汗劑の力を假るに及ばざるを示すなり。この脈狀にして、隱伏緊縮の根つよき邪氣にあらざること明なるゆゑ、中風と名づけて、今汗出でずといへども、麻黄の入りたる發汗の劑を用ひずして、汗出づるの證に用ふる桂枝湯を以て治するとなり。〕「嗇々として惡寒し、淅々として惡風し、翕々として發熱し、」〔嗇はしじまるなり。惡寒はさむけだつなり。ぞくぞくとしてしじまるやうにさむけだつなり。淅は水をかけそそぐなり。惡風は風にあたるをにくむなり。風にあたればぞんぞんとして水をかける如くさむきなり。翕は合なり。熱が合うてまん中へよる義なり。ぽつぽつとして熱がでるなり。此の病外感ゆゑ劇し。〕「鼻鳴乾嘔する者は、桂枝湯之を主る。」〔鼻鳴・乾嘔は衝逆の候にして、表邪の證なり。此の證に桂枝湯を用ひて治する所以は、所謂邪氣虚に乗じて入るものにして、衛榮和諧せず、腠理固密ならずして、外より邪襲ひ入るものとす。されども表に瘀水の壅塞するなく、裡に邪熱の伏隱するなく、陽浮にして陰弱なるを以て、發散の力を假らずして外出すべきものゆゑ、桂枝湯を用ひて、正氣を助け、水血を運利して、肌表を和解すれば、邪氣は自ら退くなり。桂枝湯もとより發汗の劑にあらざるゆゑ、大劑に作り、分温三服の法を以て、間を促して服さしめ、尚熱稀粥をすすらしめ、衣被を温覆して、汗を出して邪氣を解するものなり。乃ち和解の意にして、發散の法に非ざること、かんがふべし。〕",
      yaku: "『傷寒論』にいう。「太陽中風、」〔太陽は陽気が表に現れた病証の位の名である。「太」ははなはだしいこと、思ったより越えているという意味で、陽気が表に浮かび出ている様子を形容した名である。中風は風に当たること。風は外から来て物を揺らすものである。だから外邪が皮膚に侵入し、発散させて解すべきものを、仮に中風と名づける。太陽の表位にあって、風に当たると名のつく病という意味である。〕「陽が浮で陰が弱、」〔これは脈のことである。『傷寒論』で脈を挙げるのは、軽重や陰陽の紛らわしい場合に限る。陽は外、陰は内で、外に浮き内に弱い脈である。この病証は騒がしく激しそうに見えるが、全体に根の浅い病なので、邪気が内に縮こまっている様子がなく、ひたすら外へ出ようとする勢いばかりだから、陽が浮で陰が弱なのである。「而」の字は「陽浮」の二字を受けているので、外へ浮いているから内に強みがなく弱い、という意味である。〕「陽が浮であるのは熱が自然に出るからで、陰が弱であるのは汗が自然に出るからである。」〔この二句は前の脈の状態から判断した言葉である。注釈が紛れ込んだという説もあるが、本文として解しても差し支えない。これを挿入の文法といい、間に挟み込んだ文である。その心は、脈が外へ浮いているのは熱が自然に外へ出ようとしている徴候、「自」とは薬の力を借りないこと。内へ按じて弱いのは汗が自然に出る徴候で、これも「自」の字を置いて発汗剤の力を借りるまでもないことを示す。この脈の状態なら、潜み縮こまった根の強い邪気でないことは明らかなので、中風と名づけ、いま汗が出ていなくても、麻黄の入った発汗剤を用いず、汗の出る証に用いる桂枝湯で治すというのである。〕「ぞくぞくと悪寒し、水をかけられたように悪風し、ぽっぽっと発熱し、」〔「嗇」は縮こまること。悪寒は寒気がすること。ぞくぞくと縮こまるように寒気がする。「淅」は水を注ぎかけること。悪風は風に当たるのを嫌うこと。風に当たるとぞわぞわと水をかけられたように寒い。「翕」は合うこと、熱が合わさって真ん中に寄る意味で、ぽっぽっと熱が出る。この病は外からの感受なので激しい。〕「鼻が鳴り、からえずきする者は、桂枝湯が主治する。」〔鼻鳴・からえずきは衝逆の徴候で、表邪の証である。この証に桂枝湯を用いて治すのは、いわゆる邪気が虚に乗じて入ったもので、衛気と栄気が調和せず、皮膚のきめが締まっていないために外から邪が入ったものとする。しかし表に滞った水がふさがっておらず、裏に邪熱が潜んでおらず、陽が浮で陰が弱なので、発散の力を借りずに外へ出せるものだから、桂枝湯を用いて正気を助け、水と血を巡らせ、肌表を和解すれば、邪気は自然に退く。桂枝湯はもともと発汗剤ではないので、大剤に作り、三回に分けて温服する法で間を詰めて服用させ、さらに熱い薄粥をすすらせ、夜具をかけて温め、汗を出して邪気を解くのである。つまり和解の意味であって、発散の法ではないことを考えよ。〕" },
    { head: "傷寒論の五章（二）〜（四）：正面の証・下後の上衝・解肌の本分", koma: "179R–179L",
      kaki: "又曰く、「太陽病、頭痛發熱、汗出で惡風する者は、桂枝湯之を主る。」〔これは太陽病自地の證候にして、外邪にあらざるゆゑ、但だ太陽病といふなり。ゆゑに惡風ばかりにて惡寒せず、且つ嗇々・淅々・翕々の形容にも及ばざるなり。發熱汗出でてまぎらはしき證候なきゆゑ、脈狀を言はざるなり。是れ桂枝湯正面の病證なり。陽氣を助け、血分を和して愈ゆるの意みつべし。〕又曰く、「太陽病、之を下して後、其の氣上衝する者は、桂枝湯を與ふべし。若し上衝せざる者は、之を與ふべからず。」〔此れは太陽病は表の位なるゆゑ、汗を發し、若しくは表を和して治すべきもの、之を下して後に、其の表證は解したれども、下すによりて、其の氣上衝するものは、肌表の正氣の虚衰したるものとす。凡そ氣上衝するものは、正氣肌表に充たざるときは、怒つて一道になりて、腹中を上衝するなり。ゆゑに正氣をたすけて、肌表にはらしむれば、衝氣は自ら平低するなり。其の證をあらはす所、内外の異ありといへども、桂枝湯を用ひて肌表を和解するの歸趣は一なり。下之後といひ、其の氣上衝といひ、上衝せざる者は之を與ふべからずといふにて、太陽病は解して、但だ其の氣上衝するのみにして、桂枝湯を用ふること明なり。凡そ傷寒論に汗吐下の後をいふものは、病の變化の道途を示さん為にかり設けたるものにて、深く泥むべからず。但だ其の病證の轉路奈何といふところに意を注ぐべきのみ。〕又曰く、「桂枝は本解肌を爲す。若し其の人脉浮緊、汗出でざる者は、之を與ふべからず。」〔前に中風にも氣上衝にも、いろいろの證に用ひてまぎらはしきゆゑに、此の章に於て、桂枝湯本分の主治を辨じて、誤らざらしむることを示すなり。解肌は肌表を和解するなり。發表とは異なり。乃ち前に述ぶる、正氣をはり出しふやし、血脈を調和するが、解肌なり。緊はきびしくとがる脈にて、錐のさきに指をあつるがごとしといへり。縄によりをかけたるごとく、力あるなり。此れは表に瘀水あるか、若しくは寒邪表を閉ぢて、熱がこもるゆゑ、脈に力を帯びてつよきなり。麻黄を主として汗を發すべきの脉なり。汗出でずとは、桂枝湯の方下にいふごとく、粥をすすり、或いは温覆して汗を出さんとすれども、いでざるものをいふことなり。〕",
      yaku: "また「太陽病で、頭痛・発熱し、汗が出て悪風する者は桂枝湯が主治する」とある。〔これは太陽病そのものの証候で、外邪によるものではないので、ただ「太陽病」という。だから悪風だけで悪寒はなく、ぞくぞく・ぞわぞわ・ぽっぽっという形容もない。発熱して汗が出るだけで紛らわしい証候がないので、脈の状態を言わない。これが桂枝湯の正面の病証である。陽気を助け、血の分を和らげて治るという意味が見てとれる。〕また「太陽病を下した後、気が上衝する者には桂枝湯を与えてよい。上衝しない者には与えてはならない」とある。〔太陽病は表の位なので、汗を出させるか表を和らげて治すべきものを、下した後、表証は解したが、下したために気が上衝するものは、肌表の正気が虚し衰えたものとする。気が上衝するのは、正気が肌表に満ちていないと、怒って一筋になって腹の中を突き上げるのである。だから正気を助けて肌表に張らせれば、衝気は自然に平らかになる。証の現れ方には内外の違いがあるが、桂枝湯を用いて肌表を和解するという帰着点は一つである。「下した後」「気が上衝する」「上衝しない者には与えてはならない」と言っていることから、太陽病は解して、ただ気が上衝するだけで桂枝湯を用いることは明らかである。『傷寒論』で発汗・吐・下の後をいうのは、病の変化の道筋を示すために仮に設けたもので、深くこだわってはならない。ただその病証がどう転じたかに注意すればよい。〕また「桂枝湯はもともと解肌の薬である。脈が浮緊で汗が出ない者には与えてはならない」とある。〔前に中風にも気上衝にもいろいろな証に用いて紛らわしいので、この章で桂枝湯本来の主治を示して誤らないようにしたのである。解肌は肌表を和解すること、発表とは違う。前に述べた、正気を張り出してふやし、血脈を調和するのが解肌である。「緊」は厳しくとがる脈で、錐の先に指を当てるようだという。縄によりをかけたように力がある。これは表に滞った水があるか、寒邪が表を閉じて熱がこもるので、脈が力を帯びて強いのである。麻黄を主として汗を出させるべき脈である。「汗が出ない」とは、桂枝湯の方の下にあるように、粥をすすったり夜具で温めたりして汗を出そうとしても出ないものをいう。〕" },
    { head: "傷寒論の五章（五）：急に裏を救い、表を救う", koma: "179L–180L",
      kaki: "又曰く、「傷寒、醫之を下し、續いて下利清穀止まざるを得、身疼痛する者は、急に當に裏を救ふべし。後身疼痛し、清便自ら調ふ者は、急に當に表を救ふべし。裏を救ふには四逆湯に宜し。表を救ふには桂枝湯に宜し。」〔傷寒は寒にやぶらるるなり。寒は殺厲の氣にて、萬物を肅殺するものゆゑ、邪氣の外より入りて、容易に解すべからざるものを名づけて傷寒といふ。治を得ざれば命をも伐るべきほどの病ゆゑ、寒を以て名とするなり。冬寒にやぶらるといふにはあらず。此れは所謂傷寒の實熱にあらざるものを、誤り下して、胃陽ます衰へ、引きつづいて下利して、食穀化せずしてそのまま下るを清穀といふなり。止まずは、前の下劑の藥力つくれども下利は止まざるをいふなり。其のうへに身疼痛するものは、表裏ともに病なり。然れどもまづ急に裏を救うて後、清穀の大便自ら調和して常を得ば、急に其の表にある身疼痛を解して、表をもすくふべしとなり。此の身疼痛するもの、邪氣の致すところにあらず。乃ち下利するによりて正氣虚衰して、血脉の和せざるものとす。是の故に急に桂枝湯を用ひて陽氣を助け、正氣を肌表にはらしめ、血脉を和解するなり。此れ皆一時の變に應ずる治用にして、時宜を揣つて用ふるものゆゑ、宜といふなり。要するに四逆は裏に於て、寒邪逼迫して胃陽を亡はんとするものをすくふ。其の方甘草を主として急迫をゆるくし、乾姜・附子の力を合せて、下焦の寒を退け、陽氣のまさに亡はんとするを挽囘するを以て、急救の字を下すものと見るべし。其の桂枝表を救ふの意も、亦正氣を助けて托出するを以て言ふものなり。並びに皆陽氣を助け救ふの旨なること考ふべし。〕以上五章は論中緊要の文なるを以て、此に標出して、略其の義を解して、以て初學に示す。",
      yaku: "また「傷寒を医者が下し、続いて不消化便の下痢が止まらず、体が痛む者は、急いで裏を救うべきである。その後、体が痛み、大便が自然に整った者は、急いで表を救うべきである。裏を救うには四逆湯がよく、表を救うには桂枝湯がよい」とある。〔傷寒は寒に破られること。寒は人を殺す厳しい気で万物を枯らすものだから、邪気が外から入って容易に解けないものを傷寒と名づける。治療を得なければ命を奪うほどの病なので、寒をもって名とする。冬の寒さに破られるという意味ではない。これは、いわゆる傷寒で実熱でないものを誤って下したため、胃の陽気がますます衰え、引き続き下痢して、食べた物がこなれずにそのまま下る、これを清穀という。「止まない」とは、前の下剤の効き目が尽きても下痢が止まらないこと。そのうえ体が痛むのは表裏ともに病んでいるのである。しかしまず急いで裏を救い、その後、清穀の大便が自然に整って常に戻ったら、急いで表にある体の痛みを解いて表も救えというのである。この体の痛みは邪気のしわざではない。下痢によって正気が虚し衰え、血脈が調和しないものとする。だから急いで桂枝湯を用いて陽気を助け、正気を肌表に張らせ、血脈を和解するのである。これらはみな一時の変化に応じる治療で、時宜をはかって用いるものなので「宜」という。要するに四逆湯は、裏で寒邪が迫って胃の陽気が失われようとするものを救う。その方は甘草を主として急迫をゆるめ、乾姜・附子の力を合わせて下焦の寒を退け、陽気が失われかけているのを取り戻すので「急救」の字を置くと見るべきである。桂枝湯が表を救うという意味も、正気を助けて押し出すことから言うのである。いずれも陽気を助け救う趣旨であることを考えよ。〕以上の五章は論中の重要な文なので、ここに掲げてその意味をあらまし解き、初学者に示した。" },
    { head: "陽気が健運しないと：風・血痺・虚労・癰疽", koma: "180L–181L",
      kaki: "是に因つて推し考ふるに、人身の陽氣健運せざるときは、水血駃流せず。因つて氣内に逼り升つて降らず、上實下虚して、四肢常に乏しく、肌膚常に飢ゑ、六氣感じ易し。之を六氣といふ。風寒暑濕燥、諸般の表證、是に於て見はる。内經に云ふ、「陽は其の精上に幷すれば、則ち上明らかにして下虚す」。又云ふ、「陽は外を衛りて固めを爲すなり」。左氏傳に醫和曰く、「風淫は末疾」。杜預が註に「末疾は四肢の疾」。愚按ずるに、人身に於て腹を本とし、四肢を末とし、肌膚を表とし、胸腹を裡とす。表虚しやすく、末達しがたし。萬物を搖かすものは風なり。善く其の虚に乗ず。是の故に四肢に發するもの、及び肌表に見はるるもの、名づくるに風の名を以てするもの多し。内經に「風は百病の始めなり」といふも、是の旨を以ていふものなり。是を以て風を治するといふは、大率陽氣をして健運せしむるにあるなり。獨り六氣のみ感じ易きに非ず、陽氣健運せざるときは、津液内理を滋潤せずして、榮血之が為に乾き、たとへば冬月に諸物の枯燥するがごとし。是れ陽氣外に發せざれば、滋潤すること能はざるの證なり。輕きを血痺とし、重きを虚勞とす。且つ陽氣健運せざるときは、血留連して筋脉を順流せず、乃ち癰疽を生ずといへども、潰ゆるに膿速かならず、内消して處々に隱見し、遂に廢壞を成す。其の他厲病・黴毒の如きも、亦氣血の澁滯による。凡百の疾病其の名に惑はず、其の證を審にせば、桂枝湯を以て治すべきもの半ばを過ぎん。但だ其の證の變化に於て、去加損益の機を明にし、病の淺深厚薄に依つて、作劑の大小進退の度を適するものは、紙上の譚に非ず。要は學者の勉めて思辨するに在るのみ。",
      yaku: "これによって推し考えると、体の陽気が健やかに巡らないときは、水と血が速やかに流れない。そのため気が内に迫り上って下らず、上が実して下が虚し、手足は常に乏しく、肌は常に飢え、六気（外気）に感じやすい。これを六気という。風・寒・暑・湿・燥など、あらゆる表証がここに現れる。『内経』に「陽がその精を上に集めると、上は明らかで下は虚す」、また「陽は外を守って固めとなる」とある。『左伝』で医和は「風が過ぎれば末端の病」と言い、杜預の注に「末端の病とは手足の病」とある。私の考えでは、体では腹を本、手足を末、肌を表、胸腹を裏とする。表は虚しやすく、末端には届きにくい。万物を揺らすのは風で、よくその虚に乗じる。だから手足に起こるものや肌表に現れるものには、風の名を付けたものが多い。『内経』に「風は百病の始め」というのもこの趣旨である。だから風を治すというのは、おおむね陽気を健やかに巡らせることにある。六気に感じやすいだけでなく、陽気が健やかに巡らないと、津液が体の内のきめを潤さず、栄血がそのために乾く。たとえば冬に物が枯れて乾くようなものである。これは陽気が外に出なければ潤せない証拠である。軽いものを血痺、重いものを虚労とする。また陽気が健やかに巡らないと、血が留まって筋脈を順調に流れず、癰疽を生じても、潰れて膿が出るのが速くなく、内にこもってあちこちに見え隠れし、ついには廃れ崩れる。そのほか厲病（ハンセン病）や梅毒なども気血の滞りによる。あらゆる病は名に惑わされず、証を詳しく見れば、桂枝湯で治すべきものが半分を超えるであろう。ただ証の変化に応じて加減の機を明らかにし、病の浅深・厚薄によって剤の大小や進め退きの程度を合わせることは、紙の上の話ではない。要は学ぶ者が努めて考え見分けることにある。" },
    { head: "附：黴毒の誤治と桂枝湯", koma: "181L–182L",
      kaki: "附、世間に多きものは黴毒なり。古は知らず、今は都鄙のわかちなく行きわたりて患はざるもの鮮し。其の之を治するの法、亦多端なりといへども、大率瀉肝の劑を主として、特に土茯苓の大劑を煎服すること、醫俗の通弊なり。其の中田舍に住む人は、常に蔬食を飯し、身體を勞動するもの多きを以て、自ら養生の道を得て、陽氣鬱塞せず、胃氣衰乏ならざれば、瀉肝燥濕の藥を服し過せども、害を受くるもの多からずといへども、都下に住む商估は、口常に滋味を絶たず、或いは終日肆廛に坐して、身を動かさず。却つて心を勞して、氣を鬱結せしむるを以て、胃氣先づ衰へ、表虚し、肌燥くもの、誤つて瀉肝燥濕の藥劑を過料するときは、陽氣益衰へ、肌膚益燥いて、其の毒外に發出すること能はず、頭腦を攻め、骨髓に迫りて、苦楚疼痛忍ぶべからず、遂に廢痼となり、或いは命期を促す。其の偶天庭を穿ち、鼻梁を折り、頸喉を爛して、以て命を全うすることを得るものは幸なるのみ。殊に知らず、苓・連・龍膽の類は、實火を瀉するものとす。土茯苓は水濕を燥すものとす。抑も濕は水氣なり。世俗黴毒に濕の名を呼び、或いは肝經濕熱を称するにより、其の證を審にせず、茲に表虚陽衰、血枯膚燥のものに、誤つて燥濕瀉火の藥を與ふるより、益陽氣をして衰へしむるに至る。然れども瀉肝燥濕絶えて與ふべからずといふには非ず。一に證を審にするにあるのみ。善く其の證に適するときは、土茯苓といへども過料するに及ばずして、其の効を奏するに足るのみ。世俗輕粉・礜石の類ことに畏れて、此の胃陽を克伐するの害あるを曉らず。哀しいかな。余此の誤治を救ふに、大率桂枝湯・黄耆桂枝湯を以てして、起廢回生の功を奏すること、擧げて数ふべからず。豈啻に黴毒のみならんや。萬病に此の分辨なくんばあるべからず。讀者これを思へ。",
      yaku: "付記。世間に多いのは梅毒である。昔は知らないが、いまは都会・田舎の別なく広まって、患わない者は少ない。その治療法もいろいろあるが、たいてい瀉肝の剤を主とし、とくに土茯苓の大剤を煎じて飲ませるのが、医者と世間の通弊である。田舎に住む人は常に野菜を食べ、体を動かして働く者が多いので、自然に養生の道を得ていて、陽気がふさがらず胃気も衰えていないから、瀉肝燥湿の薬を飲み過ぎても害を受ける者は多くない。しかし都会に住む商人は、口に常にうまい物を絶やさず、一日中店に座って体を動かさない。かえって心を労して気を鬱結させるので、胃気がまず衰え、表が虚し、肌が乾いている。そういう者に誤って瀉肝燥湿の薬を過量に与えると、陽気はますます衰え、肌はますます乾いて、毒が外に出られず、頭や脳を攻め、骨髄に迫って、苦痛は耐えがたく、ついには不治となり、あるいは死期を早める。たまたま額に穴があき、鼻梁が落ち、首やのどがただれても命を全うできる者は幸運なだけである。黄芩・黄連・竜胆の類は実火を瀉すもの、土茯苓は水湿を乾かすものであることを知らないのだ。そもそも湿とは水気である。世間では梅毒に湿の名を付け、あるいは肝経の湿熱と称するので、証を詳しく見ずに、表虚・陽衰・血枯・膚燥の者に誤って燥湿瀉火の薬を与え、ますます陽気を衰えさせるに至る。しかし瀉肝燥湿の薬を絶対に与えてはならないというのではない。ひたすら証を詳しくすることにある。よく証に合えば、土茯苓でも過量にせずとも効果を上げるに足りる。世間は軽粉や礜石の類ばかりを恐れて、これら（瀉肝燥湿の薬）にも胃の陽気を損なう害があることを知らない。悲しいことだ。私はこの誤治を救うのに、たいてい桂枝湯・黄耆桂枝湯を用いて、廃人を立ち直らせ、死にかけた者を生き返らせた例は数えきれない。梅毒だけではない。万病にこの見分けがなければならない。読者はよく考えよ。" },
    { head: "附方二首：桂枝加櫻皮湯・桂枝加樸樕湯", koma: "182L–183R",

    { head: "無汗は肌表の瘀水による：太陽と陽明の合病", koma: "185R–185L",
      kaki: "抑も汗出づるゆゑんを考ふるに、汗は水穀の精液にして、氣によつて發越して、腠理に洩れいづるものなり。是の故に表證の汗は流るるが如くならず。所謂尺膚滑らかにして、其れ淖澤なる者、是れなり。今この葛根湯の證に無汗をいふものは、肌表に瘀水ありて、それが爲に腠理を閉塞して、汗の出づべき門戸なきを以て、汗の出づることなきなり。麻黄は腠理を開きて水を逐ふの能あるゆゑ、此の瘀水も汗となりて出づるなり。故に下論に曰く、太陽と陽明の合病の者は、必ず自ら下利す、葛根湯之を主ると。この合病といふは、兩證をあらはしたることにて、凡そ太陽は表を從とするゆゑ、腹中の變はあるまじきに、今項背強、無汗、惡風の證ありて、又自ら下利するものは、此の下利を太陽病とすべからざるを以て、陽明の證とするなり。ゆゑに合病必ず下利すといふ。必の字を下したり。されども陽明病の正證とするところは、胃家の實にして大便鞕く、若しくは通ぜざるものなるに、何を以て自下利を陽明の證とするとせば、此の下利固より胃陽衰へて溜滯するところの水にあらず、熱の勢ひにより、肌表にあるところの瘀水が裏に走りて下利となりたるものゆゑ、下利にかかはらずして、やはり表證を主として、麻黄を以て瘀水を滲しされば、下利は自ら止むべきを以て、葛根湯を用ゆ。是れ此の下利熱の勢ひによるものなるを以て、之を陽明に屬して合病とするなり。又曰く、太陽と陽明の合病、下利せず、但だ嘔する者は、葛根湯之を主ると。これも合病とするゆゑんは前の證と同じことなれども、其の下利すべきもの、却つて上逆して嘔を發するゆゑ、但だ嘔といふなり。若し嘔吐下利ふたつながらあれば、全く表水ばかりの事にあらざるなり。此の證前の下利するものよりは一等劇しきものなり。要するに其の熱の勢ひ、裏にせまる所あるを以て、陽明と合せ病むものとするなり。是にて桂枝湯と葛根湯とは、纔かに無汗の一證を異にして、水氣の有無一つにあづかることを考ふべし。是れ乃ち葛根湯を一方として、其の方意の頗る異なる所以なり。",
      yaku: "そもそも汗が出るわけを考えると、汗は飲食物の精液で、気によって発散して腠理（皮膚のきめ）から漏れ出るものである。それゆえ表証の汗は流れるようには出ない。いわゆる「尺膚が滑らかでしっとりしている」というのがこれである。いまこの葛根湯の証に無汗というのは、肌表に瘀水（滞った水）があって腠理をふさぎ、汗の出る門戸がないので汗が出ないのである。麻黄は腠理を開いて水を追い出す働きがあるので、この瘀水も汗となって出る。だから下の論に「太陽と陽明の合病の者は必ず自然に下痢する。葛根湯が主治する」とある。この合病とは両方の証が現れていることで、太陽は表を主とするから腹の中の変化はないはずなのに、いま項背強・無汗・悪風の証があって、そのうえ自然に下痢する者は、この下痢を太陽病とすることはできないので陽明の証とするのである。だから「合病は必ず下痢する」と「必」の字を置いている。しかし陽明病の正証は胃家の実で大便が硬い、あるいは通じないものであるのに、なぜ自然の下痢を陽明の証とするのかといえば、この下痢はもともと胃の陽気が衰えて溜まった水によるのではなく、熱の勢いで肌表にある瘀水が裏に走って下痢となったものである。だから下痢にかかわらず、やはり表証を主として麻黄で瘀水をしみ出させれば下痢は自然に止むので、葛根湯を用いる。この下痢は熱の勢いによるものだから、陽明に属させて合病とするのである。また「太陽と陽明の合病で、下痢せず、ただ嘔く者は葛根湯が主治する」とある。これを合病とするわけは前の証と同じだが、下痢するはずのものがかえって上に逆らって嘔吐を起こすので「ただ嘔く」という。もし嘔吐と下痢が両方あれば、まったく表の水だけのことではない。この証は前の下痢するものよりひときわ激しい。要するに熱の勢いが裏に迫るところがあるので、陽明と合わせて病むものとするのである。これで、桂枝湯と葛根湯はわずかに無汗の一証が異なるだけで、水気の有無一つにかかっていることを考えよ。これが葛根湯を別の一方として、方意がかなり異なるわけである。" },
    { head: "葛根湯の誤用と剛痙", koma: "185L–186R",
      kaki: "抑も近世古方の盛んに行はるるより、復た其の證を審らかにせず、風邪感冒の證にあへば、輙ち葛根湯の證として誤治するもの往々これをみる。余其の跡を考ふるに、大率黄耆桂枝湯を用ふべきもの、此の瘀水を逐ふの劑を用ふるにより、益陽氣の衛を荒らし、邪氣去らずして反つて壞證をなすゆゑんなり。證に云ふ、太陽病、汗無くして小便反つて少なく、氣胸に上衝し、口噤して語ることを得ず、剛痙を作さんと欲す、葛根湯之を主ると。これ亦無汗して小便反つて少なく、水氣去るところなきを以て、痙を發せんとするなり。痙は反張の病にて、産後若しくは破傷・瘡毒等より水風入るときは、亦此の病を發するにて、表水の致すところなることを知るべし。これよりおしひろめて、瘰癧内攻して水腫するものの類に用ひて功あること、皆一歸趣にして、瘀水を汗にしさりかねて氣血を和解することを知るべきなり。",
      yaku: "そもそも近ごろ古方が盛んに行われるようになってから、その証を詳しく見ないまま、風邪や感冒の証に出会うとすぐに葛根湯の証として誤治する者をしばしば見る。その跡を考えると、たいていは黄耆桂枝湯を用いるべきものに、この瘀水を追い出す薬を用いたため、ますます陽気の守りを荒らし、邪気が去らずにかえって壊証（こじれた病）となったのである。金匱要略に「太陽病で、汗がなく小便がかえって少なく、気が胸に突き上げ、口を食いしばって話すことができず、剛痙を起こしそうなものは葛根湯が主治する」とある。これも汗がなく小便がかえって少なく、水気の去る所がないので痙を起こそうとしているのである。痙は体が反り返る病で、産後、あるいは外傷やできものなどから水や風が入ると、やはりこの病を起こすことからも、表の水によるものであると知るべきである。ここから押し広げて、瘰癧が内攻して水腫となったものの類に用いて効果があるのも、みな同じ趣旨で、瘀水を汗にして除きつつ気血を和解するのだと知るべきである。" },
    { head: "葛根黄連黄芩湯", koma: "186R–186L",
      kaki: "○論に曰く、太陽病桂枝の證、醫反つて之を下し、利遂に止まず、脈促なる者は、表未だ解せざるなり、喘して汗出づる者は、葛根黄連黄芩湯之を主ると。これは誤治によりて、熱内攻して下利をなすものゆゑ、内攻の熱を瀉すれば、下利も喘も自ら治するなり。故に芩連の胸中の熱を解するものを用ゆるなり。促は、數の數にして時に一止するの脈なり。其の促するものは誤治によるといへども、猶ほ數なるものは、表はいまだ解せざるなり。其の喘して汗いづるものは、内攻の熱と、下すによつて氣逆するとの、もめ合ひにて發するところのものゆゑ、其の喘にて汗出づるなり。是を以て喘して汗出づといふ間に而の字を插むものは、喘を主とする意を示すなり。これ胸中の熱を瀉すと表を和解するとにて、喘は自ら愈ゆれば、汗も隨つて止むなり。然るに表いまだ解せざるものゆゑ、葛根を主として表を解するなり。案ずるに葛根表を解すること明文なしといへども、其の項背強几几たるもの、乃ち表證にして、他の外臺の中にも葛根單味にして表邪を治するものあるを併せ考ふれば、亦表證を主治するものにして、項背強を解するものと知るべし。此の方甘草あるものは、内外の急をゆるむるものなり。要するに項背強、胸中煩悸して熱あるものを得ば、其の下利、喘して汗出づるの證の有無を問はずして、此の方を用ふべし。因りて轉じて、酒客の病、火證、熱瘡・湯火傷、小兒の丹毒等に、此の方の證あることを考ふべし。或いは云ふ、脈結促するもの、下利の有無を問はず、此の方を用ひて効ありと。又云ふ、此の方の腹證は、右の不容の邊に結聚するものを得べしと。",
      yaku: "○傷寒論に「太陽病の桂枝の証を、医者がかえって下してしまい、下痢がとうとう止まらず、脈が促の者は表がまだ解していない。喘して汗が出る者は葛根黄連黄芩湯が主治する」とある。これは誤治によって熱が内に攻め込み下痢を起こしたものだから、内攻した熱を瀉せば下痢も喘も自然に治る。それで胸中の熱を解く黄芩・黄連を用いるのである。促とは、速い脈がさらに速く、時に一度止まる脈である。促であるのは誤治によるが、なお速いのは表がまだ解していないからである。喘して汗が出るのは、内攻した熱と、下したことによる気逆とがもみ合って起こるので、その喘によって汗が出るのである。それで「喘而汗出」と間に「而」の字をはさむのは、喘を主とする意味を示す。胸中の熱を瀉すことと表を和解することとで喘が自然に治れば、汗もそれにつれて止む。しかし表がまだ解していないので、葛根を主として表を解くのである。考えるに、葛根が表を解くという明文はないが、項背強几几が表証であること、また外台秘要の中にも葛根一味で表邪を治すものがあることを併せて考えれば、葛根も表証を主治し、項背のこわばりを解くものと知るべきである。この方に甘草があるのは内外の急迫をゆるめるためである。要するに、項背がこわばり、胸の中がもだえ動悸して熱があるものであれば、下痢や喘して汗が出る証の有無を問わず、この方を用いよ。そこから転じて、酒飲みの病、火証、熱をもったできもの・やけど、小児の丹毒などにもこの方の証があることを考えよ。ある人は「脈が結や促のものには、下痢の有無を問わずこの方を用いて効がある」と言う。また「この方の腹証は、右の不容（右肋骨弓下）のあたりに結ぼれ集まるものがある」とも言う。" },
    { head: "附：項背強急異同の辨 并方一首", koma: "186L–187L",
      kaki: "或いは曰く、風府の行強る者は桂枝湯、風池の行強るものは葛根湯、耳後の行強るものは麻黄湯、耳後と風池との間に當たりて強るものは柴胡湯、項背悉く強るものは大青龍湯と。愚按ずるに、此の如く細々分別するもの、穿鑿に似たり。凡そ表虚陽衰のものは、大率上實下虚して、頭項肩背強急せざるものなし。其の血の凝結するものは固よりなり。或いは時に瘀水上行して、頭重く、項背強るもの、亦惟だ脈と證とを審らかにして、或いは以て葛根湯の之く所とし、或いは以て桂枝湯及び去加諸方の之く所とすべし。但だ其の項背強のみを以て、其の證と定むべからず。麻黄湯・大青龍湯の如きは、桂枝湯・葛根湯とは、其の方意格別なり。其の芍藥の有無を以て、發散を專らにすると、兼ねて血分を和解するとの異同あること、考へ知るべし。柴胡湯の如きは、項背強にあらず。所謂頸項強り脇下滿つるものは、乃ち脇下滿の應なり。故に缺盆の行を耳後に及びて強るものとす。或いは曰く、脇下不容の邊にしこりありて、之を按ずるに鞕きものは、肩のつかへたるものとす。或いは眼彫(?)のうれひ、或いは頭痛の持病あるべし。若しくは脇下攣急して水鳴するものは痰飲なり。これと異なると知るべし。若し結胸の者、項亦強るといふものは、胸鞕く張り出づるを以て之を分つべし。若し肌膚乾き、項背凝結して細疹を發するものは、黄耆桂枝湯を用ふべし。誤認して葛根湯を用ふべからず。若し解しがたきものは、肌に艾灸を以てし、時に鍼刺して、其の實血を瀉すべし。\n姜黄湯　諸もろの頭項痛み、肩背に張る者を治す。此の方肩背強急のものに用ひて効あり。葛根湯にかへ用ひて一時の急をさるべし。\n防風（華産）・獨活（或いは羗活に代ふ）各五分、桂枝・芍藥・櫻皮・姜黄各三分、甘草一分。右七味、水一盞半を以て、煮て六分を取る。",
      yaku: "ある人は「風府の筋がこわばる者は桂枝湯、風池の筋がこわばる者は葛根湯、耳の後ろの筋がこわばる者は麻黄湯、耳の後ろと風池の間がこわばる者は柴胡湯、うなじと背中がすべてこわばる者は大青竜湯」と言う。私が考えるに、このように細かく分けるのはこじつけに近い。およそ表が虚し陽気が衰えたものは、たいてい上が実し下が虚して、頭・うなじ・肩・背がこわばらないものはない。血が凝結しているものはなおさらである。あるいは時に瘀水が上って頭が重く、うなじと背中がこわばるものも、ただ脈と証をよく見て、葛根湯の行く所とするか、桂枝湯およびその加減方の行く所とするかを決めるべきで、項背のこわばりだけでその証と決めてはならない。麻黄湯や大青竜湯は、桂枝湯・葛根湯とは方意がまったく別である。芍薬の有無によって、発散を専らにするものと、あわせて血分を和解するものとの違いがあることを考え知るべきである。柴胡湯は項背強ではない。いわゆる「頸項がこわばり脇下が満ちる」ものは、脇下満の現れである。だから缺盆の筋から耳の後ろにかけてこわばるのである。ある人は「脇下の不容のあたりにしこりがあって、按じて硬いものは肩がつかえている。目の病（?）や頭痛の持病があるはずである」と言う。もし脇下が引きつって水の鳴る音がするものは痰飲であって、これとは異なると知るべきである。結胸の者もうなじがこわばるというが、これは胸が硬く張り出すことで区別する。もし肌が乾き、うなじと背中が凝り固まって細かな発疹が出るものは黄耆桂枝湯を用いよ。誤って葛根湯を用いてはならない。治りにくいものは、肌に艾の灸をし、時に鍼を刺して実した血を瀉せ。\n姜黄湯：さまざまな頭やうなじの痛み、肩と背中が張るものを治す。この方は肩背のこわばりに用いて効果がある。葛根湯の代わりに用いて一時の急を除くとよい。\n防風（中国産）・独活（羌活で代えてもよい）各5分、桂枝・芍薬・桜皮・姜黄各3分、甘草1分。以上7味を水1盞半で煮て6分を取る。" }
  ],
