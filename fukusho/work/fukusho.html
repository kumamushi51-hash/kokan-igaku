  paras: [
    { head: "心下の水気と咳：小青竜湯の証", koma: "188L",
      kaki: "圖の如く心下中脘より上、不容の邊まで、たぷたぷとするほど水氣ありて、咳出で、或いは咳逆喘急し、發熱惡寒、乾嘔するもの、小青龍湯の證なり。論に曰く、傷寒表解せず、心下に水氣あり、乾嘔、發熱して咳し、或いは渴し、或いは利し、或いは噎し、或いは小便不利、少腹滿ち、或いは喘する者は、小青龍湯之を主ると。此の証は心下に宿水留飲ありて、其の上に外邪を感じたるものにて、宿水と外邪とが相激して咳を發するなり。乾嘔發熱は表証なり。咳は發熱に因りて發するゆゑ、發熱に接して而の字を間るなり。或以下の諸證は正證にあらず。皆心下の水氣より出でたるところの變證なり。水氣が去らんと欲すれば、渴することもあるなり。水が胃中にいれば、下利することもあるなり。水が胸中に迫れば、噎することもあるなり。小便が利せざれば、少腹のはりみつることもあるなり。氣上逆すれば、咽喉に迫りて喘を發することもあるなり。是れ皆水と氣の變候なり。或いはといふは、其のあることを必とせずして、其の變に備へたるなり。さて此の方も亦桂枝湯に本づき、心下の水氣を解するを主としたるものなり。五味子咳を治し、半夏・細辛・乾姜と并せて痰飲停水を解す。麻黄表を開き、汗を發し、餘は桂枝湯本方の意にして、兼ねて氣血を和解するものとしるべし。",
      yaku: "図のように、心下の中脘から上、不容のあたりまで、たぷたぷするほど水気があって咳が出る、あるいは咳き込んで激しく喘ぎ、発熱・悪寒し、からえずきするものは小青竜湯の証である。傷寒論に「傷寒で表が解せず、心下に水気があり、からえずきし、発熱して咳し、あるいは口渇し、あるいは下痢し、あるいはむせ、あるいは小便の出が悪く下腹が張り、あるいは喘する者は小青竜湯が主治する」とある。この証は心下にもともと宿水・留飲があり、その上に外邪を受けたもので、宿水と外邪が激しく打ち合って咳を起こすのである。からえずきと発熱は表証である。咳は発熱によって起こるので、発熱に続けて「而」の字をはさんでいる。「或いは」以下の諸証は正証ではなく、みな心下の水気から出た変証である。水気が去ろうとすれば口渇することもある。水が胃の中に入れば下痢することもある。水が胸の中に迫ればむせることもある。小便が出なければ下腹が張り満ちることもある。気が上逆すれば咽喉に迫って喘を起こすこともある。これらはみな水と気の変化の兆候である。「或いは」というのは、それが必ずあるとはせず、変化に備えたものである。さてこの方も桂枝湯にもとづき、心下の水気を解くことを主としたものである。五味子は咳を治し、半夏・細辛・乾姜とともに痰飲・停水を解く。麻黄は表を開いて汗を出させ、残りは桂枝湯本来の意味で、あわせて気血を和解するものと知るべきである。" },
    { head: "支飲・冒眩・溢飲", koma: "189R",
      kaki: "此の方心下の水氣を去るを以て主とす。故に又支飲を治す。證に曰く、咳逆倚息して臥することを得ず、小青龍湯之を主ると。此の證即ち支飲なり。金匱に云ふ、咳逆倚息、短氣して臥することを得ず、其の形腫るるが如し、之を支飲と謂ふと。支はささへるなり。心下に留飲ありて支へて開利せざるゆゑ、物に倚りかかりて平臥することを得ざるなり。又云ふ、心下に支飲あり、其の人冒眩に苦しむと。是を以て此の證も亦冒するなり。又苓桂五味甘草湯の證に云ふ、青龍湯下り已りて云々、小便難く、時に復た冒する者と。此の復の字、小青龍湯を服せざる前に已に冒するもの、青龍湯にて一旦愈えて、今又復た衝氣を發して冒するをいふにて知るべし。冒はおほふなり。物をひきかむりたるごとくに面目うつとりとなるなり。冒眩といへば、目くるめきくらむことなり。即ち水氣の上逆して冒眩を發するなり。又曰く、溢飲を病む者は、當に其の汗を發すべし、大青龍湯之を主る、小青龍湯も亦之を主ると。溢はあふるるなり。飲水流行して四肢に歸し、當に汗出づべくして汗出でず、身體疼重する、之を溢飲と謂ふといふもの是れなり。乃ち亦留飲あふれて四肢に歸するの謂にて、身體疼重し、或いは浮腫するものなり。",
      yaku: "この方は心下の水気を除くことを主とする。だから支飲も治す。金匱要略に「咳き込んで物に寄りかかって息をし、横になれない者は小青竜湯が主治する」とある。この証が支飲である。金匱要略に「咳き込んで寄りかかって息をし、息切れして横になれず、その姿がむくんでいるようなものを支飲という」とある。支とは支えることで、心下に留飲があって支え、通じないので、物に寄りかかって平らに寝ることができないのである。また「心下に支飲があると、その人は冒眩に苦しむ」とある。それでこの証も冒するのである。また苓桂五味甘草湯の証に「青竜湯を服し終えて…小便が出にくく、時にまた冒する者」とある。この「また」の字から、小青竜湯を飲む前からすでに冒していたものが、青竜湯でいったん治り、いままた衝気を起こして冒するのだと分かる。冒とはおおうことで、物をかぶったように顔や目がぼうっとなることである。冒眩といえば目がくらむことで、水気が上逆して冒眩を起こすのである。また「溢飲を病む者はその汗を出させるべきで、大青竜湯が主治し、小青竜湯もまた主治する」とある。溢とはあふれることで、「飲んだ水が流れて四肢に帰し、汗が出るはずなのに出ず、体が痛み重いものを溢飲という」とあるのがこれである。留飲があふれて四肢に帰するという意味で、体が痛み重く、あるいはむくむものである。" },
    { head: "大青竜湯との別", koma: "189L",
      kaki: "其の大青龍との別は、大青龍は麻黄湯より來り、麻黄湯は又桂枝甘草湯より來るものにして、血分をはなれて、專ら肌表に達して發散することを主とす。並びに上に衝して上部にこずみ、胸滿して心下の水氣少なく、たぷつくほどのことなし。わけて大青龍は内の燥きみあり。其の石膏あるを以てみるべし。小青龍は前に辨ずるごとく、心下の留飲をさるを主として、發散に專らならず。是れ大青龍は飲水流れて四肢に歸し、外にあるものを汗にしさり、小青龍は其の本根の水をさるの異ありとしるべし。故に溢飲の證に汗を發するには、大青龍を用ふといへども、留飲に用ふることなきを見るべし。要するに溢飲腹に水氣多く、四肢に水氣すくなきものは、小青龍湯を用ふべし。腹に水氣すくなく、四肢に水氣多く、或いは浮腫するものは、大青龍湯を用ふべきなり。又小青龍加石膏湯の證に云ふ、肺脹、咳して上氣し、煩躁して喘し、脈浮なる者は、心下に水ありと。これ其の煩躁して喘するを以て石膏を加ふといへども、心下に水あるを以て、亦大青龍湯を用ひざること前と同じ。",
      yaku: "大青竜湯との区別は次のとおりである。大青竜湯は麻黄湯から来ており、麻黄湯はまた桂枝甘草湯から来たもので、血分を離れ、もっぱら肌表に達して発散することを主とする。どちらも気が上に衝いて上部にこもり、胸が満ちるが、心下の水気は少なく、たぷたぷするほどではない。とりわけ大青竜湯には内の乾き気味がある。石膏が入っていることからそれが分かる。小青竜湯は前に述べたように、心下の留飲を除くことを主とし、発散を専らにしない。つまり大青竜湯は飲んだ水が流れて四肢に帰し外にあるものを汗にして除き、小青竜湯はその根本の水を除くという違いがあると知るべきである。だから溢飲の証で汗を出させるには大青竜湯を用いるが、留飲には用いないことを見るべきである。要するに、溢飲で腹に水気が多く四肢に水気が少ないものには小青竜湯を、腹に水気が少なく四肢に水気が多い、あるいはむくむものには大青竜湯を用いるべきである。また小青竜加石膏湯の証に「肺脹で、咳して気が上り、もだえて喘し、脈が浮の者は心下に水がある」とある。もだえて喘するので石膏を加えるが、心下に水があるので、やはり大青竜湯を用いないことは前と同じである。" },
    { head: "大青竜湯の証：「汗出でず」の辨", koma: "189L–190R",
      kaki: "○論に曰く、太陽中風、脈浮緊、發熱惡寒、身疼痛、汗出でずして煩躁する者は、大青龍湯之を主ると。此の章一體に不汗出の三字を以て眼的骨子とすべし。案ずるに論中に汗出でざるをいふもの、其の異同ありて、其の趣意各ことなり。曰く汗不出、曰く不汗出、曰く無汗、曰く不發汗、是れなり。汗不出は、汗すれども出でずと讀むべし。汗を出すしかけをしても出でざるなり。不汗出は、汗にし出でずと讀むべし。表にある水氣の汗にしさるべきものが、汗となり出でざるなり。故に而煩燥といふを以て之に掲ぐ。汗にし出でざるを以て煩燥するを言ふなり。無は有の反對なり。汗の有るべき所に、其の汗が無きなり。是は表に瘀水の隔てあるを闡（?）さんために無汗といふなり。葛根湯・麻黄湯是れなり。不發汗は、發汗劑にて汗を發せぬといふなり。さて此の大青龍の證は、首に冠するに太陽中風を以てすれば、素より重病にあらず、肌表の水を汗にしされば愈ゆべきものなれども、其の水が汗になりて出でざる故、腠理を閉ぢふさぎて、脈中にも勢ひをもちて浮緊をあらはし、發熱惡寒、身疼痛して煩躁するなり。煩の解前にあり。躁は靜の反對にて、じつとして居られぬことなり。以上の諸證、劇しくみゆれども、一體に汗さへ出づれば、内熱も解して、諸證ともに解するなり。是れ重きに似て反つて輕く、名づくるに中風を以てするところなり。此にて大青龍は肌表の水氣邪氣を汗に發するを主として立てたるの意を思ふべきなり。",
      yaku: "○傷寒論に「太陽の中風で、脈が浮緊、発熱・悪寒し、体が痛み、汗が出ずにもだえ騒ぐ者は大青竜湯が主治する」とある。この章は全体として「不汗出」の三字を眼目とすべきである。考えるに、論の中で汗が出ないことを言うものには違いがあり、その趣旨はそれぞれ異なる。「汗不出」「不汗出」「無汗」「不発汗」がそれである。「汗不出」は「汗すれども出でず」と読むべきで、汗を出す手立てをしても出ないのである。「不汗出」は「汗にし出でず」と読むべきで、表にある水気で汗にして除くべきものが汗となって出ないのである。だから「而煩躁」と続けて掲げ、汗として出ないためにもだえ騒ぐことを言っている。「無」は「有」の反対で、汗があるべき所に汗がないのである。これは表に瘀水の隔てがあることを明らかにするために無汗という。葛根湯・麻黄湯がこれである。「不発汗」は発汗剤で汗を出させないということである。さてこの大青竜湯の証は、冒頭に「太陽中風」とあるから、もともと重病ではなく、肌表の水を汗にして除けば治るはずのものだが、その水が汗になって出ないので、腠理を閉じふさぎ、脈にも勢いをもって浮緊を現し、発熱・悪寒し、体が痛んでもだえ騒ぐのである。煩の解釈は前にある。躁は静の反対で、じっとしていられないことである。以上の諸証は激しく見えるが、全体として汗さえ出れば内の熱も解けて諸証ともに治る。これが重そうに見えてかえって軽く、中風と名づけるわけである。これで大青竜湯が肌表の水気・邪気を汗にして出すことを主として立てられた意味を考えるべきである。" },
    { head: "大青竜湯の禁と、浮緩・身重の証", koma: "190R–191R",
      kaki: "若し脈微弱、汗出でて惡風する者は、服すべからず。これは前の煩躁をうけたる文なり。若し脈微弱、汗出でて惡風し、一々前證と相異にして、それに煩躁があれば、此の煩躁汗出でざるによらざるゆゑ、虚證とす。誤りて大青龍を服すれば、陽氣を亡ぼして、手足厥逆し、筋惕肉瞤するなり。惕はおそるるなり。筋惕は、筋を張りつめてびつくりするなり。瞤はうごくなり。肉瞤は肉のぴくぴくとうごくなり。此れ治を逆して致すところにして、茯苓四逆湯の證なり。又曰く、傷寒、脈浮緩、身疼まず、但だ重く、乍ち輕き時あり、少陰の證無き者は、大青龍湯之を發すと。此の證は少陰眞武湯の疑似あるところの傷寒にして、前の中風よりも劇しからずして、反つて深きなり。さて此は但だ身重の一證が疑途にかかり、傷寒と名づくる所にして、大青龍を服するゆゑんなり。少陰眞武湯の證は、四肢沈重疼痛すれども、此の證は身疼まず、但だ重きばかりにて、時に乍ち輕きこともあれば、裡水の致す所の重きに非ざることを知る。是れ邪氣肌表の間に隱伏して、いまだ發せざるものとす。大青龍は肌表の水氣邪氣を發する爲の主方たること、前に辨ずるがごとくなるを以て、今審らかに少陰眞武の證にあらざるを徵察せば、大青龍にて隱伏の邪氣を發して汗にしさるべしとなり。主之といはずして、發之といふにて、此の方の發汗の主劑たることを知るべし。余嘗て一病婦姙娠の證あるもの、數日愈えざるに、大青龍湯一貼を服せしむれば、一炊の頃ばかりにして、汗流るるがごとく出でて、病一掃するが如く、不日に常に復することを得たり。古方の妙なること、試みてしるべし。",
      yaku: "「もし脈が微弱で、汗が出て悪風する者には服用させてはならない」。これは前の「煩躁」を受けた文である。もし脈が微弱で汗が出て悪風し、一つ一つ前の証と違っていて、そこにもだえ騒ぎがあるなら、この煩躁は汗が出ないことによるものではないので虚証とする。誤って大青竜湯を服用させれば陽気を失って手足が冷えあがり、筋惕肉瞤する。惕とは恐れることで、筋惕とは筋を張りつめてびくっとすることである。瞤とは動くことで、肉瞤とは肉がぴくぴく動くことである。これは治療を誤って起こしたもので、茯苓四逆湯の証である。また「傷寒で、脈が浮緩、体は痛まず、ただ重く、急に軽くなる時があり、少陰の証のない者は大青竜湯でこれを発する」とある。この証は少陰の真武湯と紛らわしい傷寒で、前の中風より激しくはないが、かえって深い。ここではただ「身重」の一証が紛らわしいところで、傷寒と名づけるところであり、大青竜湯を服させるわけである。少陰の真武湯の証は四肢が重く沈み痛むが、この証は体が痛まず、ただ重いだけで、時に急に軽くなることもあるので、裏の水による重さではないと分かる。これは邪気が肌表の間に潜伏してまだ発していないものである。大青竜湯は肌表の水気・邪気を発するための主方であることは前に述べたとおりなので、いま少陰真武湯の証ではないことをよく確かめたなら、大青竜湯で潜伏した邪気を発して汗にして除けというのである。「主之」と言わずに「発之」と言っていることから、この方が発汗の主剤であることを知るべきである。私はかつて妊娠中の病婦で数日治らない者に大青竜湯を1服飲ませたところ、飯の炊けるほどの間に汗が流れるように出て、病が一掃されたように、日ならずして平常に戻ることができた。古方の妙は試してみて知るべきである。" },
    { head: "麻黄湯の証：無汗にして喘", koma: "191R–191L",
      kaki: "○麻黄湯の證、前に略辨ずといへども、いまだ其の蘊を盡さざるを以て、更に左に詳釋す。論に曰く、太陽病、頭痛發熱、身疼腰痛、骨節疼痛、惡風し、汗無くして喘する者は、麻黄湯之を主ると。此の證も亦一體にすべて、無汗而喘の四字が骨子なり。無汗の辨は前の葛根湯の下に詳らかにす。さて此の病冠むるに太陽病を以てすれば、外來の邪氣の如く劇しからず。發熱惡風して惡寒せざれば、汗出づべきはづなれども、これ亦肌表の瘀水に隔てられて、腠理を閉塞して、汗のいづべき門戸なきゆゑ、周身へ分布するところの氣が、外に漏るることを得ずして、一道にすぼみ逼りて、氣道を衝逆するなり。其のもめ合ひにて喘を發するゆゑ、無汗而喘と中間に而の字を插むなり。其のこころは、表を閉ぢて汗することなきを以て、其がために喘を發するなり。たとへば茶鑵の湯を滚沸すれば、鑵口よりいづる湯氣が一道になり、虎尾の如くに立ち上るとき、其の蓋を取れば、其の氣忽ち平らなるがごとく、肌表の水氣を汗にしされば、腠理へ氣が分布するゆゑ、上騰の勢ひ平らになりて、胸滿喘急速やかに平愈するなり。さて又大青龍の證には身疼痛といふ。此の證には身疼、腰痛、骨節疼痛と、逐一に其の處を詳らかにするは、彼は中風の證ゆゑ、外來の邪氣にて、身軀一面に疼痛するなり。此は太陽病にて自地の病にして、其の表を閉づるものは瘀水なるゆゑ、其の疼痛するもの多く骨節にあるなり。其の惡寒と惡風との別も亦是のゆゑなり。凡そ三陽三陰自地の病と、中風傷寒外來の邪氣とは、其の證を思ふに劇易緩急の差別あること、前の諸章を參考して例し知るべし。又案ずるに、大青龍と此の方との主意の異なるところは、彼も表閉ぢて氣衝逆すといへども、胸喉に逼るところの水氣少なく、内にこもるところの熱勢つよきを以て煩躁するなり。是の故に石膏を佐として其の熱を解す。或いは渴して飲を引くの證あるべし。此の方は胸喉に逼るところの水氣あるを以て、亦胸滿して喘を發するなり。是の故に杏仁を佐として其の喘を解す。是れ其の二方の意の別なる所なり。然れども桂枝・甘草ありて芍藥なく、並びに麻黄を君として、肌表に逐し、汗を發し、水を逐ふの意は、二方一歸なりと知るべし。",
      yaku: "○麻黄湯の証は前にあらまし述べたが、まだ奥義を尽くしていないので、さらに以下に詳しく解釈する。傷寒論に「太陽病で、頭痛・発熱し、体が痛み、腰が痛み、関節が痛み、悪風し、汗がなく喘する者は麻黄湯が主治する」とある。この証も全体として「無汗而喘」の四字が骨子である。無汗の区別は前の葛根湯のところで詳しく述べた。さてこの病は冒頭に「太陽病」とあるから、外から来た邪気ほど激しくない。発熱・悪風して悪寒しないなら汗が出るはずだが、これも肌表の瘀水に隔てられて腠理がふさがれ、汗の出る門戸がないので、全身に広がるはずの気が外に漏れることができず、一筋にすぼまり迫って気道を突き上げるのである。そのもみ合いで喘を起こすので、「無汗而喘」と間に「而」をはさむのである。その意味は、表が閉じて汗が出ないために喘を起こすということである。たとえば茶釜の湯を沸騰させると、注ぎ口から出る湯気が一筋になって虎の尾のように立ち上るが、蓋を取ればその気はたちまち穏やかになる。それと同じように、肌表の水気を汗にして除けば気が腠理へ広がるので、上へ昇る勢いが穏やかになって、胸の張りと激しい喘ぎは速やかに治るのである。また大青竜湯の証には「身疼痛」とだけあるのに、この証では「身疼、腰痛、骨節疼痛」と一つ一つ部位を詳しく言っているのは、あちらは中風の証で外来の邪気によって全身一面に痛むのに対し、こちらは太陽病で自地の病（体の内から起こる病）であり、表を閉じているのは瘀水なので、痛むところが多く関節にあるからである。悪寒と悪風の区別もこのためである。およそ三陽三陰の自地の病と、中風・傷寒の外来の邪気とでは、証に激しさ・緩急の差があることを、前の諸章を参考にして推し知るべきである。また考えるに、大青竜湯とこの方の主意の違いは、あちらも表が閉じて気が上逆するが、胸や喉に迫る水気が少なく、内にこもる熱の勢いが強いのでもだえ騒ぐ。それで石膏を佐薬としてその熱を解く。口渇して水を欲しがる証もあるはずである。この方は胸や喉に迫る水気があるので、やはり胸が張って喘を起こす。それで杏仁を佐薬としてその喘を解く。これが二方の意味の違いである。しかし桂枝・甘草があって芍薬がなく、どちらも麻黄を君薬として肌表に追い出し、汗を出し、水を追う意味は、二方とも同じ帰着点であると知るべきである。" },
    { head: "太陽陽明の合病、喘して胸満す", koma: "191L–192R",
      kaki: "又曰く、太陽と陽明の合病、喘して胸滿する者は、下すべからず、麻黄湯に宜し。此の證の喘も亦無汗而喘するなり。其の無汗を言はざるは、前の章に因りて折略するなり。是れ古文の法なり。如今文の法を以て書かば、無汗而喘、喘而胸滿と書くべきところなり。さて此に合病といふ所以は、胸滿するを以てなり。此の證は一段熱勢劇しきを以て胸滿するに至るゆゑ合病とすれども、此の滿するもの實滿にあらず。但だ衝逆逼塞して、水氣上りこずみて胸滿するゆゑ、喘して胸滿するものなれば、胸滿は主證にあらずして、喘が主證となるなり。故に亦而の字を以て其の證を連接す。されば此の證も前の如く、肌表を開きて汗を發すれば、其の氣腠理に分布して、喘息は自ら平低して、胸滿隨つて愈ゆべし。故に誤認して實滿として下すべからずといふなり。是れ蓋し大承氣に腹滿して喘すといふの疑途あるを以て、之を言ふならん。凡そ太陽陽明の合病は、其の治は皆表を發して、熱の勢ひを外に解するを法とするなり。右二章の義を釋して、麻黄湯の方意詳明なり。其の他、發煩目瞑、劇しき者は必ず衄すといひ、汗を發せざるに因りて衄を致すといふものの類、概するに皆衝逆の致すところにして、發汗すれば諸證隨つて愈ゆること同意なり。故に其の無汗して衝氣劇しきものは、喘せずといへども、亦此の方を用ふとなり。",
      yaku: "また「太陽と陽明の合病で、喘して胸が張る者は下してはならない。麻黄湯がよい」とある。この証の喘も無汗にして喘するのである。無汗を言わないのは、前の章にならって省略したもので、これが古文の書き方である。今の文の書き方なら「無汗而喘、喘而胸満」と書くべきところである。さてここで合病というわけは、胸が張るからである。この証はひときわ熱の勢いが激しく胸満に至るので合病とするが、この張りは実満ではない。ただ気が突き上げてふさがり、水気が上ってこもって胸が張るので、喘して胸満するのであるから、胸満は主証ではなく、喘が主証となる。だからやはり「而」の字でその証をつないでいる。それゆえこの証も前と同じく、肌表を開いて汗を出させれば、気が腠理に広がって喘ぎは自然に収まり、胸満もそれにつれて治るはずである。だから誤って実満と思って下してはならないというのである。これはおそらく大承気湯に「腹満して喘す」とあって紛らわしいので言ったのであろう。およそ太陽と陽明の合病の治療は、みな表を発して熱の勢いを外に解くことを原則とする。以上二章の意味を解釈して、麻黄湯の方意は明らかになった。そのほか「もだえて目を閉じ、激しい者は必ず鼻血を出す」「汗を出させなかったために鼻血を出す」などというものの類も、概してみな気の上逆によるもので、発汗すれば諸証がそれにつれて治るのは同じ意味である。だから無汗で衝気の激しいものには、喘がなくてもこの方を用いるのである。" }

  paras: [
    { head: "臍上中脘の動気：桂枝湯の正腹証", koma: "193R",
      kaki: "右圖の如く、臍上中脘の邊動氣ありて、之を按ずるに浮にして築々たるもの、桂枝湯の腹證なり。氣上衝といふも、此の動氣築々するの謂なり。上衝といふは、此の動氣上騰して心にせまるなり。但だ氣上衝といふて心を言はざるは、此の動腹に在りて心胸まで上衝せざるなり。輕重の別なり。さて其の腹皮は少しつはりて力あり。所謂拘攣の微なるものなり。然れども之を正按するに鞕からず、實せずして、底にこたへるものなし。動氣も亦按じて力ありといへども甚しからず。乃ち陽浮にして陰弱なるもの、亦此に於いても同じことを得べし。凡そ腹證を診して、人ごとに此の動氣あらざることなく、陰病陽病ともに同じ。これを分別するものは外證に於いて察すべし。妄りに動氣のみをとるべからず。抑も腹證を診するもの、先づ此の圖に本づき、桂枝湯の正腹證なるものを定むべし。其の大同少異あるものは、時に取りて斟酌すべし。徒らに圖を按じて驥を求むること勿れ。",
      yaku: "右の図のように、臍の上の中脘のあたりに動気があって、按じると浮いていてどきどきと打つものが桂枝湯の腹証である。「気上衝」というのも、この動気がどきどき打つことをいう。上衝とは、この動気が上って心に迫ることである。ただ「気上衝」と言って「心」を言わないのは、この動が腹にあって胸まで突き上げないからで、軽重の区別である。さてその腹皮は少し突っ張って力がある。いわゆる拘攣の軽いものである。しかし正しく按じると硬くなく、実しておらず、底に応えるものがない。動気も按じると力はあるがひどくはない。いわゆる「陽浮にして陰弱」というものは、ここ（腹）でも同じように得られる。およそ腹証を診ると、この動気のない人はなく、陰病でも陽病でも同じである。これを見分けるには外証で察するべきで、むやみに動気だけを取ってはならない。そもそも腹証を診る者は、まずこの図にもとづいて桂枝湯の正しい腹証を定めるべきである。大筋が同じで少し異なるものは、その時に応じて斟酌すべきである。いたずらに図に当てはめて名馬を探す（図面どおりのものを探す）ようなことをしてはならない。" },
    { head: "桂枝湯の加減と、動気の変", koma: "193L",
      kaki: "若しくは此の腹狀にして腹拘急して時に痛むものは、加芍藥湯。若しくは大實痛するものは、加大黄湯。若しくは拘急甚しく急痛するものは、小建中湯。若しくは心下痞鞕拘攣するものは、加芍藥生薑人參湯。若しくは渴して口乾くものは、加括蔞根。若しくは却つて腹拘攣せず、之を按ずるにぐさつきて、胸さきより上はりみちて心わるくは、去芍藥湯。若しくは心下滿、小便不利せば、去桂加苓朮湯。〔醫宗金鑑、去芍藥に作る。〕其の他ことごとく本方に就きて去加増損するの意を審らかにし、或いは陽、或いは陰、其の變化を明らかにせば、以て大過なかるべし。又案ずるに、氣上衝するもの、瓜蒂散の證あり。呉茱萸湯の証あり。厥陰の證あり。或いは少陰病の四逆・眞武・理中の證といへども、此の動氣の變なしといふべからず。所謂心下悸、瞤（?）眩、煩躁等、亦此の動氣にかかはるもの多し。但だ其の陰陽をつまびらかにして、大表の應見を分明に診しうること肝要なり。學者これを思へ。",
      yaku: "もしこの腹の状態で、腹が引きつって時に痛むものは桂枝加芍薬湯。大いに実して痛むものは桂枝加大黄湯。引きつりがひどく急に痛むものは小建中湯。心下が痞えて硬く引きつるものは桂枝加芍薬生姜人参湯。口が渇いて乾くものは括蔞根を加える。逆に腹が引きつらず、按じるとぐさぐさとして、みぞおちから上が張り満ちて気分が悪いものは桂枝去芍薬湯。心下が張り、小便の出が悪いものは桂枝去桂加茯苓朮湯。〔医宗金鑑では「去芍薬」とする。〕そのほか、すべて本方について加減する意味をよく考え、陽か陰かその変化を明らかにすれば、大きな過ちはないであろう。また考えるに、気上衝するものには瓜蒂散の証があり、呉茱萸湯の証があり、厥陰の証がある。少陰病の四逆湯・真武湯・理中湯の証であっても、この動気の変化がないとは言えない。いわゆる心下悸・めまい・もだえ騒ぎなども、この動気にかかわるものが多い。ただその陰陽をよく見きわめ、体表に現れるものをはっきり診ることが肝要である。学ぶ者はこれを考えよ。" }

      yaku: "本方（桂枝湯）の腹が張って、按じると筋が張って痛むものは桂枝加芍薬湯。発熱・悪寒・下痢するものにこの証がある。腹痛がひどいものにはこの方に木香を加える。\n加芍薬湯の証で、臍のあたりを按じて底に応え、実しているものは桂枝加大黄湯。\n心下が痞えて硬く引きつり、小建中湯の腹の状態に似て、もっぱら心下に痞えふさがるものは桂枝加芍薬生姜人参湯の証である。" },

    desc: "髷を布で結んだ薄ひげの男が胡坐をかき、うつむく。胸の中央（両乳の間から心窩部へ）に小さな青い輪が七つ点々と並ぶ。腹には肋骨の下から下腹まで縦の青い帯が三本（中央の帯はくびれて臍を含み、両側の帯は腹直筋に当たる）。書き込み「心中悸而煩」（胸の輪へ線）、「腹動氣アリ」（中央の帯へ線）、「裡急　腹皮拘急」（腹の帯へ線）。" },
  paras: [
    { head: "小建中湯の正証：二本の大竹、鼓の皮", koma: "196R",
      kaki: "圖の如く腹一面にすぢばり引つり、宛も大鼓の上を撫づるが如し。鼓脹とは異なり。鼓脹は、腹はりふくれて急なり。此は二行通りに大竹を立つるが如く、三指探按すれば、上下に引きはるもの弓弦を張るが如し。之を正按すれば、腹底に實せず。但だ中脘の邊より上、動氣つよく、壓按するに胸中までどきどきとおどり、さて四肢の肉ひすばり痩せて、手足の心に熱を生じ、脈浮大にして力なきものを、小建中湯の正證とす。或いは二大竹を立つるが如く、鼓皮を循づるが如くならずといへども、腹皮一面にすぢばり引つりて、三指探按すれば其の人痒笑して按ずるに堪へがるものあり。其の痒笑するもの一定しがたしといへども、此の証多きを以て此にしるす。是れ亦所謂拘攣急逼するものにして、四肢痩削するの虚候に至らずといへども、亦此の方の腹證とす。",
      yaku: "図のように腹一面が筋張って引きつり、まるで太鼓の皮の上をなでるようである。鼓脹とは違う。鼓脹は腹が張りふくれて張りつめている。これは二行の線（腹直筋）に沿って大きな竹を立てたようで、三本の指で探り按じると上下に引き張るものが弓の弦を張ったようである。正しく按じると腹の底は実していない。ただ中脘のあたりから上は動気が強く、押し按じると胸の中までどきどきと躍る。そして四肢の肉がやせ細り、手足の裏（手のひら・足の裏）に熱を生じ、脈が浮大で力のないものを小建中湯の正証とする。あるいは二本の大竹を立てたようでも、太鼓の皮をなでるようでもないが、腹皮一面が筋張って引きつり、三本の指で探り按じるとその人がくすぐったがって笑い、按じられるのを嫌がるものがある。くすぐったがるものは一定しないが、この証に多いのでここに記す。これもいわゆる拘攣して急迫するもので、四肢がやせ細る虚の兆候には至らないが、やはりこの方の腹証とする。" },
    { head: "加芍薬湯・加大黄湯との別", koma: "196R–196L",
      kaki: "夫れ本方は桂枝加芍藥湯より來るものにして、更に血結拘急の甚しきものとす。是れ其の甘草を増し、膠飴を加ふる所以なり。此の證腹痛するもあり、せざるもありといへども、若し腹痛するときは、前の加芍藥とは緩急の別あり。彼は時に痛むといふ。痛み休作あり。此は急痛といふ。休作なく痛むものとす。又實痛とも異なり。彼は腹内に實するものあり。此は裡急といひて、腹皮の裡手にてひつぱりつけるごとく痛むなり。是れ亦桂枝湯本方の意を審らかにし、其の去加の由りて來る所を考へ、互ひに相發明せば、惑ひを生ずることなく、牽強臆斷ならざること得べし。",
      yaku: "そもそも本方は桂枝加芍薬湯から来たもので、さらに血の結ぼれと引きつりがひどいものである。それで甘草を増やし、膠飴を加えるのである。この証は腹痛するものもしないものもあるが、腹痛するときは前の加芍薬湯とは緩急の違いがある。あちらは「時に痛む」といい、痛みに休みがある。こちらは「急痛」といい、休みなく痛むものである。また実痛とも違う。あちらは腹の内に実するものがある。こちらは裡急といって、腹皮の裏側から引っぱりつけるように痛むのである。これも桂枝湯本方の意味をよく考え、その加減の由来を考えて互いに照らし合わせれば、迷うことなく、こじつけや当て推量にならずにすむ。" },
    { head: "虚労の証の解", koma: "196L–197R",
      kaki: "證に曰く、虚勞、裡急、悸、衄、腹中痛み、夢に失精し、四肢痠痛、手足煩熱、咽乾き口燥くと。虚勞は病の名なり。然れども古人の名を命ずる、一も證に取らざるものなし。虚は場所ありて其の内に物なきをいふ。皮骨は場所なり。其の内に實つべきものは血液・精液なり。今精液脱し肉をうるほさずして、血も亦流動の勢ひすくなく、肉ひすばり筋ひきつりて、顔面血色なく、薄白にて、但だ皮骨を存して、其の内にみつべき物なきを以て、名づけて虚といふ。證に云く、男子面色薄き者は、渴及び亡血を主る、卒かに喘悸し、脉浮なる者は裡虚なりと。是れなり。亡も亦あるべきものの無きものになりたることにて、血のひすばり力はくのいひなり。勞はつかるるなり。血其の肉を榮せず、精其の骨を守らざれば、虚熱骨髓にいりて、手足の心熱し、四肢だるく痛み、夢に精をもらし、手足觚（?）がごとく痩せて、運行すること能はず。名づけて勞といふ所以なり。裡急の裡は腹表の裏にて、皮膚の裏手にてひつぱるなり。筋脈のことなり。悸は所謂心中悸なり。むねの内だくだくとおどるなり。衄は鼻血なり。これ衝逆するによるなり。腹中痛は裏急によるなり。夢失精はもうざうなり。精は靜にして内を守るものなり。今内虚して守りを得ざるゆゑ、夢に失するなり。下焦の虚なり。手足煩熱は、ちろへ（?）のほめきあつくしてこころあしきなり。痠痛は、やせすばりてだるく痛むなり。咽乾口燥は血氣衝逆、虚熱の候なり。乃ち舌乾燥といへば、胃中の實熱によるの候とす。故にわざと舌を除きて、斷に咽乾口燥といふなり。乃ちただ咽口中のはしわぐ（?）ことなり。總て是れ虚勞の證なり。又論に曰く、傷寒、陽脈澁、陰脈弦なるは、法として當に腹中急痛すべき者と。又曰く、傷寒二三日、心中悸して煩する者と。これ皆傷寒外來の邪氣によるものにして、一時の變證なれば、悉く其の證を具へずといへども、大率前に演ぶるところの腹證に從ひて之を考ふべし。〔小柴胡の腹痛の差別は二編に詳らかなるを以て略す。〕其の他何の病名、何の病因を問はず、此の腹證に據りて考へ得べし。",
      yaku: "金匱要略に「虚労で、裡急し、動悸し、鼻血が出、腹の中が痛み、夢で精を漏らし、四肢がだるく痛み、手足がほてり、咽が乾き口が乾く」とある。虚労は病の名である。しかし古人が名をつけるときは、一つとして証からとらないものはない。虚とは、場所があってその中に物がないことをいう。皮と骨が場所であり、その中に満ちるべきものは血液と精液である。いま精液が抜けて肉を潤さず、血も流れる勢いが少なく、肉はやせ細り筋は引きつって、顔に血色がなく薄白く、ただ皮と骨だけが残ってその中に満ちるべき物がないので、虚と名づける。金匱要略に「男子で顔色の薄い者は口渇と亡血をつかさどる。急に喘ぎ動悸し、脈が浮の者は裏が虚している」とあるのがこれである。亡も、あるべきものがなくなったことで、血がやせ細り力が薄いという意味である。労とは疲れることである。血がその肉を養わず、精がその骨を守らないので、虚熱が骨髄に入って手足の裏がほてり、四肢がだるく痛み、夢で精を漏らし、手足は（枯れ枝の）ようにやせて動かすことができない。これが労と名づけるわけである。裡急の裡は腹の表面の裏側のことで、皮膚の裏側から引っぱるのである。筋脈のことである。悸はいわゆる心中悸で、胸の中がどきどきと躍ることである。衄は鼻血で、気の上逆による。腹中痛は裏急による。夢失精は夢精である。精は静かで内を守るものであるが、いま内が虚して守れないので夢で漏らすのである。下焦の虚である。手足煩熱は手足のほてりが熱く、気分が悪いことである。痠痛はやせ細ってだるく痛むことである。咽乾口燥は血気の上逆、虚熱の兆候である。舌が乾燥するといえば胃の中の実熱による兆候となるので、わざと舌を除いて、きっぱりと「咽乾口燥」と言っている。ただ咽や口の中が乾くだけのことである。すべてこれが虚労の証である。また傷寒論に「傷寒で、陽脈が渋、陰脈が弦であるのは、腹の中が急に痛むはずの者」とあり、また「傷寒の二三日目で、胸の中が動悸してもだえる者」とある。これらはみな傷寒の外来の邪気によるもので一時の変証なので、その証をすべて備えるわけではないが、たいていは前に述べた腹証に従って考えればよい。〔小柴胡湯の腹痛との区別は二編に詳しいので省く。〕そのほか、どんな病名・病因であっても、この腹証によって考えることができる。" },
    { head: "黄耆建中湯", koma: "197L",
      kaki: "○若しくは此の腹證にして、肌膚の乾くこと甚しく、或いは自汗盜汗あるもの、黄耆建中湯を用ふべし。證に曰く、虚勞裡急、諸不足と。案ずるに、諸不足とは、氣血ともに充足せざるの謂なり。黄耆は正氣を肌表にはりて、津液をめぐらすの能あり。諸もろの肌表の不足するものは、皮膚乾きてうるほひなく、衛氣腠理を固めざるゆゑ、津液もれて自汗盜汗となりいづるなり。黄耆正氣をはり、津液をめぐらし、腠理を固からしむれば、瘀水は自然と降りて小便に通利し、肌膚潤ひにして潤澤を得るなり。稱して黄耆は自汗盜汗を治すといへども、一に正氣の不足によるものとすれば、これを以て主能とすべからず。余亦黄耆を用ふる、汗の有無を以てとせず、俱に肌膚の正氣乏しきものを診し得て誤らずとす。",
      yaku: "○もしこの腹証で、肌の乾きがひどく、あるいは自汗・盗汗があるものには黄耆建中湯を用いよ。金匱要略に「虚労で裡急し、諸々が不足する」とある。考えるに、諸不足とは気血がともに充足しないという意味である。黄耆は正気を肌表に張り、津液をめぐらす働きがある。肌表が不足しているものは皮膚が乾いて潤いがなく、衛気が腠理を固めないので津液が漏れて自汗・盗汗となって出る。黄耆が正気を張り、津液をめぐらし、腠理を固くすれば、瘀水は自然に降りて小便に通じ、肌は潤って潤沢を得る。黄耆は自汗・盗汗を治すと言われるが、それはひとえに正気の不足によるものだから、これを主な効能とすべきではない。私も黄耆を用いるのは汗の有無によらず、どちらも肌の正気が乏しいものを診て見誤らないようにしている。" },
    { head: "当帰建中湯", koma: "197L–198R",
      kaki: "○若しくは小建中湯の腹狀にして、少腹拘急し、痛み腰背に引き、或いは腹中刺痛し、吸吸として少氣する者、當歸建中湯の證とす。刺痛は鍼にて刺すごとく痛むなり。血氣の痛みなり。吸々少氣は、ひくひく（?）、息みぢかくよわくして、いきぎれするなり。急迫なり。此の證は、左の臍傍の上下を三指探按するに、結ぼるものあり。之を邪按するに、痛み腰背若しくは股際陰器へひきつりすぢばるものを得べし。餘は小建中の腹證に併せ考ふべし。〔當歸芍藥散・芎歸膠艾湯の腹證略相似たり。四編に詳らかなり。〕",
      yaku: "○もし小建中湯の腹の状態で、下腹が引きつり、痛みが腰と背中に響き、あるいは腹の中が刺すように痛み、ひくひくと息が少ない者は当帰建中湯の証とする。刺痛とは鍼で刺すように痛むことで、血気の痛みである。吸々少気とは、息が短く弱くて息切れすることで、急迫である。この証は、左の臍の傍らの上下を三本の指で探り按じると結ぼれたものがある。これを斜めに按じると、痛みが腰と背中、あるいは股の付け根・陰部へ引きつり筋張るのを感じるはずである。そのほかは小建中湯の腹証と併せて考えよ。〔当帰芍薬散・芎帰膠艾湯の腹証もほぼ似ている。四編に詳しい。〕" },
    { head: "大䗪虫丸：乾血", koma: "198R–198L",
      kaki: "○小建中湯の證に似て、虚羸甚しく、肌膚乾きて、腹滿攣急し、之を按ずるに堅くして痛むもの、乾血とす。大䗪蟲丸の證なり。〔今の金匱、誤りて大黄䗪蟲丸に作る。大黄䗪蟲丸は下瘀血湯の本名なり。證類本草に詳らかなり。〕證に曰く、五勞虚極、羸痩腹滿、飲食すること能はず、内に乾血あり、肌膚甲錯、兩目黯黑なるは、中を緩め虚を補ふと。甲錯は鮫肌のごとくあれかはきたるをいふ。黯黑は黑くして明らかならざるをいふ。此の證は小建中湯より一等血のひすばりかはくものとす。方中の四蟲・乾漆・桃仁、皆血結癥瘕を破るものとす。",
      yaku: "○小建中湯の証に似て、やせ衰えがひどく、肌が乾き、腹が張って引きつり、按じると堅くて痛むものは乾血とする。大䗪虫丸の証である。〔今の金匱要略は誤って大黄䗪虫丸としている。大黄䗪虫丸は下瘀血湯の本来の名である。証類本草に詳しい。〕金匱要略に「五労で虚が極まり、やせ衰えて腹が張り、飲食できず、内に乾血があり、肌がざらざらに荒れ、両目が黒ずむものは、中を緩め虚を補う」とある。甲錯とは鮫肌のように荒れて乾いていることをいう。黯黒とは黒ずんでくすんでいることをいう。この証は小建中湯よりひときわ血がやせ細り乾いたものである。方中の四種の虫・乾漆・桃仁は、みな血の結ぼれや腹のしこり（癥瘕）を破るものである。" },
    { head: "桂枝湯から大䗪虫丸へ：病の流れと源", koma: "198L",
      kaki: "○愚案ずるに、桂枝湯の方中に芍藥あるもの、已に此の兆を成したるものなり。其の漸く加芍藥湯に到りて、已に腹滿の形狀をあらはし、時に痛みの變を發す。小建中湯に至りて、遂に虚勞の形狀を成し、裏急の攣結を致す。其の極を大䗪虫丸の乾血證とす。並びに皆正氣乏しくして健運しがたきよりして、血分滯りて調和せざるものにして、其の病の淺深厚薄の等差ありといへども、其の證の由りて來るところは一途なり。讀むもの桂枝湯本方の意を審らかにして、其の流れに泝りて其の源を究め、其の流れに沿ひて其の末を求めば、河源の出づる處を知り、又其の碍（?）よりして海に入るの號（?）をも雜く觀ることを得るものとせんか。若しくは解せざるものは、証に隨ひて此の方を數服（?）す。\n此の方轉用して、鼓脹、血癥、産後の血腫・水腫、瘰癧に、薏苡附子敗醤散、若しくは排膿散・黄耆の輩を兼用す。小兒の癖瘕等に考試すべし。或いは曰く、勞咳白沫中に血線を雜へ吐くものに試みて効ありと。",
      yaku: "○私が考えるに、桂枝湯の方中に芍薬があるのは、すでにこの兆しを成しているのである。それがしだいに加芍薬湯に至ってすでに腹満の形を現し、時に痛みの変化を起こす。小建中湯に至ってついに虚労の形を成し、裏急の引きつりと結ぼれを起こす。その極みが大䗪虫丸の乾血の証である。どれもみな正気が乏しく巡りにくいことから、血分が滞って調和しないもので、病の浅深・厚薄の差はあっても、証の由来は一筋である。読む者は桂枝湯本方の意味をよく考え、流れをさかのぼって源を究め、流れに沿って末を求めれば、川の源の出る所を知り、またその流れが海に入るまでの様子も広く見ることができるのではないか。〔このあたり判読不確実〕\nこの方（大䗪虫丸）を転用して、鼓脹、血癥（血のしこり）、産後の血腫・水腫に用い、瘰癧には薏苡附子敗醤散あるいは排膿散・黄耆の類を兼用する。小児の癖瘕（腹のしこり）などにも試してみよ。ある人は「労咳で、白い泡の痰に血の筋が混じるものに試して効果があった」と言う。" }

{

  koma: [198, 200], komaNote: "198L–200L（附方 200L）",
  intro: "小建中湯の項の附論。金匱要略の虚労と、当時「労咳」と呼ばれた少壮男女の病（咳・痰沫・午後の潮熱・血痰）を区別し、労咳は金匱の「肺痿」（＝肺疽）に当たるとして、その治法、德本・岡田南陽（?）の説、刺絡、附方（地骨皮散・地仙散・方丹）を記す。",
  paras: [
    { head: "虚労と労咳", koma: "199R",
      kaki: "虚勞の解は、小建中湯の下に詳らかにす。此の證は少壯のものに限らず、五六十以上の人にもある病なり。金匱に云ふ、人年五六十、其の病脈大なる者は、痺背を俠みて行き、腸鳴に苦しみ、馬刀俠癭なる者は、皆勞の爲に之を得と。然るに今小兒に疳勞の名あり。又男女十五六歳より以上三十歳の前後までに、勞咳と名づくるものを患ふ。之を金匱に求むるに合せざるものあり。其の證大率咳嗽して痰沫を吐き、晡時潮熱を發し、或いは痰血を雜へ吐す。之を金匱に考ふるに、所謂肺痿なるもの、此の證と合するものあり。證に曰く、肺痿の病たる、若し口中辟々として燥き、欬すれば即ち胸中隱々として痛み、脈反つて滑數なるは、此れ肺癰と爲す、膿血を咳唾す、脈數虚なる者は肺痿と爲し、數實なる者は肺癰と爲すと。",
      yaku: "虚労の解釈は小建中湯のところで詳しく述べた。この証は少壮の者に限らず、五六十歳以上の人にもある病である。金匱要略に「年が五六十で、その病の脈が大の者は、しびれが背骨をはさんで走り、腸鳴に苦しみ、馬刀・俠癭（頸や腋のるいれき）のある者は、みな労によってこれを得る」とある。ところが今は小児に疳労という名があり、また男女が十五六歳から三十歳前後までに労咳と名づけるものを患う。これを金匱要略に求めると合わないものがある。その証はたいてい咳をして泡の痰を吐き、夕方に潮熱を出し、あるいは血の混じった痰を吐く。これを金匱要略で考えると、いわゆる肺痿というものがこの証と合う。金匱要略に「肺痿の病で、口の中がからからに乾き、咳をすると胸の中が鈍く痛み、脈がかえって滑数であるのは肺癰であり、膿血を咳とともに吐く。脈が数で虚の者は肺痿、数で実の者は肺癰である」とある。" },
    { head: "肺痿は肺疽", koma: "199R–199L",
      kaki: "案ずるに、肺癰と肺痿とを分つに、脈の虚實を以てするときは、肺痿は即ち肺疽なり。凡そ内外ともに熱實して、痛み甚しく膿を成すものを癰とす。陽腫なり。熱微にして痛みを覺えず、膿を成さざるものを疽とす。陰腫なり。此に疽といはずして痿といふものは、痿はなへるなり。氣血のめぐらざるところの名なり。肺は臓にありて見るべからざるを以て、疽といはずして痿といふなり。癰は膿を吐するを以て、其の物を定むるに撒（?）なり。古人の病に名づくるもの、皆臆斷を以てせず。是に於いてみるべし。此の證肺痿の治法に隨ひて効を得べし。",
      yaku: "考えるに、肺癰と肺痿を脈の虚実で分けるのであれば、肺痿とは肺疽のことである。およそ内外ともに熱が実して痛みがひどく膿をつくるものを癰とする。陽の腫れである。熱がかすかで痛みを感じず、膿をつくらないものを疽とする。陰の腫れである。ここで疽と言わずに痿と言うのは、痿とは萎えることで、気血がめぐらないところの名だからである。肺は臓の中にあって見ることができないので、疽と言わずに痿と言うのである。癰は膿を吐くのでその実体を（膿によって）定める。古人が病に名づけるときは、みな当て推量によらない。ここにそれを見るべきである。この（労咳の）証は肺痿の治法に従えば効果を得られる。" },
    { head: "治方", koma: "199L",
      kaki: "虚勞は桂枝加櫻皮湯（前に出す）、黄耆桂枝湯、小建中湯、黄耆建中湯、大䗪虫丸の證を考へ用ふべし。此の証に伯州散を兼用して功あり。若しくは骨蒸熱解しがたきものには、地骨皮散に方丹を兼用すべし。若し少壯の勞證、血鬱によるものは、刺絡すべし。",
      yaku: "虚労には、桂枝加桜皮湯（前出）・黄耆桂枝湯・小建中湯・黄耆建中湯・大䗪虫丸の証を考えて用いよ。この証に伯州散を兼用して効果がある。もし骨蒸の熱（骨から蒸すような消耗熱）が解けにくいものには、地骨皮散に方丹を兼用せよ。もし少壮の労証で血の鬱滞によるものは刺絡せよ。" },
    { head: "岡埜大道・德本翁の説", koma: "199L–200R",
      kaki: "岡埜大道云ふ、勞熱の妙藥は、いかにも地骨皮なり。然るに今勞咳といふものに用ひて効なきは、其の証がちがふゆゑなり。眞の勞証には、德本の地骨皮散、濟世の地仙散に、寶丹・潤體圓・牛黄清心圓の類を用ひて効ありと云云。若し夫れ勞咳は、肺痿の治に從ひて、多くは効ありと。德本翁曰く、男女によらず、氣をつくし、心を勞して、營血滯りてなるものあり。或いは房事をすごし、腎水虚耗してなるものあり。或いは氣虚して肌肉うすき人、風寒にあたりたるに發散の藥を屢しば用ひすごしてなるものあり。以上の如く此の種々の分別ありといへども、男婦老少によらず、血の道のわづらひなり。熱して血へるゆゑに、色黑く痩せて、數脉生じ、又熱に依りて蟲生ずるなり。只寶丹よく勞瘵を治すと云云。",
      yaku: "岡埜大道は言う。「労熱の妙薬はまさに地骨皮である。しかし今、労咳というものに用いて効かないのは、証が違うからである。本当の労証には、德本の地骨皮散、済世の地仙散に、宝丹・潤体円・牛黄清心円の類を用いて効果がある」云々。そもそも労咳は肺痿の治法に従えば多くは効く、と。德本翁は言う。「男女を問わず、気を使い尽くし心を労して営血が滞ってなるものがある。房事が過ぎて腎水が消耗してなるものもある。気虚で肉の薄い人が風寒に当たったのに、発散の薬をたびたび使いすぎてなるものもある。このように種々の区別はあるが、男女老少を問わず血の道の病である。熱して血が減るので、色が黒くやせて数脈が生じ、また熱によって虫が生じるのである。ただ宝丹がよく労瘵を治す」云々。" },
    { head: "南陽翁の説と著者の按：胎毒と刺絡", koma: "200R",
      kaki: "〔岡田（?）〕南陽翁曰く、女子十五六歳より二十歳前後までに發する勞證、男子二十歳の前後より三十歳までに發する勞證は、大率其の人天稟篤實謹厚にして色慾を慎むもの、或いは處子深閨の内に長じて、天癸の旺んなるに至りて、情慾の遂ぐること能はざるもの、此の病を生ず。腎精の開かんとするもの鬱滯して、息すべきもの却つて消す。任脈の瘀血日に厚くして、心に逆せるもの、刺絡にあらざれば効なし。兼ねて導引して氣血を和すべしと云云。愚案ずるに、凡そ男女少壯の間に於いて勞證を發するもの、其の天稟篤實謹厚なるものは、大率胎毒あるものとす。是を以て心氣鬱塞して開かず、篤實なるゆゑんなり。多くは小兒の疳證一たび愈えて、少壯の時に至り、精開け氣旺んならんとするの時、鬱閉滯して此の證を發す。所謂肺痿の証といへども、亦下焦虚衰し、氣血上に逼り、凝滯して成るところのものとす。是を以て鍼灸以て其の治を助くべし。其の刺絡の術のごときは、亦一家言なり。余積年試み得るところあれども、此に贅せず。",
      yaku: "南陽翁は言う。「女子が十五六歳から二十歳前後までに発する労証、男子が二十歳前後から三十歳までに発する労証は、たいていその人が生まれつき実直で慎み深く色欲を慎む者か、あるいは処女で奥深い部屋で育ち、月経（天癸）が盛んになる年頃になって情欲を遂げられない者がこの病を生じる。腎精が開こうとするのが鬱滞して、生じるべきものがかえって消える。任脈の瘀血が日ごとに厚くなって心に逆上するものは、刺絡でなければ効かない。あわせて導引して気血を和すべきである」云々。私が考えるに、およそ男女の少壮期に労証を発する者で、生まれつき実直で慎み深い者は、たいてい胎毒がある。それで心気がふさがって開かず、実直なのである。多くは小児期の疳証がいったん治り、少壮の時に至って精が開き気が盛んになろうとする時に、ふさがり滞ってこの証を発する。いわゆる肺痿の証ではあるが、やはり下焦が虚して衰え、気血が上に迫り、凝滞してできるものである。だから鍼灸でその治療を助けるべきである。刺絡の術については一家言あり、私も長年試して得たところがあるが、ここでは述べない。" },
    { head: "附方", koma: "200L",
      kaki: "一　地骨皮散（德本）　地骨皮・莪胡（柴胡?）各大、知母・秦皮各中、黄栢小。右五味、末と爲して服す。\n一　地仙散（濟世）　地骨二兩、防風一兩、甘草（炙）二兩。右三味、末と爲し、毎服四錢、生姜五片、水煎す。\n　以上二方、並びに勞熱を治す。\n一　方丹　信州胡岸（?）武田子胖家の傳ふる所。德本翁神秘の方なり。子胖が勞瘵熱・癲狂等を治す。秘は口授にあり。\n　黑鉛五錢、水銀・沈香・眞珠・龍腦各三錢、麝香二錢、金箔百枚或いは百五十枚。右六味末とし、蜜丸、土中に埋むること三旬以上、取り出して服す。〔若し製せば則ち方中に黄土一錢或いは五分を加ふ。黄土は潔淨の地下三尺に得る者、水飛す。〕毎服二三分、若しくは七八分、冷水にて送り下す。證に在りては麝香三錢或いは二錢を加へ、後に玉屑を用ひて之を止む。",
      yaku: "一　地骨皮散（德本）：地骨皮・莪胡（柴胡か）各大、知母・秦皮各中、黄柏小。以上5味を粉末にして服用する。\n一　地仙散（済世）：地骨皮2両、防風1両、甘草（炙）2両。以上3味を粉末にし、1回4銭、生姜5片を加えて水で煎じる。\n　以上の2方はどちらも労熱を治す。\n一　方丹：信州の胡岸（?）の武田子胖の家に伝わるもの。德本翁の秘方である。子胖は労瘵の熱や癲狂などを治した。秘訣は口伝にある。\n　黒鉛5銭、水銀・沈香・真珠・龍脳各3銭、麝香2銭、金箔100枚または150枚。以上の6味を粉末にして蜜で丸め、土中に30日以上埋めてから取り出して服用する。〔製するときは黄土1銭または5分を加える。黄土は清浄な地の地下3尺で得たものを水飛する。〕1回2〜3分、あるいは7〜8分を冷水で飲み下す。証によって麝香3銭または2銭を加え、のちに玉屑を用いて止める。" }
  ],

{
  id: "yoku1-tokishigyakuto", no: 85, kind: "方剤", title: "当帰四逆湯（附 加呉茱萸生姜湯）", yomi: "とうきしぎゃくとう", group: "腹証奇覧翼 初編 下",
  koma: [201, 203], komaNote: "201R–203R（図 201R）",
  fig: { src: "img/fig_201R.jpg", koma: "201R", label: "當歸四逆湯圖　并加呉茱萸生姜",
    desc: "髷を布で結んだひげの老人が、向かって左の膝を立てて座り、口を開けて顔を向かって右上へ向ける。手に扇か箒のようなものを持つ。上腹から下腹まで一面の青（上部は横に広く、下へ三本の舌状に伸び、白い抜けが混じる）。前に茶碗と薬包。書き込み：向かって右「心下水氣アリ　腹拘攣」（枠で囲み上腹の青へ線）、「脇下拘急、呉茱萸ノ証多シ」、向かって左「左ノ臍傍ノ邊、按テ痛、血結ナリ」「右ノ少腹久寒ノ毒凝結」（下腹の青へ線）。" },
  paras: [
    { head: "図の書き込み", koma: "201R",
      kaki: "心下水氣あり。腹拘攣。\n脇下拘急、呉茱萸の証多し。\n左の臍傍の邊、按じて痛む、血結なり。\n右の少腹、久寒の毒凝結す。",
      yaku: "心下に水気がある。腹が引きつる。\n脇下が引きつるのは呉茱萸の証に多い。\n左の臍の傍らのあたりは按じると痛む。血の結ぼれである。\n右の下腹には久寒の毒が凝り固まっている。" },
    { head: "当帰四逆湯の腹証と方意", koma: "201L–202R",
      kaki: "圖の如く腹皮拘攣すること、桂枝加芍藥湯・小建中湯の腹狀に似たり。且つ左の臍傍天樞の上下に攣痛するものあること、當歸芍藥散・當歸建中湯の證に似たり。右の少腹腰間に於いて結聚するものあり。手足冷え、脈細にして力なきもの、當歸四逆湯の證とす。案ずるに、此の方は桂枝湯方中生姜を去りて細辛に代へ、更に當歸・通草を加へ、大棗を増すものなり。下焦の寒氣上りて心下にあり、正氣抑塞せられて肌表に充たずして四肢に及ばず、血脈澁滯して駃流の勢力なきものとす。細辛能く中焦の冷氣を散じ、胃口に抑塞せる水氣を排き、通草能く其の水を引きて小便に利し、關節を通じて陽氣を道に便す。餘は血脈を和し、正氣を滋達すること、桂枝湯の旨意なるものと知るべし。但だ當歸は之が主となりて、芍甘の二味に和し、腹中の結血攣引するものを解くことを能くす。",
      yaku: "図のように腹皮が引きつることは、桂枝加芍薬湯・小建中湯の腹の状態に似ている。また左の臍の傍らの天枢の上下に引きつって痛むものがあることは、当帰芍薬散・当帰建中湯の証に似ている。右の下腹から腰のあたりに結ぼれ集まるものがある。手足が冷え、脈が細くて力のないものを当帰四逆湯の証とする。考えるに、この方は桂枝湯から生姜を除いて細辛に代え、さらに当帰・通草を加え、大棗を増やしたものである。下焦の寒気が上って心下にあり、正気が押さえふさがれて肌表に満ちず四肢に及ばず、血脈が渋り滞って速く流れる勢いのないものである。細辛はよく中焦の冷えを散らし、胃の入り口にふさがった水気を押し開き、通草はよくその水を引いて小便に通じさせ、関節を通して陽気の通り道をよくする。残りは血脈を和し、正気を潤し行き渡らせるもので、桂枝湯の趣旨であると知るべきである。ただ当帰がその主となって芍薬・甘草の二味と和し、腹の中の血の結ぼれ・引きつりをよく解く。" },
    { head: "手足厥寒、脈細にして絶えんと欲す", koma: "202R",
      kaki: "論に曰く、傷寒、手足厥寒、脈細にして絶えんと欲する者は、當歸四逆湯之を主ると。これは平素氣虚のもの、外邪襲入して心胸にあり、正氣之が爲に抑遏せられて、四肢より厥逆し、脈細にして絶えんと欲するもの、此の方を以て心胸間の寒邪を排き、水氣を下に導きて正氣を舒暢すれば、厥寒復た温まり、脈に陽氣を帯びて愈ゆるなり。三味の四逆湯との別は、彼は既に内に在りて下利清穀の証をあらはすものとす。故に四肢に於いても厥冷をいふ。冷はつめたきなり。内に属する詞とす。寒はさむきなり。外より來る氣のさむきをおぼゆることなり。外に属する詞とす。此の証心胸間に在りて、いまだ腹内の變をあらはさず。故に文を變じて厥寒と書く。其の異を示すなり。細は幅のなく絲のごとき脈なり。故に絶えんと欲すといふ、すきれさうに思ふなり。",
      yaku: "傷寒論に「傷寒で、手足が冷えて寒く、脈が細くて絶えそうな者は当帰四逆湯が主治する」とある。これは平素から気虚の者に外邪が入り込んで胸にあり、正気がそのために押さえられて四肢から冷えあがり、脈が細くて絶えそうになったもので、この方で胸の間の寒邪を押し開き、水気を下に導いて正気をのびやかにすれば、冷えはまた温まり、脈に陽気を帯びて治るのである。三味の四逆湯との違いは、あちらはすでに内にあって下痢清穀（不消化便の下痢）の証を現すものだということである。だから四肢についても「厥冷」という。冷とは冷たいことで、内に属する言葉である。寒とは寒いことで、外から来る気を寒く感じることであり、外に属する言葉である。この証は胸の間にあってまだ腹の中の変化を現していない。だから文を変えて「厥寒」と書き、その違いを示したのである。細とは幅がなく糸のような脈である。だから「絶えんと欲す」、すぐ切れそうに思うのである。" },
    { head: "下利・脈大・浮革・腸鳴", koma: "202R–202L",
      kaki: "又曰く、下利、脈大なる者は虚なり、其の強ひて之を下すを以ての故なり、設し脈浮革、爾に因りて腸鳴する者は、當歸四逆湯之を主ると。脈大とは、所謂洪大無倫の謂なり。淺く按ずるときは大幅あれども、深く按ずるときは細くして蜘蛛の絲のごとくになる脈なり。革は弦大にして芤なる脈をいふ。芤は中のうつろにして、葱の切口に指をあつるごとしといへり。虚寒の候なり。さて此に言ふ下利脈大なる者は虚なりの一句は例なり。其の強ひて之を下すを以て以下が、此の方の証をいふものなり。言ふこころは、下利の脈大なるものは虚寒の例なり。今病人其の強ひて之を下すを以ての故に、胃陽衰へて、設し脈に浮革をあらはさば、以て實とすべからず。爾に因りてとは、強下に因りてなり。強下に因りて下利はせずとも、脈浮革にして腸中に水鳴するものは、虚寒とすべし。此の方之を主るなり。此の証前章と脈細大相反するがごとくなれども、其の歸は一なり。故に此の脈彼よりは一等虚の甚しきものとす。愚案ずるに、凡そ虚寒の証にして脈浮大なるもの、腹候動氣心下にせまりて、浮大の狀あり。誤りて陽証とすべからず。又案ずるに、三味の四逆湯は下に因りて下利清穀を致すもの、此の方は下に因りて但だ腸鳴し、脈に虚証をあらはすもの。亦内外の異なり。",
      yaku: "また「下痢して脈が大の者は虚である。無理に下したためである。もし脈が浮革で、そのために腸が鳴る者は当帰四逆湯が主治する」とある。脈大とは、いわゆる洪大でたとえようもない脈のことで、浅く按じると幅が大きいが、深く按じると細くて蜘蛛の糸のようになる脈である。革とは弦大で芤の脈をいう。芤とは中がうつろで、葱の切り口に指を当てるようだという。虚寒の兆候である。さてここの「下痢して脈が大の者は虚である」の一句は一般例であり、「無理に下したため」以下がこの方の証を言うものである。その意味は、下痢で脈が大のものは虚寒の例である。いま病人を無理に下したために胃の陽気が衰え、もし脈に浮革を現しても実とみなしてはならない。「そのために」とは、無理に下したためにということである。無理に下したために、下痢はしなくても、脈が浮革で腸の中で水が鳴るものは虚寒とすべきで、この方が主治する。この証は前の章と脈の細・大が相反するようだが、帰するところは一つである。だからこの脈はあちらよりひときわ虚がひどいものとする。私が考えるに、およそ虚寒の証で脈が浮大のものは、腹では動気が心下に迫って浮大の様子がある。誤って陽証としてはならない。また考えるに、三味の四逆湯は下したために下痢清穀を起こすもの、この方は下したためにただ腸が鳴り、脈に虚証を現すもので、これも内外の違いである。" },
    { head: "加呉茱萸生姜湯：久寒", koma: "202L–203R",
      kaki: "又曰く、若し其の人久寒ある者は、當歸四逆加呉茱萸生姜湯之を主ると。久寒は水毒の寒をなしたるものなり。腰下下焦の冷氣をあらはすもの、下にあつまり、陽氣を抑塞して、飲食の化の利を妨ぐるもの是れなり。此の證但だ久寒とのみ言ひて、其の証を詳らかにせざるを以て、或いは吐利を撮むの說あれども、今余が試驗するところを以てするに、或いは虚寒の疝毒、宿飲の類、胃口に懣ちて吐酸・呑酸等の証を成すもの、或いは冷氣衝逆して心下にせまり、胸脇を攻め、乾嘔し涎沫を吐するもの、或いは腹痛、或いは吐利、或いは轉筋、婦人の積冷・血滯・經水短少、腹中拘攣、時に心下背下に逆り、肩背強急、頭項動痛の類、概するに久寒の致すところなり。其の脈証を審らかにして、外手足厥寒、脈細なるものを得ば、本方を服して効あらずといふことなし。一に吐利の證のみにあらざるなり。呉茱萸・生姜・細辛の力を戮せて、胃腸の宿飲停水を排き、胃口を寬舒にし、冷氣を散じ、衝氣を下して、桂枝諸藥の氣血を挪化し陽氣を宣達するものをして、其の用を利せしむるものと考ふべし。",
      yaku: "また「もしその人に久寒がある者は当帰四逆加呉茱萸生姜湯が主治する」とある。久寒とは水毒が冷えとなったものである。腰から下、下焦の冷えを現すもので、下に集まって陽気を押さえふさぎ、飲食の消化を妨げるものがこれである。この証はただ「久寒」とだけ言って詳しい証を述べていないので、嘔吐・下痢をこれに当てる説もあるが、私が試したところでは、虚寒の疝毒や宿飲の類が胃の入り口に満ちて吐酸・呑酸（胸やけ・すっぱいものが上がる）などの証を成すもの、冷えが上逆して心下に迫り、胸脇を攻め、からえずきしてよだれや泡を吐くもの、あるいは腹痛、あるいは嘔吐・下痢、あるいはこむら返り、婦人の積もった冷え・血の滞り・月経量の少なさ、腹の中の引きつり、時に心下から背中に逆上し、肩や背中のこわばり、頭やうなじがずきずき痛むものの類、概して久寒の起こすものである。その脈と証をよく見て、外に手足の冷え、脈が細のものを得れば、本方を服用して効かないことはない。ひとえに嘔吐・下痢の証だけではないのである。呉茱萸・生姜・細辛の力を合わせて胃腸の宿飲・停水を押し開き、胃の入り口をゆったりとさせ、冷えを散らし、衝気を下して、桂枝などの諸薬が気血をめぐらせ陽気を行き渡らせる働きを助けるものと考えるべきである。" },
    { head: "症例：こむら返りの婦人", koma: "203R",
      kaki: "湖南老（?）浪華に寓するに、浪華の一婦人の證を診す（?）。日一夕轉筋を患ふ。其の証胸腹拘急、背膊強り、頭腦痛み、脈直にして、灸せんと欲す。門生の傍らに侍するものをして方を處せしむ。桂枝加芍藥、或いは括蔞桂枝湯を作りて進むといへども効なし。因りて鶏屎白二錢を服す。亦効なし。延いて隣に湯村生なるものあり。招きて診せしむ。生曰く、脈澁りて轉筋するは、當歸四逆加呉茱萸生姜湯を用ふべしと。其の口舌の燥くものは、舌筋轉ずるによつて血分動きて津液をかはかすものなるゆゑなり。熱の候とすべからず。乃ち本劑を作りて服せしめ、且つ鍼治を加へて、以て熱のすこしくゆるむ。續けて服すること一晝夜、…（判読不確実）…にいたりて愈ゆ。",
      yaku: "湖南老（?）が浪華（大坂）に滞在していたとき、浪華の一婦人を診た（?）。ある夕方こむら返りを患った。その証は胸と腹が引きつり、背中と肩甲部がこわばり、頭が痛み、脈はまっすぐ張っていて、灸をしようとした。そばに控えていた門人に処方させたところ、桂枝加芍薬湯あるいは括蔞桂枝湯を作って進めたが効かなかった。そこで鶏屎白2銭を服させたが、これも効かなかった。隣に湯村生という者がいたので招いて診させた。湯村生は「脈が渋ってこむら返りするのは当帰四逆加呉茱萸生姜湯を用いるべきだ」と言った。口や舌が乾くのは、舌の筋が引きつるために血分が動いて津液を乾かすからで、熱の兆候とみなしてはならない。そこでこの剤を作って服させ、さらに鍼治療を加えたところ熱が少しゆるんだ。続けて一昼夜服させ、…（判読不確実）…に至って治った。" }

{
  id: "yoku1-shakuyakukanzoto", no: 86, kind: "方剤", title: "芍薬甘草湯（附 芍薬甘草附子湯）", yomi: "しゃくやくかんぞうとう", group: "腹証奇覧翼 初編 下",
  koma: [203, 204], komaNote: "203L–204R（図なし：本文「右圖ノ如」の図は丁付三十八丁の欠けによりこの本にない）",
  paras: [
    { head: "芍薬甘草湯：筋脈の攣急", koma: "203L",
      kaki: "右圖の如く、腹二行通り内外上下に引きはりたる筋ありて、之を按ずるに強ばり、或いは脚脛、或いは手臂攣急して伸びがたく、或いは手足の患ひなくといへども、腹皮攣急して腹痛するもあり。小建中湯・桂枝加芍藥湯の腹證に相似たりといへども、彼は桂枝を主として、氣上衝等の證あること、前に具論するが如し。此の方は但だ筋脈の攣急を治するを主とするのみ。論に曰く、脚攣急するに、芍藥甘草湯を作りて之に與ふれば、其の脚乃ち伸ぶと。他の治に及ばざるなり。",
      yaku: "右の図のように、腹の二行の線に沿って内外・上下に引き張った筋があり、按じるとこわばっている。あるいはすね、あるいは腕が引きつって伸ばしにくい。手足の症状がなくても、腹皮が引きつって腹痛するものもある。小建中湯・桂枝加芍薬湯の腹証に似ているが、あちらは桂枝を主として気上衝などの証があることは前に詳しく述べたとおりである。この方はただ筋脈の引きつりを治すことを主とするだけである。傷寒論に「脚が引きつるのに芍薬甘草湯を作って与えれば、その脚はすぐに伸びる」とある。ほかの治療には及ばないのである。" },
    { head: "芍薬甘草附子湯：発汗後の悪寒", koma: "203L–204R",
      kaki: "若し此の腹證にして惡寒し、若しくは骨節疼痛する者は、附子を加ふ。論に曰く、發汗して病解せず、反つて惡寒する者は、虚するが故なり、芍藥甘草附子湯之を主ると。表証の惡寒は汗を發すれば解するなり。今發汗して反つて惡寒するものは、病解せずとする所以なり。虚するが故なりとは、此の惡寒、邪氣の實するにあらず、精氣の虚するゆゑなり。凡そ發汗吐下の後、脈微にして惡寒するものは、虚するゆゑなり。病解するものは、消息して陰陽自ら和すれば、惡寒も隨つて愈ゆるなり。故に病解せずといふ。然れば則ち其の虚して惡寒するもの、所謂虚寒にして、附子にあらざれば愈えず。然れども此の惡寒の外に、別に虚寒の證候、内外の變を見すものなし。但だ此の惡寒、發汗の後に得。さて發汗すれば津液を亡ぼして血脈の不和なるを以て、芍藥・甘草之を和して、附子其の惡寒を解するなり。其の發汗の後、身疼痛し、脈沈遲なる者に、桂枝加芍藥生姜人參湯を服したると一例なるべし。",
      yaku: "もしこの腹証で悪寒する、あるいは関節が痛む者には附子を加える。傷寒論に「発汗しても病が治らず、かえって悪寒する者は虚しているからである。芍薬甘草附子湯が主治する」とある。表証の悪寒は汗を出させれば治る。いま発汗してかえって悪寒するのは、病が治っていないとするわけである。「虚しているから」とは、この悪寒が邪気の実によるのではなく、精気が虚しているからだということである。およそ発汗・吐・下の後に脈が微で悪寒するものは虚しているからである。病が治るものは、しばらく様子を見て陰陽が自然に調和すれば悪寒もそれにつれて治る。だから「病が治らない」という。そうであればその虚して悪寒するものはいわゆる虚寒で、附子でなければ治らない。しかしこの悪寒のほかに、虚寒の証候や内外の変化を見せるものはない。ただこの悪寒は発汗の後に起こったものである。発汗すると津液を失って血脈が不和になるので、芍薬・甘草でそれを和し、附子でその悪寒を解くのである。発汗の後に体が痛み、脈が沈遅の者に桂枝加芍薬生姜人参湯を服させたのと同じ例であろう。" },
    { head: "或る説：疝気・腹証", koma: "204R",
      kaki: "○或いは曰く、疝氣、少腹臍傍に凝結するもの、之を按ずるに腰脚に引きつり、或いは股にひきつりてだるく痛むもの、証に隨ひて附子粳米湯・眞武湯・苓姜朮甘湯の類を服し、芍藥甘草湯、或いは加附子湯を合方して効ありと。又曰く、芍藥甘草湯は、腹氣鳩尾にせまり、つけたるものあり。又兩の脇下、腹底に張りはりたる筋あれども見えず、臍の邊に至りて皮上にあらはるるもの、芍藥甘草附子湯の腹証なりと云々。",
      yaku: "○ある人は言う。「疝気で、下腹や臍の傍らに凝り固まったものがあり、按じると腰や脚に引きつり、あるいは股に引きつってだるく痛むものには、証に従って附子粳米湯・真武湯・苓姜朮甘湯の類を服させ、芍薬甘草湯あるいは芍薬甘草附子湯を合方して効果がある」と。また言う。「芍薬甘草湯は、腹の気がみぞおち（鳩尾）に迫り、くっついたようなものがある。また両脇下から腹の底に張った筋があるが表には見えず、臍のあたりに至って皮膚の上に現れるものは芍薬甘草附子湯の腹証である」云々。" }

    { head: "風引湯の発明", koma: "215L–216R",
      kaki: "嗚呼、風引湯の方たるや、誠に奇なり妙なり。醫家の常に製して以て急救に備へずんばあるべからざる所のものなり。昔吉益東洞、類聚方を撰びて此の方を遺せしより、後の古方に從ふもの、復たいまだ之を試驗するものあるを聞かず。…（判読不確実）…今にて奇功を得るもの多し。…安永年間、…岡埜文平（?）なるもの、此の方にて諸もろの暴卒病を救ふことを聞く。其の後、療治茶談續編に載せて、癇證の試驗を記す。其の他は未だ之を聞かず。余が友、京師の延生堂、仲景に心醉して、診腹に苦刻せるものなり。此の方を試效して、危急を救ふこと尠からず。敢へて其の奇を秘せず、以て余に語る。余雀躍して已まず。之を數人に試むるに、果たして妙なり。因りて其の本文を釋し、併せて發明の説を記し、以て同好の士に貽り、濟生の一助たらんことを欲すること左の如し。",
      yaku: "ああ、風引湯という方は、まことに奇妙である。医家が常に調製して急病の救命に備えておかなければならないものである。昔、吉益東洞が『類聚方』を撰んだときにこの方を漏らしてから、後に古方に従う者でこれを試した者があるとはまだ聞かない。…（判読不確実）…今では著効を得る者が多い。安永年間に岡埜文平（?）という者がこの方で多くの急病を救ったと聞く。その後『療治茶談』続編に載せて、癇証に試した例を記している。そのほかはまだ聞かない。私の友人で京都の延生堂は、仲景に心酔して腹診に苦心した人である。この方を試して効を得、危急を救うことが少なくなかった。その妙を隠さずに私に語ってくれた。私は小躍りして喜んだ。これを数人に試したところ、果たして妙であった。そこで本文を解釈し、あわせて発明の説を記して同好の士に贈り、人を救う一助としたいと思い、以下のように述べる。" },
    { head: "条文の解：寸口脈遅にして緩", koma: "216R–216L",
      kaki: "證に曰く、寸口の脈遲にして緩、遲なれば則ち寒と爲し、緩なれば則ち虚と爲す。榮緩なれば則ち亡血と爲し、衛緩なれば則ち中風と爲す。邪經に中れば則ち身痒くして癮疹す。心氣足らず、邪氣入りて中れば、則ち胸滿短氣すと。案ずるに、寸口の脉より癮疹までの三十五字は、風引湯の脈証に非ず。邪風に中るの由を論ず。心氣不足以下の文、始めて風引湯の証に及ぶなり。遲はおそきなり。一息三動の脉をいふ。緩はゆるきなり。按じてひきはらぬ脉をいふ。遲脈は寒の氣勝るの候にして、緩脉は血氣虚するの証なり。榮はさかへるの義にして、血の脈中にさかへるの称とす。中に按じてゆるきを覺ゆるは榮の緩なり。是れ血を脈中に亡ふの候とす。衛はまもるの義にして、皮膚にはり出でて外を守る氣の称とす。淺く按じて緩の脈を得るは、風に中るの兆なり。故に此に脈をすべて緩なれば則ち虚と爲すといふなり。然れば則ち邪気虚に乗じて入るべき脉狀を論じて、風脈を言ふにあらずと知るべし。又此にいふ中風は、傷寒に對するの中風に非ず。乃ち手足癱瘓不仁するの中風なり。さて全文の意は、下焦に寒ある人、陽氣を抑へられて舒暢せざれば、經絡をめぐる血も不足して筋脈に實たざるゆゑ、血が亡びたるになり、随つて陽氣が肌膚に達して腠理を固め衛らざるゆゑ、邪風が虚に乗じて入りて傷るなり。若し其の邪が外にして經脉にあたれば、身痒くして癮疹を發す。癮疹は隱起するところの疹にて、即ち風疹なり。俗にかざほろしといふもの是れなり。此は輕症なり。發散して治すべし。若し其の人衛榮の虚のみならず、心氣も不足なるに、邪氣内に入りて臓にあたれば、則ち胸滿短氣して危急の証を發するなり。胸滿は胸一ぱいにはりて、短氣は呼吸みぢかく息せかせかとするなり。此の心に中るが、乃ち風引湯の證なり。",
      yaku: "金匱要略に「寸口の脈が遅で緩、遅は寒、緩は虚である。営が緩なら亡血、衛が緩なら中風である。邪が経に当たれば体がかゆくて癮疹（じんましん）が出る。心気が足りず、邪気が入って当たれば胸が張って息が短くなる」とある。考えるに、「寸口の脈」から「癮疹」までの35字は風引湯の脈証ではなく、邪風に当たるわけを論じたものである。「心気不足」以下の文で初めて風引湯の証に及ぶ。遅とは遅いことで、一呼吸に三拍の脈をいう。緩とはゆるいことで、按じても張りのない脈をいう。遅脈は寒の気が勝つ兆候で、緩脈は血気が虚している証である。営とは栄えるという意味で、血が脈中に栄えることをいう。中ほどに按じてゆるく感じるのは営の緩で、血を脈中に失った兆候である。衛とは守るという意味で、皮膚に張り出して外を守る気をいう。浅く按じて緩の脈を得るのは風に当たる兆しである。だからここでは脈をまとめて「緩は虚」というのである。つまり邪気が虚に乗じて入りうる脈の状態を論じたもので、風の脈を言ったのではないと知るべきである。またここでいう中風は、傷寒に対する中風ではなく、手足が麻痺し感覚がなくなる中風である。全文の意味は、下焦に寒のある人は陽気が押さえられてのびやかでないので、経絡をめぐる血も不足して筋脈に満ちず、血を失った状態になり、それにつれて陽気が肌に達して腠理を固め守らないので、邪風が虚に乗じて入り込んで傷るということである。もし邪が外にあって経脈に当たれば、体がかゆくて癮疹を出す。癮疹とは盛り上がって出る発疹で、すなわち風疹（じんましん）であり、俗に「かざほろし」というものである。これは軽症で、発散して治すべきである。もしその人が衛営の虚だけでなく心気も不足しているところに、邪気が内に入って臓に当たれば、胸が張って息が短くなり危急の証を起こす。胸満とは胸いっぱいに張ること、短気とは呼吸が短く息がせかせかすることである。この心に当たるものが風引湯の証である。" },
    { head: "熱癱癇を除く", koma: "216L–217R",
      kaki: "風引湯は熱癱癇を除く。邪風内に入り中りて、胸滿短氣するに至れば、熱氣内におこり、加ふるに手足を引きつり、或いは搐搦して、其の証休作あるなり。癱は癱瘓なり。癇は病間ありて發するなり。癱癇とは即ち是の謂なり。…胸滿短氣、熱癱癇の者は風引湯之を主ると書くべきを、本文の如く顛倒して書きたる故、…（判読不確実）…古文の辭なりと知るべし。何如となれば、風引湯は諸もろの暴卒病の上焦にせまるものを控抑するところの方にて、熱癱癇を除きて胸滿短氣をしづむるが風引湯の主治にて、其の證除きて後の心氣不足及び虚寒等の自地の病を治するところに非ずの意を示したるものなり。",
      yaku: "「風引湯は熱癱癇を除く」。邪風が内に入って当たり、胸が張って息が短くなるに至ると、熱気が内に起こり、そのうえ手足が引きつり、あるいはけいれんして、その証には発作と休止がある。癱は癱瘓（麻痺）、癇は間をおいて発作することで、癱癇とはこのことである。…本来は「胸満短気・熱癱癇の者は風引湯が主治する」と書くべきところを、本文のように倒置して書いているのは、…（判読不確実）…古文の言い回しであると知るべきである。なぜなら、風引湯はさまざまな急病で上焦に迫るものを抑える方であり、熱癱癇を除いて胸満短気を鎮めるのが風引湯の主治で、その証が除かれた後の心気不足や虚寒などの自地の病を治すものではない、という意味を示しているからである。" },
    { head: "大人の風引、少小の驚癇、脚気衝心", koma: "217R",
      kaki: "又曰く、大人の風引、少小の驚癇瘛瘲、日に數十發し、醫の療せざる所を治す、熱を除くの方と。此の文は金匱の正文に非ず。林億等他書の文を引くところの者にて、千金・外臺などの文躰なり。外臺に深師の方とし、瘛を瘈に作る。風引は風入りて手足を引くの名なり。少小の驚癇は即ち驚風なり。瘈瘲は搐搦といふがごとし。筋急にして縮むを瘈といひ、伸ぶるを瘲といふ。是れ邪氣心に逼るの致すところなり。日に數十發す。故に癱癇・驚癇の名あり。此れ亦前章と同意にして、醫の療せざる所といへば、古より此の方にてされる救急の良方なかりしことを思ふべし。巣氏曰く、脚氣には風引湯に宜しと。〔此の方の下に引くところの文なり。〕案ずるに、此に但だ脚氣とのみいふもの、其の証を辨ぜず。今方に依りて証を考ふるに、即ち脚氣衝心なり。脚氣衝心するものも亦胸滿短氣、心中疼煩、前章の証と一揆なることを知るべし。",
      yaku: "また「大人の風引、小児の驚癇・瘛瘲で、一日に数十回発作し、医者が治せないものを治す、熱を除く方」とある。この文は金匱要略の正文ではなく、林億らが他書の文を引いたもので、千金方・外台秘要などの文体である。外台秘要では深師の方とし、「瘛」を「瘈」としている。風引とは、風が入って手足を引きつらせることの名である。小児の驚癇とはすなわち驚風（ひきつけ）である。瘈瘲とは搐搦（けいれん）というようなもので、筋が引きつって縮むのを瘈、伸びるのを瘲という。これは邪気が心に迫って起こるものである。一日に数十回発作する。だから癱癇・驚癇の名がある。これも前の章と同じ意味で、「医者が治せない」というのだから、昔からこの方ほどの救急の良方はなかったことを思うべきである。巣氏（巣元方）は「脚気には風引湯がよい」と言う。〔この方の下に引かれている文である。〕考えるに、ここでただ「脚気」とだけいうのは、その証を区別していない。いま方によって証を考えると、すなわち脚気衝心である。脚気衝心するものも胸満・短気・胸の中の痛みともだえがあり、前の章の証と同じであることを知るべきである。" },
    { head: "延生堂の説：呉茱萸と風引湯", koma: "217R–217L",
      kaki: "○延生堂曰く、古人脚気衝心を治するに、大率呉茱萸・檳榔の劑多し。是れ仲景呉茱萸湯の意に本づき、更に降気の諸品を合したるものにて、壅れるの方とすべからず。夫れ呉茱萸は病中焦に在りて上衝するものを治して、既に上りて上焦に居するものを治すること能はず。〔…其の驚劇に至りては、手を束ねて斃るるを見ん。〕論に曰く、穀を食して嘔せんと欲する者は陽明に屬するなり、呉茱萸湯之を主る、湯を得て反つて劇しき者は上焦に屬するなりと。陽明は胃家、胃家は中焦なり。湯を得て反つて劇しき者は上焦に屬すとすること明けし。然れば則ち其の上焦に屬するもの、何の方か之に處せん。唯だ風引湯あるのみ。今にて用ひて以て効あるときは、復た何ぞ疑はん。",
      yaku: "○延生堂は言う。「昔の人が脚気衝心を治すには、たいてい呉茱萸・檳榔の剤が多い。これは仲景の呉茱萸湯の意味にもとづき、さらに気を降ろす諸薬を合わせたもので、（上焦に）ふさがったものの方とすべきではない。呉茱萸は病が中焦にあって上に衝くものを治すが、すでに上って上焦にいるものは治せない。〔…その激しい発作に至っては、手をこまねいて死ぬのを見るだけであろう。〕傷寒論に『穀物を食べて吐きそうになる者は陽明に属する。呉茱萸湯が主治する。湯を飲んでかえってひどくなる者は上焦に属する』とある。陽明は胃家であり、胃家は中焦である。湯を飲んでかえってひどくなる者を上焦に属するとしているのは明らかである。それでは上焦に属するものにはどの方を処すればよいか。ただ風引湯があるのみである。実際に用いて効果があるのだから、どうして疑うことがあろうか」。" },
    { head: "風引湯の適応と、危篤を免れた後", koma: "217L–218R",
      kaki: "此の方、大人の風引、少小の驚癇、及び脚氣衝心を治するのみならず、諸般暴卒急劇の病、上焦に逼り、心肺を下（?）して胸滿短氣、乾嘔喘息、肩膊強急、頭脹怒脹して死せんと欲するもの、何の病名を問はず之を投じて暴卒を挫き、急を緩め、危篤を挽回す。其の功の速やかなること、湯を雪に沃ぐが如し。是れ醫家常に制して救急に備へずんばあるべからざる所以なり。然りといへども、此れは唯だ危篤を挽回するのみ。既に危篤を免るることを得ば、續いて後治の方を考處せずんばあるべからず。但だ一を知りて二を知らずんば、偶たま奇方を得といへども、僅かに一旦の功を得るのみ。何を以てか十全の上工を庶幾することを得んや。初學の士、豈に勉めざるべけんや。",
      yaku: "この方は大人の風引、小児の驚癇、脚気衝心を治すだけでなく、さまざまな急激な病が上焦に迫り、心肺を（圧し）て、胸が張り息が短く、からえずき、喘ぎ、肩がこわばり、頭が張りふくれて死にそうなものに、病名を問わずこれを投じれば、急激な勢いをくじき、急迫をゆるめ、危篤を挽回する。その効果の速さは、湯を雪に注ぐようである。これが医家が常に調製して救急に備えておかなければならないわけである。しかし、これはただ危篤を挽回するだけである。危篤を免れたら、続いて後の治療の方を考えて処方しなければならない。一を知って二を知らなければ、たまたま奇方を得ても、わずかに一時の効を得るだけである。どうして十全の名医をめざすことができようか。初学の者は努めなければならない。" },
    { head: "製法の注意", koma: "218R",
      kaki: "○此の方石藥多品、時に臨みて作りがたし。預め製して收め貯ふべし。但だ其の中、氣味脱し易きものは、時に臨みて之を合することをよしとす。寒水石は鹽滷汁の底に凝り成るもの、方解石に非ず。赤石脂は華舶の物眞に非ず。本邦羽州秋田の産、眞赤石脂と呼ぶもの良し。餘藥も亦精品を擇び用ふべし。",
      yaku: "○この方は鉱物薬が多く、急に作るのは難しい。あらかじめ調製して蓄えておくべきである。ただしその中で香味の抜けやすいものは、その時になって合わせるのがよい。寒水石は塩のにがり汁の底に凝り固まってできるもので、方解石ではない。赤石脂は中国船の舶来品は本物ではない。わが国の出羽秋田産の「真赤石脂」と呼ぶものがよい。ほかの薬も良品を選んで用いよ。" },
    { head: "風引湯の腹証", koma: "219R",
      kaki: "右圖の如く胸一ぱいにはりみち、動氣奔馬の如く上りて心を衝き、肩息短氣、乾嘔、若しくは喘急、劇しきものは直視上竄、瘈瘲搐搦、水飲咽に下らざるもの、何の病因を論ぜず、一切に以て風引湯の證とす。餘は前に詳らかなり。或いは疑ふ、此の方許多の石藥、既に熱を除くの方といふ。何を以てか寒熱虚實を問はざると。答へて曰く、諸病寒熱の因を問はず、上りて心肺に逼るものは、必ず熱煩を發す。彼の厥陰の心中疼熱、少陰の乾嘔煩、皆上部に逼るによるものを見るべし。況んや其の他をや。其の熱を除くを主とするもの、寒を退くるの意少なきもの、是れが爲なり。既に以て急を救ふことを得ば、其の寒熱虚實豈に審辨せざることを得んや。是れ志を同じくするものと論ずべくして、道を異にするものと語るべからず。",
      yaku: "右の図のように、胸いっぱいに張り満ち、動気が奔馬のように上って心を衝き、肩で息をし、息が短く、からえずきし、あるいは激しく喘ぎ、ひどい者は目がすわって上転し、手足がひきつりけいれんし、水も咽を通らないものは、どんな病因であっても、すべて風引湯の証とする。そのほかは前に詳しく述べた。ある人が疑って言う。「この方には多くの鉱物薬が入っており、熱を除く方だという。それなのになぜ寒熱虚実を問わないのか」。答えて言う。「どんな病でも寒熱の原因を問わず、上って心肺に迫るものは必ず熱ともだえを起こす。厥陰の『胸の中が痛み熱い』、少陰の『からえずきしてもだえる』が、みな上部に迫ることによるのを見よ。ましてその他の病はなおさらである。熱を除くことを主として寒を退ける意味が少ないのはこのためである。急を救うことができたなら、その寒熱虚実をよく見きわめないわけにはいかない。これは（治法の）志を同じくするものとして論ずべきで、道を異にするものと言ってはならない」。" },
    { head: "附：紫石寒食散の説", koma: "219L",

      yaku: "紫石寒食散の方の下に「傷寒を治し、治って再発させない」とある。これはその証を詳しく述べておらず、脱文があるようである。私が考えるに、この方も多くの鉱物薬と上部の病を治すものを組み合わせており、附子・禹余糧の二味は下焦に達するとはいえ、おおむね風引湯の方意に似て、急病を救う方のようである。また金匱要略の雑療篇に載っていて、篇章の順序は問えないようであるが、その前に備急丸（心腹のさまざまな急病を主治する方）を置き、その後に急死を救う諸方を続けているのを見ると、意味がないわけではない。おそらく脱文があるのであろう。岡埜氏は「この方を婦人の子癇・子煩（妊娠中のけいれん・もだえ）に用いる」と言い、また「この方と風引湯をともに丸剤にして用い、小児の五疳を治すことができる」と言う。ここに書き留めて、後日の試験を待つという。" }

  koma: [220, 222], komaNote: "220R–222R（図 220R）",
  fig: { src: "img/fig_220R.jpg", koma: "220R", label: "桂枝加龍骨牡蛎湯證図",

      yaku: "部位は表位で、臍の上下をうかがう。\n動気。\n小腹弦急（下腹が弓の弦のように張る）。\n失精、脈は芤、下腹が弦のように張り、（気が上って）めまいがする。（桂枝湯に）加味するのがよい。" },
    { head: "桂枝加竜骨牡蛎湯の腹証と条文", koma: "220L",
      kaki: "圖の如く臍上中脘の邊に動氣つよく、小腹に弓弦を張りたるが如く引きはるものあり。常に衝逆目眩の患ひありて、上實下虚、上熱下寒、脈虚芤なるもの、桂枝加龍骨牡蛎湯の證なり。證に曰く、夫れ失精家は、小腹弦急、陰頭寒え、目眩、髮落つ。脈極めて虚芤遲なるは、清穀・亡血・失精と爲す。脈諸もろの芤動微緊を得るは、男子は失精、女子は夢交す。桂枝加龍骨牡蛎湯之を主ると。失精は夢に交はりて精を失ふなり。男女を別つは互文にして、其の實は一なり。小腹弦急は、つよくすぢばること弓弦の如きをいふ。其の證小腹にあるものは、下虚の候にして、氣血の不和なり。失精あるも是によるなり。陰頭寒、目眩、髮落は、共に皆衝逆の候にして、下降の氣すくなく、陽氣下部に旺ぜざればなり。髮落つるもの、皆上實にして、瘀血頭部にあつまるによるなり。",
      yaku: "図のように、臍の上の中脘のあたりに動気が強く、下腹に弓の弦を張ったように引き張るものがある。常に気の突き上げとめまいに悩み、上が実して下が虚し、上が熱く下が冷え、脈が虚で芤のものは桂枝加竜骨牡蛎湯の証である。金匱要略に「そもそも失精家（精を漏らしやすい者）は、下腹が弦のように張り、陰茎の先が冷え、めまいがし、髪が抜ける。脈がきわめて虚・芤・遅であるのは、清穀（不消化便の下痢）・亡血・失精である。脈に芤・動・微緊を得るのは、男子は失精、女子は夢交である。桂枝加竜骨牡蛎湯が主治する」とある。失精とは夢で交わって精を漏らすことである。男女を分けて言うのは互文で、実は同じことである。小腹弦急とは、強く筋張ることが弓の弦のようであることをいう。その証が下腹にあるのは下虚の兆候で、気血の不和である。失精があるのもこれによる。陰頭寒・目眩・髪落はどれも気の上逆の兆候で、下へ降りる気が少なく、陽気が下部で盛んでないからである。髪が抜けるのは、みな上が実して瘀血が頭部に集まることによる。" },
    { head: "脈の解", koma: "220L–221R",
      kaki: "脈極虚芤遲爲清穀亡血失精の十二字は、脈例をいふ錯簡の文なり。言ふこころは、凡そ脈に虚芤遲の三証を極めてあらはすは、下利清穀か、亡血か、失精か、此の三病の中の脈証の例なりとなり。虚は場所ありて物なきの義にて、浮大にして根のなき脈をいふ。芤は中の空なる脈をいふ。遲はおそき脈。三脈ともに氣血の虚に屬し、陽氣の衰へたる脈証なり。脈得以下を、此の方の脈證に取るなり。言ふこころは、以上の脈例に就きて診るときは、其の三脈の中にて、之を芤動に微緊なるが兼ね得れば、失精夢交の脈とするなり。動は闕上にありて上下に首尾なき脈といへり。蓋し臍上の築々動ずるものの應なるべし。此の方虚寒の意なし。微緊にして遲ならざるゆゑんなり。",
      yaku: "「脈がきわめて虚・芤・遅であるのは清穀・亡血・失精」の12字は、脈の一般例を言った錯簡の文である。その意味は、およそ脈に虚・芤・遅の三つがはっきり現れるのは、下痢清穀か、亡血か、失精か、この三つの病の脈の例だということである。虚とは場所があって物がないという意味で、浮大で根のない脈をいう。芤とは中が空の脈をいう。遅は遅い脈である。三脈ともに気血の虚に属し、陽気の衰えた脈である。「脈得」以下をこの方の脈証とする。その意味は、以上の脈例について診て、三脈の中に芤・動に微緊を兼ねて得れば、失精・夢交の脈とするということである。動とは関上にあって上下に頭も尾もない脈だという。おそらく臍の上のどきどき打つ動気の現れであろう。この方には虚寒の意味はない。微緊で遅でないのはそのためである。" },

      yaku: "天雄散もまた失精家を主治する。桂枝加竜骨牡蛎湯との違いは、天雄散にも桂枝・竜骨はあるが、朮・天雄が主となって下焦に達し、寒を温め水を通じさせる意味があることである。腹証もそれに従い、腰や腹が冷え、小便が近く、臍の上の動が強く、気が上逆し、脈が芤動で遅であり、失精・夢交のあるものをこの方の証として区別すべきである。吉益家で竜骨と牡蛎を分けて臍上・臍下の動をそれぞれ主治するというのは、私は知らない。考えるに、この方はさまざまな虚・内傷、頑固な冷え、遺尿、小児の慢驚風・慢脾風などに考えて用いよ。ある人は疽を治すと言う。" }

    { head: "烏頭桂枝湯の腹証と条文", koma: "223R",
      kaki: "圖の如く臍下に大筋をあらはし、弓弦を張るがごとく、其の筋睾丸、或いは股際へ引き、或いは上腹へも引きつり、腹痛すること、たとへば絞りきらるるが如くなり。或いは臍を遶りて塊を成すもあり。是れ所謂寒疝なるものに、氣血の不和を兼ぬるものにして、烏頭桂枝湯の證なり。證に曰く、寒疝、腹中痛み、逆冷、手足不仁、若しくは身疼痛し、灸刺諸藥治すること能はざるは、抵當烏頭桂枝湯之を主ると。寒疝は下焦の寒毒凝結するの名なり。逆冷は、厥冷といはざるは、此の証の冷ゆるところ手足に止まらざるゆゑ、腹中を兼ねて言ふなり。不仁は痛痒を知らざるなり。身疼痛は氣血の不和によるなり。抵はあたると訓ず。物にうちつけあたるなり。此の方は瞑眩劑にして、病毒の凝結するものにうちつけあたるゆゑ、抵當といふなり。故に刺灸諸藥治すること能はずといふて、驚劇の病狀を示したるものなり。",
      yaku: "図のように臍の下に太い筋が現れ、弓の弦を張ったようで、その筋が睾丸や股の付け根へ引き、あるいは上腹へも引きつり、腹痛はまるでしぼり切られるようである。あるいは臍を巡って塊をつくるものもある。これはいわゆる寒疝に気血の不和を兼ねたもので、烏頭桂枝湯の証である。金匱要略に「寒疝で、腹の中が痛み、冷えあがり、手足の感覚がなく、あるいは体が痛み、灸・鍼・諸薬で治せないものは、抵当烏頭桂枝湯が主治する」とある。寒疝とは下焦の寒毒が凝結したものの名である。逆冷について厥冷と言わないのは、この証の冷えが手足にとどまらないので、腹の中も含めて言うのである。不仁とは痛みもかゆみも感じないことである。身疼痛は気血の不和による。抵は「あたる」と読み、物に打ちつけて当たることである。この方は瞑眩剤で、病毒の凝結したものに打ちつけて当たるので抵当という。だから「灸・鍼・諸薬で治せない」と言って、激しい病状を示したのである。" },
    { head: "桂枝湯を合わせる意", koma: "223L",
      kaki: "按ずるに、此の方は烏頭煎と桂枝湯とを合方したるものなり。合方する所以は身疼痛にあり。身疼痛は肌表のことにして、氣血の不和によるなり。論に曰く、身疼痛する者は、急に當に表を救ふべし、表を救ふには桂枝湯に宜しと是れなり。而して其の烏頭煎の證は、更に下章の證と併せ考へて、其の意を審らかにすべし。",
      yaku: "考えるに、この方は烏頭煎と桂枝湯を合方したものである。合方するわけは身疼痛にある。身疼痛は肌表のことで、気血の不和による。傷寒論に「体が痛む者は急いで表を救うべきで、表を救うには桂枝湯がよい」とあるのがこれである。そして烏頭煎の証は、さらに次の章の証とあわせて考え、その意味をよく理解すべきである。" },
    { head: "大烏頭煎：寒疝の脈証", koma: "223L–224R",
      kaki: "證に曰く、腹痛、脈弦にして緊、弦なれば則ち衛氣行かず、即ち惡寒す、緊なれば則ち食を欲せず、邪正相搏ちて、即ち寒疝と爲る。寒疝臍を遶りて痛み、若し發すれば則ち白汗出で、手足厥逆し、其の脈沈弦なる者は、大烏頭煎之を主ると。弦はつよく引きはるなり。緊はよりのかかりくるなり。衛氣は表をまもる氣なり。弦脈は衛氣行かざるところへ寒邪の犯したる候ゆゑ、即ち惡寒すといふなり。緊脈は内にありて、寒邪胃陽を犯して穀食を停滯せしむるところの候なる故、食を欲せずといふなり。凾に曰く、脉緊にして轉索の如く常無き者は宿食あるなりと。又曰く、脉緊云云、腹中に宿食ありて化せざるなりと是れなり。此の脈弦にして緊なるは、寒邪外にして衛氣を犯し、内にして胃陽を干して、正氣と相搏つの候なり。邪正相搏ちて戰爭の勢ひあるゆゑ、腹痛も劇しきなり。之を名づけて寒疝といふ。正氣と並び立ちならぶところの邪にして、眞の虚寒に非ざるを見るべし。然れども寒は下焦より干すものゆゑ、其の毒臍をとりまきて凝結し、或いは小腹に弦急をあらはして、其の毒より痛みを發するなり。痛み發すれば自汗出で、手足逆冷して、弦緊の脈沈伏するに至る。是の故に寒を退け水を逐ふところの烏頭を煎じ、更に蜜を和して、其の急迫の毒を治するなり。",
      yaku: "金匱要略に「腹痛して、脈が弦で緊。弦なら衛気がめぐらず悪寒し、緊なら食欲がない。邪と正が打ち合って寒疝となる。寒疝で臍を巡って痛み、発作が起こると冷汗が出て手足が冷えあがり、脈が沈弦の者は大烏頭煎が主治する」とある。弦とは強く引き張ること、緊とはよりがかかってくることである。衛気とは表を守る気である。弦脈は、衛気がめぐらない所へ寒邪が犯した兆候なので「悪寒する」という。緊脈は、内で寒邪が胃の陽気を犯して食べ物を停滞させる兆候なので「食欲がない」という。（傷寒論の）書に「脈が緊で縄をよるように定まらないものは宿食がある」とあり、また「脈が緊…腹の中に宿食があって消化しない」とあるのがこれである。この脈が弦で緊なのは、寒邪が外では衛気を犯し、内では胃の陽気を侵して、正気と打ち合う兆候である。邪と正が打ち合って戦いの勢いがあるので腹痛も激しい。これを寒疝と名づける。正気と並び立つ邪であって、本当の虚寒ではないことを見るべきである。しかし寒は下焦から侵すものなので、その毒が臍を取り巻いて凝結し、あるいは下腹に弦のような張りを現し、その毒から痛みを起こすのである。痛みが起これば汗が出て手足が冷えあがり、弦緊の脈が沈み伏すに至る。それで寒を退け水を追う烏頭を煎じ、さらに蜜を和して、その急迫の毒を治すのである。" },
    { head: "烏頭湯：賊風と歴節", koma: "224R–225R",
      kaki: "右一章烏頭煎の證を辨じて、詳らかに寒疝の脈證を説くもの、前の烏頭桂枝湯の證と併せ讀みて其の意を得べし。又烏頭湯なるものあり。亦烏頭煎を以て本方として、更に麻黄・芍藥・黄耆・甘草を加ふ。其の證の別、下文に詳らかなり。\n證に曰く、寒疝、腹中絞痛し、賊風入りて五臓を攻め、拘急して轉側することを得ず、發作時あり、人をして陰縮せしめ、手足厥逆するを治すと。此の章は外臺の文なり。絞はしぼりきるやうにいたむなり。此の絞痛の二字、烏頭煎を用ふる腹痛の狀を善く形容せり。前の二章と同意を思ふべし。此の証は、寒疝の持病ある上に賊風が入りて五臓を攻むるゆゑ、身體拘急して轉側を得ざるなり。此の賊風の入りたるを以て、麻黄等の四味を合したるなり。發作時ありは腹痛のことなり。陰嚢縮むは、寒疝の毒にしめつけらるるなり。\n又曰く、身體羸痩し、獨り足腫大し、黄汗出で、脛冷え、假令ひ發熱するも、便ち歷節と爲すなり。歷節を病みて屈伸すべからず、疼痛するは、烏頭湯之を主る。烏頭湯の方、脚氣疼痛して屈伸すべからざるを治すと。此の章は金匱の古文なり。但し治脚氣以下の九字は後人の補添なるべし。身躰羸痩は表虚の候なり。獨足腫大は水血の凝滯なり。蓋し足膝腫るるなるべし。屈伸すべからざるにて知るべし。黄汗出、脛冷は、表虚と下焦の寒とによるなり。以上の諸證を具ふるものは、假令ひ發熱すとも、其の發熱にかかはらず、其のまま歷節とするなり。歷はへると訓ず。一々にへてとほること。節々にあたりて痛むゆゑ歷節と名づくるなり。…此の証寒疝の致すところに非ずといへども、表虚して水血凝滯し、寒氣相搏ちて疼痛するもの、前証と一揆にして、正気を張り、邪氣を散じ、血脈を和し、寒氣と瘀水とを逐ふの意なることを知るべし。脚氣疼痛も亦是の意を以て考ふべし。凡て古方は病名に拘らず、証に隨ひて治するもの、此等に於いてもみつべきなり。",
      yaku: "以上の一章は烏頭煎の証を述べて寒疝の脈証を詳しく説いたもので、前の烏頭桂枝湯の証とあわせて読んでその意味を理解すべきである。また烏頭湯というものがある。これも烏頭煎を本方として、さらに麻黄・芍薬・黄耆・甘草を加える。その証の違いは次の文に詳しい。\n「寒疝で、腹の中がしぼるように痛み、賊風が入って五臓を攻め、引きつって寝返りが打てず、発作が時々あり、陰部が縮み、手足が冷えあがるものを治す」。この章は外台秘要の文である。絞とはしぼり切るように痛むことである。この「絞痛」の二字は烏頭煎を用いる腹痛の様子をよく形容している。前の二章と同じ意味であることを考えよ。この証は、寒疝の持病があるうえに賊風が入って五臓を攻めるので、体が引きつって寝返りが打てないのである。賊風が入っているので、麻黄など四味を合わせたのである。「発作が時々ある」とは腹痛のことである。陰嚢が縮むのは寒疝の毒に締めつけられるのである。\nまた「体がやせ衰え、足だけが腫れて大きく、黄色い汗が出て、すねが冷える。たとえ発熱しても歴節とする。歴節を病んで屈伸できず痛むものは烏頭湯が主治する。烏頭湯は脚気で痛んで屈伸できないものを治す」とある。この章は金匱要略の古文である。ただし「治脚気」以下の9字は後人の書き足しであろう。体がやせ衰えるのは表虚の兆候である。足だけが腫れて大きいのは水と血の凝滞である。おそらく足や膝が腫れるのであろう。屈伸できないことからわかる。黄色い汗が出てすねが冷えるのは、表虚と下焦の寒による。以上の諸証を備えるものは、たとえ発熱しても、その発熱にかかわらずそのまま歴節とする。歴は「へる」と読み、一つ一つ経て通ることで、関節ごとに当たって痛むので歴節と名づける。…この証は寒疝によるものではないが、表が虚して水と血が凝滞し、寒気と打ち合って痛むもので、前の証と同じ筋道であり、正気を張り、邪気を散らし、血脈を和し、寒気と瘀水を追い出す意味であると知るべきである。脚気の痛みもこの意味で考えよ。すべて古方は病名にこだわらず証に従って治すものであることが、ここでも見てとれる。" },
    { head: "三方の意と、瞑眩の心得", koma: "225R–226R",
      kaki: "以上三方、皆烏頭煎を以て本方として、更に外證に隨ひて加味するところ、各其の意趣を異にす。之を要するに、桂枝湯は表を救ひ榮衛を諧ふるを以て力を合はせ、麻黄・黄耆・芍藥・甘草は邪風を祛り、瘀水を逐ひ、筋脈を和し、正氣を宣べんが爲に隊伍を爲すもの。烏頭煎獨り之が先鋒となりて、凝寒を散じ、結水を解く。其の勢ひの猛なること、尋常の材に非ず。是の故に其の之を服するもの、量少なしといへども、惡寒、身痺れ、口舌椒を噉むが如く、温々として吐せんと欲し、起きれば則ち頭眩す。多く服するときは身躰冷え、自汗流れ、吐瀉嘔逆、脈沈伏し、甚しき者は死狀の如し。輕きは一二時、重きは半日許りにして乃ち解すべし。故に方下に曰く、知る者は醉狀の如し、吐を得る者は病に中ると爲すと。是れ實に瞑眩の劑なり。慎まずんばあるべからず。若し夫れ瞑眩するや、駭きて妄りに他藥を與ふることなかれ。遽てて火を以て之を煖むること勿れ。靜かにして醒むるをまつべし。醒めて後吐を得るものあり。瞑眩に方りて吐瀉併せ至るものあり。但だ醒めて後渇して飲を欲せば、冷水を與へて將息すべし。若し誤りて烏頭・附子の毒に中るものは、味噌汁を服し、或いは黒豆甘草湯を服し、或いは乾姜甘草湯を服すべし。是れ亦知らずんばあるべからず。或いは曰く、若し其の緩なることを欲せば川烏頭を用ふべしと。然れども其の劇しきに於いては、草烏頭に非ずんば功を取るべからず。但し其の分量及び蜜水の煎法、差錯することなかれ。之を慎め、之を慎め。○以上の三方、疝家偏墜の證に施すべし。或いは云ふ、小腸偏墜、證に隨ひて烏藥五戔・天門冬三戔を加ふ、經驗と。案ずるに、吳球の活人心統の方なり。",
      yaku: "以上の三方はみな烏頭煎を本方とし、さらに外証に従って加味したもので、それぞれ趣旨が異なる。要するに、桂枝湯は表を救い営衛を整えることで力を合わせ、麻黄・黄耆・芍薬・甘草は邪風を払い、瘀水を追い、筋脈を和し、正気をのべ広げるために隊列を組むもので、烏頭煎がひとりその先鋒となって凝り固まった寒を散らし、結ぼれた水を解く。その勢いの猛烈さは尋常の薬ではない。だから服用すると、量が少なくても、悪寒し、体がしびれ、口や舌は山椒をかんだようで、むかむかと吐きそうになり、起き上がるとめまいがする。多く飲むと体が冷え、汗が流れ、嘔吐・下痢し、脈が沈み伏し、ひどい者は死んだようになる。軽いものは一二時（2〜4時間）、重いものは半日ほどで治まるはずである。だから方の下に「効いた者は酔ったようになり、吐いた者は病に的中したのである」とある。これはまさに瞑眩の剤である。慎重にしなければならない。瞑眩が起きても、驚いてむやみに他の薬を与えてはならない。あわてて火で温めてもいけない。静かにして醒めるのを待て。醒めた後に吐く者もあり、瞑眩と同時に嘔吐と下痢が起こる者もある。醒めた後に喉が渇いて水を欲しがれば、冷水を与えて養生させよ。もし誤って烏頭・附子の毒に当たった者は、味噌汁を飲ませるか、黒豆甘草湯か乾姜甘草湯を飲ませよ。これも知っておかなければならない。ある人は「穏やかにしたければ川烏頭を用いよ」と言う。しかし激しい病では、草烏頭でなければ効果は得られない。ただしその分量と蜂蜜・水での煎じ方を誤ってはならない。慎め、慎め。○以上の三方は、疝気の偏墜（陰嚢ヘルニア）の証に用いよ。ある人は「小腸偏墜には、証に従って烏薬5銭・天門冬3銭を加えて経験がある」と言う。考えるに、呉球の『活人心統』の方である。" }
  ],

    { head: "条文の解", koma: "227R",
      kaki: "論に曰く、太陽病、之を下して後、脈促、胸滿する者は、桂枝去芍藥湯之を主ると。胸中に事あるの証なり。太陽病、之を下し、表は解けて後、脉の來ること數にして、時に一止することを促と云ふ。案ずるに、脉促するものは、氣上衝して胸はるもの、邪と氣の實するには非ず。之を下して其の氣上衝するもの、胸中にせまりたるなり。而して其の上衝するもの、直ちに胸中に滿ちて、筋脉に攣急せず。其の之を治すること、正氣を發張し、衝逆をゆるくして、胸滿自ら去るべし。是を以て芍藥を去り、桂枝の力を專らにす。之を用ふるの意なり。是の故に其の胸滿するもの、實は邪の致すところにあらざるを以て、但心下より下にはらぎからなく（腹に力なく）、すぢばるものなくして、胸さきより上へ一ぱいになりて、上下のつり合ひあしくおぼゆるなり。此の上下のつりあひあしく覺ゆるが、去芍藥湯の胸滿とすること、診察の肝要なり。",
      yaku: "傷寒論に「太陽病を下したのち、脈が促で胸が張り満ちる者は、桂枝去芍薬湯が主る」とある。胸中に事のある証である。太陽病を下して表が解けたのち、脈の来かたが速く、ときどき一拍止まるのを促という。考えるに、脈が促になるのは、気が上衝して胸が張るもので、邪と気が実しているのではない。下したためにその気が上衝し、胸中に迫ったのである。そしてその上衝したものは、まっすぐ胸中に満ちて、筋脈にひきつれを起こさない。これを治すには、正気を張り出させ、衝逆をゆるめれば、胸満はおのずから去る。そのため芍薬を去って桂枝の力をもっぱらにする。これがこの方を用いる意味である。だからこの胸満は実は邪によるものではないので、ただ心窩部から下の腹に力がなく、筋ばるものもなくて、胸先から上がいっぱいになり、上下のつり合いが悪く感じられるのである。この「上下のつり合いが悪い」感じを去芍薬湯の胸満とすることが、診察の要点である。" },
    { head: "問答：桂枝湯の気上衝との別", koma: "227R–228R",
      kaki: "或るひと問ひて曰く、太陽病、之を下して後、其の氣上衝する者は、桂枝湯を與ふべしと。此の證も亦其の由るところを同じくして、氣上衝を曰はずして胸滿をいふ。然るに吾子皆下して後氣衝逆して致すところといふときは、其の別なきに似たり。何如と。答へて曰く、其の氣上衝するもの劇しきときは、必ず其の衝くところの位を擧ぐ。曰く衝心、曰く衝胸、曰く衝咽喉。此に但上衝といふときは、其の衝くもの心胸に至らずして、尚腹にあり。是れ其の衝逆の劇しからずして、肌表の和せざるを見る。仍りて芍藥を去らずして氣血を和し、諧へて愈ゆべし。若し夫れ胸滿するものは、其の氣直ちに胸位に逼りて、鬱悶めいて散ぜざること、譬へば炊煙の升りて屋梁を遶るもの、上窓を開かざれば鬱悶して靄々たるが如し。故に其の衝くことを覺えずして、但其の滿を覺ゆ。然れども凡そ其の滿、裡證にあらず、表閉に非ず。但衝逆の氣の致すところなること、他の喘、若しくは心煩・嘔逆・脇痛等の證なく、却つて脈促して衝逆鬱悶の候あるを見つべし。其の治、猶上窓を開きて鬱煙を散ずるが如し。桂枝の芳氣一たび肌表に達して足る。何ぞ更に芍藥の筋脈を和することを煩はさんや。是れ其の二証の由ることを同じくして、其の治方の異なる所以なり。",
      yaku: "ある人が問うた。「『太陽病を下したのち、気が上衝する者には桂枝湯を与えよ』とある。この証も原因は同じで、気上衝と言わずに胸満と言っている。それなのにあなたがどちらも下したのちの気の衝逆によるというのなら、両者に区別がないように見える。どうか」。答える。気の上衝が激しいときは、必ずその衝く部位を挙げる。衝心・衝胸・衝咽喉という。ここで単に上衝というときは、衝くものが心胸に至らず、まだ腹にある。これは衝逆が激しくなく、肌表が和していないことを示す。だから芍薬を去らずに気血を和し、ととのえて治すのである。一方、胸満するものは、気がまっすぐ胸に迫って鬱々と散らないもので、たとえばかまどの煙が昇って梁のまわりをめぐり、上の窓を開けなければこもってもやもやするようなものである。だから衝き上げる感じはなく、ただ張り満ちる感じがある。しかしその満は裏証でもなく、表の閉塞でもない。ただ衝逆の気によるものであることは、喘・心煩・嘔逆・脇痛などの証がなく、かえって脈が促で衝逆・鬱悶の兆候があることから見てとれる。その治療は上の窓を開けてこもった煙を散らすようなものである。桂枝の芳香の気がひとたび肌表に達すれば足りる。どうしてさらに芍薬で筋脈を和する手間をかける必要があろう。これが二つの証の原因が同じで、治方が異なる理由である。" },
    { head: "応用：気逆の心痛", koma: "228R",
      kaki: "○此の方、必ずしも脈促を問はず。胸滿して腹中力なく覺え、胸中痛むものに用ひて効あり。因りて考ふるに、外臺に卒心痛を治するに、桂心八兩を以て、水四升、煮て一升半を取り、分ちて二服するの方あるを見る。是れ正に此の方を試效するの意と同じくして、並びに氣逆の心痛なり。是に於いて又桂枝枳實生姜湯の證と疑似することあり。",
      yaku: "○この方は必ずしも脈促を問わない。胸が張り満ちて腹中に力がないように感じ、胸中が痛むものに用いて効果がある。考えるに、『外台秘要』に急な心痛を治す方として、桂心8両を水4升で煮て1升半とし、2回に分けて服する方がある。これはまさにこの方を試して効いた意味と同じで、どちらも気逆による心痛である。ここでまた桂枝枳実生姜湯の証とまぎらわしいことがある。" },
    { head: "附 桂枝枳実生姜湯", koma: "228R–228L",
      kaki: "然れども彼は痞滿、心下痛、飲懸かりて下らざるの意あり。故に枳實之が主となり、生姜・桂枝相伍し、以て懸心を解き、痞を破り、逆を下して、痛み乃ち去る。是を以て胸中痞滿して、腹中は特に力なきを覺えず、却つて心下に攻め鬪ふの狀あるべし。嘗て驗す、一男子、脇内痛みて忍ぶべからず。休作時あり。愈えざること數年（?）。停滯あるものとし、擬するに備急丸を以てして、痛み益甚し。之を診するに胸中痞滿、衝逆の狀あり。桂枝枳實生姜湯を與へて一服、痛み失するがごとし。\n證に曰く、心中痞、諸逆、心懸痛するは、桂枝枳實生姜湯之を主ると。心下に痞せずして心中に痞す。此の病、胃口に逼らず。但心に懸かりて痛むものなり。其の心に懸かるものは水飲なり。其の逆するものは氣なり。故に枳實以て痞をやぶり、桂枝以て逆を下だし、生姜以て飲をとく。宜なるかな、下剤の應ぜざること。",
      yaku: "しかし桂枝枳実生姜湯には、つかえて張り、心窩部が痛み、水飲が懸かって下らないという意味がある。だから枳実が主となり、生姜・桂枝と組んで、心に懸かったものを解き、つかえを破り、逆を下して、痛みが去るのである。そのため胸中がつかえて張り、腹中にはとくに力のなさを感じず、かえって心窩部で攻め合うような様子がある。かつて試した例：ある男性が脇の内側が痛んで耐えられず、痛みには起伏があり、数年（?）治らなかった。停滞があるとして備急丸を与えたところ、痛みはますますひどくなった。診ると胸中がつかえて張り、衝逆の様子があった。桂枝枳実生姜湯を与えると一服で痛みが消えたようになった。\n金匱要略に「心中が痞え、諸々の逆があり、心に懸かって痛むのは、桂枝枳実生姜湯が主る」とある。心窩部でなく心中に痞える。この病は胃の入口に迫らず、ただ心に懸かって痛むものである。心に懸かるのは水飲であり、逆するのは気である。だから枳実でつかえを破り、桂枝で逆を下し、生姜で水飲を解く。下剤が効かなかったのはもっともである。" },
    { head: "附 桂枝去芍薬加皂莢湯", koma: "229R",
      kaki: "一　若しくは桂枝去芍藥湯の腹狀のごとく、胸滿・腹中力なきを覺えて、濁唾涎沫を吐するもの、桂枝去芍藥加皂莢湯の證なり。\n證に曰く、肺痿、涎沫を吐するを治すと。此れ千金の文なり。故に其の証を擧ぐること詳らかならず。肺痿に涎沫を吐するもの、此の証に止まらず。傍例を考ふるに、皂莢丸の証に曰く、欬逆上氣、時々濁を唾し、但坐して眠るを得ずと。是れ皂莢の主治するところなり。然れば則ち此の方も胸滿して濁を唾し、涎沫を吐し、若しくは欬逆上氣等の証あるものと知るべし。因りて小兒の滞頤、涎沫を流し、咽喉糜爛するものにも効あり。若しくは大人の痰核、若しくは濁唾粘痰を吐するもの、或いは癇風に考へ用ふべし。",
      yaku: "一　あるいは桂枝去芍薬湯の腹の状態のように、胸が張り満ちて腹中に力がないと感じ、濁った唾や泡状のよだれを吐くものは、桂枝去芍薬加皂莢湯の証である。\n「肺痿で涎沫を吐くものを治す」とある。これは『千金方』の文なので、証の挙げ方が詳しくない。肺痿で涎沫を吐くものはこの証に限らない。類例を考えると、皂莢丸の証に「咳き込んで気がのぼり、ときどき濁ったものを唾き、座ったままで横になって眠れない」とある。これが皂莢の主治である。そうであればこの方も、胸が張り満ちて濁ったものを唾き、涎沫を吐き、あるいは咳き込んで気がのぼるなどの証があるものと知るべきである。そこで小児のよだれかけが要るほどの流涎、よだれが流れて咽喉がただれるものにも効く。あるいは大人の痰核、濁った粘い痰を吐くもの、あるいは癇風に考えて用いよ。" },
    { head: "附 桂枝去芍薬加蜀漆竜骨牡蛎救逆湯", koma: "229R–230R",
      kaki: "一　若しくは桂枝去芍藥湯の腹狀にして、上中脘の邊、動氣つよくをどり、驚狂、起臥安からざるもの、桂枝去芍藥加蜀漆龍骨牡蠣救逆湯の證なり。此の方、火逆はいふに及ばず、瘧病の動氣あるものに用ひて効あり。或いは曰く、病痰胸中に聚まり、胸滿し、胸腹だくだくと跳るものを治すと。\n論に曰く、傷寒、脈浮、醫火を以て迫りて之を劫かし、亡陽し、必ず驚狂し、起臥安からざる者は、桂枝去芍藥加蜀漆龍骨牡蠣救逆湯之を主ると。劫はおびやかすと訓ず。おどして物を出さすことなり。凡そ表邪の軽き証、初めに湯藥を用ひず、焼鍼を肌にあてて、威して汗を出さすこと、當時の醫者の術にあり。此の病、名づくるに傷寒を以てす。固より軽き証に非ず。然るを醫、火を以て肌に迫り、劫かして汗を出して亡陽するなり。亡は其の處にもぬけなきをいふ。汗を出すと劫かすとにて、表にはるべき陽氣をもぬかしたるより、衝氣劇しくなりて、胸腹の動氣つよく、必ず驚惕のごとくなる証を發するなり。起臥安からずは、起きても臥しても居られぬなり。乃ち驚狂の狀を詳らかにする辭なり。此の証、亡陽して衝逆を致すもの、之を下して胸滿を致すがごとく、内外異なるがごとしといへども、其の帰趣は一なり。龍骨・牡蛎を加ふるの意は、動氣を鎮むるにあり。且つ其の蜀漆を加ふるゆゑんは、痰火を去り水を逐ふにあり。亦衝逆によりて痰氣胸に逼るものを逐ふものなり。",
      yaku: "一　あるいは桂枝去芍薬湯の腹の状態で、上脘・中脘のあたりの動気が強く躍り、驚いて狂ったようになり、起きても寝ても落ち着かないものは、桂枝去芍薬加蜀漆竜骨牡蛎救逆湯の証である。この方は火逆（火による治療の誤り）は言うまでもなく、瘧（マラリア様の熱病）で動気のあるものに用いて効く。ある人は「痰が胸中に集まって胸が張り、胸腹がどくどくと跳ねるものを治す」と言う。\n傷寒論に「傷寒で脈が浮のものに、医者が火で迫っておびやかし（汗を出させ）、亡陽して、必ず驚いて狂い、起きても寝ても落ち着かない者は、救逆湯が主る」とある。劫は「おびやかす」と読み、おどして物を出させることである。表邪の軽い証に、初めから湯薬を用いず、焼いた鍼を肌に当てて、おどして汗を出させるのが当時の医者の術であった。この病は傷寒と名づけるのだから、もとより軽い証ではない。それなのに医者が火で肌に迫り、おどして汗を出させたので亡陽したのである。亡とは、その場所がもぬけの殻になることをいう。発汗とおどしとで、表に張るはずの陽気まで抜けてしまったため、衝気が激しくなって胸腹の動気が強く、必ず驚きおびえるような証を起こす。「起臥不安」とは、起きても寝てもいられないことで、驚狂のさまを詳しく言う言葉である。この証は亡陽して衝逆を起こすもので、下して胸満を起こすのとは内外が異なるようでも、帰するところは一つである。竜骨・牡蛎を加える意図は動気を鎮めることにある。蜀漆を加えるわけは、痰火を去り水を逐うことにあり、衝逆によって痰気が胸に迫るものを逐うのである。" }

      yaku: "仲景の方には「胸満」を言うものが少なくなく、それぞれ意味が異なる。読む者はよく見分けなければならない。近ごろ古方によって腹診を言う者はいるが、おおむね粗略で、突きつめて精しく研究していない。そのため胸満を診てとると、すぐに柴胡の証とし、寒熱虚実も弁別せず、現れた証の主と客も察せず、表裏のつながりも詳しく見ない。それでどうして仲景を信じ、古方を守って腹証を診ているといえようか。とりわけ、柴胡の胸満は「胸脇苦満」の略で、「苦満」は心煩・喜嘔（しきりに吐き気がする）や脇痛などの証に対する言葉であることを知らないのである（詳しくは下冊の柴胡の条で論じる）。" },
    { head: "諸方の胸満", koma: "230L–231R",
      kaki: "麻黄湯及び呉茱萸湯の胸滿の如きは、客にして主に非ず。喘して胸滿、嘔して胸滿といふもの、並びに喘と嘔とを主として辭を措くの意を見るべし。茯苓飲の胸滿は、虚氣滿をいふと雖も、尚痰氣ありて存するものとし、半夏厚朴湯の胸滿は、亦痰と氣とを主として、咽中炙臠有るが如きを其の準的とす。人參湯・橘皮枳實生姜湯の胸滿の如きは、結氣痞滿、衝逆心痛の證を併せ致すこと、本文言々のごとし。凡そ此の諸方は、明らかに胸滿の證を擧ぐるものにして、風引湯の胸滿短氣、桂枝去芍藥湯の脈促胸滿、亦各趣を異にすること、前に詳らかにするが如し。其の他、明らかに胸滿を言ふものなしといへども、亦類に觸れ例に依りて之を言はば、言ふべきもの少なからず。或いは寒升りて胸滿し、熱結びて胸滿し、飲停まりて胸滿し、氣痞えて胸滿し、或いは先天の胎毒、或いは氣血両ながら衰へ、上實下虚、胸硬く腹弱きものの類は、明らかに胸滿を言はずといへども、其の診、尤も胸部に於いて審らかにせずんばあるべからず。",

      kaki: "余頃都下の名醫、古方を執るものの療する所を見るに、病人氣血衰虚、枯燥痩癯して胸腹滿するものに於いて、大柴胡に承氣丸を兼用し、下を取ること四五日、忽ち關格（?）を成して、飲食藥汁胃に入ること能はずして死す。此の證固より不治に屬すといへども、其の命期を促すもの、誰が咎ぞ。此れ妄りに古方を執るの過ちなり。豈歎息せざらんや。要するに結胸及び胸脇苦滿を除くの外、諸もろの胸滿するもの、氣逆によらざるもの少なし。氣逆の由りて發する所は、陽氣の衰ふるに在り。陽を助け氣を降すことを謀らずして、徒らに其の滿を消せんと欲せば、其の効を見ざるのみならず、殃を招かざるもの幾んど希なり。學者これを思へ。",
      yaku: "私は先ごろ、都の古方を奉じる名医の治療を見た。病人は気血が衰え、乾いてやせ細り、胸腹が張っていた。その病人に大柴胡湯に承気丸を兼用して4、5日下したところ、たちまち関格（?）となって飲食も薬も胃に入らなくなり、死んでしまった。この証はもとより不治に属するとはいえ、その死期を早めたのは誰の咎か。これはみだりに古方を振りかざした過ちである。嘆かずにいられようか。要するに、結胸と胸脇苦満を除けば、諸々の胸満で気逆によらないものは少ない。気逆が起こるもとは陽気の衰えにある。陽を助け気を降すことを考えずに、いたずらにその張りを消そうとすれば、効果がないばかりか、災いを招かないことはほとんどない。学ぶ者はこれをよく考えよ。" }

    { head: "条文の解", koma: "232L–233R",
      kaki: "論に曰く、發汗過多、其の人手を叉みて自ら心を冒ひ、心下悸し、按を得んと欲する者は、桂枝甘草湯之を主ると。叉は両手の指と指とをくみ合せたるなり。此の證は發汗をしすぐして津液を亡ひ、正氣肌表に張ること能はずして内にすぼみ、衝逆して急迫を致すものなり。其の衝逆するもの心胸にせまりて安からざる故、其の病人手をくみ合せて自ら心を冒ひておちつかせんとすれども、尚其の心下だくだくと悸して、更に他人の按を得んと欲す。是れ臍より上心胸まで一面にをどりておちつかざるの意を見るべし。是れ乃ち衝逆急迫の然らしむるところゆゑ、桂枝にて肌表を和し、甘草にて急迫を緩むれば、心腹の悸は自ら愈ゆるなり。一服して速やかに愈ゆるの証ゆゑ、方下に水三升を以て煮て一升を取り頓服すといふなり。凡そ古人の作劑煎法、病の輕重に從ひて、大小の劑、及び頓服・分服の法あり。其の分服の法を立つるものは、劑小なりといへども、速やかに愈ゆべからざるの意を示すものなり。此の方、劑大にして頓服するもの、病劇しといへども速やかに愈ゆるの意を示すものなりと知るべし。",

      kaki: "○若しくは桂枝甘草湯の證にして、其の衝逆急逼の狀劇しからずして、却つて胸腹間の動氣つよく跳りて煩躁するものは、桂枝甘草龍骨牡蛎湯の證なり。前の救逆湯に比するに、大同小異にして、此れ但痰を退け水を逐ふの意少なきを異とするのみ。\n論に曰く、火逆、之を下し、焼鍼に因りて煩躁する者は、桂枝甘草龍骨牡蛎湯之を主ると。案ずるに、此の証に三逆二因として見るべし。火逆一、之を下す一、焼針一、凡そ三逆なり。之を下すと焼針に因るとは、凡そ二因なり。煩躁の二字、上の二因を承く。分頭の句法とすべし。火逆は、例に曰く、脉浮は宜しく汗を以て解すべし。火を用ひて之を灸すれば、邪從つて出づる無く、火に因りて盛んに、病腰より以下必ず重くして痺す。名づけて火逆と曰ふなりと。是れなり。火逆は猶表を和して救ふべきを、反つて之を下して煩躁を發するなり。焼針も亦發汗の正法に非ず。因りて亦煩躁を發す。是れ二因並びに一の煩躁を致すもの、桂甘以て表を和し急を緩め、龍骨・牡蛎にて驚惕の動氣を鎮めて、煩躁自ら治するの意なり。\n按ずるに、此の方及び救逆湯・桂枝加龍骨牡蛎湯の三方、湯火傷・灸逆に、證に隨ひて用ふべし。又諸もろの驚惕を治す。",
      yaku: "○あるいは桂枝甘草湯の証で、衝逆急迫のさまは激しくなく、かえって胸腹の間の動気が強く跳ねて煩躁する（もだえ苦しむ）ものは、桂枝甘草竜骨牡蛎湯の証である。前の救逆湯と比べると大同小異で、こちらは痰を退け水を逐う意味が少ない点が異なるだけである。\n傷寒論に「火逆で、これを下し、焼鍼によって煩躁する者は、桂枝甘草竜骨牡蛎湯が主る」とある。考えるに、この証は三つの誤治と二つの原因として見るべきである。火逆が一、下したことが一、焼鍼が一で、計三つの誤治。下したことと焼鍼によることが二つの原因である。「煩躁」の二字は上の二つの原因を受ける。分けて頭に置く句法とみるべきである。火逆とは、傷寒論の例に「脈が浮なら汗で解すべきである。火で灸をすると、邪は出ていく所がなく、火によって盛んになり、病は腰から下が必ず重くしびれる。これを火逆という」とあるものである。火逆はなお表を和して救うべきなのに、反対に下したので煩躁を起こしたのである。焼鍼もまた正しい発汗法ではないので、やはり煩躁を起こす。二つの原因がともに一つの煩躁を起こすので、桂枝・甘草で表を和し急迫をゆるめ、竜骨・牡蛎で驚きおびえる動気を鎮めれば、煩躁はおのずから治るという意味である。\n考えるに、この方と救逆湯・桂枝加竜骨牡蛎湯の三方は、やけど・灸による障害に、証に従って用いよ。また諸々の驚きおびえを治す。" }

      kaki: "右圖の如く腹臍上の動氣つよく、息せかせかとして心下くるしく、之を按ずれば腹皮軟にして力なく、外證、骨節疼み、掣痛して屈伸すべからず。手を近づくれば痛み劇しく、衣被のさはるをも懼れ、汗出で、小便利せず、惡風若しくは惡寒、身微腫するを、甘草附子湯の腹狀・外證具はるものとす。",
      yaku: "右の図のように臍の上の動気が強く、息がせかせかして心窩部が苦しく、按じると腹の皮が軟らかく力がない。外証としては、関節が痛み、引きつるように痛んで曲げ伸ばしができない。手を近づけると痛みがひどくなり、衣服や夜具が触れるのさえ恐れ、汗が出て、小便の出が悪く、風を嫌うかあるいは寒けがし、体がわずかにむくむ。これを甘草附子湯の腹の状態と外証がそろったものとする。" },
    { head: "条文の解", koma: "234L–235R",
      kaki: "證に曰く、風濕相搏ち、骨節疼煩し、掣痛して屈伸するを得ず、之に近づけば則ち痛み劇しく、汗出でて短氣し、小便不利、惡風して衣を去るを欲せず、或いは身微腫する者は、甘草附子湯之を主ると。濕はしめるなり。水と曰はずして湿といふものは、水のごとく腫れても、之を按ずるに其のあと凹まず。但皮肉のしまりなくぐさぐさとするもの、肥人の肌膚を濕すがごとくなるを以て、濕となづく。俗に呼んでわるぶとりといふの類、皆濕証とすべきなり。是れ亦正氣のはりよわきを以て、水氣之に乗ずるものゆゑ、後世氣虚の候とするなり。さて風湿相搏つといふは、其の人素湿氣あるところへ、風邪を感冒して、風邪と湿氣と相たたかふを以て名づくるなり。骨節疼煩は、ふしぶしうづきいたみて、いきれもやつくなり。掣痛はひくなり。後より引きとどむるごとく痛むなり。びつくりとするいたみをいふ。不得屈伸の句、骨節疼と應ず。之に近づくは、手を疼む処に近づくるなり。汗出づるは、風邪相搏てばなり。短氣は呼吸みぢかし。急迫するなり。小便不利は、氣衝逆して下降せざるによる。惡風は尋常より甚しきを示さんが為に、衣を去るを欲せずの一句を補添したるなり。微腫は、何となくはれたるやうなるをいふ。乃ち濕氣の候なり。いづれも風邪湿氣相搏つの証なり。此の証、汗出で短氣、表証にして衝逆急迫するを以て、桂枝・甘草あり。惡風・骨節疼煩・小便不利等の証あるゆゑ、朮・附を相伍す。而して附子の分量多きものは、外証劇しく、内寒あるを以てなり。凡そ内寒あるものは、右の小腹結聚し、腹皮軟弱なるものなり。",
      yaku: "金匱要略・傷寒論に「風と湿が打ち合い、関節がうずき痛み、引きつるように痛んで曲げ伸ばしができず、近づくと痛みがひどくなり、汗が出て息が短く、小便の出が悪く、風を嫌って衣服を脱ぎたがらず、あるいは体がわずかにむくむ者は、甘草附子湯が主る」とある。湿とは湿ることである。水と言わずに湿と言うのは、水のようにむくんでも、按じたあとがへこまないからである。ただ皮肉にしまりがなくぐさぐさしていて、太った人の肌を湿らせたような感じなので湿と名づける。俗に「悪太り」と呼ぶ類は、みな湿証とみるべきである。これも正気の張りが弱いために水気がそこに乗じたものなので、後世は気虚の兆候とする。さて「風湿相搏つ」とは、もともと湿気のある人が風邪にかかり、風邪と湿気が戦うことから名づけたのである。「骨節疼煩」とは、節々がうずき痛み、熱っぽくもやもやすることである。「掣痛」とは引くことで、後ろから引きとめられるように痛むこと、びくっとする痛みをいう。「屈伸を得ず」の句は「骨節疼」に対応する。「之に近づく」とは、手を痛むところに近づけることである。汗が出るのは風邪と打ち合うからである。「短気」は呼吸が短いことで、急迫しているのである。小便不利は、気が衝逆して下降しないことによる。悪風が普通よりひどいことを示すために「衣を去るを欲せず」の一句を補い添えたのである。「微腫」とは何となく腫れたようなことをいい、湿気の兆候である。いずれも風邪と湿気が打ち合う証である。この証は汗が出て息が短く、表証で衝逆急迫するので桂枝・甘草がある。悪風・関節痛・小便不利などの証があるので、朮・附子を組み合わせる。附子の分量が多いのは、外証が激しく、内に寒があるからである。およそ内寒のあるものは、右の下腹に結ぼれた集まりがあり、腹の皮が軟弱である。" },
    { head: "附 桂枝附子湯", koma: "235R–236R",
      kaki: "一　若しくは前方の證に似て、短氣・衝逆急迫の狀なく、身體疼煩し、轉側すること能はず、其の腹候は腹皮軟弱にして四逆の腹狀に近く覺ゆるもの、桂枝附子湯の證なり。\n論に曰く、傷寒八九日、風濕相搏ち、身體疼煩し、自ら轉側すること能はず、嘔せず渴せず、脈浮虚にして濇なる者は、桂枝附子湯之を主ると。案ずるに、風濕相搏の四字、上下の文理と相接承せず。恐らくは後人、身躰疼煩の文あるに依りて攙入するものならん。何如となれば、傷寒といふもの、外傷の邪氣の名なり。八九日、又更に風湿相搏つものを加ふるの理あらんや。不通といふべし。身躰疼煩は、骨節疼煩と異なり、身躰惣じて疼煩するなり。故に屈伸すべからずといはずして、自ら轉側すること能はずといふ。嘔せず渴せずといふものは、凡そ傷寒に八九日は、表証裏に移るの時なり。日數によるときは、大柴胡に至るの疑途あり。故に不嘔といふ。若し然らざるものは、七八日の白虎の証を發するの疑途あり。故に不渴といふ。又身體疼煩は發散すべきの疑途あり。故に脈証を擧げて其の疑途を辨ずるなり。さて傷寒八九日、邪氣裏に及びて裡証を見はすべきもの、其の証なく、但身體疼煩し、仍ほ發散すべきものに似て、脈浮緊ならず、但浮虚にして力なく、渋りとどこほるの状あるもの、假りに表証ありて、内は虚寒の相應ずるものとす。蓋し脉浮は表証にして、虚にして濇なるものは、下焦の虚寒あるの候なり。日數を經れども、熱裏に遷ること能はざるゆゑんなり。故に桂・附を主として、寒を退け陽を助けて内をあたため、外を和すれば、外傷の邪は自ら去りて治するの意とするなり。此れ附子の分量多きゆゑんを知るべし。",
      yaku: "一　あるいは前の方（甘草附子湯）の証に似て、息の短さや衝逆急迫の様子がなく、体じゅうがうずき痛んで寝返りもできず、腹の兆候は腹の皮が軟弱で四逆湯の腹の状態に近いと感じるものは、桂枝附子湯の証である。\n傷寒論に「傷寒にかかって八九日、風と湿が打ち合い、体がうずき痛み、自分で寝返りができず、吐き気もなく口渇もなく、脈が浮・虚で濇（渋る）の者は、桂枝附子湯が主る」とある。考えるに、「風湿相搏」の四字は前後の文理とつながらない。おそらく後人が「身体疼煩」の文があるので書き入れたものだろう。なぜなら、傷寒とは外から傷る邪気の名である。八九日たってさらに風湿の打ち合いが加わる道理があろうか。通じないというべきである。「身体疼煩」は「骨節疼煩」と異なり、体全体がうずき痛むことである。だから「屈伸できない」と言わずに「自分で寝返りできない」と言う。「嘔せず渇せず」というのは、傷寒で八九日は表証が裏に移る時期である。日数からいえば大柴胡湯の証に至る疑いがある。だから「嘔せず」という。そうでなければ、七八日に白虎湯の証を発する疑いがある。だから「渇せず」という。また身体疼煩は発散すべきではないかという疑いがある。だから脈証を挙げてその疑いを弁別するのである。さて傷寒八九日で、邪気が裏に及んで裏証を現すはずなのにその証がなく、ただ体がうずき痛み、なお発散すべきもののようでありながら、脈は浮緊でなく、ただ浮・虚で力がなく、渋り滞る様子があるものは、仮に表証があって、内は虚寒が応じているものとする。思うに、脈の浮は表証で、虚で濇なのは下焦に虚寒がある兆候である。日数がたっても熱が裏に移れないわけである。そこで桂枝・附子を主として、寒を退け陽を助けて内を温め、外を和すれば、外から傷った邪はおのずから去って治るという意味である。附子の分量が多いわけを知るべきである。" },
    { head: "附 桂枝去桂加朮附湯", koma: "236R",
      kaki: "若し大便鞕く、小便自利する者は、桂枝去桂加朮附湯之を主る。大便鞕きは小便自利による。小便自利は上衝せざるによる。是れ桂枝を去りて朮・附を加ふる所以なり。自利は藥力によらずして利するの謂にして、常より多きの意を知るべし。是れ下焦の寒あるのみならず、水氣あるものとすべし。更に朮を加へて水氣を逐ふ所以なり。故に此の方、水病虚寒の候あるものに試用すべし。案ずるに、此の方は乃ち近効の朮附湯なり。彼に曰く、風虚、頭重く眩し、苦しみ極まり、食味を知らざるを治す。肌を暖め中を補ひ、精氣を益すと。宜しく併せ考へて其の意を審らかにすべし。此の方、法の如く煎服すれば瞑眩の劑なり。亦しらずんばあるべからず。方下の文に詳らかなり。",
      yaku: "「もし大便が硬く、小便が自然によく出る者は、桂枝去桂加朮附湯が主る」。大便が硬いのは小便が自然によく出ることによる。小便が自然に出るのは上衝しないことによる。これが桂枝を去って朮・附子を加える理由である。「自利」とは薬の力によらずに出ることで、普段より多いという意味であると知るべきである。これは下焦に寒があるだけでなく、水気もあるものとみるべきである。さらに朮を加えて水気を逐うのはそのためである。だからこの方は、水病で虚寒の兆候のあるものに試してみるとよい。考えるに、この方は『近効方』の朮附湯である。そこには「風虚で頭が重くめまいがし、苦しみが極まり、食べ物の味がわからないものを治す。肌を温め、中を補い、精気を益す」とある。あわせて考えてその意味を詳しく知るべきである。この方は法のとおりに煎じて服すると瞑眩（薬が効く際の一時的な激しい反応）を起こす剤である。これも知っておかなければならない。方の下の文に詳しい。" },
    { head: "按：桂枝去芍薬加附子湯との別", koma: "236R–236L",
      kaki: "按ずるに、此の方、桂枝去芍藥加附子湯と藥味を同じくして、分量の異同あるのみなり。彼の方中、附子壹枚を加へて、而して曰く、若し微惡寒する者はと。此の微惡寒なるものは、嗇々惡寒と異にして、外邪の證に非ずして内寒の應なり。微はあるやうでなきの義。皮表に在らずして深微なるをみつべし。又但發汗吐下の後、精氣虚して微惡寒するもの、陰陽和して自ら愈ゆるものもあれども、彼は精氣の虚のみにあらざるを以て、附子を加へて、中を温め寒を退くるの意なり。然れども其の寒、外に於いて邪氣と相搏つに至らず。故に其の證、僅かに微惡寒にして、身體疼煩に至らず。附子の分量少なき所以なり。此の證は内寒多くして外邪と相搏ち、身體疼煩し、自ら轉側すること能はざるもの、桂・附力を戮せて肌表に逐ふに非ずんば解すべからず。是れ桂・附二味の分量、去芍藥加附子湯より多くして、胸滿を曰はずして身體疼煩を曰ふ所以なり。",
      yaku: "考えるに、この方（桂枝附子湯）は桂枝去芍薬加附子湯と薬味が同じで、分量が違うだけである。あちらは附子1枚を加えて「もし微悪寒する者は」と言う。この微悪寒は、ぞくぞくする悪寒とは異なり、外邪の証ではなく内寒の反応である。「微」とはあるようでないという意味で、皮表ではなく深くかすかなものとみるべきである。また発汗・吐・下ののちに精気が虚して微悪寒するものは、陰陽が和しておのずから治ることもあるが、あちらは精気の虚だけではないので、附子を加えて中を温め、寒を退けるという意味である。しかしその寒は外で邪気と打ち合うまでには至らない。だからその証はわずかに微悪寒だけで、体のうずき痛みに至らない。附子の分量が少ないのはそのためである。こちらの証は内寒が多くて外邪と打ち合い、体がうずき痛んで寝返りもできないもので、桂枝・附子が力を合わせて肌表へ追い出さなければ解けない。これが桂枝・附子二味の分量が去芍薬加附子湯より多く、胸満と言わずに身体疼煩と言う理由である。" }
  ],

{
  id: "yoku2-keikyosokoshinbuto", no: 93, kind: "方剤", title: "桂姜棗草黄辛附湯（気分）（附 枳朮湯）", yomi: "けいきょうそうそうおうしんぶとう", group: "腹証奇覧翼 二編 上",
  koma: [237, 242], komaNote: "237R–242R（図 237R）",
  fig: { src: "img/fig_237R.jpg", koma: "237R", label: "桂姜棗草黄辛附湯證図",
    desc: "髷を布で結んだひげの男が胡坐をかき、うつむいて腹を見下ろし、着物を開く。心窩部に盆を伏せたような円形の藍色（上縁は弧）。その両脇から臍の両側へ、藍の小点が二列ずつ弧を描いて下り、臍（白い菱形）の下にも小点が並ぶ。書き込み「部位　心下而及小腹」、「神陽之衰、心下如盤、氣分所復（?）、在逐盛寒」。" },
  paras: [
    { head: "図の書き込み", koma: "237R",
      kaki: "部位、心下にして小腹に及ぶ。\n神陽の衰へ、心下盤の如し。氣分の復す（?）所は、盛寒を逐ふに在り。",
      yaku: "部位は心窩部で、下腹に及ぶ。\n神陽（陽気）が衰え、心窩部は盆のよう（に硬い塊がある）。気分を回復させる（?）要は、盛んな寒を追い払うことにある。" },
    { head: "腹証", koma: "237L",
      kaki: "右圖の如く心下に塊物ありて、其の形圓なること覆杯のごとく、之を按ずるに堅きこと骨を循るがごとし。然れども此の證にして病輕きものは、堅塊を成さず。但心下痞鞕するものに似たり。其の分辨を知らんと欲せば、心下を按じて痛みを知り、且つ心下自ら痛むものを得べし。痛み甚しきものは心背に徹するものあり。然れども此の心下痛も亦有無あり。且つ他證にも疑似するものあつて、混じ易し。要するに心下結聚して、腹時に滿ち、脇下水鳴升降し、微惡寒・身冷・骨節疼痛の證ありて、脈沈微濇、澁滯鬱結の狀あり。たとひ熱狀浮數の意ありといへども、濇渋を帯ぶるものを、此の證として分辨すべし。是れ乃ち所謂氣分なるものにして、其の義は則ち本文に詳らかなり。",
      yaku: "右の図のように心窩部に塊があり、その形は杯を伏せたように丸く、按じると骨をなぞるように硬い。しかしこの証で病の軽いものは硬い塊をつくらず、ただ心窩部がつかえて硬いものに似る。その見分け方を知るには、心窩部を按じると痛み、また心窩部が自然に痛むことを確かめるとよい。痛みのひどいものは胸から背に突き抜けることがある。しかしこの心窩部痛にも有無があり、また他の証にもまぎらわしいものがあって混同しやすい。要するに、心窩部に結ぼれた集まりがあって腹がときどき張り、脇下で水の音が上下し、かすかな寒け・体の冷え・関節痛の証があって、脈は沈・微・濇で、渋り滞り鬱結した様子がある。たとえ熱っぽく浮・数の傾向があっても、渋りを帯びるものをこの証として見分けるべきである。これがいわゆる「気分」であり、その意味は本文（以下の金匱の文の解）に詳しい。" },
    { head: "条文の解（一）：寸口と趺陽の脈", koma: "238R",
      kaki: "證に曰く、寸口の脈遲にして濇、遲なれば則ち寒と爲し、濇なれば血不足と爲すと。濇はしぶるなり。譬へば刀を以て竹の皮をこそぐるか、或いは鋏の銹を徹するがごとき、指にさはりある脈をいふ。脈おそくして動すくなきは内寒の候にして、濇りてとどこほるは血の不足するものとするなり。趺陽の脈微にして遲、微なれば則ち氣と爲し、遲なれば則ち寒と爲す。趺陽は足趺の脈なり。凡そ脉、外に在るを陽と爲す。微はかすかに應ずるなり。爲氣の下に不足の二字を挩畧す。血氣は對名、上文に因りて省くものとす。寸口に於いて血をうかがひ、趺陽に於いて氣を伺ふ。亦互文なり。但寒は常に下焦に盛んにして、氣は常に足趺に旺じがたし。故に手足を分ちて血と氣とをいふと知るべし。寒氣不足すれば則ち手足逆冷す。寒と氣の不足と血の不足との三因なり。此の四字にて上の六句を挈げたるもの。故に之を文章の約法といふなり。此の病、寒氣盛んにして陽氣を逼するを以て、氣血の不足を致すものなるゆゑ、寒を主として之を言ふなり。さて四肢は末にて、わけて陽氣のとどき難き處ゆゑ、寒氣逼るときは手足のさきよりさかしまに冷えてくる。故に逆冷といふ。冷はつめたくなることなり。",
      yaku: "金匱要略に「寸口の脈が遅で濇、遅は寒であり、濇は血の不足である」とある。濇とは渋ることである。たとえば刀で竹の皮をこそげるか、鋏の錆を削り取るような、指にひっかかりのある脈をいう。脈が遅くて拍動が少ないのは内寒の兆候で、渋って滞るのは血の不足とする。「趺陽の脈が微で遅、微は気（の不足）、遅は寒である」。趺陽とは足の甲の脈である。およそ脈は外にあるものを陽とする。微とはかすかに応じることである。「為気」の下に「不足」の二字が省かれている。血と気は対になる名で、上文によって省いたのである。寸口で血をうかがい、趺陽で気をうかがう。これも互文である。ただし寒は常に下焦に盛んで、気は常に足の甲までは旺盛になりにくい。だから手と足に分けて血と気をいうのだと知るべきである。「寒・気の不足があれば手足が逆冷する」。寒・気の不足・血の不足の三つの原因である。この四字で上の六句をまとめているので、これを文章の約法という。この病は寒気が盛んで陽気を圧迫し、気血の不足を起こすものなので、寒を主として言っているのである。四肢は末端で、とりわけ陽気の届きにくいところなので、寒気が迫ると手足の先から逆にさかのぼって冷えてくる。だから逆冷という。冷とは冷たくなることである。" },
    { head: "条文の解（二）：栄衛不利・腹満腸鳴・気転膀胱", koma: "238R–239R",
      kaki: "手足逆冷すれば則ち榮衛利せず。榮はさかへるなり。血は脉中を行きて一身にさかへる故、榮と称し、衛はまもるなり。氣は脈外にはり出でて腠理をまもるゆゑ、衛と称す。榮衛は肌膚筋脉の間に於いて、血氣に称するの名なり。此に血氣を曰はずして榮衛をいふは、血氣は其の物を擬し、實に於けるの名なり。榮衛は其のはたらきを指して、用に於けるの称なり。言ふこころは、手足逆冷すれば、血氣の用の肌膚をまもり筋脉にさかへるものが、其のはたらきが出来ぬやうになるなり。故に不利といふ。利はとほるなり。とほらずしてゆくの義なり。\n榮衛利せざれば、則ち腹滿腸鳴相逐ふ。氣の用が不利なる其の本は、陽氣の逼せられたるによるゆゑ、肌膚に分布すべきところの陽氣が鬱滞して腹内にこもるゆゑ、寒氣と戦ひて、腹滿・腸鳴して相逐ふなり。此の腹滿、寒を得てはるもの故に、之を按じて實せず痛まず。此の腸鳴、陰陽相逐ふものなる故、雷鳴せずして腸腹を上下する声、但ぐずぐずと聞こゆるなり。相逐の字にて、或いは上り或いは下るの状を知るべし。案ずるに、此に特に腸鳴といふものは、心下は既に寒と飲と相結びて堅塊を成したるゆゑ、之をさけて腸の字を下すなり。古文の簡明をみつべし。\n氣膀胱に轉じ、榮衛倶に勞す。轉はまろばすなり。轉失氣の轉と同じ。膀胱はいばりぶくろなり。膀胱は下部に位す。下焦の寒盛んにして、陽氣の逼せらるる故に、下部に轉ずる氣、外に失すること能はずして内に轉ずるものは、血氣の用とする榮衛は倶に疲勞して、發暢の勢力なきを見るなり。按ずるに轉矢氣は放屁なり。此は放屁すべくして放たず。但膀胱にてぐずぐずとする氣は旋屁なり。此は放屁の勢力なきものとす。氣轉膀胱の句、前の腸鳴相逐と應じ、倶勞の二字、前の不利より来たりて相逐と應ず。言ふこころは、不利なるもの相逐ひて倶に疲勞するに至り、益衰ふるを見つべし。",
      yaku: "「手足が逆冷すれば栄衛が通じない」。栄とは栄えることで、血は脈中を行って全身に栄えるので栄といい、衛とは守ることで、気は脈外に張り出して腠理（皮膚のきめ）を守るので衛という。栄衛とは肌や筋脈の間での血気の呼び名である。ここで血気と言わずに栄衛と言うのは、血気はその物自体を指す実体の名であり、栄衛はそのはたらきを指す作用の名だからである。つまり、手足が逆冷すると、肌を守り筋脈に栄えるという血気のはたらきができなくなるということで、だから「不利」という。利とは通ることで、不利は通らずに滞るという意味である。\n「栄衛が通じなければ、腹が張り、腸が鳴って追いかけ合う」。気のはたらきが通じない根本は陽気が圧迫されていることにあるので、肌に行きわたるはずの陽気が鬱滞して腹内にこもり、寒気と戦って、腹が張り、腸が鳴って追いかけ合うのである。この腹満は寒によって張るものなので、按じても実しておらず痛まない。この腸鳴は陰陽が追いかけ合うものなので、雷のようには鳴らず、腸腹を上下する音がただぐずぐずと聞こえる。「相逐」の字で、上ったり下ったりするさまを知るべきである。考えるに、ここでとくに「腸鳴」というのは、心窩部はすでに寒と水飲が結んで硬い塊になっているので、それを避けて「腸」の字を用いたのである。古文の簡明さを見るべきである。\n「気が膀胱に転じ、栄衛がともに疲れる」。転とは転がすことで、「転失気」の転と同じである。膀胱は尿袋で、下部にある。下焦の寒が盛んで陽気が圧迫されるので、下部に転じる気が外に出ることができずに内で転がるのは、血気のはたらきである栄衛がともに疲労して、のびやかに発する勢いがないことを示している。考えるに、転矢気は放屁である。ここでは放屁すべきなのに出ず、ただ膀胱のあたりでぐずぐずする気は旋屁であり、放屁する勢いがないものである。「気転膀胱」の句は前の「腸鳴相逐」に応じ、「倶労」の二字は前の「不利」から来て「相逐」に応じる。つまり、通じないものが追いかけ合ってともに疲労し、ますます衰えていくことを見るべきである。" },
    { head: "条文の解（三）：陽気不通・陰気不通・前通", koma: "239R–239L",
      kaki: "陽氣通ぜざれば即ち身冷え、陰氣通ぜざれば即ち骨痛む。陽氣は生活の元氣、人の腹内に居どころなり。故に陽氣は殺厲の氣の其の物たる寒と冷とを主る（?）。陰氣は栄衛を利し、一身を溌（?）することを主る。陽氣の通ぜざる所の處、皆陰氣の驅殻なり。前の手足逆冷と應じて、其の手足に止まらざるもの、益其の侵す所の深きに及ぶを見るべし。即は即坐の義にて、其の場がすぐに陰氣の持場となる故、即ち身冷ゆといふなり。陰氣は固より寒冷を主とするものといへども、常は陽氣と相和して熙々の中に存するものなれども、陽氣鬱滞して陰氣と相阻隔するときは、内に凝りて骨髓を痛めるに至る。是れは陽氣の鬱するもの、其の處に阻りはばむゆゑ、却つて痛みを發するなり。此の二句、直ちに前の倶勞と接承して、陰陽二氣乖離阻隔し、相驅逐して勝負未だ決せざるの間に於いていふものにして、尤も解し易からず。讀むもの思へ。\n陽前に通ずれば則ち惡寒し、陰前に通ずれば則ち痺れて不仁す。陰陽阻隔して相逐ふもの、若し陽氣が勝ち進みて陰を輕くなして、悪寒するに至る。是れは陰氣の持ちきつたる場処へ陽氣が進み入りたるゆゑ、身冷が却つて悪寒となりて、やがて陰陽和せんとするに至るなり。何如となれば、身冷は陰氣の持ち切りて獨り居るところゆゑ、排して冰のごとくひゆるなり。悪寒は陽氣進みて陰氣をおだてるゆゑ、自ら寒を覚ゆるなり。是れ輕重の別なり。陰前に通ずとは、若し陰氣が勝ち進みて、素より衰へたる陽氣の處へ入り通ずれば、陽氣相逐ひてさへ…（?）ことを得ず。陽氣を射して其の名としたるところの栄衛が全躰を旋りてしまふべく、身冷ゆるのみならず、痺れて不仁するに至るなり。痺はしびる、不仁は我が身のごとくならずして痛痒を覚えざるをいふ。陽氣の懸りがすこしもあるうちは痛痒もしれども、其の悪を受けざるゆゑ不仁と名づくるなり。是れ前の身冷・骨疼よりも一等甚しくなりたるを見るべし。此の段は陰陽の勝負の付きたるところを論じて、病の軽重の分かるる所を示す。説き得て妙々。",
      yaku: "「陽気が通じなければ体が冷え、陰気が通じなければ骨が痛む」。陽気は生命の元気で、人の腹内にいる。だから陽気は、殺伐とした気そのものである寒と冷えを（防ぐことを）主る（?）。陰気は栄衛を通じさせ、全身をうるおす（?）ことを主る。陽気が通じないところは、すべて陰気の殻である。前の「手足逆冷」に応じて、手足にとどまらず、ますます深く侵すことを見るべきである。「即」とは即座の意味で、その場がすぐに陰気の持ち場になるので「即ち身冷ゆ」という。陰気はもとより寒冷を主とするものだが、ふだんは陽気と和して和やかな中にある。しかし陽気が鬱滞して陰気と隔てられると、内に凝って骨髄を痛めるに至る。これは鬱した陽気がそこで阻み邪魔をするので、かえって痛みを起こすのである。この二句はすぐ前の「倶労」を受けて、陰陽二気が離れ隔たり、追い合って勝負がまだつかない間のことを言うもので、とりわけわかりにくい。読む者はよく考えよ。\n「陽が前に通じれば悪寒し、陰が前に通じればしびれて感覚がなくなる」。陰陽が隔たって追い合う中で、もし陽気が勝ち進んで陰を軽くすれば、悪寒するに至る。これは陰気が占めきった場所へ陽気が進み入ったので、体の冷えがかえって悪寒となり、やがて陰陽が和そうとするのである。なぜなら、体の冷えは陰気が占めきって単独でいるところなので、氷のように冷える。悪寒は陽気が進んで陰気をあおるので、自分で寒さを感じるのである。これが軽重の区別である。「陰が前に通じる」とは、もし陰気が勝ち進んで、もともと衰えている陽気のところへ入り通じれば、陽気は追い合うことさえ（?）できない。陽気をさしてその名とした栄衛が全身をめぐりきってしまい、体が冷えるだけでなく、しびれて感覚がなくなるのである。痺はしびれること、不仁は自分の体のようでなく痛みもかゆみも感じないことをいう。陽気の働きが少しでもあるうちは痛みやかゆみもわかるが、それを受けとめられないので不仁と名づける。これは前の身冷・骨痛よりも一段ひどくなったものと見るべきである。この段は陰陽の勝負がついたところを論じて、病の軽重の分かれ目を示している。見事な説き方である。" },
    { head: "条文の解（四）：陰陽相得・失気と遺尿・名づけて気分", koma: "239L–240L",
      kaki: "陰陽相得れば、其の氣乃ち行る。若し陽氣前に通じて悪寒を發すれば、やがて陰陽相得て和融するに至る。其の相得たるところの氣は、鬱滞することなきゆゑ、流動して運行することを得るなり。元来此の病は寒を主として、陽氣之が為に逼せられて鬱滞するより、遂に陰陽乖離阻隔をなしたるものゆゑ、今陽氣が旺を得て陰盛の中に進み入ることを得れば、必ず陰陽相得て相和するに至るなり。此れより下、實すれば則ち失氣に至るまでの二十字、陰陽相得て病の自ら愈ゆるの機を論ず。前の陽前通則悪寒の句を承け来たる。其の氣は相得るの氣を指す。行は運行の義なり。\n大氣一たび轉ずれば、其の氣乃ち散ず。さて陰陽相得て和氣の運行すれば、前に鬱滞して膀胱に轉ずるところの氣、今大氣となりて一たび轉失すれば、其の鬱滞する所の氣は乃ち散じうせさるなり。譬へば天の陽氣、地形に障られて鬱滞するもの、風雨雷霆となりて發散すれば、其のあとは天氣晴明なるがごとし。此の句、前の氣轉膀胱の句に應ず。彼の陰盛陽衰の間に於いて、小氣屢轉ずれども發散すること能はず、却つて栄衛倶に勞するの情、是に於いてみつべし。\n實すれば則ち失氣し、虚すれば則ち遺尿す。實は陽氣の充實なり。失はとりはづすこと。失氣は即ち旋屁なり。陽氣内に實すれば、鬱滞の氣勢力を張りて、大聲一轉して肛門より外に迸泄す。世俗、大屁を失して腹のすくといふもの是れなり。虚は陽氣の虚するなり。陰前に通ずれば、陽氣其の處に虚す。外にしては痺れて不仁し、内にしては膀胱のしまりなきゆゑに遺尿するなり。遺尿は小便をもらすなり。虚則遺尿の句は、前の陰前通則痺不仁の句を承けて、遺尿の二字は氣轉膀胱の句に應ず。彼の其の氣を轉ずるもの、栄衛の労を知るといへども、いまだ陽氣の虚に至らず。此れ已に虚す。遺尿すべきを悲しむ（?）べし。此の一句、此の病の極證をいふものとしるべし。\n名づけて氣分と曰ふ。以上論ずるところの病証は、其の証の軽きに之き重きに極まるもの、亦皆陰陽の二氣を剋するところのものにして、其の壹に是れ皆陰盛に陽氣前後進退の際にあり。名づけて氣分といふゆゑんなり。而して其の全體の意をすぶるときは、栄衛倶に勞すといへども、陽氣いまだ其の虚を致さざる時に當たりて、温中解肌の劑を投じて、寒を内に退け、陽氣を外に達すれば、陰陽和して諸證皆去り、病自ら愈ゆべし。若しくは其の治を惰り、陰氣前に通じて陽氣の虚を成すに及んで、痺不仁・遺尿の極証をあらはさば、容易の治功を奏すべからず。是の故に陰陽相逐の狀を詳らかにし、進退軽重の機を明らかにす。讀むもの深く思ひて其の微を顯らかにせずんばあるべからず。",
      yaku: "「陰陽が互いを得れば、その気がめぐる」。もし陽気が前に通じて悪寒を起こせば、やがて陰陽が互いを得て和らぎ融け合う。その互いを得た気は鬱滞しないので、流れ動いてめぐることができる。もともとこの病は寒を主とし、陽気がそのために圧迫されて鬱滞したことから、ついに陰陽が離れ隔たったものなので、いま陽気が旺盛になって陰の盛んな中に進み入ることができれば、必ず陰陽が互いを得て和するに至る。ここから下「実すれば失気」までの20字は、陰陽が互いを得て病がおのずから治る機転を論じたもので、前の「陽前通則悪寒」の句を受けている。「其の気」は互いを得た気を指す。「行」はめぐるという意味である。\n「大きな気がひとたび転じれば、その気は散る」。陰陽が互いを得て和気がめぐれば、前に鬱滞して膀胱で転がっていた気が、いま大きな気となってひとたび抜け出れば、鬱滞していた気は散って消える。たとえば天の陽気が地形にさえぎられて鬱滞したものが、風雨や雷となって発散すれば、そのあとは晴れわたるようなものである。この句は前の「気転膀胱」の句に応じる。陰が盛んで陽が衰えている間は、小さな気がしばしば転がっても発散できず、かえって栄衛がともに疲れるという事情が、ここで見てとれる。\n「実すれば失気し、虚すれば遺尿する」。実とは陽気が充実していること。失とは取り落とすことで、失気は旋屁（放屁）である。陽気が内に実すれば、鬱滞した気が勢いを張って、大きな音とともに肛門から外へほとばしり出る。世間で「大きな屁をして腹がすく」というのがこれである。虚とは陽気が虚すことである。陰が前に通じれば、陽気はそこで虚す。外ではしびれて感覚がなくなり、内では膀胱にしまりがなくなるので遺尿する。遺尿とは小便を漏らすことである。「虚則遺尿」の句は前の「陰前通則痺不仁」の句を受け、「遺尿」の二字は「気転膀胱」の句に応じる。前者は気が転がり、栄衛の疲れは知れるが、まだ陽気の虚には至っていない。こちらはすでに虚している。遺尿するに至ったことは悲しむべきである（?）。この一句はこの病の極みの証を言うものと知るべきである。\n「名づけて気分という」。以上論じた病証は、軽いものから重いものに極まるまで、すべて陰陽二気が剋し合うもので、もっぱら陰が盛んな中で陽気が前後に進退するところにある。だから気分と名づけるのである。全体の意をまとめれば、栄衛がともに疲れていても、陽気がまだ虚に至らないうちに、中を温め肌を解く剤を与えて、寒を内から退け、陽気を外に達すれば、陰陽が和して諸証はみな去り、病はおのずから治る。もし治療を怠り、陰気が前に通じて陽気の虚をつくり、しびれ・感覚の喪失・遺尿という極みの証を現せば、たやすく治すことはできない。だから陰陽が追い合うさまを詳しく述べ、進退軽重の機を明らかにしたのである。読む者は深く考えて、その微妙なところを明らかにしなければならない。" },
    { head: "条文の解（五）：心下堅、大いさ盤の如し", koma: "240L–241R",
      kaki: "氣分、心下堅く、大いさ盤の如く、邊旋杯の如きは、水飲の作す所、桂姜棗草黄辛附湯之を主る。此の氣分の二字、前の名曰氣分を承けて、乃ち前文に詳らかにするところの病証をすべたるところの名なり。盤は圓器の名、或いは酒肴を盛り、或いは水をいれ、或いは物を載する器。堅等に用ふ。邊はふちなり。如盤堅塊のふちなり。旋はめぐらすと訓ず。指頭にてなでまはしてみることなり。心下の堅塊の大きさ盤の如く、其の邊端をなでまはすに、杯の形のごとし。猶心下覆盃のごとしといふがごとし。所謂塊物をなすもの、水飲の作す所にして、其の成るは寒氣にて凝結すること、譬へば堅冰の成るがごときものなり。此の方、附子を以て君藥とし、細辛力を戮せて心下の飲塊を温散し、桂・麻・諸藥相佐けて、鬱を散じ、氣を和し、以て肌表に達す。其の病は少陰を主として大陽を兼ぬるもの。方意を審らかにして考ふべし。\n右、金匱の文僅かに百餘言に過ぎず。陰陽の體用虚實、及び進退軽重の辨、照應錯綜、曲盡して復た遺さず。古文辭の妙と謂ふべし。唐以後の方技家の書體と齊しく看過すべからず。學者若し此等の文を熟讀翫味せば、古人の病に臨んでの證を鑒み、陰陽進退の機を審らかにし、證に隨ひて之を治するの意を得ること、思ひ半ばに過ぎん。",
      yaku: "「気分で、心窩部が硬く、大きさは盆のようで、縁は杯をなでまわしたような形のものは、水飲がつくったもので、桂姜棗草黄辛附湯が主る」。この「気分」の二字は前の「名づけて気分という」を受けて、前文で詳しく述べた病証をまとめた名である。盤とは丸い器の名で、酒や肴を盛ったり、水を入れたり、物を載せたりする器である。「堅」などに用いる。辺とは縁のことで、盆のような硬い塊の縁である。旋は「めぐらす」と読み、指先でなでまわしてみることである。心窩部の硬い塊の大きさが盆のようで、その縁をなでまわすと杯の形のようである。「心下が杯を伏せたよう」と言うのと同じである。塊をつくるものは水飲で、それができるのは寒気で凝結するためであり、たとえば硬い氷ができるようなものである。この方は附子を君薬とし、細辛が力を合わせて心窩部の水飲の塊を温めて散らし、桂枝・麻黄などの諸薬が助けて、鬱を散らし、気を和し、肌表に達する。その病は少陰を主として太陽を兼ねるものである。方の意味をよく考えるべきである。\n以上の金匱要略の文はわずか百余字にすぎないが、陰陽の本体と作用、虚実、進退軽重の区別が、照応し入り組んで、細かく述べ尽くして余すところがない。古文辞の妙というべきである。唐以後の医術家の書きぶりと同じように見過ごしてはならない。学ぶ者がもしこのような文を熟読して味わえば、古人が病に臨んで証を見きわめ、陰陽進退の機を詳しく知り、証に従って治すという意味を、半ば以上は理解できるだろう。" },
    { head: "按：附子の分量（稲葉翁の説と外台の深師附子湯）", koma: "241R–242R",
      kaki: "○按ずるに、此の方、先達曰く、桂枝去芍藥湯・麻黄附子細辛湯二方の證相合する者と。所謂氣分なるもの、少陰の證許多なりといへども、其の心下堅塊を成すもの、二方の證のいまだ言はざる所。且つ古方は藥味を同じくすれども、分量異なるときは、其の主治する所も亦同じからず。稲葉翁疑ひて謂ふ、附子壹枚、之を本邦省略の分量に充つるときは僅かに三分許りにして、本方煎水の升量に比校するに、附子の分量少なきに似たり。且つ用ひて其の効を見ず。因りて省畧の方中、一貼毎に附子一錢五分を増加して、堅塊速やかに解したりと（其の説、奇覧初編に詳らかなり）。然れども金匱所載の方、但二方相合するものにして、水量の多きを異とするのみ。以て徴するに足らざるを憾む。後、余外臺を讀むに、深師附子湯と名づくるものあり。即ち此の方にして、大附子壹枚、細辛・麻黄各三両、餘藥は金匱と同じくして、心下堅の證を記す。此の方、附子湯と名づけて、其の分量多きもの、主藥たること明らかにして、稲葉翁の考ふるところ、暗に古人の意と符合し、以て徴するに足れり。爾來余此の證を得るごとに、病の輕重に隨ひて、一貼の附子壹錢より以て二錢に至るまでを用ひ、手に隨ひて功を奏せずといふことなし。",
      yaku: "○考えるに、この方について先輩は「桂枝去芍薬湯と麻黄附子細辛湯の二方の証が合わさったもの」と言う。いわゆる気分には少陰の証が多いが、心窩部に硬い塊をつくることは二方の証が言っていないところである。また古方は薬味が同じでも分量が異なれば、主治も同じではない。稲葉翁（稲葉文礼）は疑って言った。「附子1枚をわが国の省略した分量に当てるとわずか3分ほどで、本方の煎じる水の量に比べると附子の分量が少ないようである。また用いても効果が見られない。そこで省略した方の1貼ごとに附子1銭5分を増やしたところ、硬い塊が速やかに解けた」と（その説は『腹証奇覧』初編に詳しい）。しかし金匱要略に載る方は二方を合わせただけで、水の量が多い点が違うだけであり、証拠とするには足りないのが残念であった。のちに私が『外台秘要』を読むと、「深師附子湯」というものがあった。これがこの方で、大附子1枚、細辛・麻黄各3両、ほかの薬は金匱要略と同じで、心下堅の証を記している。附子湯と名づけて分量が多いのだから、附子が主薬であることは明らかで、稲葉翁の考えはひそかに古人の意と一致しており、証拠とするに足りる。それ以来、私はこの証を得るたびに、病の軽重に応じて1貼の附子を1銭から2銭まで用いて、効果を上げなかったことはない。" },
    { head: "附 枳朮湯・甘遂半夏湯・黒豆湯", koma: "242R",
      kaki: "○若しくは此の腹證にして氣分の證なく、小便不利、若しくは水腫するもの、枳朮湯の證なり（此の證、後世分消湯の本づくところなり。併せ考ふべし）。\n證に曰く、心下堅く、大いさ盤の如く、邊旋杯の如きは、水飲の作す所と（心下の上に氣分の二字なきを以て分別す）。又一證、心下覆杯の如くにして、腹滿し青筋を見はすもの、甘遂半夏湯の証なり（鼓脹の証、大黄甘遂湯の腹に似たり。心下と小腹とを以て其の位を分つ）。其の他、水腫病にして心下覆杯のごとく、氣息急迫して實に属するものあり。外臺の黒豆湯効あり。",
      yaku: "○あるいはこの腹証で気分の証がなく、小便の出が悪いか、むくむものは、枳朮湯の証である（この証は後世の分消湯がもとづくところである。あわせて考えよ）。\n金匱要略に「心窩部が硬く、大きさは盆のようで、縁は杯をなでまわしたような形のものは、水飲がつくったもの」とある（「心下」の上に「気分」の二字がないことで区別する）。また一つの証として、心窩部が杯を伏せたようで、腹が張って青筋が浮き出るものは、甘遂半夏湯の証である（鼓脹の証で、大黄甘遂湯の腹に似る。心窩部か下腹かで位置を分ける）。そのほか、水腫病で心窩部が杯を伏せたようで、息が苦しく迫り、実に属するものがある。『外台秘要』の黒豆湯が効く。" }
  ],
