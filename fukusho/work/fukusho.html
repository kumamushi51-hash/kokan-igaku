  --ai:#a9cf98; --ai-soft:#25311f; --shu:#e07a68; --shu-soft:#3a2522; --hl:#5a4f1f; --br:#9b8f84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1715; --paper:#231e1b; --ink:#ece5de; --muted:#a89d93; --line:#3d342e;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;max-width:1180px;margin:0 auto}

.sub{color:var(--muted);font-size:12px}

.search input:focus{outline:2px solid var(--ai);outline-offset:1px}
.hint{max-width:1180px;margin:6px auto 0;font-size:12px;color:var(--muted)}
.hint button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 10px;margin:2px 2px 0 0;cursor:pointer}
#navbtn{display:none}
.tabs{display:flex;gap:6px;max-width:1180px;margin:10px auto 0}
.tabs button{font:inherit;font-size:14px;padding:5px 16px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px 6px 0 0;background:var(--paper);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ai)}
.fm p.intro{font-size:14px;color:var(--muted);background:var(--bg);border-radius:6px;padding:10px 14px;margin:12px 0 0}
.fm .para{border-top:1px solid var(--line);padding:16px 0}
.fm .para:first-of-type{border-top:0}
.fm .para h4{font-family:var(--f-disp);font-size:16px;margin:0 0 6px;color:var(--ai)}
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1180px;margin:18px auto 0}
nav{position:sticky;top:225px;align-self:start;font-size:14px;max-height:calc(100vh - 245px);overflow:auto}
nav h3{font-family:var(--f-disp);font-size:13px;color:var(--muted);letter-spacing:.15em;margin:14px 0 4px;font-weight:500}
nav a{display:block;padding:5px 10px;border-left:3px solid transparent;color:var(--ink);text-decoration:none;border-radius:0 4px 4px 0}
nav a:hover{background:var(--ai-soft)}
nav a.on{border-left-color:var(--ai);background:var(--ai-soft);font-weight:700}
nav .no{font-size:11px;color:var(--muted);margin-right:4px}
main{min-width:0}
.results{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:18px}
.results h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.hit{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.hit:first-of-type{border-top:0}
.hit b{font-family:var(--f-disp);font-size:17px}
.hit .where{font-size:12px;color:var(--ai);margin-left:8px}
.hit p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 1px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px clamp(16px,3vw,36px)}
.page h2{font-family:var(--f-disp);font-size:30px;margin:0;letter-spacing:.1em}
.page h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;margin-left:10px;font-weight:400}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.meta a{color:var(--ai)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg);cursor:pointer;color:var(--ink);font-family:inherit}
.tag:hover{border-color:var(--ai)}
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--paper);color:var(--ink);padding:4px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--paper);font-weight:700}
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:10px 0 0}
.toc a{color:var(--ai)}
section{margin-top:30px}
section>h3{font-family:var(--f-disp);font-size:19px;margin:0 0 12px;padding-bottom:4px;border-bottom:2px solid var(--ink);letter-spacing:.08em}
.small{font-size:13px;color:var(--muted)}
.kaki{font-family:var(--f-disp);font-size:16.5px}
.yaku{font-size:15px}
.lbl{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;font-family:var(--f-body);letter-spacing:0;vertical-align:2px}
.br{color:var(--br)}
.txt>div{margin:4px 0}
body[data-mode="kaki"] .yaku{display:none}
body[data-mode="yaku"] .kaki{display:none}
body:not([data-mode="both"]) .lbl{display:none}
table.herbs{border-collapse:collapse;font-size:15px;margin:4px 0 10px}
table.herbs th,table.herbs td{border-bottom:1px solid var(--line);padding:4px 14px 4px 0;text-align:left;font-weight:400}
table.herbs th{font-size:12px;color:var(--muted)}
table.herbs td:first-child{font-family:var(--f-disp);font-size:17px;font-weight:700}
.jo{border-top:1px solid var(--line);padding:16px 0}
.jo:first-of-type{border-top:0;padding-top:4px}
.jo .no{font-family:var(--f-disp);font-weight:700;color:var(--ai);margin-right:6px}
.jo .src{font-size:12px;color:var(--muted)}
.tc{margin:10px 0 0;padding:10px 14px;background:var(--ai-soft);border-left:3px solid var(--ai);border-radius:0 6px 6px 0}
.tc .h{font-size:12px;font-weight:700;color:var(--ai)}
.tc a,.jo .src a,.meta a{color:var(--ai)}
.tc .h span{font-weight:400;color:var(--muted);margin-left:6px}
.tc .kaki{font-size:15.5px}
.an{margin:10px 0 0;padding:8px 14px;border:1px dashed var(--line);border-radius:6px}
.an .h{font-size:12px;font-weight:700;color:var(--muted)}
.check{background:var(--shu-soft);border-radius:6px;padding:10px 16px 10px 30px;margin:0;font-size:13.5px}
.check li{margin:2px 0}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:10px 14px}
footer{max-width:1180px;margin:28px auto 0;font-size:12px;color:var(--muted)}
footer a{color:var(--ai)}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  #navbtn{display:block;width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);margin-top:8px}
  nav{position:static;max-height:none;display:none}
  nav.open{display:block}
  .page h2{font-size:26px}
}
.fig{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start;margin-top:16px}
.fig img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:#efe9dd}
.fig .cap{font-family:var(--f-disp);font-size:18px;font-weight:700}
.fig p{margin:6px 0 0;font-size:14px}
.para{border-top:1px solid var(--line);padding:16px 0}
.para:first-of-type{border-top:0;padding-top:4px}
.para h4{font-family:var(--f-disp);font-size:16px;margin:0 0 6px;color:var(--ai)}
.para h4 span{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.para h4 a{color:var(--muted)}
.rel{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.rel a{color:var(--ai)}
#zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:12px}
#zoom img{max-width:100%;max-height:100%}
@media (max-width:760px){.fig{grid-template-columns:1fr}.fig img{max-width:420px}}

<script>
// 腹証奇覧（稲葉文礼）正編 上冊：腹診の法（総論）・第1図 桂枝湯　コマ10L–13R
// 書式：paras[] は本文の段落（kaki＝本文をひらがな交じりに直したもの、yaku＝現代語訳）。
//       本文中の漢文の引用は書き下す。tochu[] は枠外上部の頭注。fig は腹証図（../img/fig_コマ頁.jpg）
window.FUKU_DATA = window.FUKU_DATA || [];
window.FUKU_DATA.push(
{
  id: "fukushin-ho", no: 0, kind: "総論", title: "腹診の法", yomi: "ふくしんのほう", group: "正編 上冊",
  koma: [10, 11], komaNote: "10L–11R",
  intro: "上冊の巻頭、「腹證奇覧上冊　湖南 稲葉克文禮著」に続く総論。診察の心構えと、腹を診る順序を述べる。",
  paras: [
    { head: "診察の心構え", koma: "10L",
      kaki: "夫れ腹症を按ずるの法。まづ病人を平らかに臥しめ、志氣を正しうせしめ、さて醫者も亦平らかに坐し、呼吸をたゞし、志氣を臍下に收め、あたかも武夫の兵器を執りて敵にむかふが如く、大病を怖れず、死生に眩せず、富貴に屈せず、貧賤を侮らず、その病毒を治して、その疾苦を救はんと、心を專一にして診察すべし。是れ疾醫病者を診察するの大法なり。",
      yaku: "腹証を按じて診る方法。まず病人を平らに寝かせ、気持ちを落ち着けさせる。医者もまた姿勢を正して座り、呼吸を整え、気力を臍の下に収める。ちょうど武士が武器を取って敵に向かうときのように、大病を恐れず、生死に心を乱されず、相手が富貴でもへつらわず、貧賤でも侮らず、その病毒を治してその苦しみを救おうと、心を一つにして診察しなければならない。これが疾医（古方の医者）が病者を診察するときの大原則である。" },
    { head: "腹を診る順序", koma: "10L–11R",
      kaki: "凡そ腹症を候ふの法。右のごとく病者に臨み、まづ右手の掌を徐かに胸心へあて、一息して呼吸を定靜し、こゝろをしづめて胸脇の毒をうかゞふ。中央より診して左右におよぶ。而して後、心下へやはらかに指を下して、三指（食指・中指・無名指）の頭にて按すべし。次に肋骨のはしへ指頭をかゝげ入れて、苦滿の有無をうかゞひ、次に腹中、次に左右の小腹、次に臍究、次に左右の臍傍、次に臍下と、順々に診察すべし。これ診腹の次第なり。かくのごとくにして後、外證を察し、諸患の有無を問ふべし。",
      yaku: "腹証をうかがう手順。上のような心構えで病者に向かい、まず右手のてのひらを静かに胸に当てる。ひと呼吸おいて呼吸を整え、心を静めて、胸脇の毒をうかがう。中央から診て左右に及ぶ。その後、みぞおち（心下）へやわらかに指を下ろし、三本の指（人差し指・中指・薬指）の先で按じる。次に肋骨の縁へ指先を差し入れるようにして、苦満（胸脇苦満）の有無をうかがう。次に腹の中、次に左右の下腹部（小腹）、次に臍、次に臍の左右、次に臍の下と、順々に診察する。これが腹診の順序である。こうして腹を診たのちに、外に現れた症状（外証）を観察し、そのほかの症状の有無を問うべきである。" }
  ],
  tags: ["腹診", "診察の順序", "胸脇苦満", "みぞおち"],
  check: ["11R「臍究」の「究」は字形どおり。臍窠（へそのくぼみ）の意と解した"]
},
{
  id: "keishito", no: 1, kind: "方剤", title: "桂枝湯", yomi: "けいしとう", group: "正編 上冊",
  koma: [11, 13], komaNote: "11L–13R",
  fig: { src: "img/fig_011L.jpg", koma: "11L", label: "桂枝湯之證",
    desc: "冠をかぶった髭の男が椅子に腰掛け、胸腹をあらわにしている。腹部に色付けはない。" },
  paras: [
    { head: "腹証と三方の使い分け", koma: "12R",
      kaki: "此の證、腹滿にして、底までもこたゆるものなく、圖のごとく、只拘攣あり。所謂臓に他病なし。上衝・發熱・頭痛有りて、汗あり惡風する者は、桂枝湯を用ゆる也。拘攣せざる者は、去芍藥湯を用ゆるなり。拘攣劇しき者は、加芍藥湯を用ゆるなり。此の三方を合せみれば、上衝と拘攣との二つ、此の症の準據たること知るべし。",
      yaku: "この証は、腹は張っているが、底のほうまで手に応える（しこりや抵抗の）ものはなく、図のように、ただ拘攣（腹のひきつり）があるだけである。いわゆる「臓に他病なし」（内臓にはほかの病がない）の状態である。上衝（気の突き上げ）・発熱・頭痛があって、汗が出て風を嫌う者には桂枝湯を用いる。拘攣のない者には桂枝去芍薬湯を、拘攣の激しい者には桂枝加芍薬湯を用いる。この三方を合わせて見れば、上衝と拘攣の二つが、この証の目安（準拠）であることがわかる。" },
    { head: "「衝」と「拘攣」の字義・拘攣の診かた", koma: "12R–12L",
      kaki: "故に腹證を知らんと欲せば、まづ準據とするところの字義を味ひ考ふべし。衝は突なり、向なり。毒の頭上へ突き上るなり。拘は物を去り手能く之を止むるなり。また擁なり。攣は係攣なり。縄を以て引きつりしばるなり。然れば拘攣は毒のかゝはりひきつるものなり。これを診する法、やはらかに指を下して、腹中をいろひ探るに、指頭にあたりて、かゝはり引きつるものあり。是れすなはち拘攣なり。",
      yaku: "だから腹証を知ろうとするなら、まず目安とする語の字義をよく味わい考えるべきである。「衝」は突く、向かうの意で、毒が頭のほうへ突き上がることである。「拘」は手でとどめる意であり、また抱え込む（擁）意でもある。「攣」はつなぎひきつる（係攣）意で、縄で引きつらせて縛ることである。そうであれば、拘攣とは毒がつっぱって引きつるものである。これを診る方法は、やわらかに指を下ろして腹の中をさわり探ると、指先に当たってつっぱり引きつるものがある。これがすなわち拘攣である。" },
    { head: "方意（生薬の役割）", koma: "12L",
      kaki: "夫れ毒腹中にあり、拘攣して上衝す。是れ即ち桂枝湯の主治する所なり。衝逆して毒心胸を過ぐるを以て、嘔する氣味ある故、方中に生姜あり。又拘攣上衝すれば、攣引急迫も其のうちにこもりある故、大棗・甘草あり。是は諸藥各主治する所ありといへども、壹に皆桂芍二味に佐として、拘攣上衝の毒を治するものなり。",
      yaku: "そもそも毒が腹の中にあって、拘攣して上衝する。これがすなわち桂枝湯の主治するところである。突き上げた毒が胸を通り過ぎるので吐き気の気味があり、そのため方中に生姜がある。また拘攣して上衝すれば、ひきつり（攣引）や差し迫った症状（急迫）もその中に含まれているので、大棗と甘草がある。これらの薬にはそれぞれ主治があるが、すべて桂枝・芍薬の二味の補佐として、拘攣・上衝の毒を治すものである。" },

  <li><b>コマ</b>：京都大学貴重資料デジタルアーカイブの画像番号（1コマ＝見開き、R＝右頁、L＝左頁）。押すと原本画像が開きます。</li>
  <li><b>要確認</b>：判読に自信がない字や、読み方を確かめたい点です。</li></ul></section>
  <section><h3>底本</h3><p class="small">『腹証奇覧』正編2巻・後編2巻（1冊）、稲葉克（文礼）著。京都大学附属図書館所蔵（富士川文庫, RB00004915）。利用条件：自由利用（出典表示）。</p></section></div>`;
}
function render(id){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.goto===id));
  if(id==="about"){ $("#page").innerHTML=about(); return }
  const e=D.find(x=>x.id===id)||D.find(x=>x.kind==="方剤")||D[0]; if(!e) return;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.goto===e.id));
  let h=`<div class="page"><h2>${esc(e.title)}<small>${esc(e.yomi||"")}</small></h2>`+
    `<div class="meta">${esc(e.group)}　${e.kind==="方剤"?`第${e.no}図`:esc(e.kind)}　原本：${komaLink(e.koma[0])}〜${komaLink(e.koma[1])}（${esc(e.komaNote||"")}）</div>`;
  if(e.fig) h+=`<div class="fig"><img src="${esc(e.fig.src)}" alt="${esc(e.fig.label)}（腹証図）" data-zoom="${esc(e.fig.src)}" loading="lazy"><div><div class="cap">${esc(e.fig.label)}</div><p class="small">${komaLink(e.fig.koma)}</p><p>${esc(e.fig.desc||"")}</p></div></div>`;
  if(e.intro) h+=`<p class="note" style="margin-top:14px">${esc(e.intro)}</p>`;
  h+=`<div class="tags">${(e.tags||[]).map(t=>`<button class="tag" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>`+modebar();
  h+=`<section id="s-hon"><h3>本文</h3>${e.paras.map((p,i)=>`<div class="para" id="p-${i+1}">${p.head||p.koma?`<h4>${esc(p.head||"")}<span>${komaLink(p.koma)}</span></h4>`:""}${txt(p)}</div>`).join("")}</section>`;
  if(e.tochu&&e.tochu.length) h+=`<section id="s-tc"><h3>頭注</h3>${e.tochu.map((t,i)=>`<div class="tc" id="t-${i+1}"><div class="h">${esc(t.head||"頭注")}<span>${komaLink(t.koma)}</span></div>${txt(t)}</div>`).join("")}</section>`;
  const rel=(e.related||[]).map(r=>D.find(x=>x.id===r)).filter(Boolean);
  if(rel.length) h+=`<section><h3>関連</h3><div class="rel">${rel.map(r=>`<a href="#${r.id}" data-goto="${r.id}">${esc(r.title)}</a>`).join("")}</div></section>`;
  if(e.check&&e.check.length) h+=`<section id="s-chk"><h3>要確認</h3><ul class="check">${e.check.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></section>`;
  $("#page").innerHTML=h+"</div>";
}
function search(q){
  const box=$("#results");
  if(!q.trim()){box.hidden=true;return}
  const ts=terms(q); const hits=[]; const test=s=>s&&ts.some(t=>s.includes(t));
  D.forEach(e=>{
    if(test(e.title)) hits.push({e,where:e.kind==="方剤"?"方剤名":"見出し",text:(e.paras[0]||{}).yaku||"",a:""});
    (e.tags||[]).forEach(t=>{ if(test(t)) hits.push({e,where:"タグ",text:t,a:""}) });
    if(e.fig&&test(e.fig.desc)) hits.push({e,where:"腹証図",text:e.fig.desc,a:""});
    e.paras.forEach((p,i)=>{ if(test(p.kaki+p.yaku)) hits.push({e,where:p.head||"本文",text:p.yaku,a:`p-${i+1}`}) });
    (e.tochu||[]).forEach((t,i)=>{ if(test(t.kaki+t.yaku)) hits.push({e,where:"頭注",text:t.yaku,a:`t-${i+1}`}) });
  });
  const seen=new Set(); const uniq=hits.filter(h=>{const k=h.e.id+h.where+h.text.slice(0,20); if(seen.has(k))return false; seen.add(k); return true});
  const mark=s=>{ let h=esc(s.length>130?snip(s,ts):s); ts.forEach(t=>{ if(t) h=h.split(esc(t)).join(`<mark>${esc(t)}</mark>`) }); return h };
  box.hidden=false;
  box.innerHTML=`<h2>「${esc(q)}」の検索結果 ${uniq.length}件${ts.length>1?`<span class="small">（${esc(ts.slice(0,8).join("・"))} を含めて検索）</span>`:""}</h2>`+
    (uniq.length?uniq.slice(0,80).map(h=>`<a class="hit" href="#${h.e.id}" data-goto="${h.e.id}" data-anchor="${h.a}"><b>${esc(h.e.title)}</b><span class="where">${esc(h.where)}</span><p>${mark(h.text)}</p></a>`).join(""):`<p class="small">該当なし。別の言い方（例：「のぼせ」→「上衝」）でもお試しください。</p>`);
}
function snip(s,ts){ let i=-1; for(const t of ts){ i=s.indexOf(t); if(i>=0)break } i=Math.max(0,i-30); return (i>0?"…":"")+s.slice(i,i+120)+"…" }
let mode="both"; try{ mode=localStorage.getItem("fk-mode")||"both" }catch(e){}
if(!["both","kaki","yaku"].includes(mode)) mode="both";
document.body.dataset.mode=mode;
$("#nav").innerHTML=navHTML();
$("#hint").innerHTML="例："+EX.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join("");
document.addEventListener("click",ev=>{
  const z=ev.target.closest("[data-zoom]");
  if(z){ $("#zoom").innerHTML=`<img src="${esc(z.dataset.zoom)}" alt="">`; $("#zoom").hidden=false; return }
  if(ev.target.closest("#zoom")){ $("#zoom").hidden=true; return }
  const t=ev.target.closest("[data-q],[data-mode],[data-goto]"); if(!t||t.tagName==="BODY") return;
  if(t.dataset.q){ $("#q").value=t.dataset.q; search(t.dataset.q); window.scrollTo(0,0); return }
  if(t.dataset.mode&&t.tagName==="BUTTON"){ mode=t.dataset.mode; document.body.dataset.mode=mode; try{localStorage.setItem("fk-mode",mode)}catch(e){}
    document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode)); return }
  if(t.dataset.goto){ ev.preventDefault(); history.replaceState(null,"","#"+t.dataset.goto); render(t.dataset.goto);
    if(matchMedia("(max-width:760px)").matches){ $("#nav").classList.remove("open"); $("#navbtn").setAttribute("aria-expanded","false"); $("#navbtn").textContent="目次を開く" }
    const a=t.dataset.anchor; requestAnimationFrame(()=>{ const el=a&&document.getElementById(a); (el||$("#page")).scrollIntoView(); }); }
});
$("#q").addEventListener("input",e=>search(e.target.value));
$("#navbtn").addEventListener("click",()=>{const n=$("#nav"),o=!n.classList.contains("open");n.classList.toggle("open",o);$("#navbtn").setAttribute("aria-expanded",o);$("#navbtn").textContent=o?"目次を閉じる":"目次を開く"});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||((D.find(x=>x.kind==="方剤")||D[0])||{}).id);
</script>
