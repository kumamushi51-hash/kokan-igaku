      yaku: "部位は表位で、上部に迫る。\n労気による黄汗で、衝逆して胸がふさがる。肌に潤いがなく、長引くと食噎（食べ物がつかえる病）になる。" },
    { head: "腹証と肌膚の診", koma: "243R–244R",
      kaki: "右圖の如く衝逆して、頭部より項背に及びて強急し、胸前缺盆の邊も亦凝結するものあり。水氣心胸より上頭項に聚まり、肌膚潤澤なく、滑淖ならず。甚しきものは皮膚甲錯枯燥し、腠理密ならず。是れ陽氣盛んならずして、正氣皮膚に達しがたく、却つて上升して下降すること少なく、表虚し下衰へて、諸證ここにあらはる。桂枝加黄耆湯の證なり。其の腹狀は大率桂枝湯によるべしといへども、此の證は特に循按の法を用ひて肌膚の診を審らかにすることを要とす。但其の肌膚の診、図畫の貌すべきなく、文辞の盡すべきにあらず。之を手に得て心に應じ、黙して識るべきのみ。古に所謂、尺を循りて滑濇し、肉の堅脆を審らかにすといふもの、其れ斯の謂なるかな。抑も其の略を言はんに、醫の掌を平らに肌にあて、心胸より腹に至り、輕く循でて下ること幾遍もして、肌膚の正氣の旺衰を察すべし。肌膚温々たる中に、何となくむつくりとしたる意を含みたるものは、正氣旺ずるものとし、何となくがさがさとしたるやうに覺えて、肌膚腠理のしまりなく、わけて胸肺の間は隠然として水氣ありて滿つるの狀あり。夫れより肩背項頸より頭中にさしこみたる水氣あるもの、或いは項背ににきびの如き細疹を發するもあり。凡そ此等の診より心をつけて數人に試み得ば、自ら正氣の旺衰虚實の狀を了解すべし。而して脈を對診し、衛氣の旺衰を察すること、亦微々の間にありとしるべし。丹溪が所謂、肥白にして汗多きもの黄耆に宜しく、黒痩のものに用ひがたきの説も、一偏にして其の要を得たりとは言ひがたし。黒痩・肥白は皮膚の水氣の有無による。且つ自汗・盗汗、正氣の労より出づ。是れ皆黄耆の治するところといへども、偏に水氣のみを去るにあらず。但正氣の労を助けて、肌表に旺ぜしむるものの主とする所なり。故に表和して汗自ら止み、肌實して水自ら去る。何ぞ啻に皮膚の水氣のみ是れ主とせんや。尚本文をみるべし。",
      yaku: "右の図のように衝逆して、頭部から項背（うなじと背）にかけてこわばりひきつり、胸の前の缺盆（鎖骨上窩）のあたりも凝り固まるものがある。水気が心胸から上の頭・うなじに集まり、肌に潤いがなく、なめらかでない。ひどいものは皮膚がさめ肌のように荒れて乾き、きめが密でない。これは陽気が盛んでなく、正気が皮膚に届きにくく、かえって上にのぼって下に降りることが少なく、表が虚し下が衰えて、諸証がここに現れたもので、桂枝加黄耆湯の証である。その腹の状態はおおむね桂枝湯に準じてよいが、この証はとくに撫でさする診法を用いて肌の診察を詳しくすることが要点である。ただし肌の診察は絵に描けるものではなく、言葉で言い尽くせるものでもない。手で得て心で応じ、黙って会得するしかない。古くに「尺膚をなでて滑・濇をみ、肉の堅さ・もろさを詳しくみる」と言うのは、このことであろう。そのあらましを言えば、医者の手のひらを平らに肌に当て、胸から腹へ軽く撫でおろすことを何度も繰り返し、肌の正気の盛衰を察するのである。肌がほかほかと温かい中に、何となくふっくらした感じを含んでいるものは正気が盛んなものとし、何となくがさがさしたように感じ、肌のきめにしまりがなく、とりわけ胸肺のあたりにひそかに水気が満ちている様子があるもの（がこの証である）。そこから肩・背・うなじ・首から頭の中へ差しこむ水気のあるもの、あるいはうなじや背ににきびのような細かい発疹を出すものもある。およそこうした診察に気をつけて何人かに試してみれば、おのずから正気の盛衰・虚実の様子がわかってくる。あわせて脈を診て衛気の盛衰を察することも、ごくわずかな違いの間にあると知るべきである。朱丹渓の「色白で太って汗の多い者には黄耆がよく、色黒でやせた者には用いにくい」という説も、偏っていて要点を得ているとは言いがたい。色黒でやせているか色白で太っているかは、皮膚の水気の有無による。また自汗・盗汗は正気の疲れから出る。これらはみな黄耆が治すところだが、ただ水気を去るだけではない。正気の疲れを助けて肌表に盛んにさせることが主である。だから表が和して汗がおのずから止まり、肌が充実して水がおのずから去るのである。どうして皮膚の水気だけを主とすることがあろうか。さらに本文を見よ。" },
    { head: "条文の解（一）：黄汗と歴節", koma: "244R",
      kaki: "證に曰く、黄汗の病、両脛自ら冷ゆ。假令發熱するも、此れ歷節に屬すと。黄汗の病は表虚によるなり。両脛冷ゆるは、陽氣下に旺ぜざればなり。凡そ表虚するものは氣衝逆す。氣衝逆するものは下部自ら冷ゆ。是れ内因病の常情なり。假令發熱すとも、外因の邪氣にあらざることを知る。此の病、汗歷節より出づるを以て、歷節病に屬するものとするなり。屬は手下につくの意にして、正証にあらざるを示す。歷節は歷節痛みて黄汗出づるの病名。前の烏頭湯の証の下に注す。併せ讀みて其の意を審らかにすべし。",
      yaku: "金匱要略に「黄汗の病で、両すねが自然に冷える。たとえ発熱しても、これは歴節に属する」とある。黄汗の病は表の虚による。両すねが冷えるのは陽気が下で盛んでないからである。およそ表が虚す者は気が衝逆し、気が衝逆する者は下部が自然に冷える。これが内因の病の常である。たとえ発熱しても外因の邪気ではないことがわかる。この病は汗が節々から出るので、歴節病に属するものとする。「属」とは配下につくという意味で、正証ではないことを示す。歴節とは節々が痛んで黄色い汗が出る病の名で、前の烏頭湯の証のところで注した。あわせて読んでその意味を詳しく知るべきである。" },
    { head: "条文の解（二）：食已汗出・暮盗汗は労気", koma: "244R–244L",
      kaki: "食し已りて汗出で、又身常に暮れに盗汗出づる者は、此れ勞氣なり。又は一つある次にする助字にて、それに、またと譯す。食事が已むと汗出づる、それに又身より常々不断に日暮れになると煩躁して寐中に盗汗出づるものは、此れは労氣の然らしむるところなり。盗汗は睡寐の間に出づる汗の名。労氣は前の栄衛倶労と同意にして、正氣の肌膚を衛り固めて、津液を内にめぐらし、腠理へもらさずはずのものが、疲れ憊れて其の守衛を失ひたるをいふ。心氣の労と誤認すべからず。暮れに出づるといふものは、蓋し熱によりて出づるところの汗、虚熱は多く午後より日暮れに出で、且つ盗汗は寐中の汗ゆゑ、故に暮の字を下すなり。",
      yaku: "「食べ終わると汗が出て、さらにいつも日暮れに寝汗が出る者は、これは労気である」。「又」は一つあることに次ぐときの助字で、「それに」「また」と訳す。食事が終わると汗が出て、それに加えてふだんから日暮れになるともだえて寝ている間に寝汗が出るものは、労気によるものである。盗汗とは眠っている間に出る汗の名である。労気とは前の「栄衛ともに疲れる」と同じ意味で、本来、正気が肌を守り固めて津液を内にめぐらせ、腠理へ漏らさないはずのものが、疲れ果ててその守りを失ったことをいう。心気の疲れと誤解してはならない。日暮れに出るというのは、熱によって出る汗で、虚熱は多く午後から日暮れに出るし、寝汗は寝ている間の汗なので「暮」の字を用いたのである。" },
    { head: "条文の解（三）：甲錯・悪瘡・身瞤", koma: "244L–245R",
      kaki: "若し汗出で已りて反つて發熱する者は、久々にして其の身必ず甲錯す。發熱止まざる者は、必ず悪瘡を生ず。凡そ發熱するもの、汗出で已りて解するを常とす。今汗出で已りて發熱するもの、常と反す。故に反といふなり。然れば則ち此の發熱は表証に非ずして、氣血の鬱による。氣血の鬱は乃ち正氣の労なり。此の汗出で、熱久々止まざれば、津液枯竭して其の身必ず甲錯す。甲錯は肌膚あれて鮫皮となるなり。發熱止まざるものは、氣血の鬱が散ぜざるゆゑ、必ず悪瘡を發して癰膿を成すことを知るなり。\n若し身重く、汗出で已りて輒ち輕き者は、久々にして必ず身瞤し、瞤すれば即ち胸中痛む。若し汗いまだ出でざる前に身重く、汗出で已りて輒ち軽きものは、其の身重、肌表の瘀水あるによるなり。此の証久々止まざれば、必ず身瞤動す。瞤はびくびくびりびりとうごくなり。此れ水氣經に入りて衝逆するの候なり。さて身瞤動すれば、其のたび毎に即時に胸中痛む。是れ其の瞤すること水氣の衝逆するものなるがゆゑに、同時に胸中痛み、氣上りて胸を衝くなり。身瞤の下に即の字を以て相接するもの、瞤と痛と間を容れざるの意をみつべし。此の段、較虚候を見る。前段より重きこと一等。",
      yaku: "「もし汗が出終わったのにかえって発熱する者は、長引くと体が必ずさめ肌になる。発熱が止まない者は必ず悪性のできものを生じる」。およそ発熱するものは、汗が出終われば解熱するのが普通である。いま汗が出終わって発熱するのは普通と反対なので「反」という。そうであればこの発熱は表証ではなく、気血の鬱滞による。気血の鬱滞とは正気の疲れである。汗が出て熱が長く止まなければ、津液が枯れて体が必ずさめ肌になる。甲錯とは肌が荒れてさめ皮のようになることである。発熱が止まないものは、気血の鬱滞が散らないので、必ず悪性のできものを出して膿をつくることがわかる。\n「もし体が重く、汗が出終わるとすぐ軽くなる者は、長引くと必ず体がぴくぴく動き、ぴくぴくすると胸中が痛む」。汗がまだ出ないうちは体が重く、汗が出終わるとすぐ軽くなるものは、体の重さが肌表の瘀水によるのである。この証が長く止まなければ、必ず体がぴくぴく動く。瞤とはびくびく、びりびりと動くことで、水気が経脈に入って衝逆する兆候である。体がぴくぴく動くと、そのたびにすぐ胸中が痛む。ぴくぴくするのは水気の衝逆なので、同時に胸中が痛み、気がのぼって胸を衝くのである。「身瞤」の下に「即」の字でつないでいるのは、ぴくつきと痛みの間に間がないことを示す。この段はやや虚の兆候を示し、前段より一段重い。" },
    { head: "条文の解（四）：真の黄汗と治法", koma: "245R–245L",
      kaki: "又腰より以上必ず汗出で、下に汗無く、腰髖弛痛し、物皮中に在るが如き狀あり、劇しき者は食すること能はず、身疼重、煩躁し、小便不利す。此れを黄汗と爲す。桂枝加黄耆湯之を主る。此の一段、前の四段を承けて、又一等の劇證を論ず。故に又の字を以て上に接するなり。腰より以上必ず汗出で、下に汗無しの二句、前の両脛自冷と應ず。下部冷えて汗出づることなきなり。腰以下に及ぶもの、脛冷より一等重きを見る。弛はたるむなり。腰髖は腰のくろろの處ゆゑ、たるみだるきごとく痛む。是れ瘀水と鬱熱とによるなり。物皮中に在るが如き狀とは、麻痺の狀なり。肌を循るに、皮中に一物を隔てたるごとく覺ゆるは、吾が身のやうに覺えぬなり。此れは瘀水腰にあつまりて、陽氣下部にめぐりくだること少なきがゆゑなり。劇しき者は食すること能はずとは、衝逆劇しく胸中窒塞して、食せんとすれども食すること能はざるなり。不能の字、食氣なきを言ふにあらず。食を欲すれども能はざるの意を見るべし。例に曰く、身腫れて冷え、狀周痺の如く、胸中窒がり、食すること能はず、反つて聚痛し、暮れに躁して眠るを得ず、此れを黄汗と爲すと。是れなり。乃ち前の胸中痛の句と応じて一等劇しきに至るを見る。身疼重も亦瘀水と鬱熱とによるなり。前の身重に應ず。煩躁は前の暮盗汗出に應ず。例に所謂暮躁なるもの是れなり。盗汗は是れ睡中の汗にして、いまだ煩躁するに至らざるの意をみる。今是れ煩躁す。其の一等劇しきことをしる。例に所謂暮躁不得眠是れなり。小便不利は氣下降せざるによるなり。以上の諸証をかねて汗出づるものを、真の黄汗病と名づくるものとするなり。\n而して其の治法は、栄衛を和諧して血氣の鬱滞なからしめ、衝氣自ら低くするところの桂枝湯を本方として、更に表托して肌膚を實にするところの黄耆を加へて服さしむれば、陽氣は肌膚に旺じ、衝氣は自ら低降し、腠理自ら固密にして、瘀水止まること能はず、小便自利して、諸証悉く退くもの、信にして徴あり。案ずるに、黄耆二兩、外臺に五兩に作る。是と爲す。今之に從ふ。",
      yaku: "「また腰から上は必ず汗が出て、下には汗がなく、腰がだるく痛み、皮の中に物があるような感じがあり、ひどい者は食べることができず、体が痛く重く、もだえ苦しみ、小便の出が悪い。これを黄汗とする。桂枝加黄耆湯が主る」。この一段は前の四段を受けて、さらに一段激しい証を論じる。だから「又」の字で上につなぐ。「腰から上は必ず汗が出て、下には汗がない」の二句は、前の「両すねが自然に冷える」に応じる。下部が冷えて汗が出ないのである。腰から下に及ぶのは、すねの冷えより一段重い。弛とはたるむことで、腰髖は腰の骨のつなぎ目のところなので、たるんでだるいように痛む。これは瘀水と鬱熱による。「皮の中に物があるような感じ」とは麻痺の様子である。肌をなでると皮の中に何か一枚隔てたように感じるのは、自分の体のように感じないのである。これは瘀水が腰に集まって、陽気が下部にめぐり下ることが少ないためである。「ひどい者は食べられない」とは、衝逆が激しく胸中がふさがって、食べようとしても食べられないのである。「不能」の字は食欲がないことを言うのではなく、食べたいのにできないという意味である。金匱要略の例に「体がむくんで冷え、周痺のようで、胸中がふさがり、食べられず、かえって集まって痛み、日暮れにもだえて眠れない。これを黄汗とする」とあるのがそれである。前の「胸中痛」の句に応じて一段激しくなったことがわかる。体の痛みと重さも瘀水と鬱熱による。前の「身重」に応じる。煩躁は前の「暮れに寝汗が出る」に応じ、例にいう「暮躁」である。寝汗は眠っている間の汗で、まだもだえるには至らない。いまはもだえるので、一段激しいことがわかる。例にいう「暮れにもだえて眠れない」がこれである。小便不利は気が下降しないことによる。以上の諸証をかねて汗が出るものを、真の黄汗病と名づけるのである。\nその治法は、栄衛を和してととのえ、血気の鬱滞をなくし、衝気をおのずから低くする桂枝湯を本方とし、さらに表を支えて肌を充実させる黄耆を加えて服させれば、陽気は肌に盛んになり、衝気はおのずから降り、腠理はおのずから固く密になって、瘀水はとどまることができず、小便がよく出て、諸証はことごとく退く。これは確かで証拠がある。考えるに、黄耆2両を『外台秘要』は5両としている。これが正しい。いまはこれに従う。" }
    ,{"head": "按：本章の五節", "koma": "246R–247R", "kaki": "按ずるに、此の章分ちて五節と爲す。首より爲歷節までを第一節とす。黄汗の病いまだ劇しきを致さざるものは、汗歷節より出づるを以て歷節の屬とするを論ず。食已より勞氣也までを第二節とす。汗出づるの食已にあるもの、胃陽の發越を見るといへども、固より正氣の肌表に旺ぜざるに因るものにして、又常々暮熱・盗汗出づるに至るは、陽氣の已に疲勞に堪へざるに因るものなることを論じて、證より因に及ぼす。前節より重きこと一等。若汗出已より發悪瘡までを第三節とす。勞氣の宣暢せざる、氣血の鬱滞を致せば、鬱熱是に生じて身甲錯し、因りて又悪瘡膿癰を發することあるを論ず。是れ素勞氣に因るといへども、其の鬱をなして瘡を發するもの、陽氣の尚勢ひを張ることあるを見る。若身重より胸中痛までを第四節とす。勞氣の肌表をして虚せしむるや、瘀水經に入りて身瞤し、即ち胸中痛むもの、衝氣胸に逼りて危きを致すを論ず。此の一節、前の第三節の發悪瘡とは、自ら血と水と異候ありて、彼は血の瘀する、悪瘡を發し、此は水の逆する、身瞤をなすに至りて、較虚候の甚しきを見る。真武湯に身瞤の證ありて其の病少陰に位するものと併せ考へて其の意を得べし。又從腰以下章末までを第五節とす。前の四節を承けて各證の劇しきを致すを論ず。其の両脛自ら冷ゆるものは、腰以下汗無く、物皮中に在るが如き狀を致し、胸中痛むものは、窒塞して食すること能はざるを致し、身重に疼を加へ、發熱するものは煩躁を致すに至りて、睡中汗出づるもの、却つて眠ることを得ず、下焦の不利なるもの、衝逆の劇しき、小便不利を致すを、黄汗の正證たるものとし、桂枝加黄耆湯の主る所とす。而して其の病因を示すものは勞氣の二字にありて、前後皆是れ勞氣の由るところに非ざることなし。勞氣の由るところを要すれば、乃ち表虚衝逆、上盛下衰是れなり。其の文簡に、其の旨遠し。照應の間、微意含蓄す。一節は一節より重し。學者此の章を讀みて其の微意を得るものにして、始めて與に醫を言ふべきのみ。", "yaku": "考えるに、この章は五節に分けられる。冒頭から「歴節に属す」までを第一節とする。黄汗の病でまだ激しくなっていないものは、汗が節々から出るので歴節の類とすることを論じる。「食已」から「労気也」までを第二節とする。食後に汗が出るのは胃の陽気の発散を示すとはいえ、もとは正気が肌表で盛んでないためであり、さらにふだんから日暮れの熱と寝汗が出るに至るのは、陽気がすでに疲労に耐えられないためであることを論じて、証から原因に及んでいる。前節より一段重い。「若汗出已」から「発悪瘡」までを第三節とする。労気がのびやかでなく気血の鬱滞を起こせば、鬱熱が生じて体がさめ肌になり、そのため悪性のできものや膿を出すことがあると論じる。これはもとは労気によるが、鬱をつくってできものを出すのは、陽気になお勢いがあることを示す。「若身重」から「胸中痛」までを第四節とする。労気が肌表を虚させると、瘀水が経脈に入って体がぴくつき、すぐ胸中が痛むのは、衝気が胸に迫って危険を招くことを論じる。この節と第三節の「悪瘡を発す」とは、血と水という兆候の違いがあり、あちらは血が瘀して悪瘡を出し、こちらは水が逆して体のぴくつきを起こすので、やや虚の兆候が甚だしい。真武湯に身瞤の証があり、その病が少陰に位置することとあわせて考えれば意味がわかる。「又従腰以下」から章末までを第五節とする。前の四節を受けて、それぞれの証が激しくなることを論じる。両すねが冷えるものは、腰から下に汗がなく皮の中に物があるような状態となり、胸中が痛むものはふさがって食べられなくなり、体の重さに痛みが加わり、発熱するものはもだえるに至り、寝ている間に汗が出るものはかえって眠れなくなり、下焦が通じないものは衝逆が激しくなって小便が出にくくなる。これを黄汗の正証とし、桂枝加黄耆湯が主るものとする。その病因を示すのは「労気」の二字で、前後すべて労気によらないものはない。労気のもとを要約すれば、表虚・衝逆、上盛下衰である。その文は簡潔で趣旨は深い。照応の間に微妙な意味が含まれ、一節ごとに重くなっていく。学ぶ者がこの章を読んでその微妙な意味を得てこそ、はじめてともに医を語ることができる。"}
    ,{"head": "按：梔子豉湯の証を兼ねる（延生堂の発明）", "koma": "247R–248R", "kaki": "○又按ずるに、本文胸中痛といひ、劇しき者は食すること能はずといふもの、之を黄汗の例に考ふるに、胸中窒がり、食すること能はず、反つて聚痛し、暮れに躁して眠るを得ずといふものと同じくして、傷寒論梔子豉湯の證に曰く、發汗吐下の後、虚煩眠るを得ず、劇しき者は必ず反覆顛倒し、心中懊憹すと。又曰く、煩熱、胸中窒がると。又曰く、心中結痛すと、其の證を同じくす。是れ蓋し黄汗も亦其の汗に因りて此の煩熱・胸中痛、及び胸中窒を致すこと一揆にして、暗に梔子豉湯の證を兼ね見はすものなることを知る。且つ後世、黄耆を服すれば其の人をして胸滿せしむといふの説あり（丹溪曰く、黄耆は元氣を補ふ。面黒く形實なる者之を服すれば、人をして胸滿せしむと）。偶黄耆の神なることを知れども、其の妨害を退けて之を用ふることを知らず。蓋し黄耆の材、輕浮、能く正氣を助けて肌表に達すといへども、胸中の鬱を解くことをせざれば、其の氣の升騰するもの胸中に留まり、靄靄として發散すること能はず。是を以て胸滿、若しくは妨食の患ひを致すのみ。今試みに其の見證あるに隨ひて、黄耆の方中に梔子豉湯を合して之を與ふるに、たとひ黒痩多氣胸滿の人といへども、復た妨害あるをみず。是に於いてか廣く施し、多く試みて、黄耆の能を窮め盡すことを得たり。此の考へは友人延生堂の發明に出でて、予も亦試驗すること少なからず。因りて其の美を擅にせず、併せ記して以て同志に示し、以て延生堂の嘉貺を分たんと欲すと云ふ爾。", "yaku": "○また考えるに、本文に「胸中痛」といい「ひどい者は食べられない」というのは、黄汗の例に照らすと「胸中がふさがり、食べられず、かえって集まって痛み、日暮れにもだえて眠れない」というものと同じで、傷寒論の梔子豉湯の証に「発汗・吐・下ののち、虚煩して眠れず、ひどい者は必ず寝返りを繰り返してのたうち、胸中がもやもやと苦しい」、また「煩熱して胸中がふさがる」、また「胸中が結ぼれて痛む」とあるのと証が同じである。思うに黄汗もその汗によってこの煩熱・胸中痛・胸中のふさがりを起こすことは同じで、ひそかに梔子豉湯の証を兼ねて現しているのである。また後世に「黄耆を服すると胸が張る」という説がある（朱丹渓は「黄耆は元気を補う。顔色が黒く体格の充実した者が服すると胸が張る」という）。黄耆の霊妙さを知ってはいても、その妨げを取り除いて用いることを知らないのである。思うに黄耆は軽く浮く性質の薬材で、正気を助けて肌表に届かせるが、胸中の鬱を解かなければ、のぼった気が胸中にとどまり、もやもやとして発散できない。そのため胸が張ったり食事が妨げられたりするだけである。いま試しに、その証が見られるときに黄耆の方に梔子豉湯を合わせて与えると、たとえ色黒でやせ、気が多く胸の張る人でも、もはや妨げは見られない。そこで広く用い、多く試して、黄耆のはたらきを究めることができた。この考えは友人の延生堂の発明によるもので、私も試したことが少なくない。そこでその手柄を独り占めせず、あわせて記して同志に示し、延生堂の贈り物を分かちたいと思う。"}
    ,{"head": "附 黄耆桂枝五物湯", "koma": "248R–249R", "kaki": "黄耆桂枝五物湯の方は、血痺、身體不仁するものを治す。其の方たるや、桂枝加黄耆湯の方内に甘草を去りて生姜を増加するもの。余竊かに其の去加する所に就きて方意を考ふるに、血痺といひ不仁といふもの、亦勞氣の然らしむる所にして、之を桂枝加黄耆湯に比するに、其の全躰の病狀急迫の證なし（發熱・煩躁・汗出・身疼の類、急迫の狀を見るべし）。甘草を去る所以なり。而して其の陰陽微なるもの、内に抑遏する所あるを見る。其の抑遏するものは、蓋し下焦に在らずして、上中二焦の間にあり。胃上の寒飲是れなり。生姜を増加する所以なり。生姜能く寒を下し水を去り、以て胃口を豁にして陽氣を升騰し、桂・耆・芍力を戮せて、身體に分布し、肌膚に宣暢せしむ。血脈之に因りて活溌流動し、痺不仁の患ひ隨ひて去る所以なり。是れ亦桂・耆の功なり。知らずんばあるべからず。方極に云ふ、桂枝加黄耆湯の証にして急迫せず嘔する者と。愚謂へらく、此れ但去加に就きて之を言ふのみ。本文の証に考ふる所なし。此の証、桂枝ありといへども衝逆の証なし。痺不仁の外証、嘔を發すべきの候なし。嘔を以て生姜を増加するにあらざることをしるべし。\n證に曰く、血痺、陰陽倶に微、寸口關上微、尺中小緊、外證身體不仁、風痺の狀の如きは、黄耆桂枝五物湯之を主ると。血痺は血脈澁滯して麻痺するの名なり。此の血脈渋滞するゆゑんは、陽氣の宣暢せざるによる。陽氣宣暢せざれば、陰氣其の虚に乗じて、身体冷え、手足厥逆、悪寒等の証を發するを常とす。今血痺すれども陰氣も亦微なり。故に陰陽倶に微といふなり。或いは曰く、此の一句脈証を擧ぐるものと。然れども傍例に依るときは、脈証特起せず。必ず脈の字を陰陽の上に冠らしむ。若し脈証をいふものならば、陰陽の上、脈の字を脱するなるべし。但二氣倶に微とするもの、其の意優なるに似たり。案ずるに、寸口關上微、尺中小緊の九字は正文にあらず。注文誤りて正文に混ずるもの。若し然らざれば叔和の補添なるべし。古文脈証を擧ぐるは、但其の疑途を辨ずる較に梗概を言ふのみ。寸関尺を細別せず。他に例して知るべし。風痺は、正氣虚して邪氣犯し入りて麻痺不仁するの名。此の証は外来の邪の致すところにあらず。但正氣疲労して血脈行らざるもの故に、風痺の狀の如しと曰ひて其の異なるをしめすなり。此の病証、金匱に虚労と並べ論ず。所謂労氣なるもの推し考ふべきなり。", "yaku": "黄耆桂枝五物湯は、血痺で体の感覚がなくなるものを治す。その方は桂枝加黄耆湯から甘草を去って生姜を増したものである。私はひそかにその加減から方意を考えてみた。血痺・不仁というのもまた労気によるものだが、桂枝加黄耆湯に比べると、全体の病状に急迫の証がない（発熱・煩躁・汗出・身疼の類が急迫のさまである）。これが甘草を去る理由である。そして陰陽がともに微であるのは、内に押さえつけるものがあることを示す。その押さえつけるものは下焦ではなく、上焦と中焦の間にある。胃の上の寒飲である。これが生姜を増す理由である。生姜は寒を下し水を去り、胃の入口を開いて陽気をのぼらせ、桂枝・黄耆・芍薬が力を合わせて全身に行きわたらせ、肌にのびやかにさせる。血脈はこれによって活発に流れ動き、しびれ・感覚まひの患いはそれにつれて去る。これも桂枝・黄耆の功であることを知っておかなければならない。『方極』には「桂枝加黄耆湯の証で急迫せず、嘔吐する者」とある。私が思うに、これは加減についてだけ言ったもので、本文の証からは考えていない。この証は桂枝があっても衝逆の証がなく、しびれ・感覚まひの外証には嘔吐を起こす兆候もない。嘔吐のために生姜を増すのではないと知るべきである。\n金匱要略に「血痺で、陰陽がともに微、寸口・関上が微、尺中が小緊、外証として体の感覚がなく、風痺のようなものは、黄耆桂枝五物湯が主る」とある。血痺とは血脈が渋り滞って麻痺することの名である。血脈が渋り滞るのは陽気がのびやかでないことによる。陽気がのびやかでなければ、陰気がその虚に乗じて、体が冷え、手足が冷えあがり、悪寒などの証を起こすのが常である。いま血痺しても陰気もまた微である。だから「陰陽ともに微」という。ある人は「この一句は脈証を挙げたもの」と言う。しかし類例によれば、脈証は単独では起こさず、必ず「脈」の字を陰陽の上にかぶせる。もし脈証を言うのなら、陰陽の上の「脈」の字が脱けているのだろう。ただ二気がともに微とする方が意味がよいようである。考えるに「寸口関上微、尺中小緊」の九字は正文ではなく、注文が誤って正文に混じったもので、そうでなければ王叔和が補い添えたものだろう。古文が脈証を挙げるのは、ただ疑わしい点を弁別するためにあらましを言うだけで、寸・関・尺を細かく分けない。ほかの例から知るべきである。風痺とは、正気が虚して邪気が侵入し、麻痺して感覚がなくなることの名である。この証は外来の邪によるものではなく、ただ正気が疲労して血脈がめぐらないものなので、「風痺のような」と言ってその違いを示したのである。この病証は金匱要略で虚労と並べて論じている。いわゆる労気であることを推し量るべきである。"}
    ,{"head": "附 黄耆桂枝苦酒湯（黄汗と黄疸の別）", "koma": "249R–250R", "kaki": "黄耆桂枝苦酒湯は、黄汗、身體腫れ、發熱汗出づるものを治す。此の方も黄耆以て之が主とし、桂・芍以て之が佐とし、之を煮るに苦酒を以てするもの。前の五物湯に比するに、其の去るところのもの生姜・大棗にして、其の加ふるところ苦酒なり。而して其の證たる身體腫れ、汗出づるもの、肌表の水多くして正氣の旺ずること少なきを以て、黄耆を主とすること、前に詳らかにするが如し。其の發熱汗出づるものも亦桂枝加黄耆湯と其の旨趣を同じくすといへども、其の異なるところ只黄汗尤も黄にして蘗汁の如きにあり。是れ蓋し血脈の鬱結、熱氣内に薫じて其の色を成すもの。苦酒能く其の鬱を解き、筋脈を和するを以て、其の熱自ら消散するものか（案ずるに、黄汗と黄疸と其の病自ら異なり。黄汗は出づるところの汗衣を沾して黄色を見し、黄疸は一身面目悉く黄色を發す。故に發黄ともいふ。黄汗は表虚・鬱熱、黄疸は飲食・女労、其の因同じからず。金匱を読みて審らかにすべし）。\n證に曰く、黄汗の病たる、身體腫れ、發熱し、汗出でて渴し、狀風水の如く、汗衣を沾し、色正黄にして蘗汁の如く、脈自ら沈云云、黄耆桂枝苦酒湯之を主ると。身躰腫るるは肌表の瘀水多きなり。肌表の瘀水多きは、正氣の衰虚に因るなり。黄耆の分量多きもの之が為なり。發熱するものは血氣の鬱なり。發熱するが故に汗も亦出づ。汗出づるに因りて内其の渇を致す。故に發熱汗出でて渇すと曰ふ。風水の身腫・脈浮・汗出、其の狀相似たり。故に狀風水の如しと曰ふ。然れども風水は其の汗黄ならず、其の脈沈ならず。故に汗色と脈狀とを擧げて其の疑途を辨ずるなり。風水は外邪の感ずるもの、脉浮なるゆゑんなり。此の証は陽氣の宣暢しがたきもの、發熱すれども脈沈なるゆゑんなり。自ら沈といふもの、本分の脈証にして、他の妨害によらざるの意みつべし。案ずるに、前後問荅の文は後人の補綴なり。故に之を刪る。\n以上二方、皆桂枝加黄耆湯より來るものにして、一は汗出の證なく、一は汗出の證あり。其の勞氣を因として、汗出の有無によらざるの意見るべし。其の肌肉の診法、まさに前に依りて照らし得べし。", "yaku": "黄耆桂枝苦酒湯は、黄汗で体がむくみ、発熱して汗が出るものを治す。この方も黄耆を主とし、桂枝・芍薬を佐とし、苦酒（酢）で煮るものである。前の五物湯と比べると、去ったものは生姜・大棗で、加えたものは苦酒である。その証の体のむくみ・汗出は、肌表の水が多く正気の盛んさが少ないためなので黄耆を主とすることは、前に詳しく述べたとおりである。発熱して汗が出るのも桂枝加黄耆湯と趣旨は同じだが、異なるのは黄汗がとりわけ黄色く、黄檗の汁のようであることだけである。思うにこれは血脈の鬱結で熱気が内にこもってその色をつくるもので、苦酒がその鬱を解き筋脈を和するので、熱がおのずから消散するのであろうか（考えるに、黄汗と黄疸はもともと別の病である。黄汗は出る汗が衣服をぬらして黄色に見え、黄疸は全身と顔・目がすべて黄色になる。だから発黄ともいう。黄汗は表虚と鬱熱、黄疸は飲食と房事によるもので、原因が同じでない。金匱要略を読んで詳しく知るべきである）。\n金匱要略に「黄汗の病は、体がむくみ、発熱し、汗が出て口が渇き、風水のようで、汗が衣服をぬらし、色はまさに黄色で黄檗の汁のよう、脈はおのずから沈…（中略）…黄耆桂枝苦酒湯が主る」とある。体がむくむのは肌表の瘀水が多いのである。肌表の瘀水が多いのは正気の衰えによる。黄耆の分量が多いのはそのためである。発熱するのは血気の鬱である。発熱するので汗も出る。汗が出るので内に渇きを起こす。だから「発熱し汗が出て渇く」という。風水の体のむくみ・脈浮・汗出と様子が似ているので「風水のよう」という。しかし風水は汗が黄色くなく、脈は沈でない。だから汗の色と脈の状態を挙げて紛らわしさを弁別するのである。風水は外邪に感じたもので、だから脈が浮である。この証は陽気がのびやかになりにくいもので、だから発熱しても脈は沈である。「おのずから沈」というのは本来の脈証で、他の妨げによるのではないという意味である。考えるに、前後の問答の文は後人が補い綴ったものなので削った。\n以上の二方はどちらも桂枝加黄耆湯から来たもので、一方は汗出の証がなく、一方は汗出の証がある。労気を原因とし、汗の有無によらないという意味を見るべきである。その肌肉の診法は、前の方法に照らしてわかるはずである。"}
    ,{"head": "附 防已黄耆湯", "koma": "250R–251L", "kaki": "防已黄耆湯の方、水氣皮膚に在りて腫るるが如く、或いは腫るるものを治す。其の方、防已を以て君とし、黄耆・朮之が臣たりといへども、其の黄耆を伍する所以に律ならざることなし。而して其の意、專ら正氣を徤運せしめて、浮行の水氣をして回降せしむるにありて、他の氣血の鬱滞を解和するの意なし。桂・芍を伍せざる所以なり。其の表虚水氣を診するの法、病人肌膚肥白にして、之を捫するに其の肉軟虚にしてしまりなく、ださださとするもの、是れ正氣表に旺ぜずして浮水泛濫するものなり。腫るるには非ずといへども、以て表虚水氣とすべし。此の證、男女老少を問はずといへども、多くは室女許嫁の年齒より以上、廿歳の前後にして、卒に肥満をなして、衝逆つよく、両瞼紅にして、經水短少、心氣鬱々として開けざるもの、此の證あり。是れ其の肥満を成すもの、成長の時に當たりて可なるに似たりといへども、其の實は表虚に屬して、以て佳候とすべからず。醫若し其の經行不利なるを見て、誤りて通經破血の劑を投ぜば、徒らに効を奏せざるのみならず、反つて禍端を啓くことあらん。又嘗て記す、一男子痼冷を患ふこと年あり。夏月に重衣・襪を着け、遍く温熱の劑を服して寸効なし。京師に來たりて名醫の診を請へども効を見ず。一醫生あり、深く考へて此の方を與ふること一月許りにして、病痾全く愈ゆと。其の證たる一概にすべからずといへども、見るところなきに非ず。故に併せ錄して以て一案とす。\n證に曰く、風濕、脈浮、身重く、汗出でて悪風する者は、防已黄耆湯之を主ると。脈浮・汗出・悪風、是れ風感の証なり。身重は肌表に湿氣ある候なり。此の方、風邪發散の藥劑にあらず。專ら肌表を實にして水氣を回降して小便より利しさればば、素湿と氣と相感ずるところの風邪なれば、治せずして自ら去るものとしるべし。又案ずるに、此の証汗出をいふもの、風氣によるなり。故に汗の有無、以て必とすべからず。又此の方、風水にも用ゆ。然れども湿を治するの意多きに似たり。風湿及び湿水の辨は前にあり。", "yaku": "防已黄耆湯は、水気が皮膚にあってむくんだように見えるか、実際にむくむものを治す。この方は防已を君とし、黄耆・朮を臣とするが、黄耆を配合する理由にはきちんとした筋道がある。その意図はもっぱら正気を力強くめぐらせて、浮かんでいる水気をめぐらせて下させることにあり、ほかに気血の鬱滞を解き和する意味はない。桂枝・芍薬を配合しないのはそのためである。表虚の水気を診る方法：病人の肌が色白で太っていて、なでると肉が軟らかく虚してしまりがなく、だぶだぶしているもの、これは正気が表で盛んでなく浮いた水があふれているものである。むくんではいなくても、表虚の水気とみなしてよい。この証は男女老若を問わないが、多くは娘が嫁入りする年ごろから二十歳前後で、急に太りだし、衝逆が強く、両まぶたが赤く、月経が短く少なく、気分がふさいで晴れない者にこの証がある。太るのは成長期にあっては結構なことのようだが、実は表虚に属するもので、よい兆候とはいえない。医者がもしその月経不順を見て、誤って月経を通じ血を破る剤を与えれば、効果がないばかりか、かえって災いの端緒を開くことになろう。またかつてこんな例を記した。ある男性が長年頑固な冷えを患い、夏でも重ね着して足袋をはき、あらゆる温める剤を飲んでも少しも効かなかった。京都に来て名医の診察を受けても効果がなかった。ある医学生がよく考えてこの方を与えたところ、ひと月ほどで病がすっかり治ったという。その証は一概には言えないが、参考になるところがないわけではないので、あわせて記して一つの案とする。\n金匱要略に「風湿で、脈が浮、体が重く、汗が出て風を嫌う者は、防已黄耆湯が主る」とある。脈浮・汗出・悪風は風に感じた証である。体の重さは肌表に湿気がある兆候である。この方は風邪を発散させる薬剤ではない。もっぱら肌表を充実させ、水気をめぐらせ下して小便から出してしまえば、もともと湿と気が感じ合っての風邪なので、治そうとしなくてもおのずから去るものと知るべきである。また考えるに、この証で汗出というのは風気によるので、汗の有無を必須とすべきではない。またこの方は風水にも用いるが、湿を治す意味が多いようである。風湿と湿水の区別は前に述べた。"}
    ,{"head": "附 防已茯苓湯", "koma": "251L–252R", "kaki": "防已茯苓湯は、皮水の病、四肢腫れて、衝逆・肉瞤するものを治す。是れ亦正氣皮膚に達せずして腫滿するもの、加ふるに水氣衝逆して肉瞤するに至るは、茯苓の主治するところ多きを以て、茯苓を君とし、防已・黄耆・桂枝・甘草相伍して以て之を佐け、以て正氣を宣べ、衝氣を低からしめ、水氣を利し去るの意見るべし（或いは曰く、腫満堅く硬くして之を循るに潤沢なきこと、譬へば革嚢に水を盛りて其の口を括りたるごとく、かさかさとして堅き腫は、陽氣の腕（?）なり。或いは十分に水気ありながら、其の腫肌表に達せず、皮膚に皺あるもの、亦陽気の腕（?）にして、多くは不治に至るものなり。此の方を用ひ、或いは附子を加ふと云々）。\n證に曰く、皮水の病たる、四肢腫れ、水氣皮膚の中に在り、四肢聶聶として動く者は、防已茯苓湯之を主ると。聶々は微動の貌、びくびくびりびりとうごく、即ち肉瞤の狀貌なり。此の証、正氣皮膚にとどかずして、水氣泛濫するもの、皮表にあり。皮水と名づくる所以なり。聶々として動くものは、水氣經に入り、且つ衝逆するに因りて發す。是れ皆表虚多水の候なり。\n以上二方、黄耆主藥に非ずといへども、表水を于り全功を収むるもの、黄耆を伍するにあり。是を以て黄耆諸劑の下に標出して、之を前の諸証に隷属す。讀むもの歷観して其の旨を得べきなり。", "yaku": "防已茯苓湯は、皮水の病で、手足がむくみ、衝逆して筋肉がぴくつくものを治す。これも正気が皮膚に届かずにむくみ張るもので、さらに水気が衝逆して筋肉がぴくつくに至るのは茯苓の主治するところが多いので、茯苓を君とし、防已・黄耆・桂枝・甘草を組み合わせて助け、正気をのびやかにし、衝気を下げ、水気を出して去らせるという意味を見るべきである（ある人は言う。むくみが硬く張って、なでても潤いがなく、たとえば革袋に水を入れて口を縛ったように、かさかさして硬いむくみは、陽気の衰え（?）である。あるいは十分に水気がありながら、むくみが肌表に達せず、皮膚にしわがあるものも陽気の衰え（?）で、多くは不治に至る。この方を用いるか、附子を加える、など）。\n金匱要略に「皮水の病は、手足がむくみ、水気が皮膚の中にあり、手足がぴくぴく動く者は、防已茯苓湯が主る」とある。聶々とはかすかに動くさまで、びくびく、びりびりと動く、すなわち筋肉がぴくつくさまである。この証は正気が皮膚に届かず、水気があふれて皮表にある。皮水と名づけるわけである。ぴくぴく動くのは、水気が経脈に入り、かつ衝逆するために起こる。これらはみな表虚で水の多い兆候である。\n以上の二方は黄耆が主薬ではないが、表の水を除いて十分な効果を上げるのは黄耆を配合しているからである。そのため黄耆の諸剤の下に掲げて、前の諸証に属させた。読む者は通して見てその趣旨を得るべきである。"}
  ],

      yaku: "右の図のように水気が上部に集まり、喘鳴と咳で息が苦しく、全身がむくみ、脈は浮で、自然に汗が出るか、あるいは汗がない。その心胸のあたりを手のひらを伏せて押さえると、皮膚を隔てて熱のある様子がわかり、たとえば熱い灰を袋に入れてその上から押さえるような感じがするものを伏熱の兆候として、越婢湯の正証とする。" },
    { head: "条文の解", koma: "253R–253L",
      kaki: "證に曰く、風水、惡風し、一身悉く腫れ、脈浮、渴せず、續いて自汗出で、大熱無きは、越婢湯之を主ると。此の証は風邪表を閉ぢて開かず、水氣發越し難きを以て一身悉く腫るるなり。悪風・脈浮は風邪の証なり。渇すべくして渇せず。故に不渇をいふなり。此の証、心胸の熱伏す。渇を發すべき候あれども、水氣專ら上部にこごみあつまるを以て、渇を發せざるなり。續いて自汗出づるは、きれてなく出づるなり。此の汗、表証の汗出と異なり。風邪表を閉ぢてひらかず、水氣之に溢れて伏熱となり、發散せんとすれども發散すること能はず。因りて薫蒸して汗出づ。故にきれてなくいづるなり。此の汗の分辨は、熱自ら大くなりあるを以てしるべし（?）。大熱は表熱なり。皮表にはつはつとする熱なくして、肌肉の内にわこぎみあしき熱を伏したるの謂を、大熱無しといふなり。此の熱が汗をも出し、水氣をもこずみあげしめて、喘をもおこすゆゑにして、石膏を伍するもの之がためなり。\n按ずるに、此の證、風水をいふといへども、前の防已黄耆湯の風水とは虚實の異あるものと知るべし。其の方意を考ふるに、麻黄主として表閉を開き、大棗佐として喘咳をゆるめ、石膏心に入りて伏熱を解すれば、水氣は汗と小便とに去り、風邪は發散して治すべし。若し夫れ水氣專ら胸中に聚まるものは、腠理緊閉して動くによるものと知るべし。是の故に表に於いては邪氣の實を攻め去るの意專ら多し。",
      yaku: "金匱要略に「風水で、風を嫌い、全身がことごとくむくみ、脈は浮、口渇はなく、引き続いて自然に汗が出て、大熱がないものは、越婢湯が主る」とある。この証は風邪が表を閉じて開かず、水気が外へ発散しにくいので、全身がことごとくむくむのである。悪風・脈浮は風邪の証である。渇いてよいはずなのに渇かないので「不渇」という。この証は心胸に熱が伏している。渇きを起こすはずの兆候があるのに、水気がもっぱら上部にかがまり集まっているので、渇きを起こさないのである。「続いて自汗出づ」とは、途切れなく出ることである。この汗は表証の汗とは異なる。風邪が表を閉じて開かず、水気がそこにあふれて伏熱となり、発散しようとしてもできない。そのため蒸されて汗が出る。だから途切れなく出るのである。この汗の見分けは、熱の様子から知るべきである（?）。大熱とは表の熱である。皮表にかっかとする熱がなく、肌肉の内に何となく気持ちの悪い熱を伏しているという意味を「大熱無し」という。この熱が汗を出させ、水気をも突き上げさせて喘鳴を起こすので、石膏を配合するのである。\n考えるに、この証は風水というが、前の防已黄耆湯の風水とは虚実の違いがあると知るべきである。その方意を考えると、麻黄を主として表の閉塞を開き、大棗を佐として喘咳をゆるめ、石膏が心に入って伏熱を解けば、水気は汗と小便に去り、風邪は発散して治るはずである。水気がもっぱら胸中に集まるものは、腠理が固く閉じて（水が）動くためと知るべきである。だから表においては邪気の実を攻め去る意味がもっぱら多い。" },
    { head: "附 越婢加朮湯", koma: "253L–254L",
      kaki: "○若しくは前證にして小便不利、或いは脚弱のものは、越婢加朮湯の證なり。脚弱とは、脚膝がくがくぶらぶらとして力なく、動もすれば蹶かんとするものをいふ。脚氣痿弱などにも、前に辨ずるごとく胸満・喘咳等の證あらば、此の方を用ふべし。\n證に曰く、裡水は越婢加朮湯之を主る。麻黄甘草湯も亦之を主ると。又曰く、裡水、一身面目黄腫し、其の脈沈、小便不利、故に水を病ましむ。越婢加朮湯之を主ると。裡は心胸の位なり。心胸間に聚まるところの水氣、小便利すれば自ら去るべし。然るに小便不利なるが故に、專ら上部にあつまり、一身にあふれて水腫となるなり。上部をすかし表を發し、兼ねて小便を利すれば愈ゆるなり。故に朮を加へて小便を利す。麻黄甘草湯は、表閉ぢて水氣胸中にあつまり、喘急息迫のものを治す。伏熱・小便不利等の証なきものを其の別とす。黄腫は淡黄にして黄疸の色とことなり。案ずるに、令病水の下、假如小便自利云云の十四字、正文に似ず。故に之を刪る。\n又曰く、肉極を治す。内熱すれば則ち身體津脱し、腠理開き、汗大いに泄れ、厲風の氣あり、下焦脚弱しと。此の章は千金の文なり。内は心胸内なり。熱は伏熱なり。極はとまりまでやるなり。越婢湯の証にある熱は裡熱なるゆゑ、内よりむしたてて自汗が出づるなり。其の熱を解かざれば、遂に身躰の津液を脱す。津液脱すれば、腠理開きて汗大いにもれいづるに至る。汗大いに泄るれば表虚して、邪風の入り来たること遮るべからざるをおそる。厲は…（判読不確実）…氣づかふの義なり。以上は越婢湯の治を怠る（?）なりゆきを論ず。越婢湯の証を説くに非ず。下焦脚弱の四字、語を成さざるに似たり。恐らくは上下脱誤あらんか。姑く文に随ひて解せば、越婢湯は表閉ぢ熱伏して、水氣專ら上部にあつまるゆゑ、其の勢ひにて下焦に氣降らず、因りて脚弱をなす。下焦に氣發せざれば、小便も利せず。故に方内に朮を加ふるの意なるべし。然らずんば、津脱し腠理開き汗大いに泄るるの後、此の麻黄劑を用ふるの理あらんや。讀者思へ。",
      yaku: "○あるいは前の証で小便の出が悪いか、脚が弱いものは、越婢加朮湯の証である。脚弱とは、脚や膝ががくがく、ぶらぶらして力がなく、ややもするとつまずきそうになるものをいう。脚気の萎えなどにも、前に述べたように胸満・喘咳などの証があれば、この方を用いよ。\n金匱要略に「裏水は越婢加朮湯が主る。麻黄甘草湯もこれを主る」、また「裏水で、全身と顔・目が黄色くむくみ、脈は沈、小便の出が悪いので水を病む。越婢加朮湯が主る」とある。裏とは心胸の位置である。心胸の間に集まった水気は、小便が出ればおのずから去るはずである。ところが小便が出にくいので、もっぱら上部に集まり、全身にあふれて水腫となる。上部を通じさせ、表を発し、あわせて小便を出せば治る。だから朮を加えて小便を出す。麻黄甘草湯は、表が閉じて水気が胸中に集まり、喘鳴して息が迫るものを治す。伏熱や小便不利などの証がないことで区別する。黄腫とは淡い黄色で、黄疸の色とは異なる。考えるに「令病水」の下の「仮如小便自利」など14字は正文らしくないので削った。\nまた『千金方』に「肉極を治す。内に熱があると体の津液が抜け、腠理が開き、汗が大量に漏れ、悪い風の気があり、下焦の脚が弱る」とある。内とは心胸の内、熱とは伏熱、極とは行きつくところまで行くことである。越婢湯の証の熱は裏熱なので、内から蒸し立てて自汗が出る。その熱を解かなければ、ついに体の津液が抜ける。津液が抜ければ腠理が開いて汗が大量に漏れ出るに至る。汗が大量に漏れれば表が虚して、邪風が入ってくるのを防げないことを恐れる。厲とは…（判読不確実）…気づかうという意味である。以上は越婢湯の治療を怠った（?）場合のなりゆきを論じたもので、越婢湯の証を説いたものではない。「下焦脚弱」の四字は文になっていないようで、おそらく前後に脱落や誤りがあるのだろう。とりあえず文に従って解すれば、越婢湯の証は表が閉じて熱が伏し、水気がもっぱら上部に集まるので、その勢いで下焦に気が降りず、そのため脚が弱る。下焦に気が発しなければ小便も出ない。だから方の中に朮を加えるという意味であろう。そうでなければ、津液が抜け腠理が開き汗が大量に漏れたあとに、この麻黄剤を用いる道理があろうか。読者はよく考えよ。" },
    { head: "附 越婢加朮附湯・越婢加半夏湯", koma: "254L",
      kaki: "一　若しくは前方の證にして腰脚疼痛し、或いは脚氣痿弱・麻痺する者は、越婢加朮附湯を用ふべし。此の証、腰脚冷えを得べし。\n一　若しくは前の越婢湯の證にして欬して上氣喘急する者は、半夏を加ふ。\n證に曰く、欬して上氣す。此れを肺脹と爲す。其の人喘し、目脱する狀の如く、脈浮大なる者は、越婢加半夏湯之を主ると。上氣は氣頭面に上るなり。上衝と異なり。例に曰く、上氣、面浮腫、肩息すと。是れなり。上氣はせきのぼせなり。咳は肺部の不利より出づ。故に肺脹とす。痰飲の上にせまるを思ふべし。此の証、表閉づる故に必ず喘す。目脱する狀の如しは、咳きあげて面腫れ、咳に因りて目球も脱け出づるやうにみゆるをいふ。脈浮大なるものも亦上氣の候なり。此の証、專ら痰飲肺位にせまりふくれて、喘咳上氣するもの。表閉ぢて熱裡にあるの候あり。因りて越婢湯に半夏を加へて治するなり。\n一　若しくは越婢湯の證に似て、脚弱疼痛、及び水腫等の證なり（あり?）、……（以下、11冊本に欠丁あり）",
      yaku: "一　あるいは前の方の証で、腰や脚が痛むか、脚気で萎えてしびれる者には、越婢加朮附湯を用いよ。この証では腰や脚の冷えが確かめられるはずである。\n一　あるいは前の越婢湯の証で、咳をして気がのぼり、喘鳴して息が苦しい者には半夏を加える。\n金匱要略に「咳をして気がのぼる。これを肺脹とする。その人は喘鳴し、目が飛び出しそうな様子で、脈が浮大の者は、越婢加半夏湯が主る」とある。上気とは気が頭や顔にのぼることで、上衝とは異なる。金匱の例に「上気して顔がむくみ、肩で息をする」とあるのがそれである。上気とは咳き込んでのぼせることである。咳は肺の部位の不調から出るので肺脹とする。痰飲が上に迫っていることを考えるべきである。この証は表が閉じているので必ず喘鳴する。「目が飛び出しそう」とは、咳き上げて顔がむくみ、咳のために眼球も飛び出しそうに見えることをいう。脈の浮大も上気の兆候である。この証はもっぱら痰飲が肺の位置に迫って膨れ、喘咳・上気するもので、表が閉じて熱が裏にある兆候がある。そこで越婢湯に半夏を加えて治すのである。\n一　あるいは越婢湯の証に似て、脚の弱りと痛み、むくみなどの証である（がある?）……（以下、11冊本に欠けた丁がある）" },
    { head: "附 麻黄杏仁石膏甘草湯", koma: "255R",
      kaki: "（欠丁の後）……表閉ぢて水氣心胸に聚まり、喘急し、汗出でて渇し、或いは渇せず、其の腹狀は腹脹りて皮上にりんとしたる力あり。之を按ずるに大熱なくして身熱を覺ゆること、白虎の如く越婢に似るものを、麻黄杏仁石膏甘草湯の證とす。要するに大抵白虎の腹狀に似て、表証多く、上部に聚まりて喘するを以て此の證と定むべし（白虎湯の腹狀、下冊に之を詳らかにす）。\n論に曰く、發汗の後、更に桂枝湯を行ふべからず。汗出でて喘し、大熱無き者は、麻黄杏仁石膏甘草湯之を主ると。發汗し汗出で表解けて後、更に桂枝湯を行ふべからず。若し發汗し汗出でて喘し、反つて大表の發熱なく、裡熱の伏するあるもの、此の方の主るところとするなり。此に汗出でて喘すといふもの、越婢湯の續いて自汗出づると其の証を同じくして、薫蒸熱鬱の自汗なり。故に汗出づれども表解けずして喘を發す。是れ麻黄・杏仁を主とするゆゑんなり。自汗出でて大熱なきもの、是れ石膏あるゆゑんなり。渇をいはざるものは、表証多く、水氣胸腑にあればなり。",
      yaku: "（欠けた丁のあと）……表が閉じて水気が心胸に集まり、喘鳴して息が苦しく、汗が出て口が渇くか、あるいは渇かない。その腹の状態は、腹が張って皮の上にぴんとした力がある。按じると大熱はないが体の熱を感じ、白虎湯のようで越婢湯に似ているものを、麻黄杏仁石膏甘草湯（麻杏甘石湯）の証とする。要するに、おおむね白虎湯の腹の状態に似て、表証が多く、上部に集まって喘鳴することでこの証と定めるべきである（白虎湯の腹の状態は下冊で詳しく述べる）。\n傷寒論に「発汗したのち、さらに桂枝湯を与えてはならない。汗が出て喘鳴し、大熱のない者は、麻黄杏仁石膏甘草湯が主る」とある。発汗して汗が出て表が解けたのちは、さらに桂枝湯を与えてはならない。もし発汗して汗が出て喘鳴し、かえって表の大きな発熱がなく、裏熱が伏しているものは、この方の主るところとする。ここで「汗出でて喘す」というのは、越婢湯の「続いて自汗出づ」と同じ証で、蒸されて熱がこもった自汗である。だから汗が出ても表が解けずに喘鳴を起こす。これが麻黄・杏仁を主とする理由である。自汗が出て大熱がないのは、石膏がある理由である。渇きを言わないのは、表証が多く、水気が胸にあるからである。" },
    { head: "附 麻黄杏仁薏苡甘草湯", koma: "255L–256R",
      kaki: "一　右此の方内、石膏を去りて薏苡に代ふるときは、麻黄杏仁薏苡甘草湯なるものにして、風濕身疼み、發熱するものを治す。此の證、裡熱なく、表閉ぢて喘急し、皮膚の水氣發して出づること能はざるを以て、一身疼み、發熱す。蓋し麻黄は表を發し、杏仁は喘を治し、薏苡は濕を去り、甘草は急を緩めて、風除き濕乾く。凡そ此等の方、皆表邪の實證に屬するもの、一に發散を以て主とするにありと知るべし。\n證に曰く、病者一身盡く疼み、發熱、日晡所劇しき者は、風濕と名づく。此の病、汗出でて風に當たるに傷られ、或いは久しく冷を取るに傷られて致す所なり。麻黄杏仁薏苡甘草湯を與ふべしと。一身尽く疼むは風湿相搏つなり。表閉ぢて風邪去ること能はざるによるなり。發熱、日晡所劇しはは…（?）。傷久は久傷に作るべし。字の顛倒なり。久しく冷を取るときは湿と風とを両感するゆゑ、風濕を病むの意なるべきなり。\n或いは曰く、此の方、瘧病動氣なく、渇せず、水狀あり、日晡に發するものを治す。又曰く、小瘡家、發熱・喘満のものを治すと。",
      yaku: "一　この方（麻杏甘石湯）から石膏を去って薏苡仁に代えると、麻黄杏仁薏苡甘草湯（麻杏薏甘湯）というものになり、風湿で体が痛み、発熱するものを治す。この証は裏熱がなく、表が閉じて喘鳴し、皮膚の水気が外へ出ることができないので、全身が痛み、発熱する。思うに麻黄は表を発し、杏仁は喘鳴を治し、薏苡仁は湿を去り、甘草は急迫をゆるめて、風が除かれ湿が乾く。およそこれらの方は、みな表邪の実証に属するもので、もっぱら発散を主とすると知るべきである。\n金匱要略に「病人が全身ことごとく痛み、発熱し、夕方にひどくなる者は風湿と名づける。この病は汗をかいて風に当たったことで傷られ、あるいは長く冷えをとったことで傷られて起こる。麻黄杏仁薏苡甘草湯を与えるべきである」とある。全身がことごとく痛むのは風と湿が打ち合うのである。表が閉じて風邪が去れないことによる。「発熱、日晡所劇し」は…（?）。「傷久」は「久傷」とすべきで、字の顛倒である。長く冷えをとると湿と風を両方受けるので、風湿を病むという意味であろう。\nある人は「この方は、瘧（マラリア様の熱病）で動気がなく、渇かず、水の様子があり、夕方に発作するものを治す」と言い、また「できものの多い人で、発熱・喘満のものを治す」と言う。" },
    { head: "附 文蛤湯", koma: "256R",
      kaki: "一　若しくは越婢湯の證にして、喘咳・渇して飲を貪るものは、文蛤湯の証なり。此の方、此の越婢湯の方内に文蛤・杏仁を加ふるものにして、文蛤は渇を治し、杏仁は喘咳を治す。而して文蛤・石膏之が主たれば、其の渇を治するの意尤も多しと知るべし。\n證に曰く、吐して後、渇して水を得んと欲して飲を貪る者は、文蛤湯之を主る。兼ねて微風、脈緊、頭痛を主ると。貪飲は、水を飲めども渇解せざるをいふ。微風・脈緊・頭痛は表証なり。此の方、表証あつて渇するを治すること、前に辨ずるがごとし。\n腹證奇覧翼二編上冊　終",

    { head: "条文の解：傷寒五六日、中風", koma: "262R–262L",
      kaki: "論に曰く、傷寒五六日、中風（傷寒と名づくるの邪は重し。故に五六日を期とす。中風とするものは軽し。故に日數を期せず）、往來寒熱（熱往き寒来たり、寒往けば熱来たり、須臾に遞ひに相往来す。時を期するに非ず）、胸脇苦滿（胸脇は裡の位なり。邪氣之に遏れば、水飲茲に聚まり、因りて苦満す。苦はじれつなきこと、滿ははりみつるなり）、黙黙として飲食を欲せず（黙々は話はざるなり。是れ熱氣と飲水と胸脇に塞がりて、精神爽やかならず、且つ飲水食穀を欲しがらぬなり。邪氣胃口をふさぐなり）、心煩喜嘔、或いは胸中煩して嘔せず（胸は膈上の総名。心は胸位の中央をさす。中央にてもやもやし、衝逆の意あるを以て、嘔を喜むなり。喜嘔は嘔せずに居られぬことなり。又ややもすればゑづくことを喜むなり。胸中煩は胸一面に煩するなり。已下の諸証は、あることもあり無きこともありて一定せず、正証に非ざるなり。或いは嘔を必とせざる…（?）…ゑづかざるなり）、或いは渇し（此の証、胸脇水多く飲を欲せざれども、水少なきものは熱に因りて渇することもあるなり）、或いは腹中痛み（邪氣裡にせまる故なり。是れ拘痛なり）、或いは脇下痞鞕し（脇滿の餘波、脇下に及んで痞鞕するなり。両脅の肋骨の下端を按ずればつかへてかたし。是れは此の証の目じるしなり）、或いは心下悸し、小便不利し（心下は鳩尾の下なり。だくだくとおどりてめよりなきやうなるを悸といふ。是れは小便不利して水氣ここにあつまるなり。故に二句連語するなり）、或いは渇せず、身に微熱有り（身は肌膚を指していふ。微熱はうはべになく肌膚にある熱なり。即ち身熱のことなり。越婢・白虎などの所謂大熱無しといふものにて、渇すれば白虎の証、いづれ石膏の主るところとなるゆゑ、不渇といふなり）、或いは咳する者は（水氣胸肺をおかせば咳もあるなり）、小柴胡湯之を主ると。\n右一章、小柴胡湯の正證を悉く具へ、其の熱あり水あるの多少輕重、是に於いて概見すべし。然れども其の主證を取り得なば、必ずしも其の餘を問はず。例に曰く、傷寒中風、柴胡の證、但一證を見はせば便ち是れなり。必ずしも悉く具へずと。是れなり。案ずるに、此の方、和解を以て主として、汗吐下の劑に非ずといへども、偶肯綮にあたるときは發汗して解することあり。是れ其の邪素表裡の間に在ればなり。",
      yaku: "傷寒論に「傷寒五六日、あるいは中風で」（傷寒と名づける邪は重いので五六日を期限とする。中風とするものは軽いので日数を定めない）、「往来寒熱し」（熱が去れば寒けが来、寒けが去れば熱が来て、短い間に交互に行き来する。時刻を定めて起こるのではない）、「胸脇苦満し」（胸脇は裏の位置である。邪気がそこでさえぎられると水飲が集まり、苦満する。苦は、じれったくやるせないこと、満は張り満ちることである）、「黙々として飲食を欲せず」（黙々とは話さないことである。熱気と水が胸脇に塞がって気分が晴れず、飲み物も食べ物も欲しがらない。邪気が胃の入口をふさいでいるのである）、「心煩してしきりに嘔き、あるいは胸中が煩して嘔かず」（胸は横隔膜より上の総称、心は胸の中央を指す。中央でもやもやし、衝逆の気味があるので、しきりに嘔きたがる。喜嘔とは吐かずにいられないこと、またややもするとえずきたがることである。胸中煩は胸一面がもだえることである。以下の諸証はあったりなかったりして一定せず、正証ではない）、「あるいは渇き」（この証は胸脇に水が多く飲みたがらないが、水の少ないものは熱のために渇くこともある）、「あるいは腹中が痛み」（邪気が裏に迫るためで、引きつれる痛みである）、「あるいは脇下が痞えて硬く」（脇の張りの余波が脇下に及んでつかえ硬くなる。両脇の肋骨の下端を按じるとつかえて硬い。これがこの証の目印である）、「あるいは心下が悸し、小便の出が悪く」（心下はみぞおちの下である。どくどくと躍って頼りないようなのを悸という。小便が出ずに水気がここに集まるので、二句を続けて言う）、「あるいは渇かず、体に微熱があり」（身とは肌を指す。微熱とは表面になく肌にある熱で、身熱のことである。越婢湯・白虎湯などのいう「大熱無し」にあたり、渇けば白虎湯の証で、いずれも石膏の主るところになるので「渇かず」という）、「あるいは咳する者は」（水気が胸や肺を侵せば咳も出る）、「小柴胡湯が主る」とある。\nこの一章は小柴胡湯の正証をことごとく備え、熱と水の多少・軽重をここでおおよそ見ることができる。しかし主証をつかめば、必ずしも残りを問わない。傷寒論の例に「傷寒・中風で柴胡の証は、一証を見れば即ちそれである。すべてそろう必要はない」とあるのがこれである。考えるに、この方は和解を主とし、発汗・吐・下の剤ではないが、たまたま急所に当たると発汗して解けることがある。それは邪がもともと表と裏の間にあるからである。" },
    { head: "発黄と頸項強", koma: "263R–263L",
      kaki: "又此の證にして發黄するものあり。是れ所謂瘀熱裡に在り、必ず發黄するものなり。又頸項強ること表證に似るものなり。左の本文に就きて分辨すべし。\n論に曰く、病を得て六七日、脈遲浮弱、風寒を惡み、手足温かなり。醫二三之を下し、食すること能はずして脇下滿痛し、面目及び身黄ばみ、頸項強り、小便難き者は、小柴胡湯を與ふと。脈遅浮弱にして風寒を悪み、…起こるものは虚寒に似たり。虚寒は必ず手足冷ゆ。今其の温かなるを以て其の寒に非ざるを辨ず。此の証、初め悪風寒にあり。法に於いて發汗すべく、下すべからず。蓋し醫其の脉遅を以て誤認して、之を下すこと二三に及んで、終に邪氣内陥して胸脇にあつまり、食道に窒がりて食せんと欲すれども食すること能はずして、脇下に満痛し瘀熱して、面目より一身に及んで黄色を發し、上は頸項に強り、下は因りて小便通じ難きを患ふるものは、小柴胡湯を與へて後治あるをまつなり。頸項強は項背強と異なり、両の耳後の行を下りて缺盆に至るものの強るなり。且つ又表に屬せずして裡に屬するにつべし（?）。乃ち脇下満の應にして上下に及ぼしたるものと知るべし。\n證に曰く、諸黄、腹痛して嘔する者はと。此れ亦胸脅満、腹痛して嘔す。黄は色の發するものとすべし。\n論に曰く、傷寒四五日、身熱、惡風、頸項強り、脇下滿ち、手足温にして渇する者は、小柴胡湯之を主ると。傷寒四五日にして邪裡に及びて身熱・悪風す。身熱は發熱にあらず、肌膚にあるの熱なり。故に悪寒せずして悪風す。頸項強り脇下満するもの、前証と同じ。手足温燥にして渇するもの、是れ蓋し外證激劇ならず、内胸脇にあつまるところの水氣少なきを以て、熱は多く寒は少なく、且つ嘔逆せず。是を以て手足厥冷せず。其の裡証は…（?）。是を以て身熱して手足熱せず。此に両の義を…（?）て手足温なりといふものか。而して其の主証を要するときは、頸項強・脇下満、柴胡の位にあらはる。是を以て小柴胡湯の主るところとするなり。此の証一轉すれば白虎の証に至るの機あり。讀むもの之を審らかにせよ。",
      yaku: "またこの証で黄疸を起こすものがある。いわゆる「瘀熱が裏にあれば必ず発黄する」ものである。また首・うなじのこわばりが表証に似るものがある。以下の本文によって見分けるべきである。\n傷寒論に「病を得て六七日、脈が遅・浮・弱で、風寒を嫌い、手足は温かい。医者が二三度これを下し、食べられずに脇下が張って痛み、顔・目と体が黄色くなり、首・うなじがこわばり、小便が出にくい者には、小柴胡湯を与える」とある。脈が遅・浮・弱で風寒を嫌うのは虚寒に似ている。虚寒なら必ず手足が冷える。いま手足が温かいので寒ではないことがわかる。この証は初めは悪風寒の段階にあり、法としては発汗すべきで下してはならない。思うに医者が脈の遅を見誤って二三度下したため、ついに邪気が内に陥って胸脇に集まり、食道がふさがって食べようとしても食べられず、脇下が張って痛み、熱がこもって顔・目から全身に黄色を発し、上は首・うなじがこわばり、下は小便が通じにくくなったもので、小柴胡湯を与えてから次の治療を待つのである。頸項強は項背強とは異なり、両耳の後ろの筋を下って缺盆（鎖骨上窩）に至るところがこわばるのである。また表ではなく裏に属するものとみるべきで（?）、脇下の張りの反応が上下に及んだものと知るべきである。\n金匱要略に「諸々の黄疸で、腹が痛んで嘔く者は（小柴胡湯）」とある。これも胸脇の張りがあり、腹が痛んで嘔くもので、黄は色が出たものとすべきである。\n傷寒論に「傷寒四五日、身熱・悪風し、首・うなじがこわばり、脇下が張り、手足が温かくて渇く者は、小柴胡湯が主る」とある。傷寒四五日で邪が裏に及んで身熱・悪風する。身熱とは発熱ではなく、肌にある熱である。だから悪寒せずに悪風する。首・うなじのこわばりと脇下の張りは前の証と同じである。手足が温かく乾いて渇くのは、外証が激しくなく、内の胸脇に集まる水気が少ないので、熱が多く寒が少なく、しかも嘔逆しないからである。だから手足が冷えない。その裏証は…（?）。だから身熱があっても手足は熱くない。ここでその両方の意味を…（?）て「手足温」と言ったのであろうか。主証をまとめれば、首・うなじのこわばりと脇下の張りが柴胡の位置に現れている。だから小柴胡湯の主るところとする。この証は一転すれば白虎湯の証に至る機転がある。読む者はよく見きわめよ。" },
    { head: "舌診：白胎", koma: "263L–264R",
      kaki: "凡そ表裡の分を明らかにし、熱の深淺を知り、寒熱虚實の疑途を辨ずるもの、之を舌上に診することあり。小柴胡の舌のごときは、所謂白胎なるものを得べし。是れ心胸の熱候にして、未だ深きに及ばざる者なり。\n論に曰く、陽明病、脇下鞕滿し、大便せずして嘔し、舌上白胎の者は、小柴胡湯を與ふべし。上焦通ずることを得、津液下ることを得、胃氣因りて和し、身濈然として汗出でて解するなりと。陽明病は胃家實を以て正証とす。胃家實する者は必ず腹滿す。今腹満せずして脇下鞕満、外証にして胃實に非ざることを知る。胃實に非ざるを以て、不大便の嘔を發す。此れ上焦の熱、水氣を逆して、津液胃中を潤さずして大便不通なり。舌上の白胎は、舌上の色白くもりあげたる如きをいふ。且つ又上焦に熱あり水氣あるの候なり。若し胃家實すれば必ず黄胎なるを以て之を分つ。此の証、陽明病にして胃實に至らざるを以て、權りて小柴胡湯を與ふべしとなり。蓋し承氣の後治あるを以て、主証とせざるなるべし。さて柴胡にて上焦の熱を解して正氣通ずることを得れば、津液下りて胃中に入り、胃氣因りて和すれば、胃陽に…（?）して一身濈然と汗出でて病解け、大便も自ら通ずるとしるべし。",
      yaku: "およそ表裏の区別を明らかにし、熱の深さ浅さを知り、寒熱虚実の紛らわしさを弁別するのに、舌で診ることがある。小柴胡湯の舌は、いわゆる白苔が見られる。これは心胸の熱の兆候で、まだ深くには及んでいないものである。\n傷寒論に「陽明病で、脇下が硬く張り、大便が出ずに嘔き、舌に白苔のある者には、小柴胡湯を与えるとよい。上焦が通じ、津液が下り、胃気が和して、全身にじっとりと汗が出て解ける」とある。陽明病は胃家実を正証とする。胃家実の者は必ず腹が張る。いま腹は張らずに脇下が硬く張るのは外証で、胃実ではないとわかる。胃実でないのに便秘して嘔くのは、上焦の熱が水気を逆上させ、津液が胃中を潤さないので大便が通じないのである。舌の白苔とは、舌の上が白く曇って盛り上がったようなものをいう。これも上焦に熱があり水気がある兆候である。もし胃家実なら必ず黄苔なので、これで区別する。この証は陽明病だが胃実に至っていないので、一時の手段として小柴胡湯を与えよというのである。思うに承気湯による次の治療があるので、主証としないのであろう。柴胡で上焦の熱を解いて正気が通じれば、津液が下って胃中に入り、胃気が和して、全身にじっとりと汗が出て病が解け、大便もおのずから通じると知るべきである。" },
    { head: "熱入血室", koma: "264R–264L",
      kaki: "又婦人經行中に邪氣を得るか、或いは邪氣を得て後に遽かに經行來たれば、其の熱血室に入りて胸脇満す。其の候、左の脇下に得べし。\n論に曰く、婦人中風七八日、續いて寒熱を得、發作時有り、經水適ま斷ゆる者は、此れを熱血室に入ると爲す。其の血必ず結ぶ。故に瘧狀の如く發作時有らしむ。小柴胡湯之を主ると。適はてうど其の時に出のはれたる詞なり。断は行くべきがきれてあとからつづかぬなり。例に曰く、胸脇下満ち、結胸の状の如く、譫語する者は、此れを熱血室に入ると爲すと。此れによるならば胸脇下満・寒熱發作時有るもの、小柴胡の証なるを以て之を主るもの、亦証に随ひて治するの意なり。其の血結ぶもの、胸脇下より小腹に鞕満す。故に結胸の如しといふ。婦人の血室、左の小腹にあり。故に左腹に於いて得べきなり。",
      yaku: "また女性が月経中に邪気を受けるか、邪気を受けたあとに急に月経が来ると、その熱が血室に入って胸脇が張る。その兆候は左の脇下で確かめられる。\n傷寒論に「女性が中風にかかって七八日、引き続いて寒熱があり、発作に時があり、月経がちょうど途切れた者は、熱が血室に入ったとする。その血は必ず結ぼれる。だから瘧（マラリア様の熱病）のように時をおいて発作させる。小柴胡湯が主る」とある。「適」とはちょうどその時に出会ったという言葉、「断」とは続くはずのものが切れてあとが続かないことである。傷寒論の例に「胸脇の下が張り、結胸のようで、うわごとを言う者は、熱が血室に入ったとする」とある。これによれば、胸脇の下の張りと寒熱の発作に時があるのは小柴胡湯の証なので、これが主るのであり、これも証に従って治すという意味である。血が結ぼれるものは、胸脇の下から下腹にかけて硬く張る。だから「結胸のよう」という。女性の血室は左の下腹にある。だから左の腹で確かめられるのである。" },
    { head: "腹痛：小建中湯との先後", koma: "264L–265R",
      kaki: "又小柴胡湯の腹痛は、所謂熱痛なるものにして、邪氣裡に逼るの致すところなり。而して小建中湯の裡急の腹痛なるものと疑似し、前後緩急の治法あり。且つ心煩は二方の證の疑似するものあつて、其の異同を辨ず。\n論に曰く、傷寒、陽脈濇、陰脈弦、法當に腹中急痛すべき者は、先づ小建中湯を與ふ。差えざる者は、小柴胡湯之を主ると。陽脈・陰脈の説、諸家一定せず。而して腹背をわかつて言ふものも穏やかならざるに似たり。此れ蓋し寸口に於いて之を言ふものなるべければ、其の擧按に於いて言ふもの穏やかなりとす。窃かに謂ふ、陽は氣なり、陰は血なり。故に浅く按じて之を知るは、氣の盛衰を候するにあり。陽と云ふゆゑんなり。深く按じて之を得るは、血の虚實を伺ふにあり。陰といふゆゑんなり。今浅く按じて渋滞なる、陽氣の健行せざるものにして、深く按じて弦緊なるもの、陰血の和緩ならざるを知る。是れ乃ち氣血澀滞弦緊、法に於いて腹中急痛すべきの候にして、適ま腹中急痛する者は、先づ小建中湯を與へて、其の差ゆるや否やを識るなり。小建中湯は、是れ氣血を和し、緊急を緩むるもの。若し其の証に對せば一服即ち差ゆべし。差えざるものは、再び前方を服すべからず。是れ傷寒の邪裡にせまるところの熱痛にして、定めて小柴胡の証とすることを知るなり。かやうに二方を試用するものは、明鑒なきに似たりといへども、小柴胡の腹痛なる者だも固より旁証なれば、姑く脈証に隨ひて小建中湯を試用するも、亦古人病を治する緩急の法なりと知るべし。此の章、前の或腹中痛の句に就きて之を詳らかにするもの。\n又曰く、傷寒二三日、心中悸して煩する者は、小建中湯之を主ると。傷寒二三日、表にある時に當たりて、心中悸して且つ煩するもの、熱裡に逼るの致すところに非ず。是れ外襲に因りて氣血が内に逼りて、此の衝逆急迫の状をいたすもの。是の故に証に隨ひて小建中湯の主治と定むるなり。若し外邪裡にせまりて煩悸する者は此の方の証にあらず。其の異は上に言ふ、心中悸を主として煩を客とするにあり。若しくは裡証の致すところは、前に所謂傷寒五六日、心煩喜嘔、或いは胸中煩して嘔せず、或いは心下悸・小便不利なるものにして、小柴胡の証なり。此の章、小柴胡の証にいふものならずといへども、小柴胡に就きて疑途を辨ずるものなるを以て、此に抄出して、二方の証の相似て方意の各別なることをしらしむ。讀むもの審らかにせよ。",
      yaku: "また小柴胡湯の腹痛はいわゆる熱痛で、邪気が裏に迫って起こるものである。これは小建中湯の裏急による腹痛とまぎらわしく、先後・緩急の治法がある。また心煩も二方の証でまぎらわしいところがあるので、その異同を論じる。\n傷寒論に「傷寒で、陽脈が濇、陰脈が弦で、法として腹中が急に痛むはずの者には、まず小建中湯を与える。治らない者は小柴胡湯が主る」とある。陽脈・陰脈の説は諸家で一定しない。腹と背に分けて言うのも穏当でないようである。これは寸口について言うのであろうから、浮かべて按じるか沈めて按じるかで言うのが穏当である。ひそかに思うに、陽は気、陰は血である。だから浅く按じて知るのは気の盛衰をうかがうことで、陽というわけである。深く按じて得るのは血の虚実をうかがうことで、陰というわけである。いま浅く按じて渋り滞るのは陽気が力強くめぐらないもので、深く按じて弦緊なのは陰血が和らいでいないことを示す。これは気血が渋り滞り張り詰めて、法として腹中が急に痛むはずの兆候であり、ちょうど腹中が急に痛む者には、まず小建中湯を与えて、治るかどうかを見るのである。小建中湯は気血を和し、張り詰めをゆるめるもので、その証に合っていれば一服ですぐ治るはずである。治らないものには再び前の方を服させてはならない。これは傷寒の邪が裏に迫る熱痛で、確かに小柴胡湯の証であるとわかる。このように二方を試すのは見識がないようだが、小柴胡湯の腹痛はもともと傍証なので、ひとまず脈証に従って小建中湯を試すのも、古人が病を治した緩急の法であると知るべきである。この章は前の「あるいは腹中痛む」の句を詳しく述べたものである。\nまた傷寒論に「傷寒二三日、心中が悸して煩する者は、小建中湯が主る」とある。傷寒二三日で表にある時期に、心中が動悸してもだえるのは、熱が裏に迫って起こるのではない。外からの侵襲によって気血が内に迫り、この衝逆急迫の状態を起こしたのである。だから証に従って小建中湯の主治と定めるのである。もし外邪が裏に迫ってもだえ動悸する者は、この方の証ではない。その違いは、上に言ったように、心中悸を主として煩を客とする点にある。裏証によるものは、前にいう「傷寒五六日、心煩喜嘔、あるいは胸中煩して嘔かず、あるいは心下悸・小便不利」のもので、小柴胡湯の証である。この章は小柴胡湯の証を言うものではないが、小柴胡湯について紛らわしさを弁別するものなので、ここに抜き出して、二方の証が似ていても方意が別であることを知らせる。読む者はよく見きわめよ。" },
    { head: "結語と附方", koma: "265L",
      kaki: "以上の諸章、論中小柴胡湯の正變證を審辨するものを抄し、愚解を附し、以て初學に示す。其の旁枝を生ずること多端なるが如しといへども、其の本根を尋ぬるに至りては一なり。讀むもの前後の文理を紬繹して、其の玄旨を求めば、以て大過なかるべし。其の餘、小柴胡の證を辨ずるもの尠なからずといへども、推し考へ得べきを以て、此に枚擧せず。\n附方　小柴胡加樹（?）皮湯　本方に樹（?）木皮大を加ふ。婦人一切の乳腫を主治す。",
      yaku: "以上の諸章は、傷寒論の中で小柴胡湯の正証と変証を詳しく弁別するものを抜き出し、私の解釈を付けて初学者に示したものである。枝分かれが多いようだが、根本をたずねれば一つである。読む者が前後の文理をたぐってその奥義を求めれば、大きな誤りはないだろう。そのほか小柴胡湯の証を論じるものは少なくないが、推し量れるのでここでは一つ一つ挙げない。\n附方　小柴胡加樹（?）皮湯：本方に樹（?）木皮を大量加える。女性のあらゆる乳房の腫れを主治する。" }

{
  id: "yoku2-saikokeishikankyoto", no: 97, kind: "方剤", title: "柴胡桂枝乾姜湯（附 柴胡去半夏加括蔞湯・柴胡加桂枝湯）", yomi: "さいこけいしかんきょうとう", group: "腹証奇覧翼 二編 下",
  koma: [266, 268], komaNote: "266R–268L（図 266R）",
  fig: { src: "img/fig_266R.jpg", koma: "266R", label: "柴胡桂枝乾姜湯證図",
    desc: "髷の若い女が片膝を立てて座り、顔を向かって右へ向け、両手を下腹（股の上）で組む。両乳の下から心窩部にかけて横長の藍色（上縁は波形）、その中央から臍の上へ縦に細く垂れ下がる藍の帯（下端は三角）。両乳の間から臍の上へ、白抜きの小さな丸が数珠状に並ぶ。書き込み「部位　表裡間而候在胸脇腹」、「半夏代粉、候在燥渇、胸満微結、動築屢頻」。横の藍へ線を引いて「胸脇満微結」、縦の帯へ線を引いて「臍上動気強ク右臍傍ニ及」。" },
  paras: [
    { head: "図の書き込み", koma: "266R",
      kaki: "部位、表裡の間にして、候は胸脇腹に在り。\n半夏を粉（括蔞根）に代ふ。候は燥渇に在り。胸満微結、動築屢頻りなり。\n胸脇満微結。\n臍上の動気強く、右臍傍に及ぶ。",
      yaku: "部位は表と裏の間で、兆候は胸・脇・腹にある。\n半夏を天花粉（括蔞根）に代える。兆候は口の乾きと渇き。胸脇が張ってわずかに結ぼれ、動悸がしきりに打つ。\n胸脇満微結。\n臍の上の動気が強く、右の臍の傍らに及ぶ。" },
    { head: "腹証と方意", koma: "266L–267R",
      kaki: "右圖の如く胸脇滿して、臍上・心下の動氣つよく、虚里の動も亦應じ、心煩衝逆し、口舌乾きて渇して嘔せざるもの、柴胡桂枝乾姜湯の證とす。或いは曰く、左の脇下に結聚し、虚里の動つよく、腹中の動、及び右の臍傍・小腹に應じて微結あるを、此の方の腹証とすと。此の方や小柴胡湯より去加し來たるものといへども、其の意頗る異なる所あり。其の異なる所は、半夏を去りて括蔞に代ふるにあり。半夏・括蔞、其の治相反す。半夏は痰を去り濕を燥し、寒飲嘔吐を治す。括蔞は燥を潤し渇を解し、虚熱を治す。此の證、水氣すくなく、渇して嘔せず。去加する所以なり。其の桂枝を加ふるものは、肌表を和するにあり。肌表和せざるものは、氣衝逆・動氣の亢激、職として是に之れ由れり。牡蛎ある所以なり。乾姜を以て生姜に代ふるものは、頗る温散の意あり。則ち上焦の熱邪を解くことを主とすといへども、亦兼ねて以て下焦の寒に及ぶものとす。其の意、寒多き瘧を治するに於いてみつべし。",
      yaku: "右の図のように胸脇が張って、臍の上と心窩部の動気が強く、虚里（左乳下の心尖拍動部）の拍動も呼応し、胸がもだえて衝逆し、口や舌が乾いて渇き、吐き気のないものを柴胡桂枝乾姜湯の証とする。ある人は「左の脇下に結ぼれた集まりがあり、虚里の拍動が強く、腹中の動悸が右の臍の傍らや下腹に響いてわずかな結ぼれがあるのを、この方の腹証とする」と言う。この方は小柴胡湯から加減したものだが、その意図はかなり異なる。異なる点は、半夏を去って括蔞根に代えたことにある。半夏と括蔞根は治すところが反対である。半夏は痰を去り湿を乾かし、寒飲や嘔吐を治す。括蔞根は乾燥を潤し渇きを解き、虚熱を治す。この証は水気が少なく、渇いて吐き気がない。これが加減の理由である。桂枝を加えるのは肌表を和するためである。肌表が和していないと、気の衝逆と動気の激しさはもっぱらそこから起こる。牡蛎があるのはそのためである。乾姜を生姜に代えたのはかなり温めて散らす意味がある。つまり上焦の熱邪を解くことを主とするが、あわせて下焦の寒にも及ぶものである。その意味は、寒けの多い瘧を治すことに見てとれる。" },
    { head: "条文の解", koma: "267R–267L",
      kaki: "論に曰く、傷寒五六日、已に發汗して復た之を下し（傷寒五六日、固より柴胡の主治する所にして、已に發汗して解せざるを以て、又之を下す。並びに其の治を得たりとせず。是を以て内外津液を亡ひて、邪氣仍ほ在り、枯渇・衝逆の病証を加ふるゆゑんを見るべし）、胸脇滿微結、小便不利、渇して嘔せず（胸脇満は傷寒五六日必見の証なり。微結は蓋し脇下に結ぶなり。小便不利、渇して嘔せずは、汗下に因りて津液を亡ふの候なり。此の渇は乃ち津液の枯渇。括蔞を用ひて石膏を用ひざるの意みつべし。括蔞は實熱の渇を治せざればなり）、但頭汗出で、往來寒熱、心煩する者は、此れ未だ解せずと爲すなり。柴胡桂枝乾姜湯之を主ると（汗下に因りて津液を亡ひ、微結すれども結胸をなさず。又裡に遷りて内實の機あらず。却つて陽氣衰へ、衝逆を致す。小便不利、頭汗出づるもの是れなり。而して往來寒熱・心煩するものは、胸脇満微結と與に、傷寒の邪はいまだ解せずとするなり。故に其の方仍ほ柴胡を主として、其の佐とするもの水を逐ふものにあらずして、却つて燥を潤し、氣を和し、動を鎮め、逆を低くし、寒を溫め、陽を回すの意あるものを隊伍するの旨をみつべし）。\n證に曰く、瘧、寒多く、微しく熱有り、或いは但寒して熱せずと（此れ外臺の文なり。故に其の証具はらず。瘧は寒熱發作時有るの病。寒多きを治するは乾姜あるを以てなり。且つ白虎加桂枝湯と對の証なり。然れども柴胡の腹狀を得ずんば、妄りにもちゆべからず）。\n按ずるに、此の方、近世諸家に流行するところ、病人胸脇滿し、腹中に動あるものを見れば、輒ち此の方を用ひ、復た表裡虚實を審らかにせざるもの多し。宜なるかな、其の治効の著明ならざること。學者思へ。",
      yaku: "傷寒論に「傷寒五六日、すでに発汗し、また下した」（傷寒五六日はもとより柴胡の主治するところで、すでに発汗して解けなかったので、さらに下した。どちらも正しい治療とはいえない。そのため内外の津液を失い、邪気はなお残り、乾きと衝逆の病証が加わったことを見るべきである）、「胸脇が張ってわずかに結ぼれ、小便の出が悪く、渇いて吐き気がない」（胸脇満は傷寒五六日で必ず見られる証である。微結とはおそらく脇下に結ぼれることである。小便不利と渇いて吐き気のないことは、発汗と下しで津液を失った兆候である。この渇きは津液の枯渇で、括蔞根を用いて石膏を用いない意味を見るべきである。括蔞根は実熱の渇きは治さないからである）、「ただ頭にだけ汗が出て、往来寒熱し、胸がもだえる者は、まだ解けていないのである。柴胡桂枝乾姜湯が主る」とある（発汗と下しで津液を失い、わずかに結ぼれても結胸にはならない。また裏に移って内実になる機もない。かえって陽気が衰えて衝逆を起こす。小便不利と頭汗がそれである。往来寒熱と心煩は、胸脇満微結とともに傷寒の邪がまだ解けていないことを示す。だからこの方はなお柴胡を主とし、その助けとなる薬は水を逐うものではなく、かえって乾燥を潤し、気を和し、動悸を鎮め、逆を下げ、寒を温め、陽を回復させる意味のものを組み合わせていることを見るべきである）。\n『外台秘要』に「瘧で寒けが多く、熱はわずか、あるいはただ寒けだけで熱が出ない」とある（これは外台の文なので証がそろっていない。瘧は寒熱の発作が時を定めて起こる病である。寒けの多いものを治すのは乾姜があるからである。また白虎加桂枝湯と対になる証である。しかし柴胡の腹の状態が得られなければ、みだりに用いてはならない）。\n考えるに、この方は近ごろ諸家に流行しており、病人の胸脇が張り、腹中に動悸があるのを見るとすぐにこの方を用い、表裏虚実を詳しく見ない者が多い。治療効果がはっきりしないのも当然である。学ぶ者はよく考えよ。" },
    { head: "附 柴胡去半夏加括蔞湯", koma: "267L–268R",
      kaki: "一　若しくは小柴胡湯の證にして渇し嘔せざる者は、柴胡去半夏加括蔞湯の證なり。而して其の二味去加するの意は前方と同じ。\n證に曰く、瘧病、渇を發する者。亦勞瘧を治すと（此れ亦外臺の文なり。故に其の証詳らかならず。但本方の去加する所に就きて、其の方意を審らかにすべし。勞瘧は瘧病久しく瘥えずして疲勞するもの、亦渇の証なくんばあるべからず）。\n或いは曰く、瘧に此の方に牡蛎湯を合方して用ひて効ありと。",

function terms(q){
  const out=new Set();
  q.split(/[\s　、,]+/).filter(Boolean).forEach(w=>{
    out.add(w);
    if(SYN[w]){ SYN[w].forEach(x=>out.add(x)); return }
    const ks=Object.keys(SYN).filter(k=>k.includes(w)||w.includes(k)).sort((a,b)=>b.length-a.length);
    if(ks.length) SYN[ks[0]].forEach(x=>out.add(x));
  });
  return [...out];
}

function kScore(e){
  const S=Object.keys(K.f); const E=(e.shoken||[]).filter(x=>x.k!=="その他"&&!x.neg);
  const ecats=new Set(E.filter(x=>x.k!=="腹力").map(x=>x.k));
  const hit=[],sideNg=[],miss=[];
  S.forEach(c=>{ if(!ecats.has(c)){ miss.push(c); return }
    const want=K.f[c]; const ok=!want||E.some(x=>x.k===c&&(!x.side||x.side===want||x.side==="両"||want==="両"));
    (ok?hit:sideNg).push(c) });
  const extra=[...ecats].filter(c=>!(c in K.f));
  let lvTxt="", lvPt=0;
  if(K.lv){ const r=E.filter(x=>x.k==="腹力").map(lvRange).find(Boolean); const i=LV.indexOf(K.lv);
    if(r){ const d=i<r[0]?r[0]-i:i>r[1]?i-r[1]:0; lvPt=d===0?1:d===1?.5:0; lvTxt=d===0?"腹力一致":d===1?"腹力やや近い":"腹力不一致" } else lvTxt="腹力の記載なし" }
  const nS=S.length+(K.lv?1:0), nE=ecats.size+(K.lv?1:0);
  const pts=hit.length+sideNg.length*.5+lvPt;
  const score=nS? pts/(nS+extra.length) : 0;   // 患者の所見と方剤の所見の重なり（0〜1）
  return {e,hit,sideNg,miss,extra,lvTxt,lvPt,score,pts};
}

  <li><b>患者の腹証から探す</b>：腹力と所見（左右）を選ぶと、各図の腹証所見と照らし合わせて一致の多い方剤から並べます。文献を引くための道具で、診断や処方の判断を代わりに行うものではありません。</li>
  <li><b>頭注</b>：枠の上に刷られた注。全文を本文と現代語訳で載せています。</li>
  <li><b>コマ</b>：京都大学貴重資料デジタルアーカイブの画像番号（11冊通しの番号。1コマ＝見開き、R＝右頁、L＝左頁）。押すと原本画像が開きます。</li>
  <li><b>別本コマ</b>：後編 上巻は底本（11冊本）に欠けているため、同館所蔵の別本（RB00004915、正編・後編1冊）で補いました。その頁のコマ番号は「別本コマ」と表示し、押すと別本の画像が開きます。</li>
  <li><b>要確認</b>：判読に自信がない字や、読み方を確かめたい点です。</li></ul></section>
  <section><h3>底本</h3><p class="small">『腹証奇覧』（正編・後編・腹証奇覧翼、11冊）、稲葉克（文礼）・和久田叔虎著。京都大学附属図書館所蔵（富士川文庫, RB00004916）。後編 上巻は欠けるため、同館所蔵の別本（RB00004915）で補った。利用条件：自由利用（出典表示）。</p></section></div>`;
}
function render(id){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.goto===id));
  if(id==="about"){ $("#page").innerHTML=about(); return }
  if(id==="shoken"){ $("#page").innerHTML=shokenPage(); return }
  if(id==="kensaku"){ $("#page").innerHTML=kensakuPage(); kRun(); return }
  const e=D.find(x=>x.id===id)||D.find(x=>x.kind==="方剤")||D[0]; if(!e) return;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.goto===e.id));
  let h=`<div class="page"><h2>${esc(e.title)}<small>${esc(e.yomi||"")}</small></h2>`+
    `<div class="meta">${esc(e.group)}　${e.fig?`第${e.no}図`:esc(e.kind)}　原本：${komaLink(e.koma[0])}〜${komaLink(e.koma[1])}（${esc(e.komaNote||"")}）</div>`;
  if(e.fig) h+=`<div class="fig"><img src="${esc(e.fig.src)}" alt="${esc(e.fig.label)}（腹証図）" data-zoom="${esc(e.fig.src)}" loading="lazy"><div><div class="cap">${esc(e.fig.label)}</div><p class="small">${komaLink(e.fig.koma)}</p><p>${esc(e.fig.desc||"")}</p>${(e.figs||[]).map(f=>`<div class="fig2"><img src="${esc(f.src)}" alt="${esc(f.label)}（腹証図）" data-zoom="${esc(f.src)}" loading="lazy"><div><div class="cap">${esc(f.label)}</div><p class="small">${komaLink(f.koma)}</p><p>${esc(f.desc||"")}</p></div></div>`).join("")}${skBlock(e)}</div></div>`;
  if(e.intro) h+=`<p class="note" style="margin-top:14px">${esc(e.intro)}</p>`;
  h+=`<div class="tags">${(e.tags||[]).map(t=>`<button class="tag" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>`+modebar();
  if(!e.fig) h+=skBlock(e);
  h+=`<section id="s-hon"><h3>本文</h3>${e.paras.map((p,i)=>`<div class="para" id="p-${i+1}">${p.head||p.koma?`<h4>${esc(p.head||"")}<span>${komaLink(p.koma)}</span></h4>`:""}${txt(p)}</div>`).join("")}</section>`;
  if(e.tochu&&e.tochu.length) h+=`<section id="s-tc"><h3>頭注</h3>${e.tochu.map((t,i)=>`<div class="tc" id="t-${i+1}"><div class="h">${esc(t.head||"頭注")}<span>${komaLink(t.koma)}</span></div>${txt(t)}</div>`).join("")}</section>`;
  const rel=(e.related||[]).map(r=>D.find(x=>x.id===r)).filter(Boolean);
  if(rel.length) h+=`<section><h3>関連</h3><div class="rel">${rel.map(r=>`<a href="#${r.id}" data-goto="${r.id}">${esc(r.title)}</a>`).join("")}</div></section>`;
  if(e.check&&e.check.length) h+=`<section id="s-chk"><h3>要確認</h3><ul class="check">${e.check.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></section>`;
  $("#page").innerHTML=h+"</div>";
}
function search(q){
  const box=$("#results");
  if(!q.trim()){box.hidden=true;return}
  const ts=terms(q); const hits=[]; const test=s=>s&&ts.some(t=>s.includes(t));
  D.forEach(e=>{
    if(test(e.title)) hits.push({e,where:e.kind==="方剤"?"方剤名":"見出し",text:(e.paras[0]||{}).yaku||"",a:""});
    (e.tags||[]).forEach(t=>{ if(test(t)) hits.push({e,where:"タグ",text:t,a:""}) });
    [e.fig,...(e.figs||[])].filter(Boolean).forEach(f=>{ if(test(f.desc)) hits.push({e,where:"腹証図",text:f.desc,a:""}) });
    (e.shoken||[]).forEach(x=>{ if(test(x.k+x.w+(x.note||""))) hits.push({e,where:"腹証所見",text:`${x.k}：${x.w}${x.note?"（"+x.note+"）":""}`,a:"s-sk"}) });
    e.paras.forEach((p,i)=>{ if(test(p.kaki+p.yaku)) hits.push({e,where:p.head||"本文",text:p.yaku,a:`p-${i+1}`}) });
    (e.tochu||[]).forEach((t,i)=>{ if(test(t.kaki+t.yaku)) hits.push({e,where:"頭注",text:t.yaku,a:`t-${i+1}`}) });
  });
  const seen=new Set(); const uniq=hits.filter(h=>{const k=h.e.id+h.where+h.text.slice(0,20); if(seen.has(k))return false; seen.add(k); return true});
  const mark=s=>{ let h=esc(s.length>130?snip(s,ts):s); ts.forEach(t=>{ if(t) h=h.split(esc(t)).join(`<mark>${esc(t)}</mark>`) }); return h };
  box.hidden=false;
  box.innerHTML=`<h2>「${esc(q)}」の検索結果 ${uniq.length}件${ts.length>1?`<span class="small">（${esc(ts.slice(0,8).join("・"))} を含めて検索）</span>`:""}</h2>`+
    (uniq.length?uniq.slice(0,80).map(h=>`<a class="hit" href="#${h.e.id}" data-goto="${h.e.id}" data-anchor="${h.a}"><b>${esc(h.e.title)}</b><span class="where">${esc(h.where)}</span><p>${mark(h.text)}</p></a>`).join(""):`<p class="small">該当なし。別の言い方（例：「のぼせ」→「上衝」）でもお試しください。</p>`);
}
function snip(s,ts){ let i=-1; for(const t of ts){ i=s.indexOf(t); if(i>=0)break } i=Math.max(0,i-30); return (i>0?"…":"")+s.slice(i,i+120)+"…" }
let mode="both"; try{ mode=localStorage.getItem("fk-mode")||"both" }catch(e){}
if(!["both","kaki","yaku"].includes(mode)) mode="both";
document.body.dataset.mode=mode;
$("#nav").innerHTML=navHTML();
$("#hint").innerHTML="例："+EX.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join("");
document.addEventListener("click",ev=>{
  const z=ev.target.closest("[data-zoom]");
  if(z){ $("#zoom").innerHTML=`<img src="${esc(z.dataset.zoom)}" alt="">`; $("#zoom").hidden=false; return }
  if(ev.target.closest("#zoom")){ $("#zoom").hidden=true; return }
  const t=ev.target.closest("[data-q],[data-mode],[data-goto]"); if(!t||t.tagName==="BODY") return;
  if(t.dataset.q){ $("#q").value=t.dataset.q; search(t.dataset.q); window.scrollTo(0,0); return }
  if(t.dataset.mode&&t.tagName==="BUTTON"){ mode=t.dataset.mode; document.body.dataset.mode=mode; try{localStorage.setItem("fk-mode",mode)}catch(e){}
    document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode)); return }
  if(t.dataset.goto){ ev.preventDefault(); history.replaceState(null,"","#"+t.dataset.goto); render(t.dataset.goto);
    if(matchMedia("(max-width:760px)").matches){ $("#nav").classList.remove("open"); $("#navbtn").setAttribute("aria-expanded","false"); $("#navbtn").textContent="目次を開く" }
    const a=t.dataset.anchor; requestAnimationFrame(()=>{ const el=a&&document.getElementById(a); (el||$("#page")).scrollIntoView(); }); }
});
$("#q").addEventListener("input",e=>search(e.target.value));
$("#navbtn").addEventListener("click",()=>{const n=$("#nav"),o=!n.classList.contains("open");n.classList.toggle("open",o);$("#navbtn").setAttribute("aria-expanded",o);$("#navbtn").textContent=o?"目次を閉じる":"目次を開く"});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||((D.find(x=>x.kind==="方剤")||D[0])||{}).id);
</script>
