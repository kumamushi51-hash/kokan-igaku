<title>類聚方広義 症状検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 左に方剤の目次、右に一方剤の頁。上部に症状検索。皇漢医学アプリと同じ作り（色は茶） */
:root{
  --bg:#f1eee8; --paper:#fbf9f5; --ink:#2a2420; --muted:#6c625a; --line:#d6cec3;
  --ai:#6b3e26; --ai-soft:#efe3d8; --shu:#b23a2a; --shu-soft:#f3e0dc; --hl:#f2e6a8; --br:#8a7f74;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1715; --paper:#231e1b; --ink:#ece5de; --muted:#a89d93; --line:#3d342e;
  --ai:#d9a985; --ai-soft:#3a2b21; --shu:#e07a68; --shu-soft:#3a2522; --hl:#5a4f1f; --br:#9b8f84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1715; --paper:#231e1b; --ink:#ece5de; --muted:#a89d93; --line:#3d342e;
  --ai:#d9a985; --ai-soft:#3a2b21; --shu:#e07a68; --shu-soft:#3a2522; --hl:#5a4f1f; --br:#9b8f84; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.85;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;max-width:1180px;margin:0 auto}
h1{font-family:var(--f-disp);font-size:22px;margin:0;letter-spacing:.08em}
.sub{color:var(--muted);font-size:12px}
.search{display:flex;gap:8px;max-width:1180px;margin:10px auto 0}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.search input:focus{outline:2px solid var(--ai);outline-offset:1px}
.hint{max-width:1180px;margin:6px auto 0;font-size:12px;color:var(--muted)}
.hint button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 10px;margin:2px 2px 0 0;cursor:pointer}
#navbtn{display:none}
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1180px;margin:18px auto 0}
nav{position:sticky;top:150px;align-self:start;font-size:14px;max-height:calc(100vh - 170px);overflow:auto}
nav h3{font-family:var(--f-disp);font-size:13px;color:var(--muted);letter-spacing:.15em;margin:14px 0 4px;font-weight:500}
nav a{display:block;padding:5px 10px;border-left:3px solid transparent;color:var(--ink);text-decoration:none;border-radius:0 4px 4px 0}
nav a:hover{background:var(--ai-soft)}
nav a.on{border-left-color:var(--ai);background:var(--ai-soft);font-weight:700}
nav .no{font-size:11px;color:var(--muted);margin-right:4px}
main{min-width:0}
.results{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:18px}
.results h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.hit{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.hit:first-of-type{border-top:0}
.hit b{font-family:var(--f-disp);font-size:17px}
.hit .where{font-size:12px;color:var(--ai);margin-left:8px}
.hit p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 1px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px clamp(16px,3vw,36px)}
.page h2{font-family:var(--f-disp);font-size:30px;margin:0;letter-spacing:.1em}
.page h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;margin-left:10px;font-weight:400}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.meta a{color:var(--ai)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg);cursor:pointer;color:var(--ink);font-family:inherit}
.tag:hover{border-color:var(--ai)}
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--paper);color:var(--ink);padding:4px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--paper);font-weight:700}
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:10px 0 0}
.toc a{color:var(--ai)}
section{margin-top:30px}
section>h3{font-family:var(--f-disp);font-size:19px;margin:0 0 12px;padding-bottom:4px;border-bottom:2px solid var(--ink);letter-spacing:.08em}
.small{font-size:13px;color:var(--muted)}
.kaki{font-family:var(--f-disp);font-size:16.5px}
.yaku{font-size:15px}
.lbl{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;font-family:var(--f-body);letter-spacing:0;vertical-align:2px}
.br{color:var(--br)}
.txt>div{margin:4px 0}
body[data-mode="kaki"] .yaku{display:none}
body[data-mode="yaku"] .kaki{display:none}
body:not([data-mode="both"]) .lbl{display:none}
table.herbs{border-collapse:collapse;font-size:15px;margin:4px 0 10px}
table.herbs th,table.herbs td{border-bottom:1px solid var(--line);padding:4px 14px 4px 0;text-align:left;font-weight:400}
table.herbs th{font-size:12px;color:var(--muted)}
table.herbs td:first-child{font-family:var(--f-disp);font-size:17px;font-weight:700}
.jo{border-top:1px solid var(--line);padding:16px 0}
.jo:first-of-type{border-top:0;padding-top:4px}
.jo .no{font-family:var(--f-disp);font-weight:700;color:var(--ai);margin-right:6px}
.jo .src{font-size:12px;color:var(--muted)}
.tc{margin:10px 0 0;padding:10px 14px;background:var(--ai-soft);border-left:3px solid var(--ai);border-radius:0 6px 6px 0}
.tc .h{font-size:12px;font-weight:700;color:var(--ai)}
.tc a,.jo .src a,.meta a{color:var(--ai)}
.tc .h span{font-weight:400;color:var(--muted);margin-left:6px}
.tc .kaki{font-size:15.5px}
.an{margin:10px 0 0;padding:8px 14px;border:1px dashed var(--line);border-radius:6px}
.an .h{font-size:12px;font-weight:700;color:var(--muted)}
.check{background:var(--shu-soft);border-radius:6px;padding:10px 16px 10px 30px;margin:0;font-size:13.5px}
.check li{margin:2px 0}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:10px 14px}
footer{max-width:1180px;margin:28px auto 0;font-size:12px;color:var(--muted)}
footer a{color:var(--ai)}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  #navbtn{display:block;width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);margin-top:8px}
  nav{position:static;max-height:none;display:none}
  nav.open{display:block}
  .page h2{font-size:26px}
}
</style>
<header>
  <div class="top"><h1>類聚方広義</h1><span class="sub">尾台榕堂　条文・頭注を症状から検索</span></div>
  <div class="search"><input id="q" type="search" placeholder="症状・方剤名で検索（例：のぼせ、頭痛、汗、下痢）" autocomplete="off" enterkeyhint="search"></div>
  <div class="hint" id="hint"></div>
  <button id="navbtn" type="button" aria-expanded="false">目次（方剤）を開く</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main><div class="results" id="results" hidden></div><div id="page"></div></main>
</div>
<footer>底本：『類聚方広義』尾台逸（榕堂）著（京都大学附属図書館所蔵 富士川文庫）。画像は <a href="https://rmda.kulib.kyoto-u.ac.jp/item/rb00005779" target="_blank" rel="noopener">京都大学貴重資料デジタルアーカイブ</a>。書き下し・現代語訳は学習用の試訳です。</footer>
<script>
// 類聚方広義（尾台榕堂）京都大学附属図書館所蔵 富士川文庫 RB00005779
// koma は RMDA ビューアの page 番号（1コマ＝見開き）。R=右頁, L=左頁
// kaki=書き下し（「」は東洞が囲んだ部分）, yaku=現代語訳（〔〕は「」の部分）。原文（白文）は載せない（利用者の指定）
// tochu=頭注（尾台榕堂）。全文を書き下し kaki と現代語訳 yaku で
window.RUIJU_DATA = window.RUIJU_DATA || [];
window.RUIJU_DATA.push(
{
  id: "keishito",
  no: 1,
  title: "桂枝湯",
  yomi: "けいしとう",
  group: "桂枝湯類",
  koma: [26, 30], komaNote: "26L–30L",
  shuchi: {
    kaki: "上衝、頭痛、發熱、汗出で、惡風し、腹拘攣する者を治す。",
    yaku: "気が上へ突き上げ（のぼせ）、頭痛・発熱があり、汗が出て風に当たるのを嫌い、腹（腹直筋）がひきつる者を治す。"
  },
  houzai: {
    herbs: [
      { name: "桂枝", ryo: "三兩", ima: "七分五釐" },
      { name: "芍藥", ryo: "三兩", ima: "七分五釐" },
      { name: "生薑", ryo: "三兩", ima: "七分五釐" },
      { name: "大棗", ryo: "十二枚", ima: "七分五釐" },
      { name: "甘草", ryo: "二兩", ima: "五分" }
    ],
    imaNote: "「今用」は本書に小字で添えられた当時の常用量（桂枝・芍藥・生薑・大棗は「各七分五釐」、甘草は「五分」）。",
    kaki: "右五味、㕮咀し、水七升を以て、微火にて煮て三升を取り、滓を去り、寒温に適し、一升を服す。（今は水一合四勺を以て、煮て六勺を取り、服す。）服し已って須臾にして、熱稀粥一升餘を歠り、以て藥力を助く。温覆すること一時許りならしめ、「遍身漐漐として微かに汗有るに似たる者益々佳し。水の流漓するが如くならしむべからず、病必ず除かれず。若し一服にて汗出で病差ゆれば、後服を停め、必ずしも劑を盡くさず。若し汗せざれば、更に服すること前法に依る。又汗せざれば、後服は小しく其の間を促し、半日許りにして三服を盡くさしむ。若し病重き者は、一日一夜服し、周時之を觀る。一劑を服し盡くして、病證猶在る者は、更に作りて服す。若し汗出でざる者は、乃ち服すること二三劑に至る。生冷・粘滑・肉麪・五辛・酒酪・臭惡等の物を禁ず。」",
    yaku: "以上の五味を刻み、水七升で弱火で煮て三升に煮詰め、かすを除き、ほどよい温かさにして一升を服用する。（今の用量では水一合四勺で煮て六勺にして服用する。）服用してしばらくしたら、熱い薄粥を一升あまりすすって薬の力を助ける。衣類や布団で一時（約2時間）ほど温め、〔全身がしっとりとわずかに汗ばむ程度が最もよい。水が流れるように汗をかかせてはならず、そうすると病は必ず治らない。一回の服用で汗が出て病が治れば、残りは飲むのをやめ、全部飲みきる必要はない。汗が出なければ、前と同じ方法でさらに服用する。それでも汗が出なければ、次の服用は間隔を少し詰め、半日ほどで三回分を飲みきるようにする。病が重い場合は昼夜を通して服用し、丸一日（周時）様子を観察する。一剤を飲みきっても病状がまだ残っていれば、さらに作って服用する。汗が出なければ二〜三剤まで服用する。生もの・冷たいもの、ねばり気・脂っこいもの、肉・麺類、五辛（にんにく・ねぎ類など刺激の強い野菜）、酒・乳製品、においのきついものなどは禁ずる。〕",
    tochu: [
      { head: "㕮咀", koma: "26L",
        kaki: "陶弘景曰く、㕮咀とは、之を細切し、較略㕮咀の如くならしむ。",
        yaku: "陶弘景は「㕮咀とは細かく刻むことで、おおよそ㕮咀（かみ砕いた）程度の大きさにすることだ」と言っている。" },
      { head: "適寒温・服", koma: "26L–27R",
        kaki: "適は適宜の義、中を得るを謂うなり。靈樞師傳篇に曰く、飲食衣服も亦寒温に適せんと欲す。十四難に曰く、其の飲食を調え、其の寒温に適す。千金の卒倒を治する法に曰く、冷煖に適して三升を飲む。說文に曰く、服は用なり。氣味合して之を服すは、素問藏氣法時論に見ゆ。",
        yaku: "「適」は「ほどよい」という意味で、中庸を得ることをいう。『霊枢』師伝篇に「飲食や衣服もまた、寒温をほどよくしたい」とあり、『難経』十四難に「飲食を調え、寒温をほどよくする」とあり、『千金方』の卒倒の治法に「冷たさ温かさをほどよくして三升飲む」とある。『説文』に「服とは用いることである」とある。「気味合して之を服す」という語は『素問』蔵気法時論に見える。" },
      { head: "服用の度合い", koma: "27R–27L",
        kaki: "醫の藥を用うるに於ける、發汗吐下を論ずる勿く、假使方症相對するも、苟も藥量用度機宜に適せずんば、疾疢安んぞ其の治を得ん。故に處療の際、尤も心を斯に用いざるべからず。但世人多く疾を攻むるに怯ゆ、是を以て其の汗吐下に於けるや、多く之を不斷に失い、顧望趑趄して、爲すべきに爲すこと能わず、却って輕きをして重きに至らしめ、重きは非命に斃る。東洞先生の之を域する者は、其の意特に流弊を矯むるに在るのみ。服度の斟酌、安んぞ廢すべけんや、學者之を思え。",
        yaku: "医者が薬を用いるにあたっては、発汗・吐・下のいずれであれ、たとえ処方と症状が合っていても、薬の量や服用の度合いが時機にかなっていなければ、どうして病を治すことができようか。だから治療のときには、とりわけこの点に心を用いなければならない。ところが世の人の多くは病を攻めることを恐れ、そのため汗・吐・下の治療で決断がつかずに失敗することが多い。ためらって先へ進めず、なすべきことをなせず、かえって軽い病を重くし、重い者を非業の死に至らせている。東洞先生がこの部分を囲んだ（「」で括った）のは、その意図がひとえに世に広まった弊害を正すことにあったにすぎない。服用の度合いを斟酌することを、どうして廃してよいだろうか。学ぶ者はよく考えよ。" },
      { head: "禁忌の十五字", koma: "27L",
        kaki: "玉函・千金・千金翼共に「禁生冷」以下十五字無し、是なり。",
        yaku: "『金匱玉函経』『千金方』『千金翼方』にはいずれも「禁生冷」以下の十五字がない。それが正しい。" }
    ]
  },
  joubun: [
    { src: "傷寒論 太陽病上", koma: "27L",
      kaki: "「太陽の中風、陽浮にして陰弱。陽浮の者は熱自ずから發し、陰弱の者は汗自ずから出づ。嗇嗇として惡寒し」、淅淅として惡風し、翕翕として發熱し、鼻鳴乾嘔する者。",
      yaku: "〔太陽の中風で、脈が浅いところでは浮き、深いところでは弱い。浮いているのは自然に発熱するからで、弱いのは自然に汗が出るからである。ぞくぞくと寒気がし、〕すうすうと風を嫌い、ほかほかと発熱し、鼻が詰まって鳴り、からえずきをする者。" },
    { src: "傷寒論 太陽病上", koma: "27L",
      kaki: "「太陽病」、頭痛發熱し、汗出で惡風する者。",
      yaku: "〔太陽病で、〕頭痛・発熱があり、汗が出て風を嫌う者。",
      tochu: [ { koma: "27L", kaki: "第二章は、是れ桂枝湯の正症なり。「惡風」の下、脉經に「若惡寒」の三字有り。",
        yaku: "この第二条は桂枝湯の正証（本来の証）である。「惡風」の下に、『脈経』では「若惡寒（あるいは悪寒）」の三字がある。" } ] },
    { src: "傷寒論 太陽病上", koma: "27L",
      kaki: "「太陽病、之を下して後」、其の氣上衝する者は、桂枝湯を與うべし。方は前法を用う。若し上衝せざる者は、之を與うべからず。",
      yaku: "〔太陽病を下剤で下したあと、〕気が上へ突き上げる者には桂枝湯を与えるがよい。煎じ方・飲み方は前に述べた方法による。突き上げがない者には与えてはならない。",
      tochu: [ { koma: "27L", kaki: "特に上衝の一症に就いて桂枝湯を用う、以て桂枝の主治する所を見るべし。桂枝去芍藥湯・桂枝加桂湯・桂枝甘艸湯の如きも、亦併せ考うべし。按ずるに「方用前法」の四字、玉函・千金翼并びに無し、是なり。",
        yaku: "上衝というただ一つの症状について桂枝湯を用いていることから、桂枝の主治するところがわかる。桂枝去芍薬湯・桂枝加桂湯・桂枝甘草湯なども、あわせて考えるべきである。按ずるに、「方用前法」の四字は『玉函経』にも『千金翼方』にもない。ないのが正しい。" } ] },
    { src: "傷寒論 太陽病上", koma: "27L–28R",
      kaki: "「太陽病」、三日、已に汗を發し、若しくは吐し、若しくは下し、若しくは温鍼して、仍お解せざる者は、此れを壞病と爲す、桂枝は與うるに中らざるなり。其の脉證を觀て、何の逆を犯せるかを知り、證に隨って之を治す。",
      yaku: "〔太陽病で、〕三日たち、すでに発汗させ、あるいは吐かせ、あるいは下し、あるいは温鍼をしても、なお治らない者は「壊病」であり、桂枝湯を与えるのは適当でない。脈と症状をよく観察し、どのような誤治を犯したかを見きわめ、その証に従って治療する。",
      tochu: [ { koma: "28R", kaki: "壞病とは、汗下の諸治を經て、正症敗壞するを謂うなり。「證に隨って之を治す」の一句は、處方の大要の言なり。苟も斯の義を會せば、方劑の用、疾病の治、之を掌上に運らすべし。王肯堂曰く、「症に隨って之を治す」の一句、語活きて義廣しと、知言と謂うべし。",
        yaku: "「壊病」とは、発汗・下しなどの諸治療を経て、本来の証が崩れてしまったものをいう。「証に随って之を治す」の一句は、処方の大要を述べた言葉である。もしこの意味を会得すれば、方剤の運用も病気の治療も、手のひらの上で転がすように自在にできるだろう。王肯堂は「証に随って之を治すの一句は、言葉が生きていて意味が広い」と言っている。本質をとらえた言葉といえる。" } ] },
    { src: "傷寒論 太陽病上", koma: "28R",
      kaki: "「桂枝は本と解肌と爲す。若し其の人脉浮緊、發熱して汗出でざる者は、與うべからざるなり。常に須らく此れを識り、誤らしむること勿かれ。」",
      yaku: "〔桂枝湯は本来、肌（体表）の邪を解くものである。脈が浮いて緊張し、発熱しても汗が出ない者には与えてはならない。常にこれをわきまえ、誤ってはならない。〕",
      tochu: [ { koma: "28R", kaki: "若し其の人脉浮緊、發熱して汗出でざる者は、麻黄湯を用うべし。若し症にして煩躁或いは渴する者は、大青龍湯を用うべし。",
        yaku: "脈が浮緊で、発熱して汗が出ない者には麻黄湯を用いるがよい。その証でさらに煩躁したり口渇があったりする者には、大青竜湯を用いるがよい。" } ] },
    { src: "傷寒論 太陽病上", koma: "28R",
      kaki: "「若し酒客病めば、桂枝湯を與うべからず。湯を得れば則ち嘔す、酒客は甘きを喜ばざるを以ての故なり。」",
      yaku: "〔大酒飲みが病んだときは桂枝湯を与えてはならない。飲めば吐く。酒飲みは甘いものを好まないからである。〕" },
    { src: "傷寒論 太陽病上", koma: "28R",
      kaki: "「凡そ桂枝湯を服して吐する者は、其の後必ず膿血を吐するなり。」",
      yaku: "〔およそ桂枝湯を飲んで吐く者は、その後必ず膿血を吐く。〕" },
    { src: "傷寒論 太陽病上", koma: "28R",
      kaki: "「太陽病」、初め桂枝湯を服し、反って煩して解せざる者は、「先ず風池・風府を刺し」、却って桂枝湯を與うれば則ち愈ゆ。",
      yaku: "〔太陽病で、〕はじめに桂枝湯を飲んだところ、かえって煩わしく苦しみ、治らない者は、〔まず風池・風府のツボに鍼を刺し、〕そのうえで改めて桂枝湯を与えれば治る。",
      tochu: [ { koma: "28R", kaki: "反って煩して解せざる者は、藥瞑眩すと雖も、藥力徹せず、病未だ除くことを得ざるなり。故に仍お桂枝湯を用うるなり。",
        yaku: "「かえって煩して治らない」というのは、薬による瞑眩は起きているものの、薬の力が行きわたらず、病がまだ除かれていないのである。だから引き続き桂枝湯を用いるのである。" } ] },
    { src: "傷寒論 太陽病上", koma: "28R–28L",
      kaki: "桂枝湯を服し、大いに汗出で、脉洪大の者は、桂枝湯を與うること前法の如くす。「若し形瘧の如く、日に再發する者は、汗出づれば必ず解す。桂枝二麻黄一湯に宜し。」",
      yaku: "桂枝湯を飲んで大いに汗が出て、脈が洪大（大きく力強い）になった者には、前と同じ方法で桂枝湯を与える。〔もし症状がマラリアのように寒熱をくり返し、一日に二度発作が起こる者は、汗が出れば必ず治る。桂枝二麻黄一湯がよい。〕",
      tochu: [ { koma: "28R–28L", kaki: "「服桂枝湯」以下十八字は、是れ白虎加人參湯の條文、錯誤して此に入るなり。當に之を删去すべし。「若形」以下は、宜しく前章「却與桂枝湯則愈」の句の下に接して、以て一章と爲すべきなり。",
        yaku: "「服桂枝湯」以下の十八字（服桂枝湯〜如前法）は白虎加人参湯の条文で、誤ってここに入ったものである。削除すべきである。「若形」以下は、前の条の「却って桂枝湯を与うれば則ち愈ゆ」の句の下に続けて、一条とすべきである。" } ] },
    { src: "傷寒論 太陽病中", koma: "28L",
      kaki: "「太陽病、外證未だ解せず、脉浮弱の者は、當に汗を以て解すべし。」",
      yaku: "〔太陽病で、体表の症状（外証）がまだ治らず、脈が浮いて弱い者は、汗をかかせて治すべきである。〕",
      tochu: [ { koma: "28L", kaki: "「太陽病外症未解」云云の二章は、是れ已に發汗を經て、大勢已に解し、而して頭痛發熱惡風等の症未だ全く愈えず、脉も亦浮弱、故に外症未だ解せずと曰う、更に桂枝湯を用うる所以なり。東洞先生の之を域する者は、其の辭を惡むなり。編中此の類、枚舉に勝えず、是れ斯の書の體例なり。學者之を思え。",
        yaku: "「太陽病、外証未だ解せず」云々の二条（この条と次の条）は、すでに発汗を経て病勢の大部分は治まったが、頭痛・発熱・悪風などの症状がまだ完全には治らず、脈も浮弱である。だから「外証未だ解せず」と言うのであり、そのためさらに桂枝湯を用いるのである。東洞先生がこれを囲んだ（「」で括った）のは、その言い回しを嫌ったためである。本書中にこのような例は数えきれないほどあり、これが本書の体例（編集方針）である。学ぶ者はよく考えよ。" } ] },
    { src: "傷寒論 太陽病中", koma: "28L",
      kaki: "「太陽病、外證未だ解せざる者は、下すべからざるなり。之を下すを逆と爲す。外を解せんと欲する者。」",
      yaku: "〔太陽病で、体表の症状がまだ治らない者は、下してはならない。下すのは誤治である。体表の邪を解こうとする者（には桂枝湯）。〕" },
    { src: "傷寒論 太陽病中", koma: "28L",
      kaki: "「太陽病、先ず汗を發して解せず、而るに復た之を下し、脉浮の者は愈えず。浮は外に在りと爲す、而るに反って之を下す、故に愈えざらしむ。今脉浮、故に外に在るを知る。當に須らく外を解すべし、則ち愈ゆ。」",
      yaku: "〔太陽病で、まず発汗させても治らず、さらに下したが、脈が浮いている者は治らない。脈が浮くのは邪が外（体表）にあるからで、それなのに下したから治らないのである。いま脈が浮いているので、邪は外にあるとわかる。体表の邪を解けば治る。〕" },
    { src: "傷寒論 太陽病中", koma: "28L–29R",
      kaki: "「病常に自汗出づる者は、此れを榮氣和すと爲す。榮氣和する者は、外諧わず、衛氣の榮氣と共に和諧せざるを以ての故に爾り。榮は脉中を行り、衛は脉外を行るを以て、復た其の汗を發し、榮衛和すれば則ち愈ゆ。」",
      yaku: "〔病でいつも自然に汗が出る者は、栄気は調和している。栄気が調和していても外側（体表）が整わないのは、衛気が栄気と調和していないためである。栄気は脈の中を、衛気は脈の外をめぐるので、もう一度発汗させて栄衛が調和すれば治る。〕" },
    { src: "傷寒論 太陽病中", koma: "29R",
      kaki: "病人「藏」に他病無く、時に發熱し、自汗出でて愈えざる者は、「此れ衛氣和せざるなり」、其の時に先だって汗を發すれば則ち愈ゆ。",
      yaku: "病人で、〔腹中（内臓）に〕ほかの病がなく、ときどき発熱し、自然に汗が出て治らない者は、〔衛気が調和していないのである。〕発熱する時刻より前に発汗させれば治る。",
      tochu: [ { koma: "29R", kaki: "「藏に他病無し」の藏は、「其の藏に寒有り」及び「藏厥」の藏と同じく、皆腹中を謂うなり。魏志華佗傳に曰く、彭城の樊阿、佗に從いて學び、阿鍼術を善くす。凡そ醫咸言う、背及び胸藏の間は妄りに鍼すべからず、之を鍼すること四五分に過ぎずと。而るに阿は背に鍼して入るること一二寸、巨闕胸藏に五六寸、而して病皆愈ゆと。以て徵すべし。",
        yaku: "「蔵に他病無し」の「蔵」は、「其の蔵に寒有り」「蔵厥」の「蔵」と同じで、いずれも腹の中を指す。『魏志』華佗伝に「彭城の樊阿は華佗に学び、鍼術にすぐれていた。医者たちはみな、背中と胸部・内臓のあたりはむやみに鍼を刺してはならず、刺しても四〜五分を超えてはならないと言っていた。ところが樊阿は背中に一〜二寸、巨闕（みぞおち）から胸部・内臓に五〜六寸も刺し、それで病はみな治った」とある。これによって（蔵が胸腹部を指すことが）証明できる。" } ] },
    { src: "傷寒論 太陽病中", koma: "29R",
      kaki: "「傷寒」、大便せざること六七日、頭痛して熱有る者は、承氣湯を與う。「其の小便清き者は、裏に在らず、仍お表に在るを知るなり。當に須らく汗を發すべし。若し頭痛する者は必ず衄す。桂枝湯に宜し。」",
      yaku: "〔傷寒で、〕六〜七日便通がなく、頭痛して熱がある者には承気湯を与える。〔小便が澄んでいる者は、邪は裏（体内）ではなく、まだ表にあるとわかる。発汗させるべきである。頭痛する者は必ず鼻血を出す。桂枝湯がよい。〕",
      tochu: [ { koma: "29R–29L", kaki: "「頭痛有熱」の下、千金翼に「小便赤」の三字有り。「小便」の下、外臺秘要に「反」の字有り、倶に是なり。承氣湯は大承氣湯なり。大承氣湯一下して、以て裏熱の壅滯を疏蕩すれば、則ち頭痛身熱即ち解す。「傷寒六七日、目中了了たらず、睛和せず、大便難く、身微熱の者は、大承氣湯を與う」と、其の義略同じ。",
        yaku: "「頭痛有熱」の下に、『千金翼方』では「小便赤」の三字がある。「小便」の下に、『外台秘要』では「反」の字がある。どちらも正しい。ここでいう承気湯とは大承気湯である。大承気湯で一度下して裏熱の停滞を一掃すれば、頭痛・身熱はすぐに治る。「傷寒六七日、目中了了たらず、睛和せず、大便難く、身微熱の者は大承気湯を与う」という条と、意味はほぼ同じである。" } ] },
    { src: "傷寒論 太陽病中", koma: "29R",
      kaki: "「傷寒」、汗を發して解し、半日許りにして、復た煩し、脉浮數の者は、更に汗を發すべし。",
      yaku: "〔傷寒で、〕発汗させていったん治ったが、半日ほどして再び煩わしく苦しくなり、脈が浮いて速い者は、もう一度発汗させるべきである。",
      tochu: [ { koma: "29L", kaki: "傷寒、汗を發して解し、半日許りにして復た煩し、脉浮數の者は、邪氣未だ全く除かず、死灰將に再び燃えんとするなり。麻黄湯を用うべきに似たり、而るに今桂枝湯を用うる者は、發汗の後なるを以てなり。",
        yaku: "「傷寒、発汗して解し、半日ほどで再び煩し、脈浮数」の者は、邪気がまだ完全に除かれておらず、消えかけた灰が再び燃えあがろうとしているのである。麻黄湯を用いてもよさそうに思えるが、ここで桂枝湯を用いるのは、すでに発汗したあとだからである。" } ] },
    { src: "傷寒論 太陽病中", koma: "29L",
      kaki: "「傷寒」、醫之を下し、續いて下利を得、清穀止まず、身疼痛する者は、「急に當に裏を救うべし。」後身疼痛し、清便自ら調う者は、「急に當に表を救うべし。裏を救うには」四逆湯に宜しく、「表を救うには」桂枝湯に宜し。",
      yaku: "〔傷寒で、〕医者が下剤で下したところ、続いて下痢となり、未消化便（清穀）が止まらず、体が痛む者は、〔急いで裏（内部）を救わねばならない。〕その後、体の痛みは残るが便通が正常になった者は、〔急いで表を救わねばならない。裏を救うには〕四逆湯、〔表を救うには〕桂枝湯がよい。",
      tochu: [ { koma: "29L–30R", kaki: "傷寒、醫之を下し、續いて下利を得、清穀止まず、身疼痛する者は、此れ下すべからずして之を下し、以て危急に至る者なり。故に先ず四逆湯を以て其の危急を救い、而る後に桂枝湯を以て發汗すれば、則ち身疼痛隨って愈ゆ。雉間子炳云う、清穀止むと雖も、身疼痛未だ愈えざる者は、猶お四逆の輩に宜し、恐らくは桂枝湯の症に非ずと。是れ特に處療の法を知らざるのみならず、又二方の主治を知らざるなり。",
        yaku: "「傷寒、医が下して、続いて下痢となり、清穀が止まらず、体が痛む」者は、下すべきでないのに下したために危急に至った者である。だから先に四逆湯でその危急を救い、そのあとで桂枝湯で発汗させれば、体の痛みもそれに従って治る。雉間子炳は「清穀は止まっても体の痛みがまだ治らない者は、なお四逆湯の類がよく、恐らく桂枝湯の証ではない」と言うが、これは処置の方法を知らないばかりか、二方の主治も知らないのである。" } ] },
    { src: "傷寒論 太陽病中", koma: "29L",
      kaki: "「太陽病」、發熱し汗出づる者は、「此れ榮弱く衛強しと爲す、故に汗出でしむ。邪風を救わんと欲する者。」",
      yaku: "〔太陽病で、〕発熱して汗が出る者。〔これは栄気が弱く衛気が強いためで、そのため汗が出る。邪風を除こうとする者（には桂枝湯）。〕" },
    { src: "傷寒論 太陽病下", koma: "29L",
      kaki: "「傷寒」、大いに下して後、復た汗を發し、心下痞し、惡寒する者は、「表未だ解せざるなり。痞を攻むべからず。當に先ず表を解すべし。表解して乃ち痞を攻むべし。」表を解するには桂枝湯に宜しく、痞を攻むるには大黄黄連瀉心湯に宜し。",
      yaku: "〔傷寒で、〕大いに下したあと、さらに発汗させ、みぞおちがつかえ（心下痞）、寒気がする者は、〔まだ表証が治っていない。つかえを攻めてはならない。まず表を解き、表が治ってからつかえを攻めるべきである。〕表を解くには桂枝湯、つかえを攻めるには大黄黄連瀉心湯がよい。",
      tochu: [ { koma: "30R", kaki: "「傷寒大下後」云云、「心下痞」の下、頭痛發熱身疼痛等の一二症を脫するかと疑う。否ずんば則ち附子瀉心湯の症と差別無きに似たり。",
        yaku: "「傷寒、大いに下して後」云々の条で、「心下痞」の下に、頭痛・発熱・身疼痛など一、二の症状が脱落しているのではないかと疑われる。そうでなければ、附子瀉心湯の証と区別がないように思われる。" } ] },
    { src: "傷寒論 陽明病", koma: "29L–30R",
      kaki: "「陽明病」、脉遲く、汗出づること多く、微しく惡寒する者は、「表未だ解せざるなり」、汗を發すべし。",
      yaku: "〔陽明病で、〕脈が遅く、汗がたくさん出て、わずかに寒気がする者は、〔まだ表証が治っていないのであり、〕発汗させるべきである。",
      tochu: [ { koma: "30R", kaki: "「陽明病脉遲」云云、按ずるに陽明篇小承氣湯の條、「微惡寒」を「微發熱惡寒」に作る、是なり。",
        yaku: "「陽明病、脈遅」云々の条について。按ずるに陽明篇の小承気湯の条では「微惡寒」を「微發熱惡寒」に作っており、それが正しい。" } ] },
    { src: "傷寒論 陽明病", koma: "30R",
      kaki: "病人煩熱し、汗出づれば則ち解し、「又瘧狀の如く」、日晡所に發熱する者は、「陽明に屬するなり」。脉實の者は宜しく之を下すべし、脉浮虛の者は宜しく汗を發すべし。之を下すには大承氣湯を與え、汗を發するには桂枝湯に宜し。",
      yaku: "病人が熱っぽく苦しみ、汗が出ると治まり、〔またマラリアのように、〕夕方ごろ（日晡所）に発熱する者は、〔陽明に属する。〕脈が充実していれば下し、脈が浮いて虚していれば発汗させる。下すには大承気湯、発汗には桂枝湯がよい。",
      tochu: [ { koma: "30R", kaki: "「病人煩熱」云云、此の症、脉浮虛と雖も、恐らくは桂枝二麻黄一湯を用うるを佳と爲す。",
        yaku: "「病人煩熱」云々の条について。この証は脈が浮虚であっても、恐らく桂枝二麻黄一湯を用いるほうがよい。" } ] },
    { src: "傷寒論 太陰病", koma: "30R",
      kaki: "「太陰病」、脉浮の者は、汗を發すべし。",

    (e.tags||[]).forEach(t=>{ if(test(t)) hits.push({e,where:"症状タグ",text:t,a:""}) });
    (e.joubun||[]).forEach((j,i)=>{
      if(test(j.kaki+j.yaku)) hits.push({e,where:`第${i+1}条`,text:j.yaku,a:`jo-${i+1}`});
      if(j.an&&test(j.an.kaki+j.an.yaku)) hits.push({e,where:`第${i+1}条・東洞按`,text:j.an.yaku,a:`jo-${i+1}`});
      (j.tochu||[]).forEach(t=>{ if(test(t.kaki+t.yaku)) hits.push({e,where:`第${i+1}条・頭注`,text:t.yaku,a:`jo-${i+1}`}) });
    });
    [...(e.tochu||[]),...(e.houzai?.tochu||[])].forEach(t=>{ if(test(t.kaki+t.yaku)) hits.push({e,where:`頭注・${t.head}`,text:t.yaku,a:"s-ho"}) });
  });
  const seen=new Set(); const uniq=hits.filter(h=>{const k=h.e.id+h.where+h.text.slice(0,20); if(seen.has(k))return false; seen.add(k); return true});
  const mark=s=>{ let h=esc(s.length>130?snip(s,ts):s); ts.forEach(t=>{ if(t) h=h.split(esc(t)).join(`<mark>${esc(t)}</mark>`) }); return h };
  box.hidden=false;
  box.innerHTML=`<h2>「${esc(q)}」の検索結果 ${uniq.length}件${ts.length>1?`<span class="small">（${esc(ts.slice(0,8).join("・"))} を含めて検索）</span>`:""}</h2>`+
    (uniq.length?uniq.slice(0,80).map(h=>`<a class="hit" href="#${h.e.id}" data-goto="${h.e.id}" data-anchor="${h.a}"><b>${esc(h.e.title)}</b><span class="where">${esc(h.where)}</span><p>${mark(h.text)}</p></a>`).join(""):`<p class="small">該当なし。別の言い方（例：「寒気」→「悪寒」）でもお試しください。</p>`);
}
function snip(s,ts){ let i=-1; for(const t of ts){ i=s.indexOf(t); if(i>=0)break } i=Math.max(0,i-30); return (i>0?"…":"")+s.slice(i,i+120)+"…" }
let mode="both"; try{ mode=localStorage.getItem("rj-mode")||"both" }catch(e){}
if(!["both","kaki","yaku"].includes(mode)) mode="both";
document.body.dataset.mode=mode;
$("#nav").innerHTML=navHTML();
$("#hint").innerHTML="例："+EX.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join("");
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-q],[data-mode],[data-goto],[data-jump]"); if(!t||t.tagName==="BODY") return;
  if(t.dataset.q){ $("#q").value=t.dataset.q; search(t.dataset.q); window.scrollTo(0,0); return }
  if(t.dataset.mode&&t.tagName==="BUTTON"){ mode=t.dataset.mode; document.body.dataset.mode=mode; try{localStorage.setItem("rj-mode",mode)}catch(e){}
    document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode)); return }
  if(t.dataset.jump){ ev.preventDefault(); document.getElementById(t.dataset.jump)?.scrollIntoView(); return }
  if(t.dataset.goto){ ev.preventDefault(); history.replaceState(null,"","#"+t.dataset.goto); render(t.dataset.goto);
    if(matchMedia("(max-width:760px)").matches){ $("#nav").classList.remove("open"); $("#navbtn").setAttribute("aria-expanded","false"); $("#navbtn").textContent="目次（方剤）を開く" }
    const a=t.dataset.anchor; requestAnimationFrame(()=>{ const el=a&&document.getElementById(a); (el||$("#page")).scrollIntoView(); }); }
});
$("#q").addEventListener("input",e=>search(e.target.value));
$("#navbtn").addEventListener("click",()=>{const n=$("#nav"),o=!n.classList.contains("open");n.classList.toggle("open",o);$("#navbtn").setAttribute("aria-expanded",o);$("#navbtn").textContent=o?"目次を閉じる":"目次（方剤）を開く"});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||(D[0]&&D[0].id));
</script>
