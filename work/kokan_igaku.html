<title>皇漢医学 症状検索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 左に篇→方剤の目次（帙の背）、右に一方剤の頁。上部に症状検索。 */
:root{
  --bg:#eef0ec; --paper:#f8f9f6; --ink:#1f2a2e; --muted:#5d6a6c; --line:#c9d0cb;
  --ai:#2c4a6b; --ai-soft:#dbe3ec; --shu:#b23a2a; --shu-soft:#f3e0dc; --hl:#f2e6a8;
  --f-disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b1e; --paper:#1c2427; --ink:#e3e8e6; --muted:#9aa7a8; --line:#33403f;
  --ai:#8fb3d9; --ai-soft:#24364a; --shu:#e07a68; --shu-soft:#3a2522; --hl:#5a4f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b1e; --paper:#1c2427; --ink:#e3e8e6; --muted:#9aa7a8; --line:#33403f;
  --ai:#8fb3d9; --ai-soft:#24364a; --shu:#e07a68; --shu-soft:#3a2522; --hl:#5a4f1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;max-width:1180px;margin:0 auto}
h1{font-family:var(--f-disp);font-size:22px;margin:0;letter-spacing:.08em}
.sub{color:var(--muted);font-size:12px}
.search{display:flex;gap:8px;max-width:1180px;margin:10px auto 0}
.search input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.search input:focus{outline:2px solid var(--ai);outline-offset:1px}
.hint{max-width:1180px;margin:6px auto 0;font-size:12px;color:var(--muted)}
.hint button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:1px 10px;margin:2px 2px 0 0;cursor:pointer}
#navbtn{display:none}
#menufab{display:none}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1180px;margin:18px auto 0}
nav{position:sticky;top:150px;align-self:start;font-size:14px}
nav h3{font-family:var(--f-disp);font-size:13px;color:var(--muted);letter-spacing:.15em;margin:14px 0 4px;font-weight:500}
nav a{display:block;padding:5px 10px;border-left:3px solid transparent;color:var(--ink);text-decoration:none;border-radius:0 4px 4px 0}
nav a:hover{background:var(--ai-soft)}
nav a.on{border-left-color:var(--ai);background:var(--ai-soft);font-weight:700}
nav .vol{font-size:11px;color:var(--muted)}
main{min-width:0}
.results{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin-bottom:18px}
.results h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.hit{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.hit:first-of-type{border-top:0}
.hit b{font-family:var(--f-disp);font-size:17px}
.hit .where{font-size:12px;color:var(--ai);margin-left:8px}
.hit p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
mark{background:var(--hl);color:inherit;padding:0 1px}
.page{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px clamp(16px,3vw,36px)}
.page h2{font-family:var(--f-disp);font-size:30px;margin:0;letter-spacing:.1em;text-wrap:balance}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--bg);cursor:pointer;color:var(--ink);font-family:inherit}
.tag:hover{border-color:var(--ai)}
.rel{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:10px;font-size:13.5px}
.rel a{color:var(--ai);font-family:var(--f-disp);font-weight:700}
.toc{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.toc a{color:var(--ai)}
section{margin-top:30px}
section>h3{font-family:var(--f-disp);font-size:19px;margin:0 0 12px;padding-bottom:4px;border-bottom:2px solid var(--ink);letter-spacing:.08em}
.houzai{display:grid;gap:4px}
.houzai .c{font-family:var(--f-disp);font-size:17px;white-space:pre-line}
.small{font-size:13px;color:var(--muted)}
.jo{border-top:1px solid var(--line);padding:16px 0}
.jo:first-of-type{border-top:0;padding-top:0}
.johead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.no{font-family:var(--f-disp);font-weight:700;color:var(--ai);font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted)}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;color:var(--ink);padding:3px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
.kaki{font-family:var(--f-disp);font-size:18px;line-height:2;margin:0}
.yaku{font-size:15.5px;margin:0}
.both .yaku{margin-top:6px;padding-left:12px;border-left:3px solid var(--ai-soft)}
.yumoto{margin-top:12px;background:var(--shu-soft);border-radius:6px;padding:10px 14px}
.yumoto summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--shu);list-style:none}
.yumoto summary::-webkit-details-marker{display:none}
.yumoto summary::before{content:"求真按 ";font-family:var(--f-disp);border:1.5px solid var(--shu);border-radius:3px;padding:0 4px;margin-right:6px;font-weight:700}
.yumoto p{margin:8px 0 0;font-size:14.5px}
.sp{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line)}
.sp:first-of-type{border-top:0}
.sp .who{font-family:var(--f-disp);font-weight:700}
.sp .who small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:13px;background:var(--ai-soft);border-radius:4px;padding:1px 8px}
.case{padding:12px 0;border-top:1px solid var(--line)}
.case:first-of-type{border-top:0}
.case b{font-family:var(--f-disp)}
.case p{margin:4px 0 0}
.box{background:var(--shu-soft);border-radius:6px;padding:12px 16px}
.box p{margin:0 0 8px}
.kg{padding:10px 0;border-top:1px solid var(--line)}
.kg:first-of-type{border-top:0}
.kg b{font-family:var(--f-disp);font-size:17px}
.check{font-size:12.5px;color:var(--muted);margin-top:30px;border-top:1px dashed var(--line);padding-top:10px}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #navbtn{display:block;max-width:1180px;margin:8px auto 0;width:100%;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
  #navbtn[aria-expanded="true"]{border-color:var(--ai)}
  nav{position:static;display:none;flex-wrap:wrap;gap:4px}
  nav.open{display:flex}
  nav h3{width:100%;margin:6px 0 0}
  nav a{border:1px solid var(--line);border-radius:999px;padding:2px 12px}
  nav a.on{border-color:var(--ai)}
  .sp{grid-template-columns:minmax(0,1fr)}
  .page h2{font-size:26px}
  /* 読むときは上の検索・目次を隠して全画面に。左下のボタンで呼び出す */
  body.reading header,body.reading nav,body.reading #results{display:none!important}
  body.reading .wrap{margin-top:12px}
  body.reading{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.reading #menufab{display:flex;align-items:center;gap:6px;position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
    font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border:0;border-radius:999px;background:var(--ai);color:var(--paper);box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}
  body.reading #menufab:active{transform:scale(.97)}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

window.KOKAN_DATA = window.KOKAN_DATA || [];
window.KOKAN_DATA.push(
{

  pages: "74–76", koma: "57–58",
  joubun: [
    {
      src: "傷寒論",
      kaki: "太陽の病たる、脈浮、頭項強痛して惡寒す。",
      yaku: "太陽病とは、脈が浮で、頭から項（うなじ）にかけてこわばって痛み、悪寒がするものをいう。",

    }
  ],
  senpai: [
    { who: "吉益南涯", src: "（本書所引）", kw: ["太＝はなはだしい", "陽気が表位（体表）に盛ん", "脈浮・頭項強痛が太陽の徴候", "気が盛んで血が滞る→強痛", "発散すれば項強・悪寒は去り、発熱・汗出となる", "日を経ると内に及ぶ"] },
    { who: "張璐", src: "（本書所引）", kw: ["脈浮＝邪気が肌表にある"] },
    { who: "程応旄", src: "（本書所引）", kw: ["頭痛・悪寒が太陽経の最も確かな証", "ゆえに冒頭に掲げる"] },
    { who: "成無已", src: "（本書所引）", kw: ["悪寒：風に当たらなくても自然に寒い", "悪風：風に当たると嫌うが、密室・帳の中では平気"] },
    { who: "丹羽元堅", src: "（本書所引）", kw: ["太陽病＝表熱証", "邪は初感でまず表を犯す", "正気が伸びず、併さって熱となる"] }
  ],
  cases: [],
  yumoto: [
    { head: "太陽病の大綱について", text: "これらの註釈によって師（張仲景）の意図を推し量れないわけではないが、一言でいえば、どのような病症であっても、脈が浮で頭項がこわばって痛み、悪寒するならば、これを太陽病とせよという意味であり、まさに太陽病の大綱を示したものである。脈が浮であるのは浅在動脈に血液が充満している徴候、頭項が強ばり痛むのは頭部・項部が他の部位に比べて血液充満の度が強く、滞っているためであり、悪寒するのは、まさに発熱しようとしてまだ発熱しきれない徴候である。\nこのように太陽病は病毒が体表、とくに上半身に集中したものであるから、これを治すには発汗解熱薬を用いて病毒を汗腺から排除するほかに方法はない。しかし病者の体質はそれぞれ異なるので、それに対する処方もまた同じであるわけにはいかない。人の体質は千差万別で予測しがたいようであるが、突き詰めれば二つに大別できる。\n一つは皮膚のきめが粗く弛緩しているもので、この素質の人が太陽病にかかると、脈浮弱・自汗などの症状を現すので、桂枝を主薬とする桂枝湯で治すべきである。もう一つは皮膚が緻密で緊張しているもので、この体質の人が太陽病に侵されると、脈浮緊・無汗などの徴候を現すので、麻黄を君薬とする麻黄湯を用いて治すべきである。\nこのように太陽病には二大別があるので、まず桂枝湯とそこから派生する諸方について述べ、次に麻黄湯とそこに源をもつ諸方に及ぼうと思う。" },

{
  id: "v1-keishito",

    how: "細かく刻み、水2合5勺を1合に煎じ、滓を去って1日3回に分けて温服する。",

  },
  joubun: [
    { src: "傷寒論",
      kaki: "太陽の中風、陽浮にして陰弱、陽浮なる者は熱自ら発し、陰弱なる者は汗自ら出づ、嗇嗇（しょくしょく）として悪寒、淅淅（せきせき）として悪風、翕翕（きゅうきゅう）として発熱し、鼻鳴り乾嘔する者は、桂枝湯之を主る。",
      yaku: "太陽病の中風（かぜ）で、脈が外（浅い所）では浮き、内（深い所）では弱い。浮いているのは自然に発熱するからであり、弱いのは自然に汗が出るからである。ぞくぞくと寒気がし、水をかけられたように風を嫌い、ぽっぽと熱が出て、鼻がぐずつき、からえずきをする者は、桂枝湯が主治する。",
      yumoto: "「太陽」は太陽病の略で、「中風」は風に中（あた）るの意であるから、現在の感冒である。したがって「太陽の中風」とは、脈浮・頭項強痛して悪寒する感冒のことである。「陽浮にして陰弱」の陽は外、陰は内の意であるから、外へ浮かび内へ弱い状態の脈をいう。「陽浮なる者は熱自ら発し、陰弱なる者は汗自ら出づ」の二句は、脈の状態から発熱と発汗を予測した言葉である。「嗇嗇として悪寒」とはぞくぞくと寒気立つこと、「淅淅として悪風」とは水をかけられたように寒く、風に当たるのを嫌うこと、「翕翕として発熱」とはぽっぽと熱が出ること、「鼻鳴り乾嘔」とは鼻がぐすぐすして、からえずきをすることである。" },
    { src: "傷寒論",
      kaki: "太陽病、頭痛発熱、汗出で悪風する者は、桂枝湯之を主る。",
      yaku: "太陽病で、頭痛と発熱があり、汗が出て風を嫌う者は、桂枝湯が主治する。",

    { src: "傷寒論",
      kaki: "太陽病、之を下して其の気上衝する者には、桂枝湯を与うべし。上衝せざる者には之を与うべからず。",
      yaku: "太陽病を（誤って）下したのち、気が突き上がってくる者には桂枝湯を与えよ。突き上がりのない者には与えてはならない。",
      yumoto: "太陽病は発表（発汗による治療）をもっぱらとすべきで、下すべきものではない。それなのに医者が誤って下したため、その反動として気が上衝する者には、桂枝湯を与えて上衝した気を降ろすべきであるが、その徴候のない者には与えてはならない、という意味である。\n「気」とは五官に触れても形がなく、しかも活動力のあるものであるから、この場合の気とはすなわち神経作用の意である。「上衝」とは『方機』に「およそ上衝とは上逆のことではない。気が下腹から上って胸を衝くもの、これである」とあるようなものであるから、「気上衝」とは発作的に上へ走る神経症状のことである。ただしこれは上衝の激しいものであって、緩やかなものでは必ずしも下腹から上って胸を衝くわけではなく、上衝の表れとして頭痛を現すにとどまる。前条の頭痛がまさにこれである。" },

      kaki: "太陽病、三日、已に発汗し、若しくは吐し、若しくは下し、若しくは温鍼し、仍お解せざる者は、此れを壊病と為す、桂枝を与うるに中らざるなり、其の脈証を観て、何の逆を犯すかを知り、証に随いて之を治す。",
      yaku: "太陽病にかかって三日ほどの間に、すでに発汗させ、あるいは吐かせ、下し、温鍼を施しても、なお治らない者は「壊病」（誤治によって病態が崩れたもの）である。もはや桂枝湯を与えるのは適当でない。脈と証をよく観察し、どの誤治を犯したのかを見極め、証に従って治療せよ。",
      yumoto: "「三日」とは太陽病にかかってから三日ほど経過したという意味である。「発汗し」とは桂枝湯証を誤って麻黄剤で発汗させたこと、「吐し」とは太陽病は吐かせるべきでないのに誤って吐かせたこと、「下し」とは下すべきでないのに下したことである。「温鍼し」とは、太陽病は汗によって解すべきものなのに、古代の民間療法である焼き鍼を体表に加えて熱を脅かしたことである。以上の療法はいずれも誤治であるから、病はなお治らないのである。\n「此れを壊病と為す」とは、これらの誤治のために病証が崩れたという意味であり、「桂枝を与うるに中らず」とは、このように病証が崩れたからには、もはや桂枝湯証があるはずはなく、この方を与えるのは適当でないということである。「何の逆を犯すかを知り」とは、麻黄剤で逆治したのか、吐剤で逆治したのか、下剤で逆治したのか、温鍼で逆治したのかを知って、という意味である。\nまた「証に随いて之を治す」とは、「症に随いて之を治す」と似て非なることがはなはだしい。なぜなら、症に随って治す者は個々の症状を目的として治療を施すのに対し、証に随って治す者は、個々の症状が必然的に連係し合った一群を目的として治療を行うからである。たとえば脈浮弱、頭痛発熱、汗出で悪風、鼻鳴り乾嘔するとき、脈浮弱、あるいは頭痛、あるいは発熱、あるいは汗出、あるいは悪風、あるいは鼻鳴、あるいは乾嘔という個々の症状を目的として治療するのは「症に随って治す」ものであり、脈浮弱・頭痛発熱・汗出で悪風・鼻鳴り乾嘔の全体を目的として治療を下すのが「証に随って治す」ものである。両者の間に大きな隔たりがあることを知るべきである。\n（頭注）「解」は「治」とほぼ同じ意味である。" },
    { src: "傷寒論",
      kaki: "桂枝は本（もと）解肌を為す、若し其の人脈浮緊、発熱汗出でざれば、与うべからざるなり、常に須く此を識らしめ、誤らしむること勿かるべきなり。",
      yaku: "桂枝湯はもともと肌（皮膚表層）をほぐして和らげる方である。もしその人の脈が浮緊で、発熱して汗が出ないならば、与えてはならない。常にこのことを心得させ、誤らせてはならない。",
      yumoto: "「解肌」とは肌膚を和解するという意味であるから、「桂枝は本解肌を為す」とは、桂枝湯は本来肌膚を和解する方であって、麻黄湯のような純粋な発汗剤とは異なるという意味を暗示している。だからこそ次の句で、脈浮緊・発熱して汗が出ない者、すなわち麻黄剤を用いて発汗させるべき者には、この方を与えてはならないと断言したのである。これは桂枝と麻黄を使い分けるうえで重要な鑑別点であるから、さらに次の句で「常にこのことを心得させ、誤らせてはならない」と特筆大書し、警告を与えたのである。尾台榕堂が「もしその人の脈が浮緊で発熱し汗が出なければ麻黄湯を用いるべきである。もし同じ証で煩躁し、あるいは口渇する者には大青竜湯を用いるべきである」と述べているのは、よく師の論を解釈したものというべきである。" },
    { src: "傷寒論",
      kaki: "太陽病、初め桂枝湯を服し、反って煩解せざる者は、先ず風池風府を刺し、却って桂枝湯を与うれば則ち愈ゆ。",
      yaku: "太陽病で、はじめに桂枝湯を服用したのに、かえって苦しみが取れない者は、まず風池・風府を刺し、そのうえで改めて桂枝湯を与えれば治る。",
      yumoto: "太陽病で桂枝湯証があるときに、適方である桂枝湯を与えれば、煩すなわち病苦は解散するはずである。それなのに反対に病苦が少しも衰えない者は、まず風池・風府の灸穴を刺絡し、再び桂枝湯を与えれば直ちに治る、という意味である。風池・風府については『甲乙経』に「風池の二穴は顳顬（こめかみ）の後ろ、髪際の陥凹の中にある。風府の一穴は項の髪際の上一寸、大筋の中のくぼみにある」とあるので、風池は側頭骨と後頭骨の縫合部にあり、風府は左右の僧帽筋停止部の中央にあることがわかる。\nでは、なぜこの二穴を刺絡しなければならないのか。答えはこうである。本条の病症は太陽病であるから、もとより脈浮・頭項強痛・悪寒の証がある。頭項が強ばり痛むのは、既に述べたように頭項部が他の部位に比べて充血が甚だしいためであるから、もしその充血がさらに一層高度に達すると、桂枝湯を与えても薬力が阻まれ、そのため煩が解けないのである。そこでこの二穴を刺絡して鬱滞した血液を取り去れば、薬力を阻んでいた原因が除かれるので、薬効を発揮するに至るのである。" },
    { src: "傷寒論",
      kaki: "太陽病、外証未だ解せず、脈浮弱なる者は、当に汗を以て解すべし、桂枝湯に宜し。",
      yaku: "太陽病で、外証がまだ取れず、脈が浮弱な者は、汗によって治すべきである。桂枝湯がよい。",
      yumoto: "「外証未だ解せず」とは、頭項強痛・悪寒などの症状がまだすっかり去っていないことをいうのである。" },
    { src: "傷寒論",
      kaki: "太陽病、外証未だ解せざる者は、下すべからざるなり、之を下すを逆と為す、外を解せんと欲すれば、桂枝湯に宜し。",
      yaku: "太陽病で、外証がまだ取れない者は下してはならない。これを下すのは逆治である。外証を治そうとするなら、桂枝湯がよい。",
      yumoto: "「逆と為す」とは逆治であるという意味で、正しい治療ではないことを示す。「外を解せんと欲すれば」とは、外証を治そうとするならばという意味である。" },
    { src: "傷寒論",
      kaki: "太陽病、先ず発汗して解せず、而して復た之を下し、脈浮なる者は愈えず、浮は外に在りと為す、而るに反って之を下す、故に愈えざらしむ、今脈浮なるが故に外に在るを知る、当に須く外を解すべし、則ち愈ゆ、桂枝湯に宜し。",
      yaku: "太陽病で、まず発汗させたが治らず、さらにこれを下したが、脈が浮の者は治らない。浮脈は病が外（表）にあることを示すのに、かえって下したので治らなかったのである。いま脈が浮であるから病が外にあることがわかる。当然、外証を治すべきであり、そうすれば治る。桂枝湯がよい。",
      yumoto: "「太陽病、先ず発汗して解せず」の一句は、この太陽病には桂枝湯を用いるべきであるのに、誤って麻黄剤で発汗させたために治らなかった、という意味を含んでいる。「而して復た之を下し」とは、瀉下してはならない太陽病を瀉下したことで、前と今とで誤治を二度重ねたものであるから、とくに「復」の字を加えたのである。\n「脈浮なる者は愈えず」云々とは、およそ浮脈を呈する者は病が外すなわち表にある徴候であるから、発表するのが正当であるのに、反対に瀉下したので治らない、という意味である。「今脈浮なるが故に」以下は、再三の誤治を経たが、いま浮脈を見ることから病がなお外すなわち表にあることがわかるので、当然発表剤を用いて外証を治すべきであり、そうすれば直ちに治る。その発表剤としては桂枝湯を用いるのがよい、という意味である。" },
    { src: "傷寒論",
      kaki: "病人、蔵に他病なく、時に発熱自汗出でて愈えざる者は、其の時に先だちて、汗を発すれば則ち愈ゆ、桂枝湯に宜し。",
      yaku: "病人の内臓に他の病がなく、ときどき発熱して自然に汗が出て、いつまでも治らない者は、その発作の起こる前に発汗させれば治る。桂枝湯がよい。",
      yumoto: "病者を診察して蔵すなわち内臓に病がないときは、その病は必ず表にある。この表にある病で、ときどき発熱し自汗が出て、長く治らない者は、その発熱・自汗が出る前に発汗させれば直ちに治るものであり、これには桂枝湯を用いるのがよい、という意味である。" },
    { src: "傷寒論",
      kaki: "傷寒、大便せざること六七日、頭痛熱あり、小便反って赤き者には、承気湯を与う、其の小便清き者は、裏に在らず、仍お表に在るを知るなり、当に須く汗を発すべし、若し頭痛する者は、必ず衄す、桂枝湯に宜し。",
      yaku: "傷寒で大便が六、七日出ず、頭痛と熱があり、小便がかえって赤い者には承気湯を与える。小便が澄んでいる者は、病は裏ではなく、なお表にあるとわかる。当然発汗させるべきである。もし頭痛（が激しい）する者は必ず鼻血を出す。桂枝湯がよい。",
      yumoto: "本条の前半は、桂枝湯証と大承気湯証との鑑別法を説いたものであるから、はなはだ重要である。すなわち大承気湯証にも桂枝湯証にも、ともに頭痛があり熱があって大いに似ているが、大承気湯証は裏証、すなわち消化管に急性炎症があり、その余波が頭脳に迫って頭痛を起こし、外表に走って熱を現したものであるから、その小便は必ず赤く濁る。これに反して桂枝湯証は表証、すなわち病がもっぱら体表にあって、頭痛・熱を主症とし、内臓に変化のないものであるから、決して尿の変化を呈することなく、平常のように清澄である、という意味である。\nまた後半の「若し頭痛する者」云々とは、頭痛と熱があり小便が清で、もし頭痛の激しい者は必ず衄血（鼻血）する。この証には桂枝湯を用いるのがよいという意味である。その理を推し究めると、既に述べたように、この頭痛は太陽病本来の病勢として頭項部に充血することが甚だしく、そのため血液が循環しにくいことによるものであるから、もしこの充血が極度に達すると、血圧もまたそれに伴って亢進し、最も抵抗力の弱い篩骨蜂窩部を突き破って外に走り、いわゆる衄血を来すのである。だから既に衄血があるときには血圧は低下し、血液は比較的循環できるようになるので、頭痛その他の症状に良い影響を及ぼす。このときに桂枝湯を与えれば、ちょうど風池・風府を刺絡した後のように、薬力を阻む原因が除かれているので、桂枝湯は遺憾なくその能力を発揮し、頭痛や衄血などはみなことごとく治るに至るのである。\n（頭注）このように衄血は病症に良い影響を与えるので、漢方医はこれを「紅汗」と称して歓迎するが、その激烈なものは止血すべきであることは言うまでもない。\n（頭注）『傷寒論』には「小便反赤」の四字がない。いま『千金翼方』『外台秘要』に従ってこの四字を加えた。" },
    { src: "傷寒論",
      kaki: "傷寒、医之を下し、続いて下利を得て清穀止まず、身疼痛する者は、急に当に裏を救うべし、身疼痛し、清便自ら調う者は、急に当に表を救うべし、裏を救うは四逆湯に宜しく、表を救うは桂枝湯に宜し。",
      yaku: "傷寒を医者が（誤って）下し、そのまま下痢が続いて未消化便が止まらず、体が痛む者は、急いで裏を救うべきである。体は痛むが便通が平常どおりの者は、急いで表を救うべきである。裏を救うには四逆湯がよく、表を救うには桂枝湯がよい。",
      yumoto: "「傷寒、医之を下し」とは医者が誤って下剤を与えたこと、「続いて下利を得」とは、下剤の薬力が尽きても下痢がなお止まらないことである。「清穀」とは不消化の下痢で糞臭のないもの、「裏を救うべし」とは止瀉すべきであるという意味である。「清便自ら調う」とは便通が平常どおりであることをいい、「表を救うべし」とは発表すべきであるという意味である。" },
    { src: "傷寒論",
      kaki: "傷寒、大いに下すの後、復た発汗し、心下痞、悪寒する者は、表未だ解せざるなり、痞を攻むべからず、当に先ず表を解すべし、表解すれば、乃ち痞を攻むべし、表を解するは桂枝湯に宜しく、痞を攻むるは大黄黄連瀉心湯に宜し。",
      yaku: "傷寒を大いに下した後、さらに発汗させ、みぞおちがつかえて悪寒がする者は、表証がまだ取れていない。つかえを攻めてはならない。まず表証を治すべきであり、表証が取れたら、そこでつかえを攻めよ。表を治すには桂枝湯がよく、つかえを攻めるには大黄黄連瀉心湯がよい。",
      yumoto: "傷寒で桂枝湯証があるときに、大いに瀉下するのも、また麻黄剤で発汗させるのも、ともに誤治である。この誤治の後に心下痞し、頭痛・発熱・身疼痛・悪寒する者は、心下痞があるといっても表証がまだ去っていないのであるから、痞を攻め下してはならない。まず発表し、表証が去ってから痞を攻め下すべきであり、発表するには桂枝湯を用いるのがよく、痞を攻め下すには大黄黄連瀉心湯がよい、という意味である。\n前条は四逆湯証と桂枝湯証が合併した場合を述べたもので、常法によれば表を先にし裏を後にすべきであるが、下痢清穀があって一刻も裏をおろそかにできないので、四逆湯を先にし桂枝湯を後にするのである。本条は桂枝湯証と大黄黄連瀉心湯証が合併したもので、心下痞は下痢清穀のような危急の症ではないから、常法にのっとって桂枝湯を先にし、大黄黄連瀉心湯を後にするのである。\n（頭注）心下痞とは、自覚的に胃部に停滞・膨満感があることをいう。" },
    { src: "傷寒論",
      kaki: "陽明病、脈遅、汗出づること多くして、微しく悪寒する者は、表未だ解せざるなり、汗を発すべし、桂枝湯に宜し。",
      yaku: "陽明病で、脈が遅く、汗がたくさん出て、わずかに悪寒がする者は、表証がまだ取れていない。発汗させるべきである。桂枝湯がよい。",
      yumoto: "本条は陽明病と太陽病が合併したものである。脈遅は陽明病の脈証、汗が多く出るのは両者に共通する症状であるが、わずかに悪寒するのは陽明証ではなく表証であるから、この一症によって表証の存在を知り、桂枝湯を用いるのである。しかしこの病症は元来陽明病であって、太陽病を兼ねているにすぎないのであるから、桂枝湯を用いるのは一時的な処置であり、表証がすっかり去ったならば、大承気湯で陽明証を治すべきである。" },
    { src: "傷寒論",
      kaki: "病人煩熱、汗出でて則ち解し、又瘧状の如く、日晡所（にっぽしょ）に発熱する者は、陽明に属するなり、脈実なる者は之を下すに宜しく、脈浮虚なる者は汗を発するに宜し、之を下すには大承気湯を与え、汗を発するは桂枝湯に宜し。",
      yaku: "病人が熱のために煩悶し、汗が出ていったん治まるが、またマラリアのように夕方に発熱する者は、陽明に属する。脈が実の者は下すのがよく、脈が浮虚の者は発汗させるのがよい。下すには大承気湯を与え、発汗させるには桂枝湯がよい。",
      yumoto: "病者が煩熱、すなわち熱のために煩悶するが、汗が出たためにいったん軽快し、後にまたマラリア発作のように日暮れ時に発熱する者は、表証からただちに陽明に転属したものであるから、脈の実な者は大承気湯を与えて下すべきであり、脈の浮虚な者は桂枝湯で発汗させるのがよい、という意味である。尾台榕堂は「病人煩熱云々の証は、脈が浮虚であっても、おそらくは桂枝二麻黄一湯を用いるのがよいであろう」と言っている。この説は正しいようである。処方の際に留意すべきである。\n（頭注）マラリア発作のときは、まず悪寒し、悪寒が止むとただちに発熱する。このような発熱の状態を漢方では「寒熱往来」という。" },
    { src: "傷寒論",
      kaki: "太陰病、脈浮なる者は、汗を発すべし、桂枝湯に宜し。",
      yaku: "太陰病で脈が浮の者は、発汗させるべきである。桂枝湯がよい。",
      yumoto: "師は「太陰の病たる、腹満して吐し、食下らず、自利益々甚しく、時に腹自ら痛む。若し之を下せば、必ず胸下結鞕す」と言っている。したがって太陰病とは嘔吐・下痢・腹痛する病症の名称であるから、本条の意は、下痢病で脈が浮の者は発汗させれば治るものであり、その発汗には桂枝湯を用いるのがよい、ということである。" },
    { src: "傷寒論",
      kaki: "下利、腹脹満、身体疼痛する者は、先ず其の裏を温め、乃ち其の表を攻む、裏を温むるは四逆湯、表を攻むるは桂枝湯。",
      yaku: "下痢して腹が張り、体が痛む者は、まずその裏を温め、そのあとで表を攻める。裏を温めるには四逆湯、表を攻めるには桂枝湯を用いる。",

  yumoto: [
    { head: "薬徴の説について・朮の医治効用（総括）", text: "この（薬徴の）説はまったく根拠のないものではないが、水を利することは本薬だけの特能ではなく、他の薬にもこの作用をもつものが多々あるので、利水をもって本薬の主治とするのは妥当でないだけでなく、このような抽象的な解釈では、臨床上どのようにこれを処すべきか、漠然として雲をつかむようだと評さざるを得ない。\n朮が利尿薬であることは弁を待たないが、臨床上においては、腎機能障害の徴である尿利の頻数あるいは減少と、胃内停水とを主目的とし、師の論および下記の諸説を副目的として応用すべきものである。ゆえにその作用はすこぶる茯苓に類似するが、本薬はそれと異なり、温性で特殊な揮発油を含むので、胃腸粘膜を刺激し充血させるものであるから、これらの臓器に急性炎症がある場合、すなわち漢方のいわゆる裏熱があるときには、たとえ適応症が備わっていても禁忌とすべきであって、まず急性炎症を治してから後にこれを施すべきである。" },
    { head: "問答：尿利の減少と頻数がともに腎機能障害の徴となるのはなぜか", text: "ある人が問う。尿利の減少を腎機能障害の徴とするのは首肯できるが、尿利の頻数もまたこの障害の徴候とするのはなぜか。答えて言う。およそ尿意が頻数であるものは、排尿の度数が頻多であるにもかかわらず、尿量はかえって少ないものである。すなわち腎臓はその機能を営もうとしても、これを完全に遂行する能力がないので生じる症状であるから、尿利減少よりは比較的に腎臓が健全であることを示すものであって、あたかも腸管における裏急後重のようである。大腸カタルや赤痢などにおける裏急後重は、腸内の毒物を駆逐しようとする自然良能作用でありながら、これを完全に遂行できないために発する症状であるから、この症状がなくて（腸筋が麻痺して）下痢するのに比べれば、腸管がまだ甚だしく衰えていない徴である。ゆえに対証の下剤、または対証剤に大黄を加用して良能作用の不足を補助し、腸内の毒物を一掃すれば、裏急後重のようなものは治さなくても自然に雲散する。腎臓においても同様で、尿意頻数の際に茯苓・朮・沢瀉などを含む対証の利尿剤、または対証剤にこれらの薬物を加用すれば、まだ甚だしく衰弱していない腎臓は、この有力な援助によってにわかにその勢力を挽回し、水毒をことごとく駆逐するので、尿意頻数のようなものも治さずして霧消するのである。" },
    { head: "問答：胃内停水はどのようにして生じるのか", text: "また問う。胃内停水はどのようにして生じるのか。答えて言う。およそ胃内停水は、胃筋の衰弱によって胃壁が弛緩・拡張するときに、もし心臓あるいは腎臓に障害があれば、尿の排泄量減少の結果として水毒の蓄積を来すことによるものである。他の体部ではこの水毒が著しく過剰でなければ、よくこれを組織内に収容するので目に見える異状を呈するには至らないが、弛緩・拡張した胃腔内の水毒は、打・聴・触診によって最も明確に認知できる。これが、胃内停水が尿利障害とともに茯苓・朮・沢瀉などの応用の主目的となりうるゆえんであって、この主目的があるときに本薬を用いれば、この停滞した水毒を腎臓を通じて体外に排除するとともに、本薬に含まれる揮発油はよく健胃作用を発揮するので、他薬の協力を得れば、西洋医学で難治とされる胃拡張症であってもこれを治すことは難しくないのである。\n私の見解が誤っていないことを証するため、次に許叔微の体験談（本事方）を掲げる。\n（註）この文を意訳すれば、許叔微自身が胃内停水症を患うこと三十年、胃内に水の鳴る音があり、左季肋部が痛み、食欲が減退し、呑酸・げっぷがあるので飲酒すると軽快するが、十数日後には必ず酸敗した胃内容物を吐き出し、夏季には右半身に汗が出るが左半身には出ないのが常であった。そこで自ら胃が拡張してその中に停水があるものと想像し、その理を推し量ると、およそ胃が拡張して停水するのは、ちょうど水がくぼみにあるときに、そのくぼみに水が充満しなければ流れ出ないようなものであって、停水の中の清澄なものは流れ去るが、汚濁したものは停滞して去る道がないので、次第に増量して五、六日も蓄積すると必ず嘔吐によってこれを排出するのである。元来、胃は水の停留を嫌うものであるから、この停留した水を去って胃を乾燥させなければ治る時期はないと考え、従来用いていた諸薬をことごとく中止し、ただ蒼朮・麻油・大棗の丸を服用したところ、三か月後にはほとんど全治し、これ以後この方を常服したところ、嘔吐・疼痛することなく、飲食は健康時のようになった、というのである。\n許氏の病理の説き方ははなはだ幼稚であるが、朮が胃内停水を去り健胃の殊効があることを物語るものではないか。そしてこの薬物の利尿作用については何ら言及するところはないが、発汗せず嘔吐せず下痢しないのにこれを治したことからみれば、胃内停水が利尿によって排除されたことは疑う余地がない。" },
    { head: "問答：身煩疼（体の痛み）に用いるのはなぜか", text: "また問う。本薬を身煩疼に用いるのはなぜか。答えて言う。尿利障害によって水毒が関節内に長く停蓄すれば身煩疼を来すのであって、その理は次の浅田氏の説のとおりである。\n（浅田氏の説）骨節疼痛は、その痛みが最も奥に及ぶものである。『説文』に「骨節は骨肉の竅（あな）である」という。思うに三百六十の骨節は神気の遊行出入するところであって、すなわち邪気の遊行出入するところである。そこでただ風寒がここに迫るだけでなく、痰飲や黴毒のようなものも長く内に鬱すれば、やはりよく骨節疼痛をなす。論に「湿が関節に流れる」というのがこれである。\nこのようであるから、尿利障害と胃内停水を主目的とし、身煩疼を副目的として本薬を用いれば、胃内停水が駆逐されるのに従って関節内の水毒も消失するので、身煩疼は自然に治るのである。" },
    { head: "問答：水瀉性の下痢に用いるのはなぜか", text: "また問う。茯苓・朮・沢瀉を水瀉性の下痢に用いるのはなぜか。答えて言う。尿利障害によって水毒が消化管内に停滞すること一定度以上に達すると、腸管は水瀉性の下痢を発して腎機能を代償する。このときに茯苓・朮・沢瀉を用いれば、この三薬はよく腎機能を回復させ、消化管内の水毒を腎臓から排出するので、腸管は代償作用を営む必要がなくなり、したがって下痢しないに至るのである。これは漢方医が利尿剤で下痢を治す慣用の手段であって、腸管と腎臓とが相互に表裏をなすことを知っているからである。\nこの他の病症に本薬を用いるゆえんも、上の理から推し究めることができるので省略し、以下に諸説を挙げて参考に供する。" },
    { head: "蒼朮の殺菌・殺虫性について", text: "私は言う。（本草綱目・本草備要で）蒼朮について「沴（い）えた災いを弭（や）む」といい「悪気を辟（さ）く」と言っているのによってみれば、朮には殺菌性があるようである。その当否はまだ明らかではないが、本薬には特種の揮発油を含むので、あるいはそうであろうか。この問題はしばらくおくとして、夏時にこれで室内を燻せば蚊の群れがことごとく死んで墜落する。これによってみれば、この薬に殺虫性があることは確実である。" }

    { head: "黄耆および建中剤は肺結核に応用すべからず", text: "私は往年、桂枝加黄耆湯以下の師の論およびこれらの諸方に関する諸家の学説を誤認し、黄耆および建中剤を肺結核に用いて失敗を招いたことがある。当時は学問がまだ浅く、その理由がわからなかったが、後に『蘭台軌範』などの書を読むに及んで初めてこれを理解するに至った。後世、あるいは私の轍を踏む者がいるのではないかと恐れ、これらの諸説を次に特筆大書して鑑戒とする。\n（蘭台軌範）古人のいう虚労はみな純虚・無陽の症であって、近日の陰虚火旺で吐血・咳嗽する者とはまさに相反する。誤って治療すれば必ずひどくなる。近日の吐血・咳嗽の病は血証であって、虚労に似ているが、その実は虚労ではない。\n（註）純虚とは真の虚証の意味であり、無陽とは陽証がなく陰証があるという意味ではない。陰虚もまた陰証で虚証であるという意味ではなく、ともに陽証で虚証であるという意味である。火旺とは炎症が劇烈であることをいう。全文の意は、古の虚労は陰虚証であって、現今の炎症が熾盛で吐血・咳嗽するものとは正反対であるから、古の虚労の治方を現今の吐血・咳嗽の病に与えるときは必ず死ぬ、ということである。\n（同書・小建中湯の条）この方は陰寒陽衰の虚労を治すものであって、まさに陰虚火旺の病とは相反する。凡庸な医者が誤って治療して人を害することがはなはだ多い。この（条文の）咽乾口燥は津液が少ないことによるものであって、火（炎症）があるのではない。\n（方輿輗）小建中湯は古の聖人が虚労を治した大方である。しかるに今これを試用すると、病者がかえってのぼせ、熱悶し、胃が膨満する（中満）などを覚える者がある。私（有持）はかつてここに疑いを抱いていたが、近日広く名家の書論を見る間に、初めて得るところがあったようだ。思うに、古のいわゆる虚労は虚寒の症であって、後世のいわゆる虚労は火動の症である。名は同じといえども実は相反する。ああ、従前は病を弁じることが明らかでなく、かつ薬に寒熱温涼はないなどという僻説に惑い、ただ病名によってその方を供していたので、効を得られなかったのである。そもそも寒熱温涼は薬の性である。どうしてこれがないと言えようか。試みに一つの経験を言おう。継洪は「麻黄の生じる地は多く雪が積もらない」と言った。これはその温熱の性がそうさせるのである。建中湯のようなものは大温ではないといっても桂枝がある。これを火旺の症に投じれば、湯をそそぐようなものである。要するに治療は病を弁じるのが第一の務めであり、方はこれに随う。そうでなくてこれを行えば、たまたま中ることはあっても、その失敗は多いであろう。\n（張氏医通）（中略）10余歳の女子。発熱・咳嗽・喘急によって小便が少なく、後に腫れ物ができた。水を利する薬を用いて治ったが、虚羸が甚だしいため、ついに黄耆建中湯を用い、日に一服して30余日でついに治った。思うに人の体質（稟）は同じではない。虚労で小便が白濁する陰臓の人は、橘皮煎・黄耆建中湯を服して治る者が多い。陽臓の人に至っては、暖薬を用いてはならない。建中湯ははなはだ熱ではないといっても肉桂があり、これを服することがやや多ければ、かえって害をなす。要するに薬を用いるには、またその体質を量り、その冷熱を詳しく審らかにすべきであって、一概に建中湯をもって虚労を治すべきではないのである。\n私は言う。有持・張の二氏はともに、建中湯が肺結核に不適当である理由を挙げて桂枝の罪に帰しているが、これははなはだいわれのない論である。なぜなら、小建中湯の君薬は膠飴であってその量が最も多く、臣薬である芍薬の量がこれに次ぎ、二氏がその罪を指摘した桂枝は、生姜・大棗・甘草とともに佐使薬にとどまり、その量も少ない。ゆえに本方の能力を討究するには、これを主として君臣薬である膠飴・芍薬に求めるべきであって、佐使薬である桂枝に求めるべきではないのに、二氏の説はこれに正反する。その議論が不当であることは論理上きわめて明白だからである。\nでは、小建中湯が肺結核に不適当なのはなぜか。答えて言う。この方の君薬である膠飴はその性が大温であるから、炎症を助長する弊があり、しかも臣薬である芍薬は収斂性であって、皮膚・肺・腸・腎の排泄機能を抑える作用があるので、もし誤ってこの二薬を主とした本方をこの病者に与えるときは、一面においては炎症を助長し、他面においては結核菌の毒素の排泄を阻止するので、これを増悪させるのであろう。\n（雑病弁要）考えるに、古のいわゆる虚労はみな裏虚不足の症であって、今の労嗽（結核性の咳）・吐血のものとは相反する。誤って治療すれば必ずひどくなる。労嗽・吐血は肺痿であって、虚労に似てはいるが、その実はそうではない。\n（頭注）陰寒陽衰の陽衰は陰       yumoto: "（方氏の註）心下逆満とは、伏飲が上にあふれて膈（横隔膜部）に搏ち実するのである。気が上って胸を衝くとは、寒邪が上に湧き、飲を挟んで逆をなすのである。経を動かすとは、経脈を傷り動かし、ふるえて奮い動くのである。思うに人の経脈は津液に頼って滋養される。飲はその津液の類である。静かであれば養いとなり、動けば病となる。これを制し勝つのがよい。\n（尤氏の註）これは傷寒の邪が解けて飲が発する証である。飲が中（胃中）に停まれば満ち、上に逆すれば気が衝いて頭眩し、経に入れば身体がふるえ揺れる。金匱に「膈間の支飲、その人喘満し、心下痞堅し、その脈沈緊」といい、また「心下に痰飲あり、胸脇支満し、目眩す」といい、また「その人振振として身瞤（ぴくぴく）すること劇しければ必ず伏飲あり」というのがこれである。「汗を発すれば則ち経を動かす」とは、発散すべき邪がないのに、かえってその経気を動かすのである。それゆえ茯苓・白朮を与えて飲気を除き、桂枝・甘草で陽気を生ずるのである。いわゆる「痰飲を病む者は温薬でこれを和すべし」とはこれである。\n（丹羽元堅の註）この条は脈沈緊までにとどまり、そこまでがこの湯の主とするところである。これは吐かせたり下したりしたので胃が虚し、飲が動いてこうなったのである。もしさらに発汗させれば表陽を傷り、変じて経を動かし、身体がふるえ揺れる。これは「身瞤動し振振として地に擗（たお）れんと欲す」というのと同じで、真武湯の主治するところである（中略）。またその方はもっぱら水を利して胃を健やかにすることに取り、苓桂甘棗湯とわずかに異なる。\n（頭注）本方証と真武湯証とは大いに類似するが、同一ではない。甘棗湯とは苓桂甘棗湯のことである。\n私は言う。「吐後若しくは下後」というのは、腹内に充実した毒がないことを示すものであって、心下逆満とは、下方から心下部に向かって満ちてくることをいう。そしてこれが起こる理由は、桂枝去芍薬湯証の胸満が起こるのと異なることはなく、吐あるいは瀉下によって内毒が出尽くすと同時に、その反動として気が上衝した結果にほかならない。けれども、桂枝去芍薬湯の胸満がただ気の上衝の反応にとどまるのとは異なり、この心下逆満は気と水毒とが相伴って上衝した徴候であるから、前者の胸満の内部が空虚であるのとは異なり、心下逆満すなわち胃部膨満の内部に停水があるものとする。また「気上りて胸を衝く」も「起きれば則ち頭眩す」も、ともに心下逆満を起こす理と異ならないが、水毒が侵襲する部位が同じでないことによって、現れる症状に差異が生ずるのである。また脈が沈緊であるのは裏に水毒がある徴候であるから、師はこの脈候を挙げて、本方証が水毒に由来することを示したのである。\nこのように本条の病症は水毒の上衝によるものであるから、これを治すには必ず本方を用いなければならないのに、もし誤って発汗剤を用いれば、これはすなわち逆治であるから、経すなわち血管系を衝動し、筋肉を失調させ、身体がふるえ揺れる、すなわち身体を振戦・動揺させるに至る。しかしこの症状だけであって他の症がなければ、たとえ誤治後の逆証であるとはいっても、なお本方の主治であるという意味である。" },

    { src: "傷寒論",

      yumoto: "（錫氏の註）痿とは、肢体が萎え廃れて自分の用をなさないことである。「久しくして痿となる」とは、経血が四肢に外行しないのである。\n（方氏の註）これは苓桂朮甘湯の条を敷衍し、しかも治療しない失があれば痿を起こすという意味を言ったものである。かの条の脈沈緊は、まだ発汗していないことから言い、この条の脈甚だ微は、すでに発汗したことから言ったのである。「経脈動」はすなわち「経を動かす」の言い換えであって、「惕」はすなわち「振振として揺く」である。だいたい両条が互いに明らかにし合う言葉である。「久しければ」とは、すでに八、九日を経たことをいう。もしなお解けず、しかもさらに治療しない失があれば、津液は内に亡び、湿淫は外から浸して、必ず両足が萎えて軟らかくなり、しかも互いに及ばない（用をなさない）のである。\n（尤氏の註）心下痞鞕し、脇下痛み、気上って咽喉を衝き、眩冒する者は、邪気が飲を搏ち、内に集まって上逆するのである。内に集まる者は四方に布くことができず、上逆する者は下に及ぶことがない。そもそも経脈は血液に頼って働くものである。汗・吐・下の後、血液はどれほど残っているだろうか。しかもまた搏結して飲となり、諸経に布散することができない。いま経脈はすでに先に潤いを失い、また後に長く養われることができないので、必ず筋膜が乾いて引きつり攣縮しようとし、枢（関節）が折れ、脛がゆるんで地に立てなくなる。内経にいう脈痿・筋痿のようなものである。それゆえ「久しければ痿と成る」というのである。\n（頭注）枢は開き戸の開閉の軸となるところの意で、また要・大切の義であるから、この場合には関節をいうのである。\n私は言う。この二説は基礎医学に反するところがないわけではないが、よく本条を解釈しているので、これを掲げて説明に代えた。" },
    { src: "金匱要略（関連条文）",
      kaki: "水心に在れば、心下堅築し、短気、水を悪み、飲むことを欲せず。／水腎に在れば、心下悸す。／夫れ心下に留飲在れば、其の人背寒冷なること、手大の如し。／四肢歴節痛、脈沈なる者は、留飲有り。／胸中痰を病み、満喘咳吐し、発すれば則ち寒熱、背痛腰疼し、目泣自ら出で、其の人振振として身瞤動すること劇しき者は、必ず伏飲有り。",

      yumoto: "（金匱要略述義）堅とは心下が堅く実すること、築とは築築然と動悸することである。\n（頭注）心下堅実は本方の治すところではないから、この心臓病には本方に心下堅実を治す大柴胡湯を合用すべきであろう。本方は心臓病を治すだけでなく、またよく腎臓病をも治すことを見るべきである。本条（背寒冷）は胃内停水ある者の一般論であって、本方証だけをいうのではない。留飲は痰飲と同じ。歴節痛は関節リウマチ・神経痛である。泣は声を立てずに涙を出す意であるから、涙と同じ意味である。\n（背寒冷の註）胃内停水がある人は、その胃に一致する背部の手のひら大の部分に冷えを覚えるという意味である。\n（歴節痛の註）関節リウマチ・神経痛などで沈脈を呈するものは胃内停水がある徴候であるから、この沈脈と胃内停水症とを主目的とし、疼痛を副目的として適方を選用すれば治癒するという意味を暗示するのである。\n（伏飲の註）伏飲とは、飲すなわち水毒が潜伏しているものであるから、胃内停水を診し得ないものであるけれども、前の症があるときは水毒が潜伏しているものと推断し、胃内停水を治す剤を用いれば、これらの症状は自然に治るという意味である。\n右の数条の病症に本方を用いよという明文はないけれども、多くは本方の主治であるから、ここに列載した。古人も「怪病は痰として治せよ」と説いたように、実に水毒は千変万化し、奇疾・怪症を現すことは限りなく、ほとんど推し量ることができないから、よく師論および後記の諸説の真意を探って、本方の運用を全うすべきである。\n（頭注）痰とは水毒の意である。" }

  fukusho: { title: "苓桂朮甘湯の腹証（湯本求真）", text: "右の師論および本方の原方である桂枝甘草湯の条を総合して観察すれば、本方の腹・脈・外証はおのずから明らかであるから、ここに蛇足を加える必要はないようであるが、右の諸説に漏れていて、しかも臨床上緊要な二、三の事項を追加しなければならない。\nおよそ瘀血が上衝するに当たっては、必ず左腹部、ことに同側の直腹筋に沿って起こり、右側によって現れることはないのに対し、気および水毒が上衝する際には、必ず右腹部、なかでも同側の直腹筋に従って起こり、左側によって現れないのを常とする。この差別が生ずる理由に至ってはまだ不明であるが、古人もつとにこれを唱道したところであって、私の実験に徴しても、また偽りのない事実である。ゆえに本方証においてもこの原則にもとることなく、気が上って胸を衝くのも、心下逆満するのも、必ず右側の直腹筋に沿って発現し、胸脇支満もまた右肋骨弓下にあり、頭痛する時でも右側が痛んで左側は痛まないか、あるいは左側に比べて右側の痛みが甚だしい。\nまた金匱に「奔豚病は、少腹（下腹）から起こって咽喉に上衝し、発作が起これば死にそうになり、また元に戻って止む」といい、また同書苓桂五味甘草湯の条に「（上略）手足厥逆し、気が少腹から胸・咽に上衝し、手足がしびれ、その顔がかっと酔ったように赤くなり、それによってまた陰股に下流し、小便が出にくく、時にまた頭が覆われたようになる者」と言っているように、茯苓・桂枝を君臣薬とする方剤の証はいずれもみな発作的に消長するものであるから、本方証もまた発作すれば増悪し、休止すれば軽快するものであって、この発作は心身の過労その他の近因によって誘発される。これが、往昔の癇・驚悸などの病症、すなわち現今の神経衰弱・ヒステリーなどの神経症に本方が多く適応する理由である。\nこのように本方証には不定の症状が多いが、常に一定不変であるのは尿利の減少あるいは頻数と胃内停水であるから、本方はまずこの二症の存在を認め、次いで心悸亢進を肯定し、なおさらにその他の症状を参照した後に、はじめて用いるべきものとする。" },

  joubun: [
    { src: "傷寒論",
      kaki: "太陽病、発汗後、大いに汗出で、胃中乾き、煩躁して眠ることを得ず、水を飲まんと欲する者は、少々与えて之を飲ませ、胃気を和せしむれば則ち愈ゆ。若し脈浮、小便不利、微熱消渇する者は、五苓散之を主る。",
      yaku: "太陽病で発汗させた後、大量に汗が出て胃の中が乾き、もだえて眠れず、水を飲みたがる者は、少しずつ水を与えて飲ませ、胃の気を和らげれば治る。もし脈が浮で、小便の出が悪く、微熱があって、いくら飲んでも渇きが止まない者は、五苓散が主治する。",
      yumoto: "初句から「則ち愈ゆ」までは、太陽病が発汗によって治ったものの、ただ発汗が強かったために体液を失い、胃もそれに従って乾燥したので、煩躁して眠れず水を欲しがるにすぎないから、薬剤を処方する必要はなく、ただ水を少量ずつ与えれば体液が回復し胃もまた潤うので、煩躁不眠は自然に治る、という意味である。そして「若し脈浮」以下は、もし上記の状態で、脈が浮数、尿量減少、微熱、消渇（渇して飲んでも尿が少ないもの）の症がある者は、前とは異なり、なお病症であるから、解熱・止渇・利尿作用のある本方の主治である、という意味である。\n（和久田氏）「大いに汗出で」の三字は斜挿法である。発汗後にさらに汗が出るのではない。「胃中乾く」をいうためにこの三字を挟んだのである。\n私は言う。この言は理がある。\n（頭注）原文に「大汗出」とあるのを指すのである。" },
    { src: "傷寒論",

      yaku: "発汗させ終わって、脈が浮数で、もだえるほどひどく渇く者は、五苓散が主治する。",

    { src: "傷寒論",
      kaki: "傷寒、汗出でて渇する者は、五苓散之を主る。渇せざる者は、茯苓甘草湯之を主る。",
      yaku: "傷寒で汗が出て渇く者は、五苓散が主治する。渇かない者は、茯苓甘草湯が主治する。",

    { src: "傷寒論",
      kaki: "中風、発熱六七日、解せずして煩し、表裏の証有り、渇して水を飲まんと欲し、水入れば則ち吐する者は、名づけて水逆と曰う、五苓散之を主る。",
      yaku: "中風（かぜ）で発熱して6〜7日、治らずに苦しみ、表と裏の両方の証があり、渇いて水を飲みたがるが、水が入るとすぐ吐く者を「水逆」という。五苓散が主治する。",
      yumoto: "「表裏の証有り」とは、脈浮・発熱・汗出で悪寒・頭項強痛（桂枝の証）の表証があり、また胃内停水の裏証があるという意味であって、この胃内停水が生じるのは、小便不利、すなわち腎臓機能障害の結果、排泄が阻止されて水毒が胃腸内に充満するためである。そしてこの水毒は熱毒を伴うので、渇して水を飲みたがるが、これを嚥下すると、すでに水毒で満たされた胃腔にはこれを受け入れる余地がなく、やむを得ずこれを吐き出すのである。これが師が「水逆」と称する機転であって、この時に本方を用いれば、方中の桂枝は水毒を汗腺から排除するとともに解熱作用を発揮し、かつ水毒の上衝を抑制して他薬の活躍を助け、沢瀉は率先して煩渇を治すとともに、猪苓・茯苓・朮の援助によって水毒とそれに伴う熱毒を泌尿器から駆逐するので、胃腸内の停水は消失し、自然に吐が鎮まるに至るのである。古方の至妙なることは嘆ずるに余りある。\n（頭注）徐霊胎氏が「五苓散の妙は桂枝にある」と言うのは、おそらく以上のような場合を指すのであろう。（小活字のため判読やや不確実）" },
    { src: "傷寒論",
      kaki: "病陽に在り、応に汗を以て之を解すべきに、反って冷水を以て之に潠（ふ）き、若しくは之に灌げば、其の熱劫かされて去ることを得ず、弥（いよい）よ更に益々煩し、肉上粟起し、意（こころ）に水を飲まんと欲して、反って渇せざる者には、文蛤散を服せしむ。若し差えざる者には五苓散を与う。",
      yaku: "病が陽（表）にあって汗で治すべきなのに、かえって冷水を吹きかけたり浴びせたりすると、その熱はおびやかされて去ることができず、ますます苦しくなり、皮膚に粟粒のような鳥肌が立ち、心では水を飲みたいと思うのに、かえって渇かない者には、文蛤散を服用させる。もし治らない者には五苓散を与える。",
      yumoto: "（尾台氏）「病陽に在り、応に汗を以て之を解すべし」云々とは、これは潠灌して劫激し、以下の変症を生じたのである。なお傷寒で脈浮・自汗出・小便数・心煩・微悪寒・脚攣急する者に、誤って桂枝湯を用いて種々の転変を致すようなものである。今の世の卑しい無知の徒は、その身にすでに邪熱があるのに、あるいは雷雨を冒して道を行き、あるいは水に入って泳いで涼をとるなどして、気にもかけない。このようにして同じ症に至る者が、夏秋の間にときにある。病情はまさに同じである。文蛤湯で連進して発汗させるべきである。本論に文蛤散とするのは誤りにすぎない。潠と噀とは同じである。『説文』に「水を含んで噴くなり」という。灌は漑（そそぐ）である。玉函には「弥更に」を「須臾に」に作る。これが正しい。\n（和久田氏）古人に潠水・灌水の法があった。潠は顔に水を吹きかけること、灌は体に水をかけることである。この二法は陽鬱証に用い、外から水気で激すると、かえって鬱陽が勃起して発散して解するのである。これは陽鬱のないものに潠水・灌水の法を行えば、その表熱は劫かされて外に出て去ることができず、いよいよ更にますます内に逼って心煩し、肉上はかえって正気が虚して粟起するのである。粟起とは俗にいう鳥肌である。これは水に劫かされたためである。この意は、水に劫かされて内攻したものであるので、なんとなく心では水を飲むことを欲するが、かえって渇して水を引くほどには至らない。水を欲しく思う類を文蛤散の証とするのである。もし文蛤散で治らず、いよいよ水を欲して渇の状態が定まるものは、煩渇して熱があり水気があるものとするので、五苓散を与えてその応否を見るのである。この証は正証ではないので「与う」と言うのである。\n私は言う。この二説はいずれも一理があるので、論理の上ではその是非を定めがたい。学者はよろしく病者についてその正否を験すべきである。" },
    { src: "傷寒論",
      kaki: "本以て之を下す、故に心下痞す、瀉心湯を与えて痞解せず、其の人渇して口燥煩し、小便不利する者は、五苓散之を主る。",
      yaku: "もともと（誤って）下したために、みぞおちがつかえる（心下痞）。瀉心湯を与えてもつかえが取れず、その人が渇いて口が乾いて苦しみ、小便の出が悪い者は、五苓散が主治する。",
      yumoto: "太陽病を誤って下せば表熱が内陥して心下痞（胃部膨満）を致す。これはすなわち大黄黄連瀉心湯の主治するところであるが、本条の心下痞は、ただ表熱の内陥によるのみならず、小便不利の因によって胃内停水してそうさせるものであるから、瀉心湯を与えてもその痞は解さないのである。ゆえにこの痞があって口燥煩・小便不利する者は本方の主治である、という意味であって、すなわち本方証と大黄黄連瀉心湯証との鑑別法を示したものである。尾台氏が「渇して口燥煩は、当に渇して煩躁に作るべし」と言っているのは参考に供すべきである。" },
    { src: "傷寒論",
      kaki: "霍乱、頭痛発熱、身疼痛し、熱多く水を飲まんと欲する者は、五苓散之を主る。寒多く水を用いざる者は、理中丸之を主る。",
      yaku: "霍乱（激しい吐き下し）で、頭痛・発熱・体の痛みがあり、熱が多くて水を飲みたがる者は、五苓散が主治する。寒（冷え）が多くて水を欲しがらない者は、理中丸が主治する。",
      yumoto: "霍乱とは、吐瀉して揮霍撩乱（激しく乱れる）する病の総称であって、急性胃腸カタル、欧州「コレラ」、アジア「コレラ」に該当するが、上古にはもとよりアジア「コレラ」はなく、わが国には徳川幕府の末葉に次第に伝来したものであるから、古代の治方がこれに適すべくもないのに、尾台榕堂・今村了庵の二氏は、葛根加朮湯をもってよくこれをその初期に頓挫させ、また本方あるいは茯苓沢瀉湯を、その下痢・発熱・口舌乾燥・煩渇して冷水を貪り、あるいは水逆の症がある者に用いて、よく効を収めた。これによってこれを見れば、師の法方は八面玲瓏、円融無碍であるというべきである。\n（頭注）揮霍は早い状態の意で、撩乱は入り乱れるの意である。" },

      yumoto: "本方は桂枝湯と同じく太陽病の治剤であるが、既に述べたように、桂枝湯証は皮膚が弛緩して汗が自然に出るもの、すなわち体表に水毒が鬱滞しないものであるから、身体疼痛することがないわけではないが、身疼・腰痛・骨節疼痛の激しさには至らず、またこの毒が呼吸器に迫らないので喘することもない。しかし本方証は皮膚が緻密で緊張しているために汗が出ないものであるから、排泄を阻止された水毒は筋肉あるいは関節に迫って身疼・腰痛・骨節疼痛させ、呼吸器を侵して喘させるのである。このようにわずかに汗が出るか出ないかの差によって千里の隔たりを生じるので、常にこれを銘記して誤ってはならない。" },
    { src: "傷寒論",
      kaki: "太陽と陽明との合病、喘して胸満する者は、下すべからず、麻黄湯に宜し。",
      yaku: "太陽病と陽明病とが併さった病で、喘いで胸が張る者は、下してはならない。麻黄湯がよい。",
      yumoto: "太陽と陽明との合病とは、太陽病が治らずに陽明に転属する機会と、陽明証があるときに太陽証を兼発する場合とを指示するものであって、前者は表から裏に及んだもの、後者は裏から表に達したものであるが、太陽・陽明の二証が共存する点では相等しい。そして前者は普通に見られるものであるから、しばらくこれを措き、今は後者について説明しよう。およそ陽明証は瀉下によって治すべきものであるが、ときとして病毒の一部が皮膚から逃れ出ようとして表証を現すとともに、呼吸器に迫って喘症を発することがある。このときにはもとより陽明証があって太陽証も一時的ながら存在するものであるから、いわゆる太陽と陽明との合病であって、喘して胸満するとは、喘するために胸腔の内圧が高まり、横隔膜を圧し下げ、心下（みぞおち）・肋骨弓下部が膨満することをいうのであるから、すなわち喘は主症であって胸満は客症である。ゆえに主症である喘を目的として本方を用いれば、喘も胸満もみなともに治る、という意味である。\nでは、なぜこの胸満という無意味な客証を特記し、しかもこれを下してはならないと言うのか。答えて言う。これはそもそも師の深意の存するところであって、この喘して胸満するのと大承気湯証の腹満して喘するのとは頗る類似するので、その鑑別法を教えようとしたためである。詳しく言えば、大承気湯証の腹満して喘するのは、病毒が腹内に充実することによって腹満し、腹満するために横隔膜を圧し上げて喘させるものであるから、腹満は主症で喘は客症である。ゆえに腹満を目的として大承気湯で充実した病毒を瀉下するときは、腹満も喘もみなともに治るのであるが、喘して胸満を治すことはできないので、麻黄湯証の喘して胸満するのを、この腹満して喘するのと誤って、大承気湯で下してはならないという意味を暗示したのである。このように証の表裏・主客は、汗下を決する重大な関鍵であるから、深く留意しなければならない。" },
    { src: "傷寒論",
      kaki: "太陽病、十日以去、脈浮細にして臥すことを嗜む者は、外已に解するなり。設し胸満脇痛する者は、小柴胡湯を与う。脈但浮なる者は、麻黄湯を与う。",
      yaku: "太陽病にかかって10日以上経ち、脈が浮細で横になりたがる者は、表証はすでに取れている。もし胸が張り脇が痛む者には小柴胡湯を与える。脈がただ浮の者には麻黄湯を与える。",
      yumoto: "太陽病にかかって10日以上経過してもなお治らないときに、浮細の脈があって横になるのを好む者は、外すなわち表証が取れたものであって、この状態があってもし胸満・脇痛する者には小柴胡湯を与えるべく、脈がただ浮を現して他の症がない者は、表証がまだすっかり去っていないものであるから本方を与えるべきだという意味である。\n本条に「与う」と称して「宜し」と言わないのはなぜかといえば、「宜し」と称するのは一時の病変に応じる活用手段であって、機宜をはかって用いることをいい、「与う」というのは目前の証を見て一時的に処方することをいって、証の変化によっては転方が止むを得ないかも計られないという意を寓するのである。そして証が完備して毫厘の疑いもないものは「之を主る」と称する。これが三者の別である。" },
    { src: "傷寒論",
      kaki: "太陽病、脈浮緊、汗無く発熱、身疼痛し、八九日解せず、表証仍お在り、此れ当に其の汗を発すべし。薬を服し已りて須臾にして、其の人発煩目瞑し、劇しき者は必ず衄す。衄すれば乃ち解す。然る所以の者は、陽気重きが故なり。麻黄湯之を主る。",
      yaku: "太陽病で、脈が浮緊、汗が出ずに発熱し、体が痛み、8〜9日経っても治らず、表証がなおある。これは当然発汗させるべきである。薬を飲み終えてしばらくすると、その人はもだえ苦しみ目がくらみ、ひどい者は必ず鼻血を出す。鼻血が出れば治る。そうなるわけは陽気が重いからである。麻黄湯が主治する。",
      yumoto: "「表証仍お在り」の文字は蛇足であるから、師の正文ではないようなので、これを削除するのもよいであろう。また原文には「薬を服し已りて」の下に「微除」の二字があるが、尾台氏の説に従って「須臾」の誤りと認めてこれを改めた。そして「目瞑」は目眩と同じであって、衄血した後に病が治る理は桂枝湯の条に述べたところと異なることはない。また「陽気重きが故なり」については諸説があるが、いずれも捕風捉影（つかみどころのない）の論であるからこれを掲げない。私もまたその意味を知らないが、本方の運用上に大きな関係がないので、しばらくこれを不問に付すのもよいであろう。ただここに一言を要するのは、「麻黄湯之を主る」の一句が本条の末尾にあるので、衄血して病が治った後にもなお本方を用いるように解する者がないわけではないが、これは師の文法を知らない罪であって、「麻黄湯之を主る」の句は「此れ当に其の汗を発すべし」の句に接続するものと仮定して解すべきものである。" },
    { src: "傷寒論",
      kaki: "脈浮なる者は、病表に在り、汗を発すべし、麻黄湯に宜し。",

    { src: "傷寒論",

      yaku: "陽明病で、脈が浮、汗が出ずに喘ぐ者は、発汗させれば治る。麻黄湯がよい。",

    { src: "金匱要略",
      kaki: "卒死・客忤死を救うには、還魂湯之を主る。",
      yaku: "急死（卒死）や、急に邪気にあたって死んだようになった者（客忤死）を救うには、還魂湯（麻黄湯）が主治する。",
      yumoto: "『千金方』の本方の主治に「卒忤・鬼撃・飛尸、諸々の奄忽（突然）として気が絶え、また目覚めることなく、あるいはすでに脈がなく、口噤して開かないならば、歯を去って湯を下す。口に入って下らない者は、病人の髪を分け、左右の足で肩を踏み、これを引くと薬が下る。また増して一升を取れば立ちどころに蘇る」とある。そして卒忤とは急に生気に逆らい触れるという意味であり、飛尸とは『肘後方』によれば、皮膚に遊走し臓腑を貫いて、発するたびに刺し痛み、変作して定まりのないものであり、鬼撃とは突然として人に著しく刀で刺したように胸脇腹内が切り痛んで押さえることもできず、あるいは吐血・鼻血・下血し、一名を鬼排と称するものであるが、本条のいわゆる卒忤・飛尸・鬼撃なるものは、体内に病変があってそうなるのではなく、ただある種の原因によって突然皮膚呼吸が断絶したため、皮膚から排泄されるべき毒物が急激に頭脳を襲撃する結果、人事不省に陥ったことをいうものであるから、峻発汗剤である本方を用いて鬱滞した病毒を一掃すれば、意識はおのずから回復するのである。\n（頭注）奄忽は迅速の意である。卒然の意に用いる。拗はねじる・まげる（もがく）の意である。" }

    { src: "生々堂治験（中神琴渓）", summary: "京都建仁寺街の近江屋某の娘、18歳。狂痛（精神の発作）を患い、時々発作が起こると、心がぼんやりしてうわごとを言い終わることがない。多くの治療に効がなく、18年の春に至っていよいよ激しく、毎夜3〜4回発作を起こし、医者もみな手をこまぬいた。父母はひどく心配して琴渓に治療を請うた。琴渓はその娘を浴室に捕らえて冷水を浴びせること、食事を一度とるほどの間、その後に麻黄湯を与え、布団をかけて汗を取らせること2〜3回で、ついに再発しなかった。",

    { src: "方伎雑誌（尾台榕堂）", summary: "13歳のとき（著者自身の初陣）。病家が往診を請いに来たが、長兄の蘿斎は外出して不在であった。祖父の紫峯君が「お前が行って診てこい」と命じたので診察して帰ると、祖父がその病症を尋ねた。傷寒で頭痛が割れるようで、悪寒発熱して脈は浮数で力があると申すと、何の方を与えるかと尋ねられた。麻黄湯で発汗させるべきかと伺うと、祖父は笑みを含んで「でかした」と言われた。そこで3貼を調合して温服・大発汗させるよう命じて使いの者を帰した。翌日診ると大いに汗が出て苦しみが脱けるように取れたという。余熱があったので小柴胡湯に転じ、日ならずして元に戻った。これが私の初陣である。",

    { src: "舒氏女科要訣", summary: "ある産婦を治療した。陣痛が起こって6日、児はすでに胞を出て頭はすでに下を向いているのに、ついに産まれない。医者は催生（陣痛促進）の諸方を用い、また催生の霊符を用い、また霊神爐丹を求めたが、いずれも効がなかった。私を招いてこれを診ると、その身は高熱で汗がなく、頭・項・腰・背が強く痛む。これは太陽の寒が営を傷ったものである。法として麻黄湯が主るとして一大剤を作って投じ、温かくして布団をかけると、しばらくして汗を得て熱が退き体が安らかになり、そこで食事を求めて食べ終わると、すんなりと産まれた。これはその病を治して産がおのずから順になる上乗の法である。",

      yumoto: "（和久田叔虎の註の引用）この章は全体として「不汗出」の三字を眼目・骨子とすべきである（求真注：原文は「不汗出」であるから、和久田はこれを指すのである）。考えるに、論中で汗が出ないことをいうものには文に異同があって、その趣旨はそれぞれ異なる。「汗不出」「不汗出」「無汗」「不発汗」がそれである。「汗不出」は「汗すれども出でず」と読むべきで、汗を出す仕掛けをしても出ないのである。「不汗出」は「汗にし出でず」と読むべきで、表にある水気で汗にして出すべきものが汗となって出ないのである。それゆえ「而して煩躁す」をこれに接続させているのであり、汗にして出ないために煩躁することをいうのである。「無」は「有」の反対で、汗のあるべきところにその汗がないのである。これは表に瘀水の隔たりがあることを知らせるために「無汗」というのであり、葛根湯・麻黄湯がこれである。「不発汗」は発汗剤で汗を発しないことをいう。さてこの大青竜湯の証は、冒頭に太陽の中風を冠しているので、もともと重病ではなく、肌表の水を汗にして出しさえすれば治るはずのものであるが、いまその水が汗となって出ないので、腠理を閉じふさいで脈中にも勢いをもって浮緊を現し、発熱・悪寒し、体が痛んで煩躁するのである。（求真の頭注：重病でないというのは誤りで、表証中の最重症である。）\n（活人書の引用）大青竜湯が病を治すのは麻黄湯と似ている。ただ病がもっとも重く、さらに煩躁が加わる者——これがこの湯を用いる指針であって、他の異論のないものとするのがよい。\n（柯氏の引用）思うに仲景は脈によって症を弁じ、ただ虚実を詳しくする。それゆえ中風・傷寒の脈の緩緊を論ぜず、ただ指の下に力のあるものを実とし、脈が弱く力のないものを虚とする。汗が出ないで煩躁する者を実とし、汗が多く出て煩躁する者を虚とする。証が太陽にあって煩躁する者を実とし、証が少陰にあって煩躁する者を虚とする。実の者は大青竜湯を服すべく、虚の者は服してはならない。これがもっとも知りやすいところである。\n（求真）以上の三説を参照して思索すれば、本方の用途はおのずから明らかであるが、「之を服すれば則ち厥逆す」云々、すなわち本方の誤用による変証の治方については、古来紛々として一致しなかった。尚論篇・後条弁・纘論はみな真武湯を用いるべきだと説き、東洞翁もこれに賛成したので、ほとんど定論のような観があったが、ひとり吉益南涯氏はこれに反対して「もし誤ってこれを服すればこの逆を致し、筋惕肉瞤する。ゆえに逆となすというのである。尚論篇・後条弁・纘論に『逆と為すなり』の下に『真武湯を以て之を救う』の六字があるのは誤りである。この条は逆症を挙げてその誤治を戒めたもので、治方を示すためではない。諸家が処方を載せるのは作者の意ではない。もし処方を論ずるならば茯苓四逆湯証であって真武湯証ではない。誤治による厥逆にいまだかつて真武湯証を見たことがない。甘草の有無によって考えるべきである」と説いた。その是非はにわかに判定しがたいが、私は往年たまたまこの症に遭遇し、茯苓四逆湯を用いてわずか1服でこれを治したことによってみれば、南涯氏の説が優れているようである。" },
    { src: "傷寒論",
      kaki: "傷寒、脈浮緩、身疼まず但重く、乍ち軽き時有り、少陰の証無き者は、大青竜湯之を発す。",

      yumoto: "（和久田叔虎の註の引用）この証は少陰の真武湯証と紛らわしいところのある傷寒であって、前条の中風よりも激しくはないが、かえって深いのである。さてこれは、ただ身重の一証が紛らわしいので傷寒と名づけたところであり、大青竜湯を用いるゆえんである。少陰の真武湯の証は四肢が沈重して疼痛するが、この証は体が痛まず、ただ重いばかりで、時にふと軽いこともあるので、裏水によって起こる重さではないことがわかる。これは邪気が肌表の間に隠れ伏して、まだ発していないものとする。大青竜湯は肌表の水気・邪気を発するための主方であることは前に弁じたとおりであるから、いま少陰真武湯の証でないことを詳しく見極めたならば、大青竜湯で隠伏の邪気を発して汗にして去るべし、というのである。「之を主る」といわずに「之を発す」というところで、この方が発汗の主剤であることを知るべきである。私（和久田）はかつてこのような証の病婦が数日治らなかったのに、大青竜湯1貼を服させたところ、飯を炊くほどの間に汗が流れるように出て、病が一掃されたようになり、日ならずして平常に復した。古方の妙は試みて知るべきである。" },

  joubun: [
    { src: "傷寒論",
      kaki: "太陽病、項背強ること几几として、汗無く悪風するは、葛根湯之を主る。",
      yaku: "太陽病で、うなじから背中がこわばってつっぱり、汗が出ずに風を嫌う者は、葛根湯が主治する。",
      yumoto: "（和久田氏）几几とは、項背が強ばって首を返したり伸ばしたりしにくいのを形容した言葉である。その強ばりが一段と甚だしいことを言うために、この形容の文字を加えたのである。\n（尾台氏）成無已は「几の音は殊で、首を伸ばす様子。几は短い羽の鳥である。短い羽の鳥は飛び上がることができず、動こうとするとまずその首を伸ばす。項背の強ばる者も、動こうとするときはこの様子のようである」と言い、程応旄は「几几とは俯仰が自由にならない様子である」と言う。考えるに『素問』刺腰痛論に「腰痛が背を挟んで痛み頭に至り、几几然となる」とある。几几の義はこれによって見るべきである。\n（浅田氏）思うに邪気が太陽に屯すれば項背は几几然として強ばる。ただ項背だけでなく腰背もまたそうである。『素問』に「傷寒一日は巨陽がこれを受ける。ゆえに頸項が痛み腰脊が強ばる」とあるのがこれである。\n項背強几几の意味は以上の三説によって解し得ないわけではないが、まだ隔靴掻痒の感を免れない。私の多年の研究によれば、項背強几几とは、腰部から脊柱の両側に沿って後頭結節に向かって上走する筋肉群の強直性痙攣の意にほかならない。ゆえに病者がもし肩凝りあるいは腰背の攣痛を訴えれば、この愚説に照らしてつまびらかに問診し、なお疑わしければ、右の筋肉群を指頭でその横径に沿って強く按圧し、凝結攣急を触知するとともに病者が疼痛を訴えれば、項背強几几ありと断じて百に一つも失うことはない。しかしこの証が存在するにもかかわらずこれを自覚しない者があり、またこれを自覚しても触診上確知しにくい場合も少なくないので、問診・触診の周到を期するとともに、外証および脈証を参照してこれを決しなければならない。そして汗がなく悪風するゆえんは一般の麻黄剤におけるのと異ならないが、この悪風・悪寒は大青竜湯証を除けば他の麻黄剤証に比して最も激しいと知るべきである。" },
    { src: "傷寒論",

    { src: "金匱要略",

cases: [
    { src: "漫游雑記", summary: "5〜6歳の小児。流行性の下痢（天行痢）にかかって2日目にひきつけを起こし、目がすわってひきつり、体が冷えて脈が絶えた。医者が三黄湯を用いようとしたのを止めて「痢の初期に癇を起こしたのであり、腹気が堅実だから危ないが死には至らない。いま外症がまだ散じないのに三黄湯を用いれば痢毒が鬱滞して数十日長引き、腹気が虚竭して癇が再発すれば救えない。今日の治はただ発散にある」として葛根湯で発汗させ、少し熊胆を兼用した。5日で痢が治り癇も再発しなかった。", yumoto: "（頭注）熊胆には鎮痙作用がある。" },
    { src: "漫游雑記", summary: "痙病で太陽の症があり、手足が拘攣して麻痺に似る者には葛根湯で発汗し、表証が去っても拘攣・麻痺が止まない者には大柴胡湯を与えること40〜50日で治る。", yumoto: "" },
    { src: "漫游雑記", summary: "30余歳の僧が浪速の住まいに来て泊まった。急に外邪に感じ寒熱往来・割れるような頭痛・腰背痛・四肢のだるさがあり、脈は洪数、食欲がなく傷寒に似る。大剤の葛根湯を作り一昼夜に5貼を飲ませ布団を重ねて汗をとらせること3日、悪寒がやや減ったが他の症は前と同じ。塾生を呼んで「この疫は後に大患となる。軽蔑するな」と言い、その夜5更に起きて診ると脈が浮索で、去来が自由でない。邪を受けることが深く、起き上がれなくなるのを恐れて葛根湯を進め、ますます量を増やした。5日目に熱が出て塾生が「紅疹が顔中に出た」と告げた。手を打って「これだ」と言い、まもなく熱が去り食が進み脈が平常になり、20日で全快した。年が若くても痘を患う者が発達しにくいのに、葛根・桂枝で誤ってその死を促すことがあると知るべきである。", yumoto: "（頭注）寒熱往来でなく悪寒発熱であるべきである。なぜなら表証は悪寒発熱するもので寒熱往来しないからである。鉄両とは用量を増加することである。" },
    { src: "古方便覧", summary: "男性。顔に腫れ物ができ、次第に両目がふさがり、あるいは破れて膿汁がしたたり、癩瘡のようで臭穢で近寄れない。本方に梅肉散を兼用してすぐに治った。", yumoto: "この症には葛根加桔梗薏苡湯に黄解丸を兼用するのがよいであろう。六角氏は東洞翁の門人であるから翁の習気を免れないが、その説は捨ててはならない。（頭注）古方便覧の著者は六角氏。" },
    { src: "生々堂治験（中神琴渓）", summary: "京都河原町平野屋清右衛門の妻、60余歳。ある朝わけもなく項背が強く痛み、全身に及んで四肢がひきつりだるく、寝返りもできない。夕方に師（中神）を迎えた。脈が緊急である。そこでその手の指先をみな縛って刺し、黒い血を取ると効があった。また一筋の青筋が喉の傍らに結ばれていたので刺すと血が大いにほとばしり、これより四肢が曲げ伸ばしできるようになった。葛根加大黄湯を与えて3日で元に戻った。", yumoto: "刺絡については発言の資格がないが、処方は葛根加大黄湯に桂枝茯苓丸あるいは桃核承気湯を合方すべきであったろう。（頭注）扎住は結紮のことである。" },
    { src: "叢桂亭医事小言", summary: "商家の婦人。秋になると大いに喘息して苦しみ、ふだんも動作が不自由な廃人のようで、治療を求めてきた。診ると炬燵櫓に腕を支えて座り、数十日動けず、眠るにもこの形で、少し寄りかかって横になると立ちどころに喘悸が激しい。食事は一椀ほど。発作の時を問うと、背骨から首まで板のようになって振り向くにも痛むという。ある医者の勧めで八味丸を数百匁用いて喘は少し緩んだという。葛根湯を与えて5貼ほどで起き歩けるようになり、数を重ねて全治した。",
      yumoto: "私が喘息に葛根湯を用いるのは、この治験にもとづく。" },
    { src: "方伎雑誌（尾台榕堂）", summary: "紀州藩の吉岡宅右衛門の息子・芳太郎。右眼の瞳に星翳（角膜の白濁）が年々生じ、3年目に星翳が胞腫して潰え、その痕が白くひきつり痘痕のようになって少しも見えないという。診ると涙も出ず痛みも赤みもなく、ただ潰破の跡がかなりひきつって新月形をなして瞳を覆っていた。経歴を問うと3歳のときに頭瘡を患ったという。その毒が浄尽せずに潜伏・痼滞して星翳胞腫の禍胎となったものと考え、葛根湯に桔梗・反鼻を加え紫円を兼用し、日に2〜3行通利させた。1か月ほどで白色が次第に薄くなり凹みも浅くなり、さらに前方を続けると少し物が見えるようになり、さらに20日ほどで論語の本文が見え、さらに20日ほどで最も細かい注文（注釈の小字）も読めるようになった。その頃には白色もごく薄くなり凹みも高くなった。なお前方を1か月ほど続けて眼は平常に戻り、今すでに30年、眼に少しの患いもない。始終転方せずに毒を駆り尽くしたので再発がない。", yumoto: "これは慢性炎症を急性炎症に転化させて治す手段である。" },
    { src: "方伎雑誌（尾台榕堂）", summary: "紀州藩の鈴木猪右衛門が4〜5歳の小児を連れていたのに途中で会った。小児は眼病だというので見ると、胎毒眼で両目とも厚い翳が幕を敷いたように覆い、容易な症ではないと語り聞かせると治療を乞うた。葛根加桔梗湯に竜葵丸を兼用させ、10日目ほどに梅肉丸を2分ずつ入れて大いに下させた。差し薬は生々乳を新汲水でごく薄くといて差させると、頑固な幕が次第に消えて40〜50日で快復した。生々乳・紫円などを眼に差すことは、見定めてからでなければみだりにしてはならない。その加減はとくに難しく、師伝がなければ決してしてはならない。", yumoto: "" },
    { src: "方伎雑誌（尾台榕堂）", summary: "逸先の山梨某の治療をしたことがある。その人は函館に勤めて命を受け蝦夷地の諸方を巡視し、瘴毒（風土病の毒）に触れ、函館に帰って重く患った。数人の医者を経て麻痺などの諸症は次第に治ったが、引き続き浮腫を発してどうしても治らない。たまたまロシア船が来たので治療をロシア医に託した。ロシア医は水薬を全身に塗り丸薬を服させ、たびたび水瀉して1か月ほどで水気は治ったが、また全身の痛みを発し、歴節風（関節リウマチ）のようでロシア医がいろいろしても治らない。初めから長くなったので、長く彼の地にいられず辞して江戸に帰り、また洋医数人を経ても治らず、後に私に診察を乞うた。診ると顔色は土のようで、全身の肉が脱け粗糙で乾いた蛙のよう、脈は微数である。病者は「体の痛みは起こったり止んだりして、近頃は少し力もついたので自宅に居ても退屈で、晴れた日には近所へ散歩することもある。しかし途中で急に痛みが起こって一歩も進めず、そのときはすぐに路傍にうずくまり、体や手足にかかわらず痛む所を従僕に命じて指頭できびしく揉ませると、しばらくして痛みが静まる。その痛みが起こるのは雷のように急に動くようで、劇痛の様子は言葉にたとえ難い。このようで、だんだん気分は爽快になっても出歩くことはできない」と言った。診るとやはり瘴毒がまだ尽きていない。そこで葛根加朮将湯（葛根加朮大黄湯）に毎日通天再造散一銭を兼用させると、両便が快利して痛みの発作が日を追って減り、服すること1か月ほどで平癒した。なお前方を服すこと10日ほどで残毒は洗い流したようになった。", yumoto: "（頭注）作輟は起こったりやんだりすることで、作輟は発作の意である。" },
    { src: "清川玄道", summary: "官吏・玉井某の妻、23歳。初妊8か月で全身の水腫・悪寒・肩背強急・心下鞕満・短気があり、産科医に治療を乞うて4〜5日でますます甚だしくなり招かれた。脈は伏弦、顔色は青く惨め、舌上は滑白、みぞおちから下腹まで紫黒の斑点が出て胎動がまったくなく、口中に穢気を帯びて胎児の死亡がわかった。しかし症状に緩急があり、緩なときはよく話し渇して飲み、急なときは人事不省・角弓反張して、大の男数人でも押さえられない。死胎を下せば暴脱の恐れがあるので、まず痙を治すことを優先し、葛根湯を連服させると諸症が次第に穏やかになり、3日で死胎を下して全治した。", yumoto: "（頭注）先考は亡父、祖考は亡祖父である。" },

      yumoto: "（和久田氏）これは誤治によって熱が内攻して下痢するものであるから、内攻の熱を瀉せば下痢も喘も自然に治るのである。ゆえに芩連の胸中の熱を解するものを用いるのである。促とは来ることが数（速い）で時に一止する脈である。その促するのは誤治によるといっても、なお数であるのは表がまだ解していないからである。その喘して汗が出るのは、内攻の熱と下によって気逆するのとが合わさって発するものであるから、その喘で汗が出るのである。そこで「喘して汗出づる」と言い、間に「而して」の字を挟むのは、喘を主とする意を示すのである。これは胸中の熱を瀉し表を和解することで、喘が自然に治れば汗も従って止むのである。しかし表がまだ解していないので、葛根を主として表を解するのである。考えるに、葛根が表を解するという明文はないが、その項背強几几たるものはすなわち表証とし、かの外台の中にも葛根単味で表邪を治すものがあるのを併せ考えれば、やはり表証を主治するもので、項背強を解くものと知るべきである。この方に甘草があるのは、兼ねて内外の急を緩めるものである。要するに項背が強ばり、胸中が煩悸して熱がある者を得れば、その下痢および喘して汗出の証の有無を問わず、この方を用いるべきである。そこで転じて、酒客の病、火証・熱瘡・湯火傷（やけど）・小児の丹毒などにこの方の証があることを考えるべきである。\n私は言う。この説は正しいので、これによって本条を解すべきであるが、促脈を「来ること数で時に一止する者」とするのは誤りである。脈証・脈診法の条を参照すべきである。" }

   "yaku": "傷寒にかかって五、六日、あるいは中風で、悪寒と発熱が交互に起こり、胸脇部が張って苦しく、ぼんやりとして飲食を欲せず、胸苦しくてしばしば吐く。あるいは胸中が苦しいが吐かない、あるいは口が渇く、あるいは腹が痛む、あるいは脇下がつかえて硬い、あるいは心下が動悸して尿の出が悪い、あるいは渇かず体に微熱がある、あるいは咳をする――このような者は小柴胡湯が主治する。",

   "yumoto": "本条は産後の痙・鬱冒・大便難・胃実の四症を論じたものであるが、本方に関係するのは前の三症で、残りの一つは治法を異にする。すなわち「新産血虚し多く汗出づるに、喜しば風に中る、故に痙を病ましむ。大便堅く嘔して食すること能はざるは小柴胡湯之を主る。産婦の鬱冒、其の脈微弱にして、嘔して食すること能はず、大便反て堅く、但頭汗出づ。然る所以の者は、血虚すれば而ち厥し、厥すれば而ち必ず冒す。冒家解せんと欲するときは必ず大汗出づ。大便堅く嘔して食すること能はざるは小柴胡湯之を主る」とみなして解すべきで、その他はこれらの章句を補足したものにすぎない。この見解のもとに註釈を試みる。\n（頭注）「大便堅く嘔して食すること能はざるは小柴胡湯之を主る」とは、前出の「上焦通ずることを得、津液下ることを得て、胃気因りて和し」云々と理は同じである。\n本条の痙は葛根湯証（剛痙）の汗が出ないものとは異なり、分娩によって血虚すなわち貧血し、汗が多く出て、大便が硬く、吐いて食べられないものであるから、たとえしばしば風にあたり感冒したことによるとしても、病は表にはなく半表半裏にあることが明らかであるので、本方が主治するというのである。\nまた鬱冒とは、『明理論』に「鬱は鬱結して気がのびないもの、冒は昏冒して精神がはっきりしないもの」と述べるようなもので、すなわち現今の脳貧血である。その吐いて食べられないことは本方証にほかならないが、この証はもともと大便が硬くないのが普通であるのに今かえって大便が硬いので「反て堅く」というのである。そうなる理由は、吉益南涯が「大便反て堅く嘔して食すること能はず（これは水毒が上にあるので吐いて食べられず、下に水気がないので大便が硬いのである）」と説くように、水毒が上半身に集まり下半身に欠乏するためである。\nまた「然る所以の者」から「必ず冒す」までは、鬱冒を発する理を説いたもので、貧血すれば四肢が冷え、四肢が冷えれば必ず鬱冒を発するとの意である。しかし四肢の冷えはただ貧血によるだけでなく水毒があってそうさせるのであるから、鬱冒もまた同じ原因による（大汗が出て解することから、水毒が主であることは明らかである）。「冒家解せんと欲するときは」とは、鬱冒の者が小柴胡湯を服して解けようとするときは、の意であって、「必ず大汗出づ」とは、『金匱要略述義』に「鬱冒の者に大汗が出るのは、小柴胡湯が適した効であって、少陽病の振汗の先例のようなものである」と言うように、前出の「凡そ柴胡湯の病証にして之を下し、若し柴胡の証罷まざる者には、復た柴胡湯を与ふ、必ず蒸蒸として振ひ、却りて発熱汗出でて解す」の類で、すなわち戦汗して治るものである。これによって、鬱冒・頭汗・大便難・四肢厥冷が水毒の変動にほかならないこと、および本方に鎮痙・鎮静・止汗・鎮嘔・催便・利尿の諸作用があることを知るべきである。\n「病解して能く食し」とは、小柴胡湯服用の結果、痙あるいは鬱冒・大便難の病が治って、の意で、以下は、このように七、八日して再び発熱するものは少陽病ではなく胃実すなわち陽明病であるから大承気湯の主治である、というのである。\n（頭注）小柴胡湯はよく脳貧血を治し、またよく脳充血を治す。後の論の通りである。偏って固執してはならない。"

   "yumoto": "『金匱要略』では「但煩する者」とするが、『千金方』では「但煩熱する者」とする。この説が正しいのでこれに従って解すべきであるが、この「煩熱する者」は「四肢苦煩熱する者」の略であると知らなければならない。草蓐とは産褥の意、「自ら発露して風を得」とは褥婦が自分で体を露わにして感冒にかかった意、「四肢苦煩熱」とは四肢の煩熱が激しいことをいうが、とくに手のひら・足の裏で甚だしい意を含んでいる。\n（『方輿輗』三物黄芩湯条を引用）「出産のときは体を露わにし力を用いて他を顧みる暇がない。このとき風寒が虚に乗じて入ることがあり、また気血が回復しないうちに軽々しく動いて邪に感じる者もある。これがみな『草蓐に在り自ら発露して風を得』の類である。その証で悪寒・発熱・頭痛し脈が浮であれば、油断なく解肌の薬（頭注：発表剤の意）を与えるべきである。産後の発汗はよくないと言って邪気を長引かせると、おそらく変じて煩熱の症となる。煩熱となってもなお頭痛する者には小柴胡湯を与えればすぐ解ける。頭痛がなくただ煩するに至っては三物黄芩湯の主るところである。この症に小柴胡加地黄湯・加味逍遥散（頭注：後世方である）なども用いるが、三物黄芩湯の簡便迅速さには及ばない。ただ惜しいことにこの薬は苦くて飲みにくいので、世の医者は黄連で苦参に代え、あるいは甘草を加える。甘草を加えるのはまだよいが、苦参を去っては仲景の方意を失う。『別録』に『苦参は伏熱を除く』とある。」――私が言う。苦参の代用薬を用いてはならない。\n（『百疢一貫』を引用）「産後に蓐労（産後の衰弱・労症）になろうとする者には、先生（和田東郭）は『小柴胡湯に三物黄芩湯を合わせるとよい。この二方のほかに蓐労を治す方はない。三物黄芩湯は熱の強いときに、小柴胡湯は熱の軽いときに用いる。また土俵際まで追い詰められても三物黄芩湯で食い止めることがある』と言う。先生はこの方を活用して、十六、七歳で月経がなくそこから労病になった婦人に用いて効があった。『金匱』の方である。この方を用いて虫が下れば一層よい。これなら労症の状態が現れて危うくても治る。先生は飲みにくいので常に甘草を加えて用いた。」\n（『類聚方広義』本方条を引用）「草蓐とは産褥をいう。四肢が苦しく煩熱し頭痛する者は、産後の中風だけでなく、男女の諸血症・長引く咳・労瘵（結核性の消耗）および諸種の失血後に多くこの症がある。二方を選んで用いるべきである。」\n私が言う。本条はこの三説によって解すべきものであるが、私の経験では、四肢苦煩熱する者には（三物黄芩湯証を除く）、本方に地黄を加えるべきもの、石膏を加えるべきもの、本方に瀉心湯あるいは黄連解毒湯（あるいは同丸）を兼用すべきもの、また本方あるいは本方加石膏湯に桂枝茯苓丸あるいは当帰芍薬散を合用すべきものがある。常に一定しているわけではないから、腹・脈・外証をよく調べて方を処し、必ずしもこの師論に固執してはならない。"

   "text": "『医方口訣集』：抑肝散は専ら肝経の虚熱による発搐（ひきつけ）、あるいは発熱・歯ぎしり、あるいは驚き動悸・寒熱、あるいは木（肝）が土（脾）に乗じて嘔吐・よだれ、腹が張り食が少なく睡眠が安らかでないものを治す。柴胡・甘草各五分、川芎八分、当帰・白朮（炒る）・茯苓・釣藤鈎各一銭。水で煎じ母子ともに服す。蜜を加えて丸にしたものを抑青丸という。\n（症例）産婦が満月（産後一か月）に及ばず発熱・脇痛・咳嗽し、四肢がふるえ動き、唇と目がひきつる。医者が補血調気剤を再三用いるとその症はいよいよ盛んになり、かえって小便の渋少が加わった。急を要して私（口訣集の著者）を招いた。診ると六脈が弦数。病因が得られないので人払いして詳しく事情を問うと、夫が実を告げて「かくかくしかじか」と言う。そこで本方を与えると三貼にならずして平癒し、のち加味帰脾湯を用いて全治した。およそ産後は新血がまだ充たず真元がまだ固まらないので、一事でも情に逆らうことがあると怒火が焔のように身命を焚き失わせる。医者は機に臨んで少しでも疑惑があれば詳しく問わなければならない。\n『蕉窓方意解』抑肝散加芍薬湯条：この薬も四逆散の変方である。腹形はおおむね四逆散と同様であるが、拘攣が腹表に浮いているのを抑肝散の標的とし、四逆散は拘攣が腹底に沈んでいるのを標的とすべきである。そのうえ抑肝散の方は多怒・不眠・性急などの甚だしいものを主症とする。多怒・不眠・性急などは肝気亢極の徴で、肝気が亢極すれば肝火が熾盛になり肝血も損耗するので、当帰・川芎で肝血を潤し、川芎で肝血を疎通し、柴胡・釣藤・甘草で肝気を緩める。すでに右のように肝気が亢極して上へ胸脇へ引き上げるので、腸胃の水飲も下降せずにみな上へ引き上げられる。そこで疏肝・緩肝・潤肝の薬で両脇・心下が和らぎ水飲も下降しやすくなるときに、白朮・茯苓で小便へ消導するのである。本方には芍薬がなく甘草の分量も少ない。考えるにこの薬は専ら肝気を潤し緩めることを主とするので、私（蕉窓）は常に芍薬甘草湯を合して用いる。\nまたこの方に当帰・芍薬・川芎を用いるのは専ら潤血で、すなわち皮膚の枯燥をも潤す意である。全体が四逆散の変方で川芎・当帰・芍薬を加えるのは、ちょうど逍遥散が小柴胡湯の変方で当帰・芍薬を用いるようなもので、逍遥散に白朮・茯苓を用いるのも抑肝散に白朮・茯苓を用いるのと同じ意である。\n『餐英館治療雑話』：この方はもと小児の肝血不足で肝火が動き、発熱・ひきつけ・歯ぎしりなどの症のある者のために設けた方であることは皆知るところである。さて小児で生まれつき非常にひ弱な者は、顔面ならびに全身の色が非常に白く潤いがなく、甚だしい者は小刀で少し怪我をしても血が出ない。また腹が虚して軟らかい中に左の筋が張り、左だけに癖積（腹のしこり）の徴候もなく、怒りっぽく性急な子はみな肝血不足の症である。この方を久しく服するとよい。大人の半身不随に用いるのは和田氏の経験である。また不眠の症に用いて効く症がある。前の温胆湯の条に言う通り、不眠の症には虚があり痰飲があり、よく脈証・腹候を弁じて方を処すべきである。この方を半身不随ならびに不眠の症に用いるのは、心下から任脈（正中線）にかけて攣急・動悸があり、心下に気が集まって痞える気味があり、医者の手で按じると左だけ痞えは見えないが、病人に問えば痞えるという症、また左脇下が柔らかくても少し筋張っている症ならば、怒りはないかと問うべきで、怒りがあれば効がないということはない。二症ともに芍薬をたっぷり加えるべきである。\n私が言う。以上の抑肝散・抑肝散加芍薬湯の適応症には、小柴胡湯・柴胡去半夏加括蔞湯・柴胡姜桂湯中の一つに当帰芍薬散を合用するのが至当であるのに、後世医はこの方法を知らなかったために、ついにこのような駄方をこしらえたのである。今、例を小柴胡湯当帰芍薬散合方に取れば、当帰芍薬散方は当帰・川芎・茯苓・朮・沢瀉・芍薬の六薬からなる方であるから、これを小柴胡湯方に合すると柴胡・黄芩・人参・甘草・大棗・生姜・半夏・当帰・川芎・茯苓・朮・沢瀉・芍薬の十三味となる。これを抑肝散加芍薬湯に対比すれば左図のようになる（図：柴胡・甘草・川芎・当帰・白朮・茯苓・芍薬は共通、抑肝散加芍薬湯にはない黄芩・人参・大棗・生姜・半夏・沢瀉、抑肝散加芍薬湯にだけある釣藤鈎）。\n図に示すように二者に共通する薬物は七種の多きに達する。これによって、抑肝散加芍薬湯が師方の合用法を一知半解したことから生まれたことを知るべきである。"

      yumoto: "マラリアの往来寒熱するにあたり、悪寒が激しく続いて起こる発熱が微弱であるもの、またはただ悪寒するだけで発熱しないものは本方の主治であるという意である。そして寒が多く熱が少しあるのは、方中の熱薬である乾姜の証が強く現れ、冷薬である柴胡・黄芩・括蔞根の証が弱く現れたためであり、ただ寒がって熱しないのは、乾姜の証が強度であるため柴胡などの証がまったく圧伏されたためである。\nこのように本方は悪寒を治す作用はすこぶる有力であるが、発熱を治す作用に至っては微力であるから、総じて高熱のある病者には禁忌としなければならない。しかしこの熱状だけを目標にこれを処方すると、片言で裁判を断ずるような誤りがあるので、これを用いるには必ず前条を参照しなければならない。" }

  fukusho: { title: "腹証", text: "東洞翁が本方を「小柴胡湯証で嘔せず、痞せず（私が言う、痞の下に鞕の一字を略している）、上衝して渇し、胸腹に動のある者を治す」と定義しているように、本方を小柴胡湯と比べると、この方には生姜・半夏を含まないので、あの証のような悪心・嘔吐はせず、人参がないので心下痞鞕しないが、桂枝・甘草があるので上衝急迫の症があり、括蔞根があるので渇症もあり、牡蛎を有するので胸腹の動、すなわち心臓および腹部大動脈の拍動が著しい。これが二方の証の異なるところで、その他はすでに講述したので参照すべきである。" },
  kagen: [],
  senpai: [
    { who: "吉益東洞", src: "（本方の定義）", kw: ["小柴胡湯証で嘔せず痞鞕せず、上衝して渇し、胸腹に動がある者を治す"] },
    {"who": "有持桂里", "src": "方輿輗", "kw": ["この方の主る所も胸脇であるが、大小柴胡の症に比べれば急でなく（※求真：大柴胡湯証のように心下急ではない）、鞕くなく（※求真：小柴胡湯証のように心下痞鞕しない）、腹中に力がなく微結するもの", "この腹は多くは飲（水毒）を蓄え、あるいは動悸を帯びる（※求真：本方証は腹部一般に軟弱無力で、多くは胃内に停水があり（生姜・半夏の証のように上迫しない）、腹部大動脈が拍動するもの）", "『素問』上古天真論の「志閑にして欲少なく、心安らかにして懼れず、形労して倦まず」は養生の要道・延寿の真訣である。しかし今は天下太平で万民の体は楽で心は苦しみ、風俗が上古と反するので、人はみな虚弱臆病で、疝・留飲を口にしない者はない。それゆえこの薬が自然と世に行われるのも理由がある", "虚労（結核性の消耗）は初めは多く風邪をひいたことから起こる。中国のことわざに「傷風醒めざれば変じて労と成る」というのはこの意", "また留飲家がたびたびかぜをひき、ついに労状に持ち込む者がある。これらの症は総じて柴胡姜桂湯がよい", "若いころ世の医者の治療を見ると、この症に当たれば慌てて人参・黄耆・当帰・地黄の類を投じ、甚だしい者は獺肝・紫河車（胎盤）などの重い薬を用いた（※求真：これらの薬を用いたのはみな後世派の医家）。今は刀圭（医術）の道がしだいに開け、俗医も姜桂（柴胡姜桂湯）を口にしない者はない。道は時とともに盛衰するものか", "※求真：本方は肺結核に用いられないことはないが、これを用いるには既記の師論と腹証を目標とすべきで、その他の説は参考にとどめるべきである"]},
    {"who": "華岡青洲", "src": "青洲医談", "kw": ["麻疹の後に労症（消耗）となる者が多い。柴胡姜桂湯に解毒散（※求真：私の黄解丸と同方）を兼服させて数人を治した。長く服さない者には効がない", "柴胡姜桂湯の条下に「心下満微結」とある（※求真：心下満微結ではなく胸脇満微結である）。満する者はまだよいが、微結ははなはだ窺いにくい", "かつて琴山翁（※求真：琴山は村井氏で東洞翁の高弟）に質すと、翁は「これははなはだ窺いにくい。ただ臍の辺りで動悸の高い者はその心下が満微結しているのである。たとえば河の流れのようで、その上に巨石があれば下も必ず激する。その理と似ている」と言った", "その象をあらわす者は万病にこの方を処して効を奏する。梅毒が久年治らない者などにみなこの方を用いて奇効を得ることは数えきれない", "※求真：村井・華岡二氏ともに胸脇満微結の意義を知らず、いたずらに暗中模索したものであるからその説は信じてはならない。しかしその腹証を認めてこれを処方すれば、梅毒そのほか万病に効があるのは事実である。これが古方の微妙なところで、洋方の夢想もできないところである"]},
    {"who": "尾台榕堂", "src": "類聚方広義", "kw": ["労瘵・肺痿・肺癰・癰疽・瘰癧・痔漏・結毒（梅毒性潰瘍）・徽毒（梅毒）などが長く治らず、しだいに衰弱に向かい、胸満・乾嘔、寒熱が交互に起こり、動悸・煩悶、盗汗・自汗、痰嗽・乾咳、咽乾・口燥、大便溏泄、小便不利、顔色が悪く精神が疲れて重い薬に耐えられない者にはこの方がよい", "※求真：この説の通り、一般に衰弱した慢性病者には本方証がはなはだ多い。注意すべし"]},
    {"who": "浅田宗伯", "src": "勿誤薬室方函口訣", "kw": ["この方も結胸の類症で、水飲が心下に微結し（※求真：心下ではなく胸脇に微結する）、小便不利・頭汗が出る者を治す", "骨蒸（※求真：熱性肺結核）の初め外感からこの症を現す者が多い。黄耆・鼈甲を加えて与えると効がある（※求真：本方に桂枝茯苓丸を合用すべきで、黄耆・鼈甲を加えるべきではない）", "高階家では鼈甲・芍薬を加えて緩痃湯と名づけ、肋下あるいは臍の傍らに痃癖（※求真：凝塊のことで瘀血）があって骨蒸状をなす者に用いる（※求真：本方に桂枝茯苓丸を合用すべきもの。鼈甲・芍薬を加えるのは誤り）", "この方は微結が目的で、津液が胸脇に結聚して五内（五臓）を潤さず乾咳が出る者によい。もとより小青竜湯などの心下水飲による頻繁な痰咳とは比べられない", "また小柴胡加五味子乾姜湯の胸脇苦満して胸肋へ引いて痛むようなものでもない。ただ表証から来て、身体の痛みがなく熱があっても脈が浮でなく、あるいは頭汗・盗汗・乾咳する者に用いる", "また瘧で寒が多く熱が少ない者に用いて効がある", "また水腫の症で心下が和せず動悸する者は、水気と持病の積聚が合して心下へ集まるもので、この方に茯苓を加えてよい（※求真：この症には本方に苓桂朮甘湯を合用すべし）", "この方の症で左脇下からさしこみ緩みにくい者、あるいは澼飲の症に呉茱萸・茯苓を加えて用いる（※求真：和田氏の説を祖述したもので、誤りであることはすでに述べた）", "また婦人の積聚に水飲を兼ね、ときどき衝逆して肩背が強急する者に効がある（※求真：肩背強急ではなく頸項強である）"]}

  cases: [{"src": "建殊録", "summary": "ある書生が読書・苦学して憤ることがあり、机にもたれて七昼夜眠らず、ついに独り言を言い、みだりに笑い、先儒を指摘して罵ることが絶えなかった。しばらくして人々は狂疾であると気づいた。東洞が診ると胸肋が張り（妨脹）、臍上に動悸があって上気が降りないので、柴胡姜桂湯を作って飲ませ、ときに紫円で攻めること数日で全く平常に復した。", "yumoto": ""}, {"src": "建殊録", "summary": "京都東洞街の商人 大和屋吉五郎。毎年春（発生の時）になると頭と顔が必ず熱して頭上に瘡ができ、かゆみが盛んで掻くとただれ、秋（凋落の候）になると薬を用いずに自然に治ることが数年続いた。東洞が診ると心下に微かな動悸があり、胸脇支満し、上気がとくに甚だしい。柴胡姜桂湯と芎黄散を作って飲ませること一か月ほどで諸証がまったく治り、以後再発しなかった。", "yumoto": ""}, {"src": "古方便覧", "summary": "婦人。平素月経不順で気が上衝し、両脇が引きつれて腰痛が耐えがたい。月経が来ようとするときは臍腹が激しく痛み、下るものは豆汁のよう、あるいは米のとぎ汁のようで、月経はわずか一日か半日で止む。これが十二、三年続いた。診ると胸脇苦満し臍上の動悸が甚だしいので、本方と硝石大円を作り交互に進めると、ときどき赤黒い膿血を排出し、服用数か月で前症がまったく治った。", "yumoto": "この症には本方に桂枝茯苓丸を合方し、下瘀血湯あるいは起癈丸を兼用すべきであったろう。"}, {"src": "成蹟録", "summary": "遠州の農夫、三十余歳。昨年から鬱冒（めまい・意識のもうろう）し、ときに少し吐血し、盗汗が出て往来寒熱し、少し渇いて臍の傍らの動悸が甚だしい。南涯に治療を請い、柴胡姜桂湯を与えて治った。", "yumoto": ""}, {"src": "成蹟録", "summary": "尾崎侯の臣 猪瀬氏の娘。もとより癇症があり、一時は痰を患った。諸医が治せず南涯を迎えた。腹に動悸があり頭汗が出て往来寒熱し、大便が乾いて硬く、ときどき上衝して意識を失う。日夜このようなことが二、三回ある。柴胡姜桂湯を与え紫円で攻め、一か月たたずして諸証がことごとく除かれた。", "yumoto": ""}, {"src": "成蹟録", "summary": "備中の村長。常に驚きやすく、胸腹が動悸し、引きつれて悪寒し、手足がやや冷え、夏でも衣を重ね、驚いた後は必ず下痢し、大黄剤を得ると下痢が甚だしい。十余年治らず、南涯に治療を請い柴胡姜桂湯を与えて治った。", "yumoto": ""}, {"src": "成蹟録", "summary": "一男子。平素鬱々として楽しまず、密室に端座するのを好み人に会いたがらず、ややもすれば目を見張る。胸腹に動悸があり、治らないこと六年ほど。南涯が診て柴胡姜桂湯を与えて治った。", "yumoto": ""}, {"src": "成蹟録", "summary": "富士山の神主某。京都に仮住まいして病を得、医者に請うと外邪とみて薬を与えられ治った。自分でも邪が解けたと思い髪を梳き湯浴みしたところ再発し、煩渇して水を多く飲み、胸腹に動悸があった。翌日には治り、治ってはまた発し、約六、七日ごとに一回発作した。このようなことが数回あり、医者は虚とみなければ邪熱とみて薬を与えたが治らない。ついに南涯に請うと「これは医者が誤っている。この病は瘧（マラリア）である」と言い、柴胡姜桂湯を服させると数貼にならずして病は洗い流したように去った。", "yumoto": ""}, {"src": "成蹟録", "summary": "長門の武士。常に口吃（どもり）がある。南涯に「私の吃音は長く、自分でも医治の及ぶところではないと知っているが、先生を訪ねたのは幸いである。笑わないでほしい」と言った。南涯が「吃音は毎日同じか」と問うと、「いいえ、ときに軽重があり、気持ちがすっきりしないときは必ずひどくなる」と答えた。南涯は「よろしい」と言って診ると、心胸の下に力がなく胸腹の動悸が甚だしいので、柴胡姜桂湯を与え「これを服して怠らないように」と諭した。武士は薬を受けて去り、後に手紙を寄せて「積年の病が日を追って元に戻りました」と謝した。", "yumoto": ""}, {"src": "蕉窓雑話", "summary": "ある老人。平素はなはだ房事過多であったが、転胞病（尿閉）を患い、ある医者がしきりに八味丸料を用いたが一滴も通じず、数日を経て苦しみが極まり和田東郭に治療を求めた。柴胡姜桂湯加呉茱萸茯苓を用いるとたちまち治った。ただ左脇下が拘攣して動悸があり、これが水飲を押し上げたために右の症をなしたのである。", "yumoto": "左脇下拘攣とは左腹直筋の攣急の意であるから、すなわち桂枝茯苓丸あるいは当帰芍薬散の腹証である。しかし熱薬である呉茱萸が比較的奏効したことから見れば、前の丸の証ではなく後の散の証であったのである。ゆえにこの病症に柴胡姜桂湯加呉茱萸茯苓を用いるのは変則で、柴胡姜桂湯当帰芍薬散合方を処すのが正則である。"}, {"src": "蕉窓雑話", "summary": "一婦人。産前から脚気萎弱を患い、小便不利で三、四日にようやく一回出る。その腹候によって柴胡姜桂湯加呉茱萸茯苓を用い、いろいろ諭したがきわめて愚かな人で聞き入れず、足の萎弱をことに憂えるので、のちには諭すのをやめてただ前方を長く服させると、段々小便も通じて一日四回ほど出るようになり、足も立てるようになった。", "yumoto": "この症にもまた柴胡姜桂湯当帰芍薬散合方を用いるべきで、柴胡姜桂湯加呉茱萸茯苓を処すべきではない。和田氏は古方後世折衷家であるから合方の機を知らずにこのような畸形方を常用したのである。従ってはならない。私の経験によれば、当帰芍薬散は駆瘀血・利尿の二作用を兼ね備えているので、よく知覚および運動の不全麻痺を治す。脚気萎弱に効果があるゆえんである。"}, {"src": "方輿輗", "summary": "先に一人の高僧（信州玄向律師、京都に上り華項山中に住む）があり、病症は多端であったが最も苦しんだのは肩背の強痛で、毎日小僧に按摩させ、ひどいときは鉄槌・鉄尺で打たせた。このようなことが二、三年、服薬・刺絡・灸と千百の治療を施さないことはなかったが一つの効もない。著者（有持桂里）が診ると、その病はまったく柴胡姜桂湯の主るところであった。「肩背の患いは私には術も智もない。ただ姜桂湯で本症を治せば、肩背もあるいは安らかになるだろう」と言い、剤を作って与えた。服すること僅か六、七日で諸証の十中六、七が去り、長年の肩背強痛も制せずして自然に治った。その効は実に意表に出た。師は大いに喜び、絹の宝を贈って懇ろに謝した。", "yumoto": "この症は肩背強痛ではなく頸項強であったのである。本方の効があったゆえんである。"}, {"src": "麻疹一哈", "summary": "山田仁右衛門の娘、18歳ほどで未婚。発熱して蒸すように熱し発疹が出たが、三、四日収まらず、光沢が鮮やかで両頬が朱のように赤く、両耳が蝉の鳴くように鳴り、頭痛・めまいがし、月経が通じないこと二、三か月。腹を按ずると胸脇支満し、腹中に動悸があり、臍の辺りが凝結して充実し、按ずると痛みが腰脚に及ぶ。そこで柴胡姜桂湯と浮石丸を作って服させると、大便が一日に二、三回下り、月経が常の倍ほど来て諸症がしだいに減じ、光沢もしだいに消えて発疹も減り、およそ二十四、五日でまったく元に戻った。", "yumoto": "これは月経閉止により瘀血が頭脳に衝逆して両頬を朱のように赤くし、かつ両耳の耳鳴り・頭痛・めまいを起こさせたものであるから、本方桂枝茯苓丸合方に下瘀血丸あるいは起癈丸を兼用すべきであった。"}, {"src": "橘窓書影", "summary": "郡山侯の臣 加藤理助の妻。産後、悪露が尽きた後にときどき悪寒・顔面の熱があり、舌の上が赤くただれ、頭汗が出て、心下がわずかに結し、腹満・小便不利、腰以下が少し腫れる。医者は蓐労（産後の消耗）とし、あるいは黄胖（貧血症の一種）とし、多くの治療も効がなかった。浅田宗伯が診て、血熱が蓄飲（水毒）を挟んだ証とし柴胡姜桂湯加呉茱萸茯苓を与えると、丁酉の秋から戊戌の春に至り長年の病が過半治った。なお前方を守ってついにまったく治った。これにより一藩の長患いの者がみな診察を請うに至った。", "yumoto": ""}, {"src": "橘窓書影", "summary": "郡山侯の臣で留守居の瀧内蔵之進の妻、40余歳。数年来臍の傍らに塊があり、ときどき心下に衝き上げて動悸し歩くことができない。腰以下に水気があり顔色は萎黄、月経不調。浅田宗伯はまずその水をめぐらせ、あわせて血を利すべきとして柴胡姜桂湯加呉茱萸茯苓を与え鉄砂丸を兼用した。服すること数日で夜中に小便が五、六回快通し、臍の傍らの塊はしだいに減り、数旬で諸証が全治した。", "yumoto": "右の二症には柴胡姜桂湯当帰芍薬散合方を処すべきであった。"}, {"src": "橘窓書影", "summary": "太田筑前守の室、27、8歳。産後に頭痛・めまいを発し、ある洋医が治療してかえって甚だしくなった。胸脇微結、小便不利、腹中動悸があり、飲食が進まず、ときに寒熱を発し、あるいは体が震え揺れ、そのたびにめまいがして目を開けられず、夜間は驚いて眠れず、あるいは体が大舟の中で風波に揺られるようで片時も安らかでなく、そのたびに侍女二人に抱き支えさせた。多くの医者が滋血・鎮痙・抑肝など種々の薬を雑投すること二年ほど、依然として少しも効がない。宗伯は「病は長患いで急に治すべき候ではない。まず胸脇を利し動悸を鎮め、心気を旺盛にさせれば上下の気が交通して頭眩・身揺は自然に安まるだろう」と言い、主人も深く承諾した。そこで柴胡姜桂湯加呉茱萸茯苓を与え、夜間は朱砂安心丸を服させた。ときは厳冬でその証は動静があったが、主人が確乎として前方を服させると、翌春に至り病は自然に去り臥床を脱した。", "yumoto": "（頭注）朱砂安心丸は後世家が称用するものであるが、黄解丸を用いる合理さには及ばない。"}, {"src": "橘窓書影", "summary": "池野新一の妻（堺奉行池野山城守の息女）。産後めまいを患い、体が揺れて維持できず、臥していても舟中に座っているように体を保てず、侍女に支えさせた。心下動悸し、足の裏に冷汗がしとしとと出て敷物を浸す。診ると血虚の候はなく飲食はふだん通り、脈も平で月経も期を失わない。そこで柴胡姜桂湯加呉茱萸茯苓を与え妙香散を兼用すると、数か月後に頭汗が止み心下の動悸も収まったが、めまいはまだ止まらない。ただ人の支えを待たずに起居できるようになっただけで、身体の血気は枯れ痩せ、頭はときに百斤の石を戴くようであった。聯珠飲を与え、ときに辰霊散を服させると、めまいは日ごとに減った。ある日右足の股間が腫れ、しだいに流注（膿瘍）のようになった。宗伯は頭中の瘀濁が下流して腫瘍となったもので必ず吉兆であるとし、膏を貼って膿の熟すのを待ち、瘍医に刺させた。のち瘡口が収まるにつれてめまいがまったく止んだ。前後七年を経て全治した。", "yumoto": "右の二症には本方・苓桂朮甘湯・当帰芍薬散の合方、あるいはこれに黄解丸または第二黄解丸を兼用すべきであった。なぜなら、前の治験の胸脇満微結・小便不利・腹中動悸・ときに寒熱を発するのは本方証で、体が震え揺れそのたびにめまいがして目を開けられないのは苓桂朮甘湯証であり、体が大舟の中で風波に揺られるようで片時も安らかでなく侍女二人に抱き支えさせたのは沢瀉湯証の冒眩であるが、この病者は分娩のため貧血したと推測されるので、冒眩を治す作用のほかに能力のない沢瀉湯を用いるべきでなく、冒眩と貧血を兼治する当帰芍薬散を処すべきものだからである（頭注：当帰芍薬散中には沢瀉湯を包含するので冒眩を治す作用がある）。また後の治験の産後めまいで体が揺れて維持できず、臥していても舟中に座っているようで体を保てず侍女に支えさせるもの、および頭がときに百斤の石を戴くようなものは、苓桂朮甘湯証と当帰芍薬散証とが錯出したもので、心下動悸し足の裏に冷汗がしとしとと出て敷物を浸すのはすなわち本方証であるから、この二病者には初めから本方・苓桂朮甘湯・当帰芍薬散の合方を与えなければならなかったのである。ところが浅田氏はこの理を弁えず本方加呉茱萸茯苓を濫用したので、軽症にはしだいに効を収めたが、重篤なものに至っては数か月を経てようやく少し効を得たにとどまり、ついには聯珠飲を用いざるを得なくなったのである。この方は原南陽が苓桂朮甘湯証と当帰芍薬散合方証を一知半解し、苓桂朮甘湯と後世方の四物湯（当帰・川芎・芍薬・地黄）を合わせた鵺のような方剤にすぎないので、所期の効果がないのは問うまでもなく明らかである。このように浅田氏は徹頭徹尾生半可な治療を事としたので、その全治を得るのに前後七年の長い時日を費やしたのである。これによって用方をおろそかにしてはならないことを知るべきである。"}, {"src": "橘窓書影", "summary": "浅草御厩岸の力士の長、雷権太夫の妻。外感が解けず毎日時を定めて悪寒発熱し、瘧に類して汗が出て止まらない。多くの医者が一か月余り治療しても依然として少しも効がなく、あるいは風労とし、あるいは血熱として紛々と一定しない。浅田宗伯が診て「脈は沈弦で心下微結し、蓄飲があり動悸がある。おそらく邪熱と水飲が併せて鬱した証であろう」と言い、柴胡姜桂湯加鼈甲茯苓を与え、ときどき気が鬱して乾嘔するので、三黄瀉心湯に香附子・檳榔・紅花を加えて泡剤として兼用させた。服すること二、三日で諸証が半減し、数旬たたずして全治した。そこで力士の仲間は大いに宗伯の業を勧めたという。", "yumoto": "この症には本方桂枝茯苓丸合方に瀉心湯を兼用すべきであった。"}, {"src": "橘窓書影", "summary": "新庄の家臣 大野善八郎の妻、50余歳。外感の後、熱が解けずときどき発熱して瘧のように盗汗が出、胸腹に動悸があり、めまい・耳鳴り、あるいは肩背が強急し、頭は大石を戴くよう、耳は大鐘を撞くようである。多くの医者を経ること一年余り、少しも効がない。宗伯は柴胡姜桂湯加黄耆鼈甲を用いること数十日で熱が減じ盗汗が止んだので、黄耆・鼈甲を去り呉茱萸・茯苓を加え、六味地黄加鉄砂煉を兼用して諸証が全治した。", "yumoto": "この症にはまず本方桂枝茯苓丸合方を与え、熱が去ったのち本方当帰芍薬散合方を処すべきであった。（頭注）六味地黄丸は後世方である。"}, {"src": "橘窓書影", "summary": "従五位 柳沢光邦。封を辞して染井の六義園にいた。外感の後、咳嗽・声のかすれが久しく治らず、肺痿（肺の消耗性疾患）になろうとしていた。宗伯は麦門冬湯加桔梗を与え六味生津煉を兼用して病が半減した。ある日雨をおかして外出すると途中から悪寒が甚だしく、家に帰ると壮熱・大渇、身体がだるく痛む。急使が宗伯を迎え、翌朝着くと寒熱は失せたようで、ただ脈は浮弦で腰以下がだるいだけであった。宗伯は「おそらく瘧疾であろう。明日を待って処方を決めるべきだ」と言った。翌日果たして震え寒がって大熱を発し、渇して水を飲み汗が流れるようであった。そこで小柴胡加知母石膏を与え、服すること四、五日で瘧邪は大いに解けたが、頭痛・心下支結・小便不利があり自汗が止まらないので、柴胡姜桂湯加黄耆鼈甲に転じて諸証はしだいに安らいだ。ただ隔日に少し悪寒を覚えて気分がすっきりしないというので、夜明けに反鼻霜を服させると瘧はまったく止んだ。のち補中益気湯加芍薬茯苓で調理して、咳嗽・声のかすれともに平常に復した。", "yumoto": "この瘧の初期には小柴胡加石膏湯（知母を加えてもよい）桂枝茯苓丸合方を与え、中期には本方桂枝茯苓丸合方を用い、後の療法には本方当帰芍薬散合方に伯州散を兼用すべきであった。本方加黄耆鼈甲や補中益気湯加芍薬茯苓を用いたのは誤りである。"}],

   "text": "〔1〕独嘯庵（永富）の『吐方考』に「汗・吐・下を並び行うのは古の道である。今、汗・下をよくして吐をよくしなければ、その能においてまた難くないか。今、吐すべき病を知って汗下すべき病を知らなければ、その知においてまた危うくないか。日本に古方書の学が興って汗・下の術が四方に敷かれること十数年、吐方に至っては艱渋して行われない。そもそも汗吐下は途を異にして帰を同じくする。学ぶ者がその機を冥会すれば、吐がどうしてとくに難しかろうか」とある。これは千古不朽の確言、初学の要訓である。およそ医となろうとする者は深く思いを致すべきで、どうしてこれを忽せにできようか。\n〔2〕また曰く、盛夏・厳冬の人を毒することが少なくない。虚弱の人は病がなくてもその修養を慎むべきである。まして吐下の方はその時を避けてよい（※独嘯庵の説）。――（加古）ああ、これは何という言葉か。思うに吐方の治は初めて『傷寒論』に詳しい。いわゆる傷寒とは、まさに厳冬の時に患うものである。ゆえに古に「冬時の厳寒には万類が深く蔵れ、君子が固く密にすれば寒に傷られない。これに触冒する者を傷寒と名づける」と言う。四時の気に傷られてもみなよく病をなすが、傷寒を毒とするのはそれが最も殺厲の気であるからであると言う（頭注：求真曰く、これは病理と細菌学を知らない罪であるが、治術に害はないので深く咎めるべきではない）。かつ傷寒篤劇の証は胸間の結毒を去りにくいのが最もで、胃実陽明がこれに次ぐ。この二証のようなものは吐下の薬を用いなければ患いが並び起こってたちどころに斃れる者は数えきれない。ゆえに厳寒の指が落ちる時でも、その証があればその薬を用いるのを速やかにすべきである。盛夏炎焼の時でもまたそうである。何の恐れることがあろうか。論に（頭注：以下「論に曰く」「又曰く」と称するのはみな仲景師の論の略）「傷寒二三日、心下痞鞕、脈沈数なる者はこれを吐すべし」、また「太陽中暍、身熱して疼重、脈微弱なる者は一物瓜蒂湯これを主る」とある。この二証のようなものは卒暴最も甚だしく、急に吐すべき証である。この証のような者に吐剤を用いなければ諸患が蜂起し、変症が雑出して死ぬことは掌を返すようである。恐れないでよかろうか。私はかつて厳寒・盛暑の時に吐剤を用いて一度もその害を見たことがない。経に「故あれば損なし」と言う。学ぶ者は論説に眩惑されて実用を失ってはならない。\n〔3〕また曰く、張子和は汗吐下を等しく行ったが、これは鋭意で病を奪おうとした弊である（独嘯庵）。――（加古）これは疾医の言ではない。私はかつて汗吐下を等しく行い、おおむね多くその利を見て、まだかつてその害を見たことがない。何の弊があろうか。およそ諸般の病は千状万態で、まだ始めから窮まることがない。ゆえにその現状に随い機変に臨応すれば、治術もまた窮まりない。ゆえに汗すべき者あり、吐すべき者あり、下すべき者あり、和すべき者あり、緩めるべき者あり、それぞれその病の在所に随ってこれを治すのである。今一、二を挙げてこれを示そう。たとえば痘瘡がまさに発しようとする時、頭痛・身熱・渇・煩躁あるいは身体疼痛し、悪い痘が肌肉の間に隠々とある者のようなものには大青竜湯を与えて表に発達させ、別に紫円を用いて鬱熱・胎毒を瀉下するときは痘の形色が光円紅活で終始恙がない。これは汗下を等しく行ってまだかつてその害を見ない者であり、余病もみなこれに準ずる。かついわゆる癇癇（てんかん）・反胃の類のようなものには吐下をこもごも用いて後によくその効を奏する。またいわゆる鬱証・狂癇のようなものにはもっぱら吐剤を用い、別に灌水の法を用い、あるいは兼ねて下剤を用い交錯して雑攻すれば百発百中で、治術を掌上に運ぶべし。そうであれば汗吐下を等しく行うこともその当否いかんを顧みるべきだけである。嘯庵子の説のようなものはいたずらに一定の規矩に拘泥して古医方拡充運用の妙理を知らない。すなわち僻狭の弊は駟も舌に及ばずである（頭注：一度口外した言葉は四頭立ての馬車でも追いつけない＝慎むべし）。\n〔4〕また曰く、病者が床褥にある者は吐すべきでない。これは幼学の縄墨（規則）である云々（独嘯庵）。――（加古）これは初学を訓戒する大概だけで、術を用いるに至ってはまだ必ずしもそうではない。そもそも吐すべき証は、病者で床に臥す者が十に五、六ある。もし当然用いるべき的証でこれを用いなければ病毒が蔓延して終に斃れる者が多い。この時に先んじて吐方を用いれば病毒が除き去り臥床から自ら離れる。何を恐れることがあろうか。世医がこの説に抑圧されて、終に用いにくい術とし、たまたま英才の士が興っても章句をもてあそび筆舌に汲々として親しく試みず、終身この術を行うことができない。ああ悲しいかな。世が遠く人が亡び経が残（そこな）われ、教えが弛んでこれを正そうとしても由る末（すべ）がない。世医の術が人を活かすのに益がなくかえって害があるのももっともである。\n〔5〕また曰く、およそ腹気が虚する者には決して吐方を用いてはならない（独嘯庵）。――（加古）これもまた初学を慎戒する大抵である。もし腹気虚実の説に拘泥して吐方を用いることができないのは庸医のすることである。思うに吐すべき証の毒は胸膈の間にある。ゆえに臓腑上に連迫して腹気空虚する者が半ばに居る。この証のようなものは一つにみな危急篤劇の候である。この時に当たって吐方を用いなければ非命に死ぬ者が多い。医たる者どうしてこれを憂えないでよかろうか。もしこれを憂えれば古を師とするに若くはない。詩に「愆（あやま）たず忘れず、旧章に率い由る」と言う。\n求真: 独嘯庵氏と加古氏の意見が正反対に至ったのは、腹の定義を異にするためで、帰するところは一つである。なぜなら独嘯庵氏の腹は現時の学説のように胸骨剣状突起および肋骨弓以下を指すものであるのに、加古氏は旧説のように左右第十二肋骨下縁を通る直線以上を胸膈間とし、以下を腹としたものであるからである。ゆえにこの見解の相違を知らずに独嘯庵氏\nを責めるのは酷である。\n〔6〕諸病は腹を候うのを第一義とする。腹は有生の本だからである。吐法を用いるには必ずしもそうでなく、この術を行おうとする者は胸膈を候うのを先務とする。病毒が胸膈間に結ぼれ塞がるからである。\n〔7〕論に「傷寒、吐後腹脹する者には調胃承気湯を与う」。古今吐方を用いる人は吐後必ず通和の剤を用いる。戴人（頭注：張子和の別名）は舟車丸、奥村氏は瀉心湯を用いる。私の一門は腹脹の証がなくても吐後必ず調胃承気湯を用いてその逆気を通和する。――求真：吐後に瀉心湯・黄連解毒湯を用いるべきものがあり、また調胃承気湯を用いるべきものもある。偏ってはならない。\n〔8〕「病桂枝の証の如く」の条の解：桂枝の証のようとは表証に似ることをいう。しかし頭痛せず項強らず、かつ脈微浮であるのは真の表証でない徴である。およそ脈を寸尺で弁ずるのは後人の加えたもので古疾医の意ではない（頭注・求真：この説は誤り。脈診を軽視するのは東洞翁の欠点で、その門下および謳歌者もこの弊に陥る。従ってはならない）。胸中痞鞕は毒がここにある徴で、気が咽喉に上衝して息ができないのは胸中の鬱毒が激沸して上に迫るためである。ゆえに注に「此れ胸に寒有りと為す」と言う、いわゆる寒とはその毒を指す。\n〔9〕「病人手足厥冷し脈乍ち緊」の条の解：脈乍ち緊・心中満は毒が胸中に鬱結して手足厥冷を現すもので、いわゆる傍証である（頭注・求真：傍証とは客証の意）。心中満して煩するのは毒が胸間に鬱結する候、飢えて食べられないのは胸中の結毒が食道を妨礙する（頭注・求真：胃と食道を圧迫する意であろう）ため、ゆえに腹中は空虚で飲食しようとしてもできない。およそ毒が胸中に実する者はみな吐すべき証とする。\n〔10〕「宿食上脘に在る」の条の解：食が滞って上脘にある者は、その証あるいは心痛・嘔吐（頭注・求真：この心痛は胃痛の意）、あるいは手足厥冷・脈沈遅、あるいは心中懊憹あるいは温温（頭注・求真：むかむかと悪心すること）、あるいは呑酸・嘈囃、そのほか数種の証候で停食に属する者はよくその証を審らかにしてこれを吐すべし。世に食傷する者で、にわかに霍乱し数証変出して急死する者がある。急な者は一、二日、緩やかな者は四、五日で必ず死ぬ。その源を究めると、ほかでもなくみな吐剤を用いない誤りによる。まことに庸医のために非命に死ぬ者\nああ、傷ましいかな。――求真：滞食・腹痛の病者に麻酔薬を主用しても吐下の剤を用いる者は稀である。三省を要する。\n〔11〕「心中温温として吐せんと欲する者」：温温は嘔嘔で、吐こうとしても吐けない者である。これは胸中の滞毒が動揺して上に迫る候である。およそ諸般の病で百薬が効かず、かたわらこの証がある者は、まず瓜蒂散でその鬱結の毒を開き通ずること二、三次あるいは四、五次、このようにすればその証は必ず変ずる。その変ずるにつれ機に随って的当の剤を投じ、あるいは攻め、あるいは和緩し、あるいは運動させ、あるいは溶化させれば、世医のいわゆる不治の痼疾の者も十に六、七を治す。ついに治らない者はもとより必死にあって天真が絶えた者である。医たる者はよく察し審らかにし、誤って古医方を不利と名づけ聖人の遺法を毀ってはならない。\n〔12〕「病胸上の諸実、胸中鬱々として痛み、食すること能はず、人をして之を按ぜしめんと欲し、而も反て涎唾有り、下痢日に十余行、其の脈反て沈微滑たり、此れ之を吐すべし」：胸上とは胸膈間を指していう。人に按じさせようとするのはこの証が結胸病に似ているからである。そもそも毒が胸間に凝結する者は大陥胸湯の主治であるが、この証は凝結の毒ではない。ゆえに「而も反て涎唾有り、下痢日に十余行」と言う。涎唾があるのは毒が上に動くのであり、下痢するのは毒が下に動くのである。これは鬱滞の毒で凝結の毒ではない。毒が胸間に鬱滞する者は瓜蒂散の主治であり、もし毒が胸間に凝結して心下石鞕な者は大陥胸湯の主治である。\n〔13〕「太陽中暍、身熱疼重して脈微弱」（注：夏月に冷水に傷られ、水が皮中を行くことによる）は一物瓜蒂湯が主る。「発汗吐下の後、虚煩して眠ることを得ず、若し劇しき者は反覆顛倒し心中懊憹す」は梔子豉湯が主る。「汗を発し若くは之を下して煩熱・胸中窒る者」「傷寒五六日大いに下して後、身熱去らず心中結痛する者」「傷寒下して後、心煩腹満し起臥安からざる者」は梔子厚朴湯が主る。（頭注：『金匱』所載の一物瓜蒂湯は瓜蒂一味の煎剤で瓜蒂散と大差がないので、ここに掲げない）\n〔14〕右の数条に「発汗吐下の後」「汗を発し若くは之を下し」「大いに下して後」「下して後」と言うので、この証は本来汗吐下の変に従って来るものである。思うに汗吐下を得て邪毒が除き去られ、ただ津液が虚竭し気血が和さずにその気が胸間に迫ってこの証をなすのである。ゆえにこの湯でこれを和す。もしまだ汗吐下を経ずにこの証を現す者はもとよりこの湯の主治ではなく、吐\n吐剤の証である。庸工はこの理を察せず、このような証の者を見るとややもすれば梔子豉湯を用い、かつ古方はただそうなる者を論じてそうなる理由を論じず、ただ顕れた証を見て方を処すと言う。これは一概に不慮の論で、吐方を用いることを知らない者の僻言である。東洞先生にもこの言があるとはいえ、今この論をなす者とその義は大いに異なる。古人は「毫釐の差で千里を誤る」と言った。思うに梔子・枳実・厚朴・豉は淡白平和の品である。どうして胸間の摯毒を利するに足りようか。ゆえに私は言う、汗吐下の変を経てこの証を現す者は梔子豉湯の主るところで、その不和窘迫の気を和すだけであり、もしまだ汗吐下を経ずにこの証を現す者はみな吐すべき証である、と。――求真：この説は理がないわけではないが、一を知って二を知らないものである。なぜなら師が「発汗吐下の後」と言うのは虚煩を致す由来を示すものであって、汗吐下の後でなければこの方を用いてはならないという意ではないからである。\n〔15〕「太陽病、過経十余日、心下温温として吐せんと欲し、胸中痛み、大便反て溏く、腹微満、鬱々として微煩す、此の時に先だちて自ら吐下を極むる者には調胃承気湯を与う。若し爾らざる者には与うべからず」：前証（12）と意を同じくする。瓜蒂散の証には「心中温温として嘔吐せんと欲す」と言い、この証には「心下温温として吐せんと欲す」と言う。心中と心下とは在所がおのずから異なる。しかし胸中痛み温温として吐せんと欲し、あるいは鬱々として微煩するのは、全く吐剤の宜しいところである。ゆえに「此の時に先だちて吐下を極むる者には調胃承気湯を与う、爾らざる者には与うべからず」と言う。「爾らざる者」とはまだ自ら吐下を極めないことをいう。もしすでに自ら吐下を極めればその毒は除き去り、ただ不和動揺の余勢があるだけであるから、調胃承気湯でその余勢を通和するだけである。（頭注：極は決定の意。自ら吐下を極めるとは病者自身が服薬して吐下したの意）\n〔16〕「陽明病、汗無く小便利せず、心中懊憹する者は身必ず黄を発す」：心中懊憹する者は吐剤の治すところで、本論に処方がないのはおそらく脱簡であろう。――求真：心中懊憹する者は必ずしも吐剤の主治ではない。従ってはならない。\n〔17〕「太陽病、二三日、臥すこと能はず但起きんと欲し、心下必ず結し、脈微弱なる者」：およそ太陽病は表証で裏に事のない、いわゆる病人の臓に他病のない者である。それなのに今この証で臥すことができずただ起きようとする者は、思うにこの証の毒が胸間に壅塞するもので、真の太陽表証ではなく臓に他病がある者である。ゆえに「心下必ず結す」と言い、かつ「脈微弱」と言う。これによって観ればこれもまた吐剤の証である。およそ古書に臓と言うのはみな裏内を指す言葉である。――求真：この説は一理あるようだが強解に似る。後日の研究を待つ。\n〔18〕「傷寒嘔多ければ陽明証有りと雖も之を攻むべからず」：およそ『傷寒論』中のいわゆる陽明証は多く下剤でこれを攻める。これがすなわち古の法である。今陽明証があっても\nこれを攻めてはならないと言うのは、嘔が多いためである。思うに嘔する者は毒が胸膈の間にあり、ゆえにその気が上に迫って嘔をなすのである。今「嘔多し」と言うことでその毒が胸中に鬱するのを見るべきである。私はゆえにこの証は当然吐すべき証であると言う。――求真：陽明病で嘔が多いのは純陽明病ではなく少陽・陽明の合病であるから、まず少陽病を解してのちに陽明病を攻めるのを法とする。ゆえに嘔が多い証、すなわち少陽病が解するまでは陽明証を攻下してはならないと言うのに、断じて吐剤の証とするのは従ってはならない。\n〔19〕「傷寒二三日、心中痞鞕し、脈沈数なる者」：独嘯庵子は「この証のような者は後に大患となる。少しこれを吐すべし」と言う。私はしばしばこの証を治して、その言葉が果たしてその通りであった。\n〔20〕「少陰病、飲食口に入れば則ち吐し、心中温温として吐せんと欲し、復た吐すること能はず、始め之を得て手足寒え、脈弦遅なる者は当に吐すべきなり」：この条は方と証がまさに相対し、弁を待たずに明らかである。\n〔21〕「太陽病、汗無くして小便反て少く、気上って胸を衝き、口噤して語ることを得ず、剛痙を作さんと欲するは、瓜蒂散之を主る」：気が上って胸を衝き口噤して語ることができない者は、いわゆる胸中の実で、当然吐すべき証である。――求真：この証には葛根湯を用いるべき場合があるので、必ずしも吐剤を用いるべきではない。\n〔22〕以上十有余章は張仲景の用いたところで、後世吐方の規矩準縄である。その機に随い運用の際に至って黙識深思してこれを拡充すれば、吐方の効は天地の間に満ちるであろう。それなのに世医の眼目はここに着かず、わずかに二、三章をもって吐方の極趣とし、かつその術を病者に行うことができない。ああ、世医はどうしてこのように愚かでかつ昧いのか。これが私が平素嘆息するゆえんである。願わくは有志の士が思いをここに致してその妙機を求めれば、この術はついに広く後世に行われるであろう。\n〔23〕「胸中に停痰宿水があって諸証をなす者」（頭注・求真：これは独嘯庵氏の説を引用したもの。以下も同じ）：胸中に停痰・宿水がある者はすなわち毒の在所で、諸証をなすのはその傍証である。このような者に私は吐方を用いてよくこれを治す。かついわゆる久年の腹痛がやまずに諸患をなす者はみな吐方のよく治すところである。世医はこれに達せず、この証を見るたびにややもすれば茯苓飲あるいは附子粳米湯の類を用いて日月を荏苒し（漫然と過ごし）、ついに病者を危篤に至らせる。なぜなら論説に拘泥し、いたずらに心胸中に停痰宿水があり自ら水を吐出し、あるいは腹中寒気切痛、逆満嘔吐などの章句を死守し、自ら方証相対とし変通を知らないためである。\n〔24〕「いわゆる禁口痢（食べられない下痢）の者は、水も薬も口に入れることができず、入ればすぐに吐き出す」：これはもとより篤劇の暴病で世医の難ずるところの者である。この証のような者にはまず吐剤を用い\n胸間の毒を通利すれば水も薬もことごとく咽に下ることができ、のちに証に随って方を処せば、世医のいわゆる必ず斃れる者も十に六、七を治すことができる。\n〔25〕いわゆる卒中で昏倒して人事不省、口眼喎斜（顔面のゆがみ）、半身不随、痰気が壅塞する者：世医はこの証にはおおむね三聖飲・導痰湯の類（頭注：後世方）を用い、たまたま軽症二、三人を治すことができるといよいよ自信して卒中家の要方とする。ああ、愚かであり拙いことか。かの軽症のようなものは薬をしなくても自ら本に復する者である。その危篤卒暴の証のようなものは命が旦夕にかかる。この時に当たって危うきを救い暴をゆるめるのは吐方を捨てて何に由ろうか。\n〔26〕いわゆる亀胸・亀背なる者：証に随って方を処し、ときに吐剤を用いて攻めればよく効を収める。\n〔27〕いわゆる狂癇なる者：しばしばこれを吐すべし。\n〔28〕いわゆる蔵結なる者：多くは吐剤がよい。\n〔29〕いわゆる淋疾で諸薬が効かない者：よくその証を詳らかにしてこれを吐すべし。\n〔30〕独嘯庵子曰く「反胃・諸嘔は最も吐すべきである」。――（加古）知言であるかな、至れり尽くせり。思うに吐方を用いる要であり、後世を蔽うに足る。それなのに世医はこの理に達せず、このような証を見るたびにややもすれば乾姜・人参・半夏・茯苓あるいは補脾降気の類（頭注：後世方をいう）を用い、まれにその機を知る者があっても大黄・甘遂・巴豆の類を用いるに過ぎない。しかも方証相対と言う。何の病が治らないことがあろうか、と。ああ、嘆くべきかな。そもそもいわゆる反胃の者は毒が胸間に壅窒する。ゆえに胃脘が妨礙されて水穀を容れることができず、朝に食べれば暮れに吐き、夕に食べれば朝に吐くのである。かの半夏・人参・茯苓の駑薬（のろい薬）がどうしてこれを制することができようか（頭注・求真：吐剤を用いるべきものがあり、乾姜・生姜・半夏・人参・茯苓などを用いるべきものもある。どうして偏重偏廃すべきであろうか）。かつ巴豆・大黄・甘遂は下剤である。そもそも下剤の能は、まずこれを胸腹に入れて熟化運造させてのちに用をなす。今や毒が胸間に鬱窒する。これをもって水穀・薬汁を内に容れることができない。たとえ強いてこれを飲んでも胸間が隔絶して薬気が内に留まることができなければ何の効があろうか。この時に当たって吐剤を用いれば、その毒薬と気が併せて馳逐し激動して上に発泄する。このようにすること数回、その毒の軽重に随ってあるいは一、二次あるいは三、四次すれば、胸中の摯毒は豁然として開け除かれる。なお他症があれば証に随ってこれを理す。これを通因通用という。学ぶ者がいやしくもよくその機に通ずれば、吐方の偉勲の明らかなこと白日のようであろう。\n〔31〕病者で悲しみ哭（な）き啼泣する者：まずこれを吐してのちに証に随って方を処し、あるいはまず方を処してのちにときどき吐方を用いてこれを攻める。\n〔32〕子和氏曰く「咳嗽・痰厥・涎潮・痺塞、口眼喎斜・半身不随する者は当にこれを吐すべし」。咳嗽・厥痰・涎潮・痺塞はこれ毒が胸間に実する候で、口眼喎斜・半身不随なる者はみな傍\n証である。――求真：咳嗽・痰厥・涎潮・痺塞すなわち呼吸器病に吐剤が奏効するゆえんは、吐剤を服すれば胃粘膜の迷走神経末端を刺激して胃内容を吐出させると同時に、肺胞および気管支内の病的産物を喀出させることによる。\n〔33〕「上喘・中満、酸心・腹脹し時々声を作し、痞気が上下して宣暢しない者は当にこれを吐すべし」（自注：いわゆる気が壅がって三焦が盛んでないのがこれである）：考えるにこの証はいわゆる留飲病で、毒が胸間に窒がって上喘・中満・酸心の証をなす（頭注・求真：中満は胃部膨満、酸心は呑酸・嘈囃）。その腹満して時々声を作す者は、これすなわち留飲の徴で、痞気が上下して宣暢しない者は傍証である。いわゆる痞気とはその毒気を指す言葉である。\n〔34〕「頭腫・瘰癧および胸臆胠脇の間、あるいは瘡痂が消えず、および膿水が止まない者はこれを吐す」（頭注：臆は胸と同意、胠は脇と同義）：私はまだこれを試していない。しかし潜思してこれを求めれば、あるいは益があるはずである。学ぶ者はこれを審らかにせよ。私はこの証のようなものにはみな生生乳を用いて万挙万全、ことごとく験を得た（頭注・求真：生生乳は砒素・水銀の化合剤であるから、梅毒性の者においては万挙万全であろうが、その他に至っては必ずしもそうではない）。\n〔35〕「赤白帯下あるいは白物が脂のような者は独聖散（頭注：瓜蒂一味の散薬）が主る。婦人の汚濁水が止まない者もまたこの方と同じ」：この証のような者は術がその機に中ればよく効を収め、もしその機に中らなければ益がない。そもそも機は筆舌の能く尽くすところではない。ただその人にあるのみである（頭注・求真：機は達者のよく捕えるところで、凡庸の与かるところではないのは加古氏の言の通りであるが、汗・下・和もみな機があり、とくに吐法のみではない）。考えるに赤白帯下とは後世のいわゆる帯下の証ではない。古は腸垢痢を帯下とした。すなわち後世のいわゆる痢疾である。これによって観ればこの帯下は今のいわゆる久痢疾の証か。\n〔36〕「小児三、五歳あるいは七、八歳から十四歳に至るまで、驚きを発し、涎潮・搐搦（ひきつけ）し、鋸を挽くような声（頭注：喉中に痰が充満して喘鳴する形容）で人事不省、目を見張り喘急してまさに死のうとする者はこれを吐すべし」：これがいわゆる急驚・熱癇の類で、これを吐すべきである。庸医は察せず、みだりに投じ暗に行い、ややもすれば鉤藤・胡黄連あるいは辰砂・茯神・麝香の類（頭注：後世医の用いるもの）を用いる。このために非命に死ぬ児はほとんど山丘に満ちる。ああ悲しいかな。\n〔37〕「いわゆる癲癇なる者はしばしばこれを吐すべし」：独嘯庵子曰く「十歳以下（頭注：以裏は以下）の者は吐した後に灸すること数千壮ならば止んで再発しない。十歳以上の者に用いても効がない」。この言はまさにその通りであろう。私（加古）はかつてこれを試みるに、年が二、三十に及ぶ者でもその病が新たに発した者は吐剤を用いて効がある。\n〔38〕およそ危急で息切れが甚だしい者、平素吐血の患いのある者、あるいはその証候に血証がある者には決して吐方を用いてはならない。もしこれを犯せばたちまち命期を促す。学ぶ者は詳らかにせよ。\n〔39〕吐方を用いる法：まず吐剤を与えて服させ、病人を二時間ほど安臥させ、動揺させてはならない。もし動揺すればたちまちその薬汁を吐し、薬気が病毒に徹透できなくなる。心中が温温として上って咽喉に迫るのを待って、病人に爪先立ちで蹲座させ（頭注：蹲はうずくまる）吐盆に臨ませ、一人が後ろから抱きかかえ、鳥の羽で咽中を探れば快く吐くことができる。このようにすること三、四回あるいは五、六回。\n〔40〕およそしばしば吐すべき証は、五、六日あるいは七、八日を隔てて法の通りにこれを吐せば、ついに粘膠・汚穢の物を吐してのちにその病は尽きる。\n〔41〕およそ吐剤を服して吐こうとする時に至り、まず沸湯一碗を飲めば吐しやすい。すでに吐してのち、しばらく安臥休息させ、さらにまた湯一碗を飲ませて吐を取ること数次、そののち冷粥あるいは冷水一碗を与えてこれを止める。\n〔42〕吐中あるいは吐した後に煩躁し、脈が絶え、人事不省、四肢厥逆する者は驚いてはならない。これはすなわち瞑眩である。冷水を顔に注ぎ、あるいはこれを飲ませれば醒める。あるいは麝香を冷水に和してこれを飲ませるのもよい。\n〔43〕およそ吐方を用いた後に精神が昏冒する者は瀉心湯を服するのがよい。\n〔44〕吐中に死んだ黒い血がある者は佳い。もし生の真血がある者は危うい。急いで麝香を用いてその薬毒を消化すべし。語に「瓜苗は麝香を聞けばたちまち死（枯）る」と言う。\n〔45〕諸々の緩慢な証で吐すのがよい者には、まず烏頭・附子の剤を用いてその鬱滞の毒を運動させ、ときどき瓜蒂散を用いてこれを吐す。\n〔46〕そもそも吐方は用いがたく、千年にわずか五、六哲（だけが行った）。私（加古）はかつてこれに従事して吐方を用いること数年、その瞑眩のようなものはただ十棗湯・備急円に比するだけである。それなのに世医が用いることができないのはなぜか。他でもない、古意を知らないためである。これを『傷寒論』に考えると、「太陽病云々、一二日之を吐せば腹中飢え、口食すること能はず、三四日之を吐せば糜粥を喜ばず、冷食を食せんと欲し、朝に食して暮に吐す（ものは医が之を吐したことの致すところ）、此れを小逆と為す」とある。そもそもいわゆる太陽病は表証で、当然発散剤を用いるべき証であるのに、医がかえって誤ってこれを吐す。これは逆治の甚だしいものである。なおかつこれを小逆とする。ましてやこれを胸中鬱滞の証に用いるにおいてをや。ああ、世医はどうしてこれを畏れることのこのように甚だしいのか。"

  }
  if(e.fukusho) parts.push(`<section id="s-fuku"><h3>${esc(e.fukusho.title)}</h3><div class="box">${paras(e.fukusho.text)}</div></section>`);
  if(e.kagen?.length) parts.push(`<section id="s-kagen"><h3>加減方</h3>${e.kagen.map(k=>`<div class="kg"><b>${esc(k.name)}</b><div class="small">${esc(k.comp)}</div><p style="margin:4px 0 0">主治：${esc(k.shuchi)}</p>${k.yumoto?`<details class="yumoto"><summary>湯本求真の註（現代語訳）</summary>${paras(k.yumoto)}</details>`:""}</div>`).join("")}</section>`);
  if(e.senpai?.length) parts.push(`<section id="s-sp"><h3>${herb?"諸家の説（要点）":"先輩の論説（要点）"}</h3>${e.senpai.map(s=>`<div class="sp"><div class="who">${esc(s.who)}<small>${esc(s.src)}</small></div><div class="kw">${s.kw.map(k=>`<span>${esc(k)}</span>`).join("")}</div></div>`).join("")}</section>`);
  if(e.cases?.length) parts.push(`<section id="s-case"><h3>症例（概略）</h3>${e.cases.map(c=>`<div class="case"><b>${esc(c.src)}</b><p>${esc(c.summary)}</p>${c.yumoto?`<details class="yumoto" open><summary>湯本求真の註（現代語訳）</summary>${paras(c.yumoto)}</details>`:""}</div>`).join("")}</section>`);
  if(!herb) parts.push(ymHTML);
  if(e.check?.length) parts.push(`<div class="check">要確認：${e.check.map(esc).join(" ／ ")}</div>`);
  $("#page").innerHTML=parts.join("");
}
function segHTML(i,m){
  const b=(v,l)=>`<button type="button" data-seg="${i}" data-v="${v}" aria-pressed="${m===v}">${l}</button>`;
  return `<span class="seg" role="group" aria-label="表示切替">${b("kaki","書き下し")}${b("yaku","現代語訳")}${b("both","両方")}</span>`;
}
function applyMode(el,m){
  el.dataset.mode=m; el.classList.remove("kaki","yaku","both"); el.classList.add(m);
  el.querySelector(".kaki").hidden = m==="yaku"; el.querySelector(".yaku").hidden = m==="kaki";
  el.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===m));
}

// 検索
function terms(q){
  const out=new Set();
  q.split(/[\s　、,]+/).filter(Boolean).forEach(w=>{
    out.add(w);
    if(SYN[w]){ SYN[w].forEach(x=>out.add(x)); return }
    // 完全一致がなければ、語を含む見出し語のうち最も長いものだけを使う
    const ks=Object.keys(SYN).filter(k=>k.includes(w)||w.includes(k)).sort((a,b)=>b.length-a.length);
    if(ks.length) SYN[ks[0]].forEach(x=>out.add(x));
  });
  return [...out];
}
function search(q){
  const box=$("#results");
  if(!q.trim()){box.hidden=true;return}
  const ts=terms(q); const hits=[];
  const test=s=>s&&ts.some(t=>s.includes(t));
  D.forEach(e=>{
    if(test(e.title)) hits.push({e,where:"方剤名",text:e.title,anchor:""});
    (e.tags||[]).forEach(t=>{ if(test(t)) hits.push({e,where:"症状タグ",text:t,anchor:""}) });
    (e.joubun||[]).forEach((j,i)=>{ const s=j.kaki+" "+j.yaku; if(test(s)) hits.push({e,where:`第${i+1}条`,text:j.yaku,anchor:`jo-${i+1}`});
      else if(test(j.yumoto)) hits.push({e,where:`第${i+1}条・求真註`,text:j.yumoto,anchor:`jo-${i+1}`}); });
    (e.senpai||[]).forEach(s=>{ const k=s.kw.join("、"); if(test(k)) hits.push({e,where:`論説・${s.who}`,text:k,anchor:"s-sp"}) });
    (e.cases||[]).forEach(c=>{ if(test(c.summary)) hits.push({e,where:`症例・${c.src}`,text:c.summary,anchor:"s-case"}) });
    (e.kagen||[]).forEach(k=>{ if(test(k.name+k.shuchi)) hits.push({e,where:`加減方・${k.name}`,text:k.shuchi,anchor:"s-kagen"}) });
    if(e.fukusho&&test(e.fukusho.text)) hits.push({e,where:"腹証",text:e.fukusho.text,anchor:"s-fuku"});
    (e.yumoto||[]).forEach(y=>{ if(test(y.text)) hits.push({e,where:`求真の論・${y.head}`,text:y.text,anchor:"s-ym"}) });
  });
  const mark=s=>{ let h=esc(s.length>120?snip(s,ts):s); ts.forEach(t=>{ if(t) h=h.split(esc(t)).join(`<mark>${esc(t)}</mark>`) }); return h };
  box.hidden=false;
  box.innerHTML=`<h2>「${esc(q)}」の検索結果 ${hits.length}件${ts.length>1?`<span class="small">（${esc(ts.slice(0,8).join("・"))} を含めて検索）</span>`:""}</h2>`+
    (hits.length?hits.slice(0,60).map(h=>`<a class="hit" href="#${h.e.id}" data-goto="${h.e.id}" data-anchor="${h.anchor}"><b>${esc(h.e.title)}</b><span class="where">${esc(h.where)}</span><p>${mark(h.text)}</p></a>`).join(""):`<p class="small">該当なし。別の言い方（例：「寒気」→「悪寒」）でもお試しください。</p>`);
}
function snip(s,ts){ let i=-1; for(const t of ts){ i=s.indexOf(t); if(i>=0)break } i=Math.max(0,i-30); return (i>0?"…":"")+s.slice(i,i+110)+"…" }

// イベント
$("#nav").innerHTML=navHTML();
$("#hint").innerHTML="例："+EX.map(x=>`<button type="button" data-q="${x}">${x}</button>`).join("");
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-q],[data-seg],[data-goto],[data-jump]"); if(!t) return;
  if(t.dataset.q){ reading(false); $("#q").value=t.dataset.q; search(t.dataset.q); window.scrollTo(0,0); return }
  if(t.dataset.seg!==undefined){
    const m=t.dataset.v;
    if(t.dataset.seg==="all"){ modePref=m; try{localStorage.setItem("kk-mode",m)}catch(e){}
      t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===m));
      document.querySelectorAll(".jo").forEach(el=>applyMode(el,m)); }
    else applyMode(t.closest(".jo"),m);
    return }
  if(t.dataset.jump){ ev.preventDefault(); document.getElementById(t.dataset.jump)?.scrollIntoView(); return }
  if(t.dataset.goto){ ev.preventDefault(); reading(true); location.hash=t.dataset.goto; render(t.dataset.goto);
    const a=t.dataset.anchor; requestAnimationFrame(()=>{ const el=a&&document.getElementById(a); (el||$("#page")).scrollIntoView(); }); }
});
function isMob(){return matchMedia("(max-width:760px)").matches}
function reading(on){document.body.classList.toggle("reading",!!on&&isMob())}
$("#q").addEventListener("input",e=>{reading(false);search(e.target.value)});
$("#navbtn").addEventListener("click",()=>{const n=$("#nav"),o=!n.classList.contains("open");n.classList.toggle("open",o);$("#navbtn").setAttribute("aria-expanded",o);$("#navbtn").textContent=o?"目次を閉じる":"目次（方剤・生薬）を開く"});
$("#nav").addEventListener("click",e=>{if(e.target.closest("a")&&isMob()){$("#nav").classList.remove("open");$("#navbtn").setAttribute("aria-expanded","false");$("#navbtn").textContent="目次（方剤・生薬）を開く";reading(true);setTimeout(()=>window.scrollTo({top:0,behavior:"instant"}),0)}});
$("#menufab").addEventListener("click",()=>{reading(false);const n=$("#nav");n.classList.add("open");$("#navbtn").setAttribute("aria-expanded","true");$("#navbtn").textContent="目次を閉じる";window.scrollTo({top:0,behavior:"instant"})});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)));
render(location.hash.slice(1)||"v1-keishito");
document.querySelectorAll(".jo").forEach(el=>applyMode(el,modePref));
const _r=render; render=function(id){_r(id);document.querySelectorAll(".jo").forEach(el=>applyMode(el,modePref))};
</script>
