# 試運用サイト（Cloudflare Pages ＋ Cloudflare Access）へ公開する。
# 3時間ごとに、前回の公開から変更があれば tools/build_site.py で _site/ を作って Cloudflare Pages に上げる。
# 急ぐときは GitHub の Actions タブから「Run workflow」で手動実行できる。
# 必要な設定（リポジトリの Settings > Secrets and variables > Actions）：
#   Secrets  : CLOUDFLARE_API_TOKEN（Cloudflare Pages の編集権限）, CLOUDFLARE_ACCOUNT_ID
#   Variables: CF_PAGES_PROJECT（Pages のプロジェクト名）, SITE_URL（https://<プロジェクト名>.pages.dev）, AUDIO_PATH（音声を置く秘密のパス）
# Variables が未設定のあいだは何もしない。
name: 試運用サイトへ公開（Cloudflare Pages）

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CF_PAGES_PROJECT != '' && vars.SITE_URL != '' && vars.AUDIO_PATH != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 前回の公開から変更があるか確かめる
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ github.sha }}
          lookup-only: true

      - name: 公開するファイルだけ取り出す
        if: steps.done.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/work/
            !/ruijuho/work/
            !/fukusho/work/
            !/kensaku/work/
            /tools/

      - name: サイトを組み立てる
        if: steps.done.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          AUDIO_PATH: ${{ vars.AUDIO_PATH }}
        run: python3 tools/build_site.py _site

      - name: Cloudflare Pages に上げる
        if: steps.done.outputs.cache-hit != 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: 公開した版を記録する
        if: steps.done.outputs.cache-hit != 'true'
        run: mkdir -p .deployed && echo "${{ github.sha }}" > .deployed/sha

      - name: 記録を保存
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: deployed-${{ github.sha }}
