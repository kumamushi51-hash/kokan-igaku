name: 皇漢医学 第3巻の所在調査（NDL）
on:
  push:
    branches: [main]
    paths:
      - "work/ndl/find_v3.py"
      - ".github/workflows/kokan_find_v3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python work/ndl/find_v3.py
        continue-on-error: true
      - name: コミット
        if: always()
        run: |
          git config user.name "kokan-images-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work/ndl/find_v3_result.txt || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "皇漢医学 第3巻の所在調査結果 [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
