name: 腹証奇覧 原本画像の取得
on:
  push:
    branches: [main]
    paths:
      - "fukusho/work/fetch_images.py"
      - ".github/workflows/fukusho_images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fukusho-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存関係
        run: pip install -U pillow
      - name: 画像を取得（既存分はとばす）
        run: python fukusho/work/fetch_images.py 2>&1 | tee fukusho/work/fetch_log.txt
        continue-on-error: true
      - name: コミット（途中で止まっても取れた分は保存）
        if: always()
        run: |
          git config user.name "kokan-images-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fukusho/work/images fukusho/work/fetch_log.txt
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "腹証奇覧 原本画像を取得 [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
